{"i":"s0PNAMkipYA","t":"Cum tragi precis cu pistolul cu o singură mână","o":"How to Accurately Shoot a Pistol with One Hand","c":"tr","d":399,"v":61000,"n":134,"s":"Motive: mâna rănită, ții un copil, te sprijini de o balustradă. Sfaturi: păstrezi platforma la fel și doar scoți mâna de sprijin (fără arma înclinată „ca în filme” și fără umărul împins înainte); strângi și mâna liberă în pumn (o strângere puternică într-o mână ajută și cealaltă); poți ridica degetul mare; „răsucești” încheietura înainte ca să blochezi reculul; când treci pe mâna cealaltă, schimbi și picioarele.","p":["Același mecanism ca la două mâini, minus mâna de sprijin.","Strânge pumnul mâinii libere.","Pe mâna cealaltă oglindești tot, inclusiv picioarele."],"k":[[30,"Când tragi cu o mână"],[62,"1 · Aceeași platformă"],[120,"2 · Strânge mâna liberă"],[195,"3 · Degetul mare"],[215,"4 · Încheietura înainte"],[275,"5 · Schimbă și picioarele"]],"w":"Exersezi acasă cu arma descărcată sau de antrenament, apoi în poligon, sub supraveghere."},{"i":"6Hibh23Xf-Y","t":"Anunț: conferință la Summit-ul PGA 2019","o":"Navy SEAL Chris Sajnog to Speak at the 2019 PGA Teaching and Coaching Summit","c":"viat","d":36,"v":666,"n":135,"s":"Scurt anunț (36 s): a vorbit despre metoda lui de învățare accelerată la o conferință a instructorilor de golf. Arată că metoda lui se aplică la orice abilitate, nu doar la tragere.","p":["Aceleași principii de învățare, alt sport."],"k":[[0,"Anunțul"]]},{"i":"gmGbslYQiSI","t":"Mărturia lui Peter din Austria despre un antrenament privat","o":"Peter - Great Personal Training with Chris Sajnog All the Way from Austria!","c":"inv","d":180,"v":1200,"n":136,"s":"Un elev austriac povestește că, după o ședință individuală online în care i-a corectat poziția și priza, a obținut cel mai bun rezultat al lui la un concurs. Apreciază și că poate revedea înregistrarea ședinței.","p":["Corecturile mici la poziție și priză pot aduce un salt.","Revederea înregistrării ajută la fixare.","Video promoțional."],"k":[[0,"Mărturia"]]},{"i":"t2qCwhjUigQ","t":"Poziția în picioare cu carabina","o":"Master the Standing Carbine Shooting Position with Retired Navy SEAL Sniper, Chris Sajnog","c":"tr","d":393,"v":16000,"n":137,"s":"Poziția cea mai folosită: rapidă și ușor de părăsit. Baza: picioarele la lățimea umerilor, șoldurile spre țintă (NPA), piciorul puternic puțin în spate (vârful lui la nivelul călcâiului celuilalt), genunchii îndoiți, „nasul peste vârfuri”. Patul armei în piept, direct sub ochi (nu pe umăr, în lateral). Mâna de sprijin cât mai în față, cu o parte deasupra armei, și cotul rotit în afară, nu în jos.","p":["Dacă nu găsești elementele de ochire, patul e în locul greșit.","Mâna de sprijin conduce arma; mâna de pe mâner controlează focul.","Cotul jos creează o balama care ridică țeava."],"k":[[30,"De ce poziția în picioare"],[55,"Baza și NPA"],[125,"Nasul peste vârfuri"],[140,"Patul sub ochi"],[190,"Mâna de sprijin"],[275,"Cotul în afară"]],"w":"Exersezi acasă cu arma descărcată / de antrenament, apoi în poligon."},{"i":"8Rl7J3DM-Bo","t":"Poți focaliza pe cătare și lovi o țintă în mișcare?","o":"Can You Focus on Your Front Sight and Hit a Moving Target?","c":"fo","d":377,"v":31000,"n":138,"s":"Da. Două tipuri de erori: unghiulară (elementele nealiniate — eroarea crește cu distanța) și paralelă (aliniere bună, dar ochești puțin pe lângă — rămâne la fel). Cu țeavă scurtă, o abatere mică ratează ușor. Demonstrația cu nivela cu bulă: dacă te uiți la țintă și urmărești, bula fuge; dacă privești bula (= cătarea) și urmărești ținta cu atenția periferică, bula stă la mijloc.","p":["Alinierea = focalizarea; imaginea țintei = atenția.","Eroarea unghiulară crește cu distanța, cea paralelă nu.","Fă testul nivelei acasă, cu cineva care te privește."],"k":[[30,"Obiecția"],[60,"Eroarea unghiulară și paralelă"],[125,"Lungimea liniei de ochire"],[185,"Testul nivelei"]]},{"i":"Y8xiI6kFuBM","t":"Cum îți oprești mintea agitată și începi să meditezi","o":"How to Stop Your Racing Mind and Start Meditating","c":"min","d":241,"v":6000,"n":139,"s":"Dacă nu poți sta liniștit, lasă meditația deoparte și învață întâi să respiri corect: pe nas (ca bebelușii), cu diafragma (burta iese și intră), fără să miști umerii, pieptul și gâtul. Când poți respira așa 5 minute, treci la meditație.","p":["Respirația corectă e poarta spre meditație.","Respirația din piept folosește mușchi care nu sunt pentru asta.","Ținta: 5 minute de respirație corectă."],"k":[[30,"Mintea agitată"],[60,"Pe nas"],[90,"Fără mușchii accesori"],[150,"Apoi meditația"]]},{"i":"H0_HRsJEygU","t":"Puterea echipei: acronimul TEAMS","o":"The Power Of Teamwork - Lessons From Retired Navy SEAL Instructor Chris Sajnog","c":"min","d":361,"v":10000,"n":140,"s":"Ce face echipele SEAL atât de bune nu e individul, ci echipa. TEAMS: Take responsibility (asumă-ți răspunderea — dacă e „vina ta”, poți schimba ceva), Encourage others (încurajează), Ask for help (cere ajutor — nu ești bun la toate), Master your job (stăpânește-ți propria sarcină, nu pe a altora), Sacrifice for others (fă sacrificii pentru coechipieri — familia și prietenii sunt echipa ta).","p":["Responsabilitatea totală îți dă puterea să schimbi.","O vorbă bună la momentul potrivit contează enorm.","Fă-ți perfect treaba ta în echipă."],"k":[[30,"De ce echipa"],[62,"T · Responsabilitatea"],[127,"E · Încurajarea"],[191,"A · Cererea de ajutor"],[245,"M · Stăpânește-ți rolul"],[280,"S · Sacrificiul"]]},{"i":"Ft1Eu-RCamw","t":"Cum îți oprești tremurul mâinilor la pistol","o":"How to Stop Your Hands from Shaking when Shooting a Pistol","c":"tr","d":288,"v":507000,"n":141,"s":"Arma nu va fi niciodată perfect nemișcată. Dacă alinierea și focalizarea sunt corecte, ratezi doar cât tremuri. Trei sfaturi: nu strânge mai tare decât poți (100%, nu peste — atunci începe tremurul), respiră (fără aer apar tremurături în mușchii mici) și relaxează-te — un truc: mișcă degetele de la picioare înainte de foc.","p":["Oscilația mică nu e problema; alinierea greșită este.","Lucrează forța prizei ca să nu treci de 100%.","Mișcatul degetelor de la picioare relaxează tot corpul."],"k":[[30,"Arma nu stă niciodată perfect"],[93,"1 · Prea strâns"],[126,"2 · Respirația"],[157,"3 · Relaxarea și degetele de la picioare"]]},{"i":"fNRp2h5JM7E","t":"Cum să te antrenezi ca un Navy SEAL","o":"How to Train Like a Navy SEAL","c":"inv","d":235,"v":7800,"n":142,"s":"Mulți fac invers: cumpără arma, merg la poligon și speră să devină buni. Ordinea corectă are trei pași: educație (afli ce-ți trebuie, dacă îți trebuie, și îți antrenezi mintea), echipament (abia acum arma și echipamentul, folosite corect) și experiență (antrenament pe scenarii, cu instructori, la final).","p":["Întâi înveți, apoi cumperi.","Mintea se pregătește înaintea mâinilor.","Experiența vine ultima, când stăpânești bazele."],"k":[[30,"Ordinea greșită"],[60,"1 · Educația"],[95,"2 · Echipamentul"],[125,"3 · Experiența"]]},{"i":"c6laC5H6cqY","t":"Cum scapi de tresărire: provocarea de 30 de zile","o":"How to Stop Flinching When Shooting a Pistol - 30 Day Navy SEAL Challenge","c":"dry","d":272,"v":56000,"n":143,"s":"Tresărirea nu e o fatalitate: apare când tragi prima dată fără pregătire și rămâne „scrisă” în creier. Trăgătorii buni nu tresar pentru că s-au antrenat corect. Leacul: 30 de zile fără foc real, doar dry training — meditație, vizualizare, gândire pozitivă și mânuire — până se formează noul reflex.","p":["O singură sesiune de dry fire nu vindecă nimic; durează cam 30 de zile.","Nu-ți mai spune „eu tresar mereu”.","Dry training = tot ce te face mai bun, nu doar trăgaciul."],"k":[[30,"De unde vine tresărirea"],[95,"Provocarea de 30 de zile"],[125,"MVP"]]},{"i":"l-ByObJbkVo","t":"Trucul lunetistului pentru trăgaci: a doua încheietură a degetului","o":"A Navy SEAL Sniper Trigger Trick to Help Hit Your Target Every Time","c":"tr","d":224,"v":33000,"n":144,"s":"Ține a doua încheietură a degetului arătător îndreptată drept spre țintă când apeși. Ca arma să se miște din cauza degetului, încheietura ar trebui să se miște lateral. Iei întâi priza bună, lași degetul unde cade, apoi apeși drept înapoi. Demonstrație cu un pix ținut în mână: dacă încheietura rămâne dreaptă, pixul se mișcă doar sus-jos.","p":["Încheietura dreaptă = fără împins sau tras lateral.","Exersezi oriunde, cu un pix.","Mecanică pură."],"k":[[30,"Trucul"],[62,"Pe pistol"],[120,"Cu pixul"]]},{"i":"ndLVmgFGvyY","t":"Schimbul de încărcător la pistol, pe bucăți","o":"Best Pistol Reload Technique - Navy SEAL Teaches the Most Effective Pistol Reload","c":"dry","d":556,"v":31000,"n":145,"s":"Schimbul când închizătorul rămâne blocat în spate. Recunoști nevoia (senzația diferită, imaginea elementelor), aduci arma în „zona de lucru” din fața ta cu cotul sprijinit de corp, păstrând ochi–țeavă–țintă pe aceeași linie, scoți încărcătorul gol, iei unul nou din „locul preferat” cu degetul arătător pe primul cartuș, privești doar o clipă în jos la introducere, apoi ochii înapoi sus. Exersezi în bucăți mici („chunking”), fiecare perfectă.","p":["Recunoașterea nevoii e un pas care se exersează.","„Locul preferat” pentru încărcătorul de urgență, completat după folosire.","Împarte mișcarea în bucăți și perfecționează fiecare."],"k":[[30,"Siguranța la exercițiu"],[60,"Recunoașterea"],[120,"Zona de lucru"],[200,"Scoaterea încărcătorului"],[250,"Locul preferat"],[300,"Introducerea"],[395,"Exersarea pe bucăți"]],"w":"Doar cu arma verificată descărcată și cartușe de exercițiu (inerte), fără muniție reală în cameră — ideal cu armă albastră sau airsoft."},{"i":"YaHpYXHS718","t":"Cum apeși corect pe trăgaci","o":"How to Pull a Trigger - Navy SEAL Teaches Proper Trigger Pull","c":"tr","d":289,"v":220000,"n":146,"s":"Nu mai „pălmui” trăgaciul. Arma e precisă; treaba ta e să n-o strici. Nu încerca să „prinzi momentul” când cătarea trece prin centru. Trei sfaturi: dry fire cu ochii închiși, simțind doar presiunea și declanșarea; „răbdarea vizuală” (ce vezi îi spune degetului când să apese — aștepți focul, nu-l forțezi); și respiri normal (ținutul respirației scade vederea și aduce tremurături).","p":["Smucitul strică alinierea.","Lasă focul să vină; nu-l anticipa.","Respirația ținută îți scade vederea și claritatea minții."],"k":[[30,"Nu pălmui trăgaciul"],[90,"1 · Dry fire cu ochii închiși"],[150,"2 · Răbdarea vizuală"],[170,"3 · Respirația"]]},{"i":"rSNB3_Py8sU","t":"10 pași pentru un dry fire corect (și sigur)","o":"10 Steps to Proper Dry Fire Training - Tips From a Navy SEAL","c":"dry","d":580,"v":83000,"n":147,"s":"Dry training = orice te face mai bun fără foc. Cei 10 pași ai lui: plan scris, o cameră doar a ta, fără telefon/distrageri, arma și încărcătoarele verificate vizual ȘI tactil, toată muniția în altă cameră (sau încuiată), o țintă cu un fundal care ar opri un glonț, spui cu voce tare „acum fac dry fire”, lucrezi doar ce ți-ai propus, dacă greșești te întorci un pas și refaci corect, sesiuni de 5–20 de minute (te oprești când îți pierzi concentrarea, după o repetare perfectă) și notezi totul în caiet.","p":["Muniția nu intră deloc în camera de antrenament.","Repetarea greșită întărește greșeala — te întorci un pas.","Încheie mereu cu ceva făcut perfect."],"k":[[30,"Ce e dry training"],[95,"1 · Planul"],[125,"2 · Camera"],[155,"3 · Fără distrageri"],[167,"4 · Arma descărcată"],[220,"5 · Fundalul"],[265,"6 · „Acum fac dry fire”"],[315,"7 · Lista"],[350,"8 · Un pas înapoi"],[410,"9 · 5–20 de minute"],[475,"10 · Caietul"]],"w":"Lista de siguranță din aplicație (Unelte → Siguranță dry fire) urmează acești pași."},{"i":"MyjYr5nwOos","t":"Testul ochiului dominant","o":"Dominant Eye Test - Navy SEAL Shows How to Find Your Dominant Eye","c":"fo","d":440,"v":96000,"n":148,"s":"Creierul se bazează mai mult pe un ochi (adesea cel cu vederea mai slabă). Testul Miles: faci un triunghi mic cu mâinile, privești un obiect mic (un întrerupător), închizi pe rând câte un ochi — ochiul cu care încă vezi obiectul e cel dominant; sau apropii încet mâinile de față și ajung la ochiul dominant. Testul Porter: același lucru arătând cu degetul. Dominanța se poate schimba cu distanța, lumina sau cu arma în mână — refă testul.","p":["Alege un obiect mic, nu unul mare.","Foarte puțini oameni nu au un ochi dominant.","Cu ambii ochi deschiși vezi două imagini — creierul învață să o aleagă pe cea bună în ~o săptămână."],"k":[[30,"Ce e ochiul dominant"],[95,"Testul Miles"],[189,"Testul Porter"],[250,"Când se schimbă"],[315,"Ambii ochi deschiși"]],"w":"Testul interactiv e în aplicație: Unelte → Ochiul dominant."},{"i":"MHpELGbIHJg","t":"Cele 4 reguli de siguranță cu arma","o":"Firearms Safety Rules From Navy SEAL Chris Sajnog","c":"tr","d":550,"v":11000,"n":149,"s":"1) Tratezi orice armă ca pe una încărcată. 2) Degetul afară de pe trăgaci până ești gata să tragi (o tresărire de spaimă îți strânge mâna). 3) Nu îndrepți niciodată arma spre ceva ce nu vrei să distrugi. 4) Îți cunoști ținta și ce e în fața și în spatele ei. Le-a învățat copiilor săi pe arme albastre, pe înțelesul lor; regula de aur pentru copii: dacă văd o armă, n-o ating, pleacă și anunță un adult.","p":["Înțelegerea regulilor contează mai mult decât formularea exactă.","Armele albastre: învățare fără stres.","La dry fire corect, fără muniție, un foc accidental e imposibil."],"k":[[30,"De ce reguli"],[62,"1 · Totul e încărcat"],[95,"2 · Degetul afară"],[126,"3 · Direcția sigură"],[157,"4 · Ținta și ce e dincolo"],[220,"Cum le-a predat copiilor"],[435,"Dry fire și siguranța"]]},{"i":"f7PVB-PF0iE","t":"Cum tragi rapid și precis în mai multe ținte","o":"How to Shoot Multiple Targets Quickly and Accurately - Navy SEAL Tips","c":"tr","d":570,"v":49000,"n":150,"s":"Cinci idei: punctul natural de ochire acoperă toate țintele (deschizi puțin piciorul/șoldurile); ordinea atenție → ochi → țeavă (ochii ajung primii, țeava vine la ochi); ritmul — focurile trebuie să sune egal (1-2-3-4); comprimi timpul dintre ținte, nu doar cel dintre focuri; crești treptat viteza și distanța dintre ținte. Totul se exersează întâi acasă (dry fire, airsoft, laser, un clicker).","p":["Cel mai mare timp mort e între ținte.","Ochii întâi, apoi țeava — așa nu treci de țintă.","Viteza vine, nu o forțezi."],"k":[[30,"Ce e diferit"],[60,"1 · Punctul natural de ochire"],[120,"2 · Atenție → ochi → țeavă"],[185,"3 · Ritmul (clickerul)"],[300,"4 · Crește treptat"],[370,"Demonstrație dry fire"],[435,"Cu airsoft"]],"w":"Ținte multiple doar în poligon, sub instructor; acasă doar dry fire sau airsoft."},{"i":"HGFsm_Zcxzc","t":"Scosul pistolului din toc: „scosul cu elastic”","o":"How to Draw a Pistol from a Holster - Navy SEAL Teaches Proper Pistol Draw","c":"dry","d":397,"v":80000,"n":151,"s":"În loc de 4 poziții separate, imaginează-ți elastice: unul trage țeava spre țintă, unul spre centrul pieptului (te frânează lin la final) și unul spre toc. Rezultatul: o singură mișcare fluidă, pe linia mediană. Nu porni mereu cu mâinile „ca un ninja” — exersează din poziții obișnuite. Linia privirii nu se mișcă; mâna de sprijin așteaptă la centru; mâna vine în semicerc ca să prindă priza sus; mâinile se întâlnesc unde bați din palme.","p":["Ce priză apuci din toc, aia ai.","Privirea fixă, arma vine în linia ochilor.","Exersează cu armă albastră sau airsoft, nu în poligon."],"k":[[30,"Ce e scosul cu elastic"],[90,"Elasticele"],[155,"Nu porni ca un ninja"],[180,"Privirea fixă"],[245,"Semicercul și priza"],[275,"Întâlnirea mâinilor"]],"w":"Exersează doar cu armă descărcată verificată, armă albastră sau airsoft."},{"i":"RXiZZGNOlCw","t":"Tragi jos-stânga cu pistolul? 3 greșeli și cum le repari","o":"Do You Shoot Low and Left with a Pistol? | Navy SEAL Explains 3 Pistol Shooting Mistakes","c":"tr","d":343,"v":815000,"n":152,"s":"La dreptaci (la stângaci e jos-dreapta), trei cauze: „mulgi” arma (strângi toată mâna când apeși — mâna strânsă la brațul întins se duce natural jos-stânga; leacul: brațul direct în spatele armei), împingi trăgaciul (degetul pus „unde ți s-a spus”, nu unde cade după o priză bună; încheietura a doua a degetului să rămână dreaptă) și punctul natural de ochire greșit (reculul readuce arma spre el, iar tu o forțezi înapoi — mai ales când tragi repede).","p":["Priza bună rezolvă două din trei cauze.","Șoldurile spre țintă, ca reculul să fie drept sus-jos.","Doar tu îți poți diagnostica greșeala — fii prezent la antrenament."],"k":[[30,"1 · „Mulsul”"],[90,"Brațul în spatele armei"],[125,"2 · Împinsul trăgaciului"],[185,"3 · Punctul natural de ochire"],[250,"Concluzia"]]},{"i":"5PdsjBQX3ZA","t":"Focalizez pe cătare sau nu? Răspunsul te surprinde","o":"Do I Focus on the Front Sight or Not? Bet You Can't Guess The Answer..","c":"fo","d":253,"v":31000,"n":153,"s":"E o scară glisantă, nu „ori-ori”. La un capăt: prioritate pe cătare (ținte depărtate sau mici — cătarea perfect clară). La celălalt: prioritate pe țintă (ținta foarte aproape, unde alinierea fină nu mai e necesară). Dar dacă nu te antrenezi niciodată să focalizezi pe cătare, nu vei putea face tirurile grele.","p":["Antrenezi capătul greu al scării, ca să ai de unde coborî.","Repetițiile fac focalizarea tot mai rapidă.","Elementele de ochire sunt acolo cu un motiv."],"k":[[30,"Dezbaterea"],[90,"Ținta foarte aproape"],[120,"Scara glisantă"]]},{"i":"0Qh3zEo5f-k","t":"Ești prezent când tragi? Cum te ajută","o":"Are You Being Present When You're Shooting? Here's How It Will Help.","c":"min","d":224,"v":4500,"n":154,"s":"A fi prezent înseamnă să-ți folosești toate simțurile pentru ce se întâmplă acum — nu cum ai tras ieri, nu ce așteptări ai. Se învață prin meditație. Când ești prezent, corpul îți spune singur, de exemplu, că un punct din priză s-a slăbit — lucru pe care niciun instructor nu-l poate vedea. De aceea tu ești cel mai bun instructor al tău.","p":["Trecutul și viitorul îți strică execuția.","Meditația te aduce în prezent.","Senzațiile din mână îți spun ce să corectezi."],"k":[[30,"Ce înseamnă prezent"],[60,"Meditația"],[120,"Exemplul cu priza"]]},{"i":"M4zPW8D4Izg","t":"Tocul C.H.R.I.S. (glumă de 1 aprilie)","o":"The C.H.R.I.S. Holster - Get CHRIS in YOUR Pants! - 1-Day SALE (04/01/18)","c":"viat","d":421,"v":9100,"n":155,"s":"Parodie de 1 aprilie: un „toc” care e de fapt buzunarul pantalonilor, cu o listă absurdă de avertismente la final. Ironizează produsele „miraculoase” care promit siguranță fără antrenament.","p":["Doar umor.","Mesajul indirect: niciun produs nu înlocuiește antrenamentul."],"k":[[0,"Gluma"]]},{"i":"tJkzXZpbNIY","t":"Greșelile de poziție pe care nu știi că le faci","o":"Tested: Shooting Stance Mistakes You Don't Know You're Making","c":"tr","d":772,"v":1000000,"n":156,"s":"Trei componente pentru orice poziție: punctul natural de ochire (închizi ochii, respiri, relaxezi șoldurile, deschizi ochii și vezi unde arăți — corectezi din picioare), sprijinul pe oase (nu pe mușchi) și relaxarea musculară. Poziția isoscel modificată: picioarele la lățimea umerilor, piciorul puternic puțin în spate, genunchii ușor îndoiți, nasul peste vârfuri, capul drept (arma vine la ochi), țeava în linie cu coloana, umerii „trași înapoi” (spatele și pieptul lucrează, nu deltoizii). Aceeași poziție ca la carabină.","p":["Testul ochilor închiși îți arată punctul natural de ochire.","Nu întinde umerii spre țintă — folosește mușchii mari.","Poziția identică la pistol și carabină face trecerea rapidă."],"k":[[30,"De ce contează"],[60,"Punctul natural de ochire"],[240,"Sprijinul pe oase"],[280,"Relaxarea musculară"],[315,"Poziția isoscel modificată"],[440,"Capul drept, arma la ochi"],[500,"Umerii trași înapoi"],[630,"Pistol vs carabină"]]},{"i":"vmnLA2DuYJs","t":"Greșeala de priză la pistol pe care nu știi că o faci","o":"The Pistol Grip Mistake You Don't Know You're Making","c":"tr","d":540,"v":3200000,"n":157,"s":"Arma trebuie să devină o prelungire a corpului; priza corectă e „leacul reculului”. Construiești priza cu arma în mâna slabă (nu din toc): mâna puternică cât mai sus pe mâner, brațul în linie cu țeava, mâna de sprijin la 45° umple golul, degetele mari înainte. Degetul pe trăgaci cade unde cade după priza bună — nu „vârful degetului pe mijloc” (acel sfat vine de la armele grele de concurs). Teste: țeava în sus (degetul mare și arătătorul la același nivel), dai drumul degetelor de jos, strângi tare și vezi dacă arma fuge lateral.","p":["Priza bună elimină spațiile prin care „scapă” reculul.","Strângere 100% cu ambele mâini — așa vei strânge oricum sub stres.","Dacă îți tot corectezi priza în poligon, n-ai pornit corect."],"k":[[30,"Arma ca prelungire a corpului"],[60,"Construirea prizei"],[155,"Mâna de sprijin la 45°"],[220,"Coada care mișcă câinele"],[300,"Testele"],[345,"Strângere 100%"],[375,"Testul strângerii"],[440,"Semne că priza e greșită"]]},{"i":"QjfkRsZ1pxo","t":"Antrenorul legendar Tom House despre metoda lui","o":"Legendary Throwing Coach Tom House on The New Rules of Marksmanship","c":"inv","d":116,"v":5600,"n":158,"s":"Un antrenor celebru de aruncători din sportul american spune că marii sportivi și operatorii de elită au ceva în comun: încredere în proces, în echipă și în propria sarcină. Metodele de predare din sport și cele de la SEAL sunt foarte apropiate.","p":["Fă-ți treaba ta, ai încredere în colegi.","Procesul contează mai mult decât rezultatul de azi.","Video promoțional."],"k":[[0,"Mesajul"]]},{"i":"w8j_d-pjX8Y","t":"Mitul motivației","o":"The Myth of Motivation","c":"min","d":222,"v":4900,"n":159,"s":"Motivația nu vine de la sine — apare după ce începi. Ne ține pe loc frica de necunoscut. Patru pași: concentrează-te pe „de ce” (scrie-l detaliat, cu emoție, și citește-l zilnic), acceptă efortul, ai atitudinea că va fi greu (dar poți) și repetă efortul în fiecare zi. Ca o rachetă: majoritatea combustibilului se consumă la decolare.","p":["Motivația vine din mișcare, nu invers.","„De ce”-ul scris și citit zilnic.","Dacă te aștepți să fie ușor, renunți la primul obstacol."],"k":[[0,"Mitul"],[60,"1 · De ce"],[95,"2 · Efortul"],[120,"3 · Atitudinea"],[150,"4 · Repetiția"]]},{"i":"1z-NoUlyCtw","t":"Antrenează-te mai inteligent acasă: uneltele lui preferate","o":"👉 Train Smarter at Home: My Must-Have Shooting Tools","c":"dry","d":117,"v":11000,"n":160,"s":"Poligonul e cel mai prost loc să înveți să tragi: nu știi încă poziția, priza, focalizarea, iar explozia din mână îți creează reflexe greșite. Învață întâi acasă, cu unelte potrivite (arme de antrenament, sfoara de focalizare, unelte de priză etc.), și abia apoi mergi la poligon.","p":["Învață acasă, confirmă în poligon.","Reculul nu e „esența” tragerii.","Lista de echipament din aplicație e în secțiunea Unelte."],"k":[[0,"De ce nu poligonul"]]},{"i":"kTBJmirkeeI","t":"Învață ca un războinic","o":"Learn Like a Warrior","c":"inv","d":175,"v":4400,"n":161,"s":"După ce a ieșit din SEAL, metodele lui nu funcționau la fel de bine cu civilii și polițiștii. A înțeles că la SEAL nu conta atât ce sau cum preda, ci cine erau elevii: oameni gata să învețe. De aceea acum predă întâi cum să devii războinic și cum să înveți (meditație, planificare), apoi tragerea.","p":["Cine ești contează mai mult decât tehnica.","Să fii „ușor de învățat” e o abilitate.","Mentalitatea te face bun la orice."],"k":[[0,"De ce nu mergea"],[60,"Elevii pregătiți"],[95,"Calea războinicului"]]},{"i":"_SWovpzWRxg","t":"Mărturia lui Mike despre metoda lui","o":"Firearms Training Review of the New Rules of Marksmanship","c":"inv","d":224,"v":2400,"n":162,"s":"Un tată care trăgea de mic spune că metoda (mai ales priza și dry fire-ul) i-a făcut tragerea cu pistolul mult mai constantă și că l-a ajutat să-și învețe copiii cu mai multă răbdare, pas cu pas.","p":["Priza a fost schimbarea cea mai mare.","Progresul treptat îi ține pe copii motivați.","Video promoțional."],"k":[[0,"Mărturia"]]},{"i":"Rr2opHtJtls","t":"Nu trebuie să meditezi: respirația în pătrat (5-5-5-5)","o":"YOU DON'T NEED TO MEDITATE! Use This Scientifically-Proven Breathing Technique","c":"min","d":220,"v":12000,"n":163,"s":"Pentru cine nu vrea să mediteze: o tehnică de respirație studiată mult, fără nicio filozofie. Loc liniștit, ochii închiși, pe nas, cu burta (nu ridici umerii). Inspiri 5 secunde, ții 5, expiri 5, ții 5 — de cinci ori. De câteva ori pe zi și oricând ești stresat.","p":["Totul pe nas, cu burta.","„Regula lui 5”: 5 secunde × 4 faze × 5 cicluri.","Funcționează și înainte de tragere."],"k":[[30,"De ce respirația"],[60,"Tehnica"],[90,"Exersează cu el"]],"w":"În aplicație: Unelte → Respirație (pătrat). Nu face exerciții de respirație în apă sau la volan."},{"i":"0QgHUBVOJZs","t":"Etapele meditației: stres controlat, concentrare sub presiune","o":"Stages of Meditation to Control Stress and Stay Focused During a Gunfight","c":"min","d":267,"v":4800,"n":164,"s":"Meditația înseamnă să alegi pe ce te concentrezi, oricât zgomot e în jur. Progresie: la început cu muzică liniștită sau zgomot alb, ochii închiși, loc liniștit; apoi fără muzică; apoi cu ochii deschiși; apoi într-un loc aglomerat; apoi chiar în poligon (dacă tresari la zgomot); la final, meditație în mișcare.","p":["Crești stresul treptat, ca la orice antrenament.","Recunoști gândul, apoi revii la respirație.","Ținta: starea de calm chiar și în mișcare."],"k":[[30,"De ce meditația"],[62,"Începutul cu muzică"],[95,"Fără muzică"],[120,"Ochii deschiși"],[125,"Locuri aglomerate"],[150,"În poligon"],[160,"Meditația în mișcare"]]},{"i":"-OSDaPed7L0","t":"Sfoara de focalizare avansată","o":"How to Use the ADVANCED Front Sight Focus String to Improve Shooting Accuracy","c":"fo","d":212,"v":42000,"n":165,"s":"Varianta lui avansată a sforii de focalizare: mărgele pătrate, negre, cu un semn alb, ca o cătare. O ții de la nas (sau de sub ochiul dominant — ori puțin între ei), focalizezi pe rând pe mărgele, inclusiv la distanța la care e cătarea. Cu un partener: numerotezi mărgelele și el strigă numărul pe care să focalizezi. Poți așeza sfoara aproape orizontal, ca privirea peste cătare.","p":["Suprafața plată seamănă cu cătarea.","Lucrezi toate distanțele, nu doar una.","Găsește-ți „locul dominant” între nas și ochi."],"k":[[30,"Ce e diferit"],[60,"Cum o folosești"],[95,"Jocul cu numere"],[125,"Sub ochiul dominant"]],"w":"În aplicație: Unelte → Sfoara de focalizare (cum ți-o faci singur)."},{"i":"Yr5Vj5OyOMU","t":"Cum te pregătește antrenamentul pentru neprevăzut","o":"How the New Rules of Marksmanship Helps Prepare You for the Unexpected","c":"inv","d":235,"v":5400,"n":166,"s":"Fiecare mișcare creează un traseu nervos pe care creierul îl „izolează” cu mielină, ca să meargă mai repede data viitoare. Sub stres, hormonii inundă creierul, dar un traseu bine izolat — construit prin repetări perfecte la dry fire — funcționează oricum. Nu te pierde în trucuri spectaculoase: bazele te salvează.","p":["Repetarea perfectă izolează traseul.","Sub stres faci ce ai repetat, nu ce ai văzut.","Bazele bat trucurile."],"k":[[30,"Traseele nervoase"],[60,"Repetarea perfectă"],[90,"Sub stres"],[150,"Nu trucurile"]]},{"i":"gGk3Ox02SIk","t":"Cu Deepak Chopra: doi războinici, o cale","o":"Deepak Chopra and Chris Sajnog - Two Warriors - One Path","c":"min","d":82,"v":1200,"n":167,"s":"Scurt moment în care îi mulțumește lui Deepak Chopra, unul dintre mentorii lui la meditație, pentru ideea că tot corpul nostru poate fi „ascultat”, nu doar ochii și gândurile conștiente.","p":["Meditația te face mai bun ca om, nu doar ca trăgător.","Ascultă-ți tot corpul."],"k":[[0,"Mulțumirea"]]},{"i":"nTiI6rfdt8E","t":"Poți chiar să focalizezi pe cătare sub stres?","o":"Can You Really Focus on Your Front Sight Under Stress?","c":"fo","d":265,"v":31000,"n":168,"s":"Se spune că sub stres pierzi abilitățile fine (focalizarea, trăgaciul). Stresul îi afectează diferit pe oameni, în funcție de antrenament. Dacă ai construit trasee nervoase puternice prin repetări — întâi fără stres, acasă — le poți folosi și sub stres. Ca la baschet: întâi arunci perfect cu ochii deschiși, abia apoi încerci cu ochii închiși.","p":["Ce n-ai exersat nu iese sub stres — nici focalizarea.","Repetiții fără stres, apoi crești stresul.","Fiecare repetare clară construiește traseul."],"k":[[30,"Întrebarea"],[60,"Stresul și antrenamentul"],[120,"Repetiția fără stres"],[145,"Exemplul cu baschetul"]]},{"i":"tOBWOP4_s-Y","t":"Cum adaugi stres în antrenament","o":"Shooting Under Stress - How to Introduce Stress into Your Training","c":"dry","d":272,"v":19000,"n":169,"s":"După ce stăpânești dry fire-ul, adaugi stres. Două moduri: efort fizic înainte (sprinturi, burpees, kettlebell — pulsul sus, apoi exersezi scosul armei) și airsoft (replici fidele, sigure, care permit scenarii cu parteneri, imposibile în poligon, unde tragi doar înainte, în hârtie).","p":["Pulsul ridicat simulează stresul.","Airsoft-ul de calitate e o unealtă serioasă.","Poligonul static nu e „realist” nici el."],"k":[[30,"De ce stres"],[60,"1 · Efortul fizic"],[95,"2 · Airsoft"]],"w":"Airsoft cu parteneri doar organizat, cu ochelari/mască de protecție și reguli clare de siguranță."},{"i":"YqQKmgzlrbY","t":"Cum te ajută meditația să rămâi calm sub stres","o":"How Meditation Helps Keep You Calm Under Stress","c":"min","d":190,"v":7900,"n":170,"s":"Meditația exersează exact abilitatea de care ai nevoie sub stres: observi gândurile și distragerile, le recunoști, apoi alegi pe ce te concentrezi. Poate fi pe respirație, pe un cuvânt, cu ochii deschiși sau în mișcare (tai-chi).","p":["Recunoști distragerea și te întorci la ce contează.","Sunt multe feluri de meditație — alege unul.","Funcționează doar dacă o practici regulat."],"k":[[30,"Întrebarea"],[60,"Ce exersezi la meditație"],[95,"Sub stres"]]},{"i":"j7PBGI3-FEA","t":"Dreptaci cu ochiul stâng dominant: soluția simplă","o":"Shooting Cross Eye Dominant - Left Eye Dominant Right Handed Shooting","c":"tr","d":188,"v":166000,"n":171,"s":"Variante folosite de alții: înclini arma spre ochiul stâng (slăbește poziția) sau înclini capul (poziție nenaturală, privire lateral). Soluția lui: păstrezi poziția și triunghiul brațelor neschimbate și doar muți arma puțin spre stânga, în dreptul ochiului stâng. Cere puțin exercițiu la dry fire.","p":["Nu strica poziția ca să compensezi ochiul.","Muți arma, nu capul.","Exersează mișcarea la dry fire."],"k":[[30,"Variantele obișnuite"],[85,"Soluția lui"]],"w":"Află-ți ochiul dominant: Unelte → Ochiul dominant."},{"i":"xiIHvSw2QH4","t":"Critica lui la țintele de calificare fără armă","o":"Is the Official NRA Target Teaching Police Officers to Shoot Human Shapes Without a Weapon?","c":"inv","d":300,"v":42000,"n":172,"s":"Opinia lui: multe ținte oficiale de calificare din SUA sunt siluete negre fără armă, iar sub stres corpul face ce a exersat. Susține că antrenamentul trebuie să includă decizia (trag / nu trag), nu doar lovirea unei forme. Povestește și conflictele lui cu fostele instituții pe teme de siguranță la antrenament.","p":["Ce exersezi sub stres devine reflex — inclusiv decizia.","Antrenamentul bun include identificarea amenințării, nu doar precizia.","Video de opinie, centrat pe SUA."],"k":[[0,"Problema"],[120,"Povestea lui"]],"w":"Opinie personală a autorului, despre sistemul din SUA."},{"i":"eE1VoWfAWFM","t":"Cum meditezi: antrenament pentru creier, focalizare și tragere","o":"How to Meditate and Train Your Brain for Improved Shooting Performance and Better Focus","c":"min","d":722,"v":37000,"n":173,"s":"Nu are legătură cu religia; dacă te încurcă, spune-i „antrenament pentru creier”. El meditează de peste 35 de ani, de două ori pe zi câte ~15 minute. Pentru început: scaun, tălpile pe jos, spatele sprijinit, capul drept, mâinile în poală, ochii închiși, atenția pe respirație (sau pe un cuvânt fără sens, ori pe imaginea unui punct negru), cronometru de 5 minute. Gândurile vor veni — asta e exercițiul: le recunoști și revii. Dă-i 30 de zile; începe cu 1–3 minute dacă 5 e prea mult; nu căuta o senzație anume.","p":["Meditația nu înseamnă minte goală, ci revenirea la ce alegi.","Succesul zilei: „am meditat azi”.","Începe mic; durata crește singură."],"k":[[30,"Ce este și ce nu"],[60,"Rutina lui"],[100,"Cum începi"],[180,"De ce pare greu"],[220,"30 de zile"],[255,"Gândurile sunt exercițiul"],[285,"Legătura cu tragerea"],[365,"Unelte (bentițe EEG)"],[440,"Nu căuta senzații"],[470,"Începe mic"],[595,"Nu greșești când vin gânduri"]],"w":"În aplicație: Unelte → Meditație ghidată (cronometru cu clopoțel)."},{"i":"kq2DUFJg1ZM","t":"Cele 7 Reguli Noi ale tirului — prezentarea completă","o":"Chris Sajnog's New Rules of Marksmanship - Your Shooting Will Never Be the Same","c":"inv","d":645,"v":35000,"n":174,"s":"După SEAL, a studiat sportivi de top, muzicieni, maeștri de șah, neuroștiința și învățarea accelerată și a sintetizat 7 reguli: 1 Mentalitatea (MVP: meditație, vizualizare, gândire pozitivă — „repornești calculatorul”), 2 Planificarea (ca un GPS: unde ești, unde vrei să ajungi, apoi pornești), 3 Fizica (forțele, nu copierea pozițiilor altora — Michael Jordan e mare prin felul în care se antrena), 4 Focalizarea (minte și ochi; ca lupa care concentrează soarele), 5 Antrenamentul răspunsului condiționat (bucăți mici, fără stres, acasă), 6 Practica deliberată (nu doar repetare) și 7 Feedback constant (o singură repetare greșită te face mai slab).","p":["Mintea e „sistemul de operare”.","Copiezi felul de antrenament al campionilor, nu poziția lor.","Repetarea fără feedback întărește greșeala."],"k":[[30,"De ce un sistem nou"],[122,"1 · Mentalitatea"],[186,"2 · Planificarea"],[246,"3 · Fizica"],[310,"4 · Focalizarea"],[370,"5 · Răspunsul condiționat"],[433,"6 · Practica deliberată"],[495,"7 · Feedback constant"],[560,"Totul sau nimic"]],"w":"Lecția „Cele 7 Reguli Noi” din aplicație le explică pe larg."},{"i":"QTnQ9H0kltQ","t":"Mărturia lui Chance după un an de antrenament online","o":"I've trained online with Chris Sajnog - Here's what you need to know...","c":"inv","d":288,"v":4100,"n":175,"s":"La început a crezut că discuția despre „trasee nervoase” e o nebunie; apoi a progresat cum nu se aștepta. Spune că metoda l-a ajutat în toate cele patru zone: fizic, spiritual (a legat meditația de rugăciunea de dimineață), mental (concentrare la muncă) și emoțional (prezent cu familia).","p":["Regulile se aplică și în afara tragerii.","O comunitate respectuoasă ajută la învățare.","Video promoțional."],"k":[[0,"Mărturia"]]},{"i":"aWWvXJh-Jw4","t":"Mărturia lui Christian: chiar înveți acasă?","o":"Can you really learn to shoot at home with Chris Sajnog?","c":"inv","d":116,"v":4100,"n":176,"s":"Un trăgător blocat de ani în progres spune că, după carte și program, tragerea s-a îmbunătățit și antrenamentul a devenit plăcut — exersează oriunde: la muncă, în mașină, prin magazin.","p":["Antrenamentul poate fi făcut oriunde.","Video promoțional."],"k":[[0,"Mărturia"]]},{"i":"H2tXmZyv-ec","t":"Mărturia lui Jill","o":"Chris Sajnog's Online Membership Training Testimonial - Jill","c":"inv","d":29,"v":1000,"n":177,"s":"Scurtă mărturie (29 s): o soție spune că programul a fost o investiție bună pentru siguranța familiei.","p":["Video promoțional."],"k":[[0,"Mărturia"]]},{"i":"hzUDFmnX1cU","t":"Mărturia lui Greg, fost jucător și agent de baseball","o":"If You're Considering Chris Sajnog's Online Training - WATCH THIS FIRST!","c":"inv","d":265,"v":9200,"n":178,"s":"Un fost sportiv profesionist spune că un antrenor bun transmite informația concis, ca să o înțelegi, să ți-o amintești și să o vizualizezi. A găsit asta în videoclipul despre focalizarea pe cătare și apoi în program: pași clari, explicații pentru fiecare regulă de siguranță.","p":["Un profesor bun explică și de ce.","Siguranța pe primul loc, mai ales cu copii în casă.","Video promoțional."],"k":[[0,"Mărturia"],[30,"Ce face un antrenor bun"]]},{"i":"AvmrCG-gOGQ","t":"Mărturia lui Roy, scafandru tehnic","o":"Roy Baggett - Review of Chris Sajnog's New Rules of Marksmanship","c":"inv","d":97,"v":1800,"n":179,"s":"Un scafandru cu peste 1000 de scufundări, obișnuit cu instruirea riguroasă, povestește că el și soția s-au pregătit acasă cu metoda lui înainte de cursul pentru permisul de port-armă și au fost cei mai buni din grupă.","p":["Instruirea temeinică dă încredere când contează.","Video promoțional."],"k":[[0,"Mărturia"]]},{"i":"uwKcGef5wwU","t":"Mărturia lui Jesse","o":"Chris Sajnog's Online Membership Training Testimonial - Jesse","c":"inv","d":120,"v":639,"n":180,"s":"După ce un prieten a avut o spargere noaptea, cu copiii acasă, s-a hotărât să învețe să-și protejeze familia. Spune că a învățat mult chiar de la birou, citind și exersând, fără să ajungă des la poligon.","p":["Pregătirea vine înaintea urgenței.","Video promoțional."],"k":[[0,"Mărturia"]]},{"i":"CxcWADeWVyw","t":"Mărturia lui Adrian","o":"Chris Sajnog's Online Membership Training Testimonial - Adrian V","c":"inv","d":137,"v":505,"n":181,"s":"Un tânăr care învățase tirul de la tatăl lui spune că, după ce s-a mutat, metoda l-a ajutat să progreseze și că i-a plăcut mai ales partea de meditație.","p":["Video promoțional."],"k":[[0,"Mărturia"]]},{"i":"EkW8qHcE_AY","t":"Mărturia lui Jaak din Estonia","o":"Chris Sajnog's Online Membership Training Testimonial - Jaak","c":"inv","d":114,"v":589,"n":182,"s":"Un trăgător sportiv din Estonia spune că a devenit mai precis și mai încrezător și că a observat efecte și în alte domenii — de exemplu, conduce mai atent și mai respectuos cu ceilalți.","p":["Disciplina se transferă în viața de zi cu zi.","Video promoțional."],"k":[[0,"Mărturia"]]},{"i":"9B-ZUHSoqBI","t":"Cum folosești sfoara de focalizare pentru o tragere mai bună","o":"How to Use a Front Sight Focus String to Improve Your Shooting - Navy SEAL Firearms Training","c":"fo","d":543,"v":272000,"n":183,"s":"La SEAL le spunea elevilor că trebuie să focalizeze, dar nu-i învăța cum. Sfoara cu mărgele antrenează convergența ochilor: legi un capăt puțin sub nivelul ochilor, celălalt îl ții la nas, prima mărgea la ~15 cm. Când privești o mărgea, vezi două „sfori” care formează un X clar exact pe ea. Apoi ridici privirea și o readuci, apoi muți focalizarea de la o mărgea la alta — până la distanța cătării (brațul întins) și mai departe. Truc: „cațără-ți” privirea peste mărgea.","p":["X-ul clar pe mărgea = ochii converg corect.","Lucrează până la distanța cătării, apoi și mai departe.","Dacă e greu, înseamnă că ai nevoie de exercițiu."],"k":[[30,"De ce să înveți să focalizezi"],[90,"Iluziile optice"],[125,"Explicația științifică"],[180,"Cum o legi"],[245,"X-ul pe mărgea"],[315,"Mutarea focalizării"],[375,"Distanța cătării"],[410,"„Cațără” privirea"],[470,"Treci la acțiune"]],"w":"În aplicație: Unelte → Sfoara de focalizare (cum ți-o faci singur, cu ghid pas cu pas)."},{"i":"vXdIufoPe5Y","t":"Prezentarea primei lui cărți și a videoclipurilor bonus","o":"How to Shoot Like a Navy SEAL - Get 12 FREE Training Videos","c":"inv","d":129,"v":8300,"n":184,"s":"Prezintă prima lui carte, scurtă intenționat (fără povești de război, doar ce trebuie să faci ca să tragi mai bine), și videoclipurile bonus pentru cei care și-o înregistrează.","p":["Fără umplutură: doar ce te face mai bun.","Video promoțional."],"k":[[0,"Prezentarea"]]},{"i":"HWuJXfTGKT8","t":"Echipament „SEAL” revoluționar (glumă de 1 aprilie)","o":"New! Navy SEAL Teams Gear - Designed by a Navy SEAL","c":"viat","d":289,"v":23000,"n":185,"s":"Parodie de 1 aprilie la produsele care se vând doar pentru că au „SEAL” în nume: un port-încărcător pe gleznă și scenarii absurde (trambulină, cafenea). Râde de marketingul bazat pe frică și pe titluri.","p":["Doar umor.","Mesajul indirect: eticheta „SEAL” nu înlocuiește antrenamentul."],"k":[[0,"Gluma"]]},{"i":"ofCjPTJJSVw","t":"Cele 3 mari mituri ale antrenamentului: recul, dry fire, foc real","o":"The Top 3 Firearms Training Myths: Recoil Control + Dry Fire + Live Fire","c":"dry","d":620,"v":167000,"n":186,"s":"Mitul 1: arma „sare” din mână și tresărirea e un reflex natural inevitabil — de fapt nu ai învățat priza, iar tresărirea e un răspuns condiționat (ca un câine bătut care tresare la orice mână), deci se poate dezvăța. Mitul 2: dry fire-ul strică arma — nu, la armele moderne cu percuție centrală (poți folosi capse de exercițiu). Mitul 3: poligonul e locul cel mai realist — o țintă de hârtie fixă, care nu trage înapoi, nu e realistă; focul real doar confirmă ce ai învățat acasă. Prezintă și un sistem de țintă laser cu telefonul, pentru feedback.","p":["Învață priza înainte de primul foc.","Tresărirea e învățată, deci se poate dezvăța.","Dacă nu-ți notezi antrenamentul, doar te joci."],"k":[[38,"Cele trei mituri"],[100,"1 · Reculul și tresărirea"],[226,"2 · Dry fire și arma"],[288,"3 · Unde te antrenezi"],[410,"Sistemul laser"]]},{"i":"zlAfIw13JQ4","t":"Forța prizei: uneltele pe care le folosește","o":"Grip Strength to Improve Shooting - What Tools a Navy SEAL Uses","c":"fit","d":374,"v":145000,"n":187,"s":"Recenzie sponsorizată a unor unelte pentru priză: gyroball (rotirea lucrează degetele, mâinile și antebrațele), o minge de încălzire (și pentru mișcări specifice: trăgaci, butonul încărcătorului), un mâner de torsiune, un aparat cu rezistență reglabilă pe fiecare deget (îți găsești degetul slab) și un gyroball metalic, mai greu.","p":["Încălzește mâinile înainte.","Lucrează și degetele slabe individual.","Video sponsorizat."],"k":[[41,"De ce priza"],[90,"Gyroball"],[160,"Mingea de încălzire"],[195,"Mânerul de torsiune"],[228,"Rezistența pe degete"],[290,"Gyroball-ul metalic"]]},{"i":"pxbFPQW5wFo","t":"Puterea dry fire-ului: trasee nervoase perfecte (cu frământări de limbă)","o":"The Power of Dry Fire and Building Perfect Neural-Pathways","c":"inv","d":250,"v":57000,"n":188,"s":"Demonstrație fără armă: spune o frământare de limbă de 5 ori cât de repede poți — vei greși mereu în același loc, pentru că acolo traseul nervos a deviat. Apoi alta, dar întâi încet și perfect, lăsând viteza să vină singură — iese mult mai bine. La fel la tragere: începătorul care pleacă direct la poligon „vorbește repede de la început”.","p":["Greșeala repetată se fixează în același punct.","Întâi încet și perfect, viteza vine singură.","Acasă construiești traseul; în poligon îl testezi."],"k":[[35,"Prima frământare"],[65,"Unde greșești"],[125,"Încet și perfect"],[190,"Legătura cu tragerea"]],"w":"Încearcă și în română: „Capra calcă piatra, piatra crapă-n patru” — întâi încet, apoi lași viteza să vină."},{"i":"q8GjsD3j7zc","t":"Ce este practica?","o":"What is Practice?","c":"inv","d":56,"v":6600,"n":189,"s":"Practica e repetarea regulată a unei activități ca să obții un rezultat. Mulți o urăsc pentru că pornesc cu o tehnică greșită și se frustrează. Contează și tehnica, și felul în care exersezi. Fiecare sesiune trebuie să aibă un scop; fără plan și fără practică deliberată, doar te joci.","p":["Felul în care exersezi e la fel de important ca tehnica.","Fiecare sesiune are un scop scris.","Fără plan = joacă."],"k":[[0,"Definiția"]]},{"i":"xMIYHYh2kqg","t":"Exercițiul cu creionul: dry fire pentru pistol","o":"Pistol Training Drills - Navy SEAL Dry Fire Training Drill w/ Pencil","c":"dry","d":87,"v":231000,"n":190,"s":"Videoclip fără vorbe, doar cu muzică. Exercițiul: un creion cu radieră intră în țeava armei verificate descărcate, cu vârful aproape de o foaie-țintă; la apăsare, percutorul împinge creionul, care lasă un punct. Vezi dacă apăsarea pe trăgaci mișcă arma: linie dreaptă de puncte, căsuțe de umplut, o verticală.","p":["Feedback vizibil pentru fiecare apăsare.","Nu te uiți la puncte până la final.","Nu funcționează la orice pistol."],"k":[[0,"Exercițiul"]],"w":"Doar cu arma verificată descărcată vizual și tactil, fără muniție în cameră. Ținta de imprimat e în aplicație: Unelte → Țintă de imprimat."},{"i":"X-y_hg2TLRI","t":"Viteză și precizie: primul foc mai repede","o":"Shooting Speed and Accuracy: How to Improve your First Shot Hit Time","c":"tr","d":392,"v":50000,"n":191,"s":"Nu forța viteza — dacă forțezi, eșuezi și îți înveți corpul greșit. Mulți fac invers: scot încet și apoi smucesc trăgaciul. Corect: elimini mișcările inutile la scos (arma vine direct înainte, nu sus și apoi înainte — „scosul cu elastic”), duci repede arma în linia ochilor, apoi frânezi, aliniezi și apeși liniștit.","p":["Timpul se câștigă la scos, nu la trăgaci.","Fiecare mișcare inutilă costă timp.","Repede unde se poate, încet unde trebuie."],"k":[[40,"Nu forța viteza"],[75,"Invers față de majoritate"],[135,"Fără mișcări inutile"],[170,"Scosul cu elastic"],[245,"Frânezi și apeși lin"]]},{"i":"B5oKnMJ56nk","t":"Reclamă: învață să tragi acasă, online","o":"Learn to Shoot any Gun Like a Navy SEAL — Save Time and Money! Online Firearms Training. Guaranteed.","c":"inv","d":72,"v":37000,"n":192,"s":"Reclamă scurtă (72 s) pentru programul lui online: învață acasă, mai ieftin și mai repede decât doar în poligon.","p":["Video promoțional."],"k":[[0,"Reclama"]]},{"i":"YuCbNhH13F4","t":"De ce le e greu trăgătorilor experimentați să progreseze?","o":"Why is it so Hard for Experienced Shooters to Improve?","c":"inv","d":316,"v":11000,"n":193,"s":"Trei motive: disonanța cognitivă (mintea respinge ce e nou, mai ales dacă te-a învățat cineva drag altfel), mutarea din nou a unei abilități din automat în conștient (o priză mai bună se simte ciudat și la început tragi chiar mai prost — e normal, treci prin „groapă”) și orgoliul de a fi din nou „începător”.","p":["Fii conștient de rezistența minții la nou.","Scăderea temporară e parte din îmbunătățire.","Un pas înapoi ca să faci doi înainte."],"k":[[37,"Platoul"],[60,"1 · Disonanța cognitivă"],[100,"2 · Din automat în conștient"],[195,"3 · Din nou începător"]]},{"i":"GHmkl4pwmsQ","t":"Ce crede el: povestea din spatele metodei","o":"Navy SEAL Author, Speaker and Trainer Chris Sajnog  — What I Believe","c":"viat","d":170,"v":8100,"n":194,"s":"S-a retras după 20 de ani pentru că fiul lui nu mai voia să mănânce ca să nu crească și să-și părăsească la rândul lui familia. Civilii nu aveau timpul și muniția nelimitată de la SEAL, așa că a studiat sportivi, muzicieni, neuroștiința și învățarea adulților. Crede că felul în care te antrenezi contează mai mult decât ce antrenezi.","p":["Familia a fost motivul retragerii.","Sistemul vechi („copiază un trăgător bun”) nu funcționează pentru toți.","Dacă nu progresezi, poate e vina metodei, nu a ta."],"k":[[0,"Povestea fiului"],[30,"De ce o metodă nouă"],[95,"Ce a studiat"],[120,"Ce crede"]]},{"i":"jmgUQRI-Z3s","t":"De ce le e greu trăgătorilor experimentați să progreseze? (varianta veche)","o":"Why is it so Hard for Experienced Shooters to Improve? [MOBILE SOUND FIXED ON NEW VIDEO]","c":"inv","d":316,"v":5100,"n":195,"s":"Prima variantă a aceluiași videoclip (sunetul pe mobil a fost reparat în versiunea nouă). Aceleași trei idei: disonanța cognitivă, reînvățarea conștientă a unei abilități automate și orgoliul de a fi din nou începător.","p":["Vezi varianta nouă, cu sunetul reparat.","Rezumat după varianta nouă — aceasta nu are subtitrare."],"k":[[0,"Începutul"]],"w":"Fără subtitrări; conținut identic cu „De ce le e greu trăgătorilor experimentați să progreseze?”."},{"i":"_afw6CzqlrE","t":"Dry fire acasă: planifici, pregătești, exersezi","o":"Dry Fire Practice - Navy SEAL Teaches Dry Fire Drills","c":"dry","d":428,"v":531000,"n":196,"s":"Trei pași la fiecare sesiune. Planifici (modelul GPS, în scris). Pregătești spațiul: separat, sigur și liniștit — fără nicio muniție în cameră, arma verificată și reverificată; poți folosi muzică dacă te ajută să intri „în zonă”. Exersezi deliberat: de exemplu scosul armei, împărțit în patru bucăți (mâna la armă, ieșirea din toc, mâinile se întâlnesc, împingerea spre țintă), întâi vizualizat, apoi exersat până e perfect, filmat pentru feedback. După sesiune, dacă îți încarci arma, spui cu voce tare „arma e încărcată acum”. Te antrenezi până la un standard (15 repetări perfecte), nu după ceas.","p":["Fără muniție în cameră, niciodată.","Spune cu voce tare când arma redevine încărcată.","Standard, nu cronometru: 15 repetări perfecte."],"k":[[30,"Ce e dry training"],[60,"1 · Planul"],[70,"2 · Spațiul"],[125,"3 · Practica deliberată"],[180,"Scosul în patru bucăți"],[300,"„Arma e încărcată acum”"],[335,"Standard, nu timp"]],"w":"Lista de siguranță din aplicație: Unelte → Siguranță dry fire."},{"i":"RDo1qe8zCT4","t":"Prezentarea cărții „Navy SEAL Shooting”","o":"New Book - How to Shoot any Handgun, Pistol or Rifle - Navy SEAL Shooting","c":"inv","d":154,"v":78000,"n":197,"s":"Prezintă cartea lui mare (386 de pagini, sute de ilustrații), cu patru părți: antrenamentul (cum să te antrenezi eficient), mentalitatea (meditație, vizualizare, gândire pozitivă), tirul (fundamentele, pe larg) și operațiunile (manevrarea armei, incidente, deplasare, ținte în mișcare, ambii ochi deschiși).","p":["Antrenamentul vine primul în carte.","Lecțiile din aplicație sunt rezumate, cu cuvintele noastre, din această carte.","Video promoțional."],"k":[[0,"Prezentarea"],[30,"Cele patru părți"]]},{"i":"L-l1pozsUyE","t":"Regula nr. 7: feedback constant","o":"New Rules of Marksmanship: Rule # 7 - Constant Feedback","c":"inv","d":212,"v":26000,"n":198,"s":"Feedback constant înseamnă că cineva (instructor, antrenor, prieten) sau camera telefonului te urmărește când exersezi, ca să vezi dacă faci corect. Împarți mișcarea în bucăți mici, filmezi o bucată, te uiți, corectezi și treci la următoarea. Mai bine prinzi greșeala după o repetare decât după o sută.","p":["Telefonul e un antrenor gratuit.","O bucată perfectă, apoi următoarea.","Greșeala repetată devine traseu nervos."],"k":[[30,"Ce e feedbackul constant"],[60,"Bucățile mici"],[95,"Demonstrația cu camera"]]},{"i":"pnsxnIQsgKg","t":"Cum focalizezi când tragi: 2 exerciții pentru cătare","o":"How to Focus When Shooting a Gun - 2 Expert Tips for Front Sight Focus","c":"fo","d":362,"v":341000,"n":199,"s":"Două exerciții simple pentru acasă. 1) Sfoara Brock: legi un capăt de ceva fix, celălalt la nas, și focalizezi pe prima mărgea — ochii învață să lucreze împreună (lipește mărgelele ca să nu alunece). 2) O foaie cu scris mic aproape și un text departe: focalizezi complet pe una, apoi complet pe cealaltă — clar de fiecare dată, nu doar o privire. Ochii au mușchi și se antrenează la orice vârstă.","p":["Câteva minute pe zi.","Peste 40 de ani, exercițiile sunt și mai importante.","Claritate completă la fiecare schimbare."],"k":[[34,"De ce aceste exerciții"],[64,"1 · Sfoara Brock"],[220,"2 · Aproape–departe cu o foaie"]]},{"i":"QDyE0ygrhV8","t":"Regula nr. 6: practica deliberată","o":"Rule # 6 - Deliberate Practice | New Rules of Marksmanship","c":"inv","d":168,"v":21000,"n":200,"s":"Practica deliberată înseamnă să te antrenezi corect, nu doar să tragi și să speri: un plan (modelul GPS), antrenamentul minții (meditație, vizualizare) și „antrenamentul pe slăbiciuni”: afli exact ce trebuie îmbunătățit, împarți tehnica în bucăți mici și le repeți până devin mai bune, apoi treci la următoarea slăbiciune.","p":["Găsește veriga slabă și lucreaz-o separat.","Bucăți mici, repetate deliberat.","Doar mai mult foc real nu te face mai bun."],"k":[[35,"Ce e practica deliberată"],[95,"Antrenamentul pe slăbiciuni"]]},{"i":"_XljDlZq7ig","t":"Răspunsuri la întrebările abonaților","o":"Answers to Subscribers Top New Rules Shooting Questions","c":"inv","d":614,"v":8900,"n":201,"s":"Trei întrebări. 1) Dacă porți ochelari, te antrenezi cu ei — construiești traseul perfect, nu te antrenezi „pentru cazul în care îi pierzi”. 2) Tubul gol sau capsa amestecată printre cartușe în poligon nu vindecă tresărirea, doar o diagnostichează (ca termometrul pentru febră); vindecarea vine din dry training. 3) Cele 7 Reguli Noi se aplică la orice armă (și la orice abilitate), nu doar la pistol.","p":["Antrenează-te cum vei fi de obicei: cu ochelarii tăi.","Diagnosticul nu e tratament.","Regulile nu țin de un anumit tip de armă."],"k":[[39,"1 · Ochelarii"],[135,"2 · Capsa printre cartușe"],[295,"3 · Regulile la carabină"]]},{"i":"KcQy0R_le98","t":"Regula nr. 5: antrenamentul fără muniție (cum funcționează dry fire)","o":"Dry Weapons Training (How Dry Fire Works) | New Rules of Marksmanship: Rule # 5","c":"dry","d":250,"v":41000,"n":202,"s":"Videoclip aproape fără vorbe (doar sunete). Ideea regulii 5: înveți fără stres, acasă, în bucăți mici, cu arma descărcată sau de antrenament, ca să construiești trasee nervoase curate; poligonul doar confirmă.","p":["Fără stres = învățare curată.","Bucăți mici, perfecte.","Rezumat după titlu și restul seriei — nu are vorbe."],"k":[[0,"Începutul"]],"w":"Fără subtitrare utilă; vezi lecția „Cele 7 Reguli Noi” din aplicație."},{"i":"BOk9VaOaIVE","t":"Cum tragi mai repede: știința din spatele vitezei","o":"Learn How to Shoot Faster - Navy SEAL Teaches the Science Behind Shooting Fast","c":"tr","d":692,"v":125000,"n":203,"s":"Schema lui: orice acțiune (corectă sau greșită) adaugă mielină pe traseul nervos, iar impulsul circulă tot mai repede. Cu cât repeți mai exact și mai încet, cu atât se formează mai multă mielină pe traseul corect — de aici viteza. Dacă forțezi viteza, greșești, iar stresul (bubuitul, semnalul cronometrului, reculul, propria minte) intră în traseul încă neizolat. Două bonusuri: „gândește mai repede” (ritmul pe care îl auzi în minte e cel cu care tragi) și o poziție mai agresivă (aplecat înainte, priză mai fermă) când vrei să tragi mai repede.","p":["Încet și exact = rapid mai târziu.","Ritmul din minte devine ritmul focurilor.","Cu cât tragi mai repede, cu atât fundația trebuie să fie mai solidă."],"k":[[0,"Schema"],[32,"Acțiunea și mielina"],[100,"Încet și exact"],[190,"Viteza forțată → stres"],[310,"Dry training"],[440,"Bonus 1: gândește mai repede"],[535,"Bonus 2: poziția agresivă"]]},{"i":"dhfhnuHj5uQ","t":"Tricou promoțional","o":"Center Mass Group's Evolution of Shooting Shirt","c":"ech","d":27,"v":2600,"n":204,"s":"Scurtă reclamă (27 s) pentru un tricou al firmei lui de atunci.","p":["Video promoțional."],"k":[[0,"Reclama"]]},{"i":"XPtTs42sVAM","t":"Cum tragi precis: uită de „fundamente”","o":"How to Shoot Accurately: Forget the Fundamentals","c":"fo","d":1280,"v":2200000,"n":205,"s":"Poziția, priza, alinierea, imaginea, trăgaciul, respirația, continuarea sunt metode, nu fundamente; fundamentele reale sunt cele 7 Reguli Noi. Lecția principală: a focaliza ≠ a te uita. Când focalizezi corect, cătarea e perfect clară și ținta e încețoșată — exact cum trebuie. Două bătălii: cu mintea (înțelegi eroarea unghiulară vs paralelă — alinierea contează mai mult decât oscilația) și cu ochii (mișcările rapide ale ochilor sunt voluntare, deci controlabile). Iluzii optice: fixezi 30 s semnul de pe cătare și mișcarea din imagine se oprește, punctele colorate dispar. Ținerea „în centrul țintei” e mai bună decât „la ora 6”. Focalizarea pe cătare îți centrează singură alinierea, ca atunci când treci cu mașina printr-un loc îngust privind drept înainte.","p":["Cătare clară, țintă încețoșată.","Un semn mic pe cătare îi dă ochiului ce să fixeze.","Exersezi 30 de secunde de focalizare la dry fire."],"k":[[0,"Metodele vechi"],[60,"Cele 7 Reguli Noi"],[160,"A focaliza vs a te uita"],[250,"Bătălia 1: mintea"],[440,"Bătălia 2: ochii"],[490,"Iluzia care se oprește"],[600,"Punctele care dispar"],[800,"Ținerea în centru vs ora 6"],[930,"Focalizarea aliniază singură"]],"w":"Iluziile (făcute de noi) le găsești în aplicație: Unelte → Antrenor de focalizare."},{"i":"Gk6PqDx8LX4","t":"Cum scapi de tresărire: știința din spate","o":"How to Stop Flinching When Shooting - Navy SEAL Uses Science to Control Your Flinch","c":"tr","d":313,"v":408000,"n":206,"s":"Tresărirea e un traseu nervos care include tresărirea — format adesea la primele focuri, când bubuitul a fost un stres. Leacul: dry training acasă până se formează un traseu nou, fără tresărire (apăsare lină, continuare perfectă). Ajută meditația și vizualizarea (repetări perfecte), plus emoția pozitivă la o repetare reușită. Nu te întoarce prea repede la poligon: o săptămână nu ajunge, mai degrabă o lună sau două.","p":["Tresărirea e învățată, deci se dezvață.","Vizualizarea = repetări perfecte, fără greșeli.","Formarea unui obicei durează mai mult de 21 de zile."],"k":[[8,"Întrebarea nr. 1"],[39,"Traseul cu tresărire"],[71,"Dry training"],[163,"Meditația și vizualizarea"],[247,"Cât durează"]],"w":"Încearcă și 66 de zile de obicei: Caietul din aplicație are un contor."},{"i":"A_afe0h-0NI","t":"Regula nr. 3: fizica — mecanică, nu metode","o":"The New Rules of Marksmanship - Rule 3: Physics - Using Mechanics, not Methods to Shoot Better","c":"tr","d":380,"v":18000,"n":207,"s":"Nu contează numele poziției (Weaver, isoscel) sau procentele prizei; contează mecanica. La un singur foc merge aproape orice, dar la distanțe mari și focuri rapide contează tot mai mult. Carabina: patul sub ochiul dominant, mâna de pe mâner ca la pistol, mâna de sprijin cât mai în față cu o parte deasupra, cotul rotit în afară (fără balama), genunchii îndoiți, nasul peste vârfuri — aceeași poziție ca la pistol. Priza la pistol: acoperi cât mai mult din mâner, totul îndreptat înainte, 100% cu ambele mâini; încheietura a doua a degetului spre țintă.","p":["Aceeași poziție la carabină și pistol.","Cotul rotit în afară scoate balamaua.","Fundația din cărămidă, ca la al treilea purceluș."],"k":[[9,"Mecanică, nu metode"],[72,"Pistol și carabină la fel"],[135,"De ce contează la viteză"],[165,"Poziția cu carabina"],[250,"Priza la pistol"],[320,"Cei trei purceluși"]]},{"i":"wGA51ix1tME","t":"Cum reglezi un toc din kydex","o":"How to Adjust a Kydex Holster - Tips From a Navy SEAL Firearms Instructor","c":"ech","d":294,"v":79000,"n":208,"s":"Recapitulează cele 4 reguli de siguranță, apoi: cu mănuși și un pistol cu aer cald (sau uscător de păr), la 2–5 cm, mișcând continuu, 5–8 secunde. Ca să strângi: încălzești în dreptul apărătorii trăgaciului și apeși cu degetul mare. Ca să lărgești: încălzești de-a lungul închizătorului și răsucești ușor arma la scoatere. Puțin câte puțin; verifici pe curea, nu în mână.","p":["Mai puțin e mai mult — încălzești treptat.","Verifici tocul purtat pe curea.","Arma descărcată verificată când o potrivești."],"k":[[40,"Siguranța"],[90,"De ce ai nevoie"],[150,"Strângerea"],[195,"Lărgirea"]],"w":"Arma folosită la potrivire trebuie verificată descărcată (vizual și tactil)."},{"i":"6lMYzJpD4n8","t":"Un truc SEAL simplu pentru focalizare instantanee pe cătare","o":"1 Simple Navy SEAL Hack For Instant Front Sight Focus","c":"fo","d":726,"v":5500000,"n":209,"s":"Dacă grupele nu sunt constant în centru, nu focalizezi cu adevărat pe cătare. Cei mai mulți doar se uită la ea. E greu pentru că pe o cătare neagră, în fața unei ținte negre, ochiul nu are pe ce să se prindă. Trucul de la școala de lunetiști: un semn mic, contrastant, în centrul cătării (vopsea pusă cu o scobitoare; se poate șterge). Apoi experimente: iluzia care pare să se miște se oprește când fixezi semnul 30 de secunde; punctele colorate din cerc „dispar”; în grila cu puncte care pâlpâie, totul se liniștește. Exersezi la dry fire până focalizarea devine instantanee și inconștientă.","p":["A te uita ≠ a focaliza.","Dă-i ochiului un punct mic de fixat.","Cu exercițiu, focalizarea devine automată."],"k":[[30,"Te uiți sau focalizezi?"],[93,"Ce înseamnă să focalizezi"],[182,"De ce e greu"],[225,"Semnul pe cătare"],[300,"Iluzia care se mișcă"],[400,"Punctele care dispar"],[500,"Grila: albe sau negre?"],[595,"Tema pentru acasă"]],"w":"Iluziile (făcute de noi) le găsești în aplicație: Unelte → Antrenor de focalizare."},{"i":"wIV6jIWrHJM","t":"Cum tragi cu ambii ochi deschiși: dominanța oculară","o":"How to Shoot With Both Eyes Open - Navy SEAL Teaches Ocular Dominance","c":"fo","d":173,"v":509000,"n":210,"s":"Cu ambii ochi deschiși vei vedea două imagini ale elementelor de ochire — e normal și nu trebuie să scapi de a doua. Creierul învață să se bazeze pe imaginea ochiului dominant și să o ignore pe cealaltă, fără ca ochiul celălalt să „doarmă” — ca la mâna dominantă. Arată exact ce vede el. Exersezi la dry fire până creierul alege singur imaginea bună.","p":["Două imagini = normal.","Creierul alege, nu ochiul se închide.","Se învață în aproximativ o săptămână de exercițiu."],"k":[[8,"De ce e greu"],[39,"Cele două imagini"],[100,"Dominanța oculară"]],"w":"Testul ochiului dominant: Unelte → Ochiul dominant."},{"i":"wAfAvX1gRiY","t":"Reclamă pentru cartea „How to Shoot Like a Navy SEAL”","o":"How to Shoot Like a Navy SEAL - Combat Marksmanship Fundamentals","c":"inv","d":74,"v":15000,"n":211,"s":"Trailer scurt (74 s) pentru prima lui carte, prezentată ca manual de tragere cu videoclipuri demonstrative.","p":["Video promoțional."],"k":[[0,"Trailerul"]]},{"i":"VskfMrjfwG4","t":"Trusa de supraviețuire: ce îți trebuie (interviu la o emisiune de vânătoare)","o":"Navy SEAL Survival Kit | Chris Sajnog Explains What You Need to Survive","c":"tac","d":618,"v":30000,"n":212,"s":"Nu există „un singur obiect”: contează planificarea și repetarea înainte de plecare. Planifici pentru hrană (calorică, compactă; cârlige și fir pentru mai mult timp), apă (cea mai curată sursă, curgătoare; fierbere sau filtru; un recipient), adăpost (pe munte, frigul vine repede — o pătură de supraviețuire e multifuncțională), foc și prim ajutor (contează să știi ce faci: oprești sângerarea, apeși cu mâna). Prioritățile depind de mediu (deșert: apa; munte: adăpostul). Hartă și busolă exersate, două busole, ții azimutul. Lași vorbă acasă unde mergi și când te întorci; dacă te-ai rătăcit, rămâi pe loc.","p":["Prioritățile depind de mediu.","„Doi înseamnă unul, unul înseamnă niciunul.”","Spune cuiva traseul și ora de întoarcere."],"k":[[30,"Un singur obiect?"],[95,"Planificarea"],[120,"Hrana"],[155,"Apa"],[340,"Pătura de supraviețuire"],[405,"Primul ajutor"],[470,"Harta și busola"],[530,"Lasă vorbă acasă"]],"w":"În România, pe munte: Salvamont (0-SALVAMONT / 0725 826 668) și 112. Aplicația gratuită „Salvamont” îți trimite locația."},{"i":"ZAXGG_CRvQM","t":"Istoria trupelor SEAL (film oficial de prezentare)","o":"Navy SEALS History Video","c":"viat","d":417,"v":2900,"n":213,"s":"Film de prezentare al Marinei SUA despre trupele speciale navale: originile în Al Doilea Război Mondial (scafandri de demolare), selecția și pregătirea foarte dure, misiunile de recunoaștere și acțiune directă, lucrul cu aliații și ideea de „echipă de echipe”.","p":["Operatorii de elită nu se pot produce în grabă — pregătirea durează ani.","Disciplina și mentalitatea se formează din prima zi.","Material istoric/de prezentare."],"k":[[33,"Originile"],[95,"Selecția și pregătirea"],[125,"Misiunile"]]},{"i":"IWmkqNvFxA0","t":"Viața unui Navy SEAL: interviu din perioada serviciului","o":"Life of a Navy SEAL Interview - What it's like to be a Navy SEAL","c":"viat","d":429,"v":64000,"n":214,"s":"Interviu din vremea când era încă activ. Ce au în comun cei care intră: sport, rezistență mentală, inteligență, dorința de provocare. El a fost întâi scafandru (medicină subacvatică), apoi a trecut prin selecție. Vorbește despre frăție, despre faptul că a refuzat să devină ofițer ca să rămână în echipă, despre cursele de aventură de mai multe zile (asemănătoare cu viața de operator: navigație, nopți, frig, oboseală) și despre studiile făcute cu sprijinul Marinei.","p":["Cei buni sunt completi: fizic, mental, intelectual.","Echipa e motivul pentru care rămâi.","Cursele de aventură te pregătesc pentru oboseală și disconfort."],"k":[[0,"Cine intră în SEAL"],[60,"Drumul lui"],[90,"Frăția"],[215,"Cursele de aventură"],[330,"Educația"]]},{"i":"L9kRFqcbq50","t":"Interviu TV despre selecția SEAL","o":"Navy SEAL interview With Bill O'Reilly - Navy SEALS on FOX News","c":"viat","d":250,"v":21000,"n":215,"s":"Interviu la o televiziune americană despre selecție: șase luni cu aceeași clasă, efort fizic zilnic plus cursuri; mulți vin nepregătiți fizic. Cam unul din zece reușește. Standardele nu scad niciodată („singura zi ușoară a fost ieri”). Lucrul care nu se poate preda: dorința de a termina — trebuie să pleci știind că vei termina, nu „să încerci”.","p":["Vino deja în formă.","Dorința de a termina nu se poate preda.","Nu „încerci” — decizi că termini."],"k":[[30,"Prima zi"],[90,"Câți reușesc"],[120,"Somnul"],[150,"Durerea"],[185,"Partea mentală"]]},{"i":"PzFV7F-3r9g","t":"Reportaj TV despre recrutarea SEAL","o":"Navy SEALS on NBC News - Navy SEALS Interviewed","c":"viat","d":175,"v":4000,"n":216,"s":"Reportaj de știri despre recrutarea trupelor SEAL: „săptămâna iadului” (cinci zile și nopți aproape fără somn), procentul uriaș de abandon (din 120 de candidați au rămas 32) și eforturile de a găsi mai mulți candidați fără a coborî standardele.","p":["Standardele rămân aceleași, oricât de mare e nevoia.","Majoritatea renunță — mintea cedează înaintea corpului.","Material de arhivă."],"k":[[38,"Săptămâna iadului"],[100,"Nevoia de operatori"],[130,"Recrutarea"]]}];

const $=(s,r=document)=>r.querySelector(s);

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const pad=n=>String(n).padStart(2,'0');

const ymd=(d=new Date())=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseYmd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const dayDiff=(a,b)=>Math.round((parseYmd(b)-parseYmd(a))/864e5);

/* ziua de antrenament: orice sesiune salvată marchează ziua (obiceiul de 66 de zile) */
function markDay(d=ymd()){if(!S.habit[d]){S.habit[d]=1;save('habit')}}
function logSession(type,min,note,extra){
  const e=Object.assign({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),d:ymd(),type,min:Math.round(min*10)/10,note:note||''},extra||{});

/* sunete (WebAudio) */
let AC=null;
function ac(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C()}if(AC&&AC.state==='suspended')AC.resume();return AC}
function beep(f=1000,dur=.18,vol=.5,type='square'){
  if(!S.set.sound)return; const a=ac(); if(!a)return;
  const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.005);
  g.gain.setValueAtTime(vol,t+dur-.02);g.gain.linearRampToValueAtTime(0,t+dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.02);
}
function bell(vol=.35,f=528){
  if(!S.set.sound)return; const a=ac(); if(!a)return; const t=a.currentTime;
  [[1,1],[2.01,.5],[2.76,.32],[5.4,.12]].forEach(([m,v])=>{const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=f*m;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol*v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+4.5/m+.6);o.connect(g).connect(a.destination);o.start(t);o.stop(t+6)});
}
function tick(vol=.4,f=1500){beep(f,.035,vol,'square')}

if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}

  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.voice=VOICE;u.lang=VOICE.lang;u.rate=rate;speechSynthesis.speak(u)}catch(e){}
}

les({id:'s1',m:'start',t:'Cum folosești aplicația',min:3,v:['kq2DUFJg1ZM','GHmkl4pwmsQ'],b:`
Aplicația are cinci părți, pe care le găsești jos (pe telefon) sau în stânga (pe calculator):

- **Azi** — ce ai de făcut astăzi: provocarea de 30 de zile, rutina zilnică și ideea zilei.
- **Lecții** — tot ce predă Chris Sajnog, explicat în română, cu animații și videoclipurile potrivite.

- **Unelte** — cronometre, antrenorul de focalizare, respirație, meditație, testul ochiului dominant, ținte de imprimat și altele.
- **Caiet** — jurnalul tău de antrenament, obiceiul de 66 de zile, obiectivele și lista celor 7 reguli.

### Ordinea recomandată
1. Citește lecțiile din „Începe aici” (siguranța mai întâi).
2. Pornește **Provocarea de 30 de zile** din pagina Azi — în fiecare zi primești o sarcină mică.
3. Scrie în Caiet **de ce** te antrenezi. Pare un lucru mic, dar e motorul a tot.
4. Parcurge „Cele 7 Reguli Noi”, apoi „Tragerea”.

### Videoclipurile sunt în engleză
Ai pentru fiecare un rezumat și momentele-cheie în română. Pe lângă asta poți porni subtitrarea tradusă automat în română — găsești pașii la fiecare videoclip, la „Cum pui subtitrarea în română”.

> Cititul nu te face mai bun. Doar antrenamentul te face mai bun. Folosește lecțiile ca să știi CE să exersezi, apoi exersează.

? Aplicația ține minte totul pe acest dispozitiv. Din Caiet → Setări poți face o copie de siguranță.
`});

les({id:'s2',m:'start',t:'Siguranța întâi: cele 4 reguli',min:4,v:['MHpELGbIHJg','rSNB3_Py8sU'],
q:[['Cineva îți dă o armă și îți spune că e descărcată. Ce faci?',['O folosești liniștit','O tratezi ca încărcată și verifici chiar tu','O dai mai departe'],1,'Regula 1: orice armă e tratată ca încărcată. Verifici personal, vizual și tactil, oricine ți-ar spune altceva.'],
   ['Când pui degetul pe trăgaci?',['Când scoți arma','Când ai decis să tragi și ești pe țintă','Mereu, ca să fii pregătit'],1,'Degetul stă întins pe lateralul armei până decizi să tragi. O tresărire de spaimă îți strânge mâna — dacă degetul e pe trăgaci, pleacă focul.']],b:`
Nimeni nu e „prea bun” pentru regulile de siguranță. Chris povestește despre un instructor cu foarte multă experiență care a tras din greșeală când nu trebuia — tocmai pentru că a crezut că lui nu i se poate întâmpla.

### Cele 4 reguli
1. **Orice armă e încărcată.** O tratezi ca încărcată până o verifici tu, vizual și cu degetul, chiar dacă „știi” că e goală.
2. **Degetul afară de pe trăgaci** până ești pe țintă și ai decis să tragi. Degetul stă întins pe lateralul armei.
3. **Țeava mereu într-o direcție sigură.** Imaginează-ți un laser care iese din țeavă: nu are voie să treacă peste nimic ce n-ai accepta să distrugi.
4. **Cunoaște-ți ținta și ce e în fața și în spatele ei.** Pereții nu opresc mereu un glonț; familia poate fi în camera de alături.

### Pe lângă cele 4
- Verifici descărcarea **personal**, vizual ȘI tactil, și nu te jenezi să ceri și altcuiva să verifice.
- Ochelari de protecție și antifoane în poligon, de fiecare dată.
- Dacă vezi ceva periculos, spui imediat. Tăcerea e tot o încălcare a siguranței.

### Copiii
Le înveți regulile pe înțelesul lor și îi pui să ți le explice cu cuvintele lor. Regula de aur pentru copii: **dacă văd o armă, n-o ating, pleacă din cameră și anunță un adult.** Armele se țin încuiate, cu muniția separat.

> Înțelegerea regulilor contează mai mult decât formularea exactă. Dacă le înțelegi, le respecți și când ești obosit sau stresat.
`});

les({id:'s3',m:'start',t:'Dry fire în siguranță: ritualul',min:4,v:['rSNB3_Py8sU','_afw6CzqlrE','cd6WeFuKJhM'],
q:[['Unde stă muniția când faci dry fire acasă?',['Pe masă, lângă tine','În altă cameră sau încuiată','În încărcătorul de rezervă'],1,'Muniția nu intră deloc în camera de antrenament. Așa un foc accidental devine imposibil.'],
   ['Ce spui la finalul sesiunii, dacă îți reîncarci arma?',['Nimic','„Arma e încărcată acum” — cu voce tare','„Gata”'],1,'Cele mai multe accidente vin la trecerea de la antrenament la armă încărcată. Spusul cu voce tare îți „comută” mintea.']],b:`
„Dry fire” (antrenamentul fără muniție) e cel mai sigur antrenament care există — **dacă** respecți ritualul de fiecare dată. Dacă cineva are un foc accidental „la dry fire”, de fapt nu făcea dry fire: avea muniție acolo unde nu trebuia.

### Ritualul, pas cu pas
1. Ai un **plan scris**: ce lucrezi azi și de ce.
2. Te duci într-o cameră doar a ta, cu ușa închisă.
3. Oprești telefonul, televizorul, orice te poate distrage.
4. **Scoți toată muniția din cameră** — o duci în altă cameră sau o încui.
5. Verifici arma și toate încărcătoarele: **vizual și cu degetul**. Apoi încă o dată.
6. Alegi un punct de ochire cu un fundal care ar opri un glonț (nu un perete subțire de interior, nu o fereastră).
7. Spui cu voce tare: **„Acum fac dry fire.”**
8. Lucrezi doar ce ți-ai propus. Dacă greșești, te întorci un pas și refaci corect.
9. Te oprești când îți pierzi concentrarea, după o repetare perfectă (de obicei 5–20 de minute).
10. Notezi în Caiet ce a mers și ce lucrezi data viitoare.

### La final
Dacă îți reîncarci arma, spui de trei ori cu voce tare: **„Arma e încărcată acum.”** Sună caraghios — e mult mai caraghios (și tragic) să uiți.

! Dacă ești întrerupt (sună cineva la ușă, te cheamă copilul), la întoarcere reiei verificările de la capăt.

les({id:'r0',m:'reguli',t:'Regulile vechi și regulile noi',min:4,an:'myelin',v:['kq2DUFJg1ZM','XPtTs42sVAM','36Ay0LAOsUI','jnOIQfIpHL4'],

Aproape toată lumea învață tragerea la fel de 50 de ani: îți spune cineva cum să stai, cum să ții arma, cum să respiri — apoi mergi la poligon și tragi până „ți se prinde”. Chris numește asta **regulile vechi**: copiezi un trăgător bun și speri.

Poziția, priza, respirația, ținerea la ora 6 — toate sunt **metode**, nu fundamente. Fundamentul e felul în care înveți.

### Cele 7 Reguli Noi
1. **Mentalitatea** — antrenezi întâi mintea, corpul urmează.
2. **Planificarea** — ai un plan scris pentru fiecare sesiune.
3. **Fizica** — folosești mecanica și legile fizicii, nu poziția copiată de la altul.
4. **Focalizarea** — înveți să focalizezi ochii și mintea pe ce contează.
5. **Antrenamentul fără muniție** — înveți fără stres, acasă.
6. **Practica deliberată** — bucăți mici, perfecte, pe slăbiciuni.
7. **Feedback constant** — afli imediat dacă faci corect.

### De ce funcționează: mielina

Ce faci în afara poligonului contează mai mult decât ce faci în poligon.

les({id:'r1',m:'reguli',t:'Regula 1: Mentalitatea',min:5,v:['eE1VoWfAWFM','et7e54XPtg8','cZHuMwJxu0g','fpABbRs9JWg','13PEKDMBMUE'],
q:[['Care e primul lucru pe care îl antrenezi, după Chris?',['Priza','Mintea','Trăgaciul'],1,'„Antrenează-ți mintea și corpul va urma.” Creierul mișcă tot.'],
   ['Ce înseamnă să fii un trăgător „MVP”?',['Cel mai bun din grupă','Meditație, Vizualizare, gândire Pozitivă','Muniție, Viteză, Precizie'],1,'MVP = Meditație, Vizualizare, gândire Pozitivă — calea cea mai rapidă spre progres.']],b:`
Gândește-te la minte ca la un calculator, iar la tragere ca la un program nou. Dacă instalezi un program bun pe un calculator vechi, plin de viruși, și merge prost, dai vina pe program. Problema e calculatorul. Mintea se „repornește” prin trei lucruri: **meditație, vizualizare și gândire pozitivă** — Chris le numește a fi un trăgător **MVP**.

### 1. De ce te antrenezi?
Totul începe cu motivul. „Mișcarea vine din emoție.” Un motiv slab (să te lauzi la prieteni) te lasă să apeși pe „amânare” la alarmă. Un motiv puternic (să-ți protejezi familia, să ajungi în unitatea pe care o vrei) te scoate din pat.

Întrebarea lui: ai intra într-o clădire în flăcări pentru o bancnotă? Dar pentru copilul tău?

@tool why Scrie-ți „de ce”-ul în Caiet

### 2. Meditația
Nu e religie. E antrenamentul de a-ți alege gândurile: observi că mintea a fugit și o readuci. Începi cu 5 minute pe zi; ținta lui e 15–20 de minute de două ori pe zi.

### 3. Vizualizarea
Repetiții în minte, perfecte de fiecare dată. Creierul folosește aceleași trasee ca la mișcarea reală.

### 4. Gândirea pozitivă
„Suntem poveștile pe care ni le spunem.” Dacă îți spui „eu tresar mereu”, mintea îți dă dreptate. Spune ce vrei: „Eu sunt un trăgător calm și precis.” Două cuvinte schimbă tot: **„Eu sunt…”**

### 5. Disonanța cognitivă
Mintea apără obiceiurile vechi și respinge informația nouă, mai ales dacă te-a învățat altfel cineva drag. Când simți „asta nu are cum să meargă”, întreabă-te: „sau doar e nou?”

> Tragi doar atât de bine cât crezi că poți.

les({id:'r2',m:'reguli',t:'Regula 2: Planificarea',min:6,v:['vd6jLUkpe9o','pWBFArCVLZ4','dU8noeVUqUk','q8GjsD3j7zc','u72-0QNxKGo','9Be6UknGmsI'],
q:[['Ce înseamnă un obiectiv MUST?',['Mare, Urgent, Simplu, Total','Cu sens, pe Înțeles, Specific, cu Termen','Măsurabil, Util, Sigur, Testat'],1,'Meaningful (cu sens), Understandable (pe înțelesul unui copil), Specific (mic și concret), Timed (cu loc și oră).'],
   ['Ce măsori ca să progresezi?',['Doar scorul din poligon','Ce faci înainte de foc: minute de dry fire, vedere, priză','Câte cartușe ai tras'],1,'Scorul e un rezultat „din spate”. Măsori ce poți controla azi: practica.']],b:`
„Dacă nu planifici, planifici să eșuezi.” Surprinzător de puțini oameni își planifică antrenamentul: iau o cutie de cartușe, merg la poligon și „trag”. E drumul cel mai lung și cel mai scump spre orice.

### Modelul GPS
Ca navigația din mașină:
1. **Adună informații** — unde ești acum? Ce îți iese, ce nu?
2. **Planifică** — care e drumul cel mai scurt până unde vrei? Scrie pașii, în ordine.
3. **Pornește** — planul se corectează doar după ce începi să mergi.

Un curs nu e un plan. Un curs e o informație.

### Cei 3 D
- **Definiție** — unde ești și unde vrei să ajungi.
- **Direcție** — pașii, scriși, în ordine.
- **Drive (motivul)** — de ce, ca să nu renunți.

### Caietul de antrenament
La fiecare sesiune notezi: data, ce ai lucrat, câte minute (sau focuri), **ce a mers, ce nu, ce lucrezi data viitoare**. Pe prima pagină ții **problema-cheie** de acum (la Chris a fost ani la rând „focalizarea pe cătare”). Înainte de fiecare antrenament citești problema-cheie și ultima intrare.

@tool caiet Deschide Caietul

### Obiective MUST
- **M**eaningful — cu sens pentru tine.
- **U**nderstandable — să-l înțeleagă și un copil de 7 ani.
- **S**pecific — mic și concret: „exersez priza în mașină, la semafor”.
- **T**imed — cu loc și oră, nu „cândva”.

Pune obiective de **proces** („15 minute de dry fire zilnic”), nu de rezultat („să câștig concursul”). Și antrenează-te până la un standard („15 repetări perfecte”), nu după ceas.

### Călărețul, elefantul și cărarea
Mintea rațională e un călăreț mic pe un elefant uriaș (emoțiile). Ca să ajungi undeva: îi dai călărețului **direcția** (planul), motivezi elefantul cu **pași mici** și pregătești **cărarea** (mediul): hainele de sport lângă pat, arma de antrenament la vedere, telefonul în altă cameră.

> Dacă nu măsori, te joci. Măsoară practica, nu doar rezultatele.

les({id:'r3',m:'reguli',t:'Regula 3: Fizica',min:6,an:'npa',v:['A_afe0h-0NI','tJkzXZpbNIY','6kK-2Y95RZ4','zztr8UamskM'],
q:[['Ce e punctul natural de ochire?',['Locul unde arăți când ești relaxat, cu ochii închiși','Centrul țintei','Cătarea'],0,'E direcția în care arată corpul tău relaxat. Dacă nu e pe țintă, reculul te readuce mereu acolo și tragi cu mușchii împotriva lui.'],
   ['Care eroare e mai gravă?',['Paralelă (oscilația)','Unghiulară (elementele nealiniate)'],1,'Eroarea unghiulară crește cu distanța. Oscilația cu aliniere perfectă mută focul doar cât te miști.']],b:`
Nu contează numele poziției (Weaver, isoscel) sau procentele prizei. Contează **mecanica**: cum folosești legile fizicii ca arma să nu se miște până pleacă glonțul. La un singur foc merge aproape orice; la distanțe mari și focuri rapide, mecanica face diferența.

Exemplul lui: nu devii Michael Jordan copiind cum stă sau cum ține mingea. Michael Jordan e mare din cauza felului în care s-a antrenat.

### Cele 4 legi ale platformei
1. **Punctul natural de ochire** — corpul relaxat arată singur spre țintă.
2. **Centrul de greutate coborât** — genunchii puțin îndoiți.
3. **Baza lărgită** — picioarele cel puțin la lățimea umerilor.
4. **Greutatea în față** — „nasul peste vârfuri”, ca într-o poziție de luptă.

@anim npa

### Testul punctului natural de ochire
1. Te așezi în poziție, cu arma de antrenament spre țintă.
2. Închizi ochii, respiri, relaxezi complet șoldurile și brațele.
3. Deschizi ochii: unde arăți acum?
4. Corectezi **doar din picioare** (rotești tot corpul), nu din brațe. Repeți până deschizi ochii și ești pe țintă.

### A treia lege a lui Newton
La orice acțiune există o reacție egală și opusă. Dacă priza e mai puternică decât forța pe care o pui pe trăgaci, arma nu se mișcă. „Nu lăsa coada să miște câinele.”

### Eroarea unghiulară și eroarea paralelă
- **Unghiulară**: cătarea nu e aliniată cu înălțătorul. Glonțul pleacă strâmb și se depărtează tot mai mult cu distanța — cea mai gravă.
- **Paralelă**: alinierea e perfectă, dar arma oscilează puțin. Glonțul ajunge doar cât te miști.

@anim errors

> Nu te teme de oscilație. Teme-te de alinierea greșită.
