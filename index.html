les({id:'p10',m:'pistol',t:'Moduri de angajare și acoperirea',min:6,
q:[['Care e diferența dintre double tap și controlled pair?',['Niciuna','Double tap: două focuri rapide, cu o imagine „flash”, de aproape; controlled pair: două focuri ochite, cu trei imagini distincte','Controlled pair e mai rapid'],1,'Double tap e pentru ținte mari și apropiate. Controlled pair, cu trei imagini la ochire, e pentru distanțe mai mari sau când trebuie să lovești doar ținta, cu oameni în jur.'],
   ['Tragi peste un zid jos. De ce contează că țeava e sub înălțătoare?',['Nu contează','Vezi ținta prin elementele de ochire, dar glonțul poate lovi marginea zidului','Ca să tragi mai sus'],1,'Linia de ochire trece peste zid, dar țeava e cu câțiva centimetri mai jos. Ține cont de asta ca să nu tragi în propria acoperire.'],
   ['Cât de aproape stai de o mașină folosită ca acoperire?',['Lipit de ea','Ceva mai în spate (aprox. 0,6–2 m), pentru că gloanțele ricoșează și alunecă pe capote și pe ziduri'],1,'Un glonț care lovește capota sau zidul tinde să alunece de-a lungul suprafeței. Distanța te scoate de pe traseul lui.']],b:`
Un principiu domină capitolul: **nu câștigă primul foc tras, ci primul foc precis.** Folosești elementele de ochire de fiecare dată, cu o singură excepție: când ridicarea armei în linia ochilor te-ar aduce la îndemâna agresorului.

### Imaginea „flash”
La distanțele pistolului rareori ai timp pentru o imagine perfectă. Compromisul e **imaginea flash**: când arma urcă în linia ochilor, privirea trece de pe amenințare pe cătare, verifici că e centrată stânga–dreapta (pe verticală poate fi aproximativ) și apeși în timp ce o prinzi. Se învață încet, apoi viteza vine singură.

Pe măsură ce avansezi, imaginea se „înmoaie”: focalizarea oscilează între cătare și țintă. E rapid și precis — dar abia după ce fundamentele sunt solide.

### Moduri de a trage
- **Double tap** — două focuri rapide, cu imagine flash, pe ținte apropiate. Distanța până la care îl folosești depinde de nivelul tău, de mărimea țintei și de cât ai exersat recent. Nu caută „gaură în gaură”, ci două lovituri rapide.
- **Controlled pair** — două focuri ochite, cu **trei imagini distincte**: înainte de primul, înainte de al doilea, după recul. Pentru distanțe mai mari, ținte mici și ori de câte ori trebuie să lovești **doar** ținta, cu oameni nevinovați în zonă.
- **„Hammers”** — două focuri foarte rapide cu o singură imagine; doar pentru ținte mari și foarte apropiate.
- **Tragi până se oprește amenințarea.** Nu „două focuri și te uiți”: nu vei vedea mereu o reacție, iar tu trebuie oricum să te uiți la cătare. Știi unde a fost cătarea la plecarea focului și continui dacă e nevoie.

### Mai multe amenințări
Autorii nu impun o metodă — o alegi tu, în funcție de distanță, de mărimea și acțiunile țintelor, de acoperire. Ce contează: **ochii ajung primii** pe centrul țintei următoare (știi de la Chris), iar trăgaciul e deja resetat și pregătit când cătarea ajunge acolo. Teoriile se verifică în antrenamente cu muniție de marcare, nu în concursuri.

### Acoperirea
**Acoperirea** oprește gloanțele. **Camuflarea** doar te ascunde. Nu le confunda.

**Peste acoperire** (zid jos, mașină) — varianta preferată:
- Stai ghemuit sau în genunchi; ieși doar cât îți trebuie pentru foc.
- Poți sprijini arma pe acoperire, dar **nu pune pistolul direct pe o suprafață dură** — mâinile fac de pernă.
- Arma nu trece de marginea acoperirii.
- **Țeava e sub înălțătoare.** Poți vedea ținta, iar glonțul să lovească marginea zidului.
- Gloanțele ricoșează și **alunecă pe capote și pe ziduri**. Stai cam 0,6–2 m mai în spate, în funcție de unghiul din care s-ar putea trage spre tine.
- Nu te profila pe un fundal care contrastează.

**Pe lângă acoperire:**
- Te așezi cât mai aproape, astfel încât, în poziția de tragere, să ieși cât mai puțin.
- Tragi pe partea armei (dreptaci — spre dreapta).
- Pe partea cealaltă, dacă nu ești antrenat cu mâna de sprijin, te apleci: un pas scurt în lateral, cât să vezi ținta cea mai din afară, apoi lucrezi spre interior.

### Lipit de agresor
La distanță de braț nu întinzi arma: o ții la corp, în **poziția de retenție**, iar mâna liberă blochează sau împinge. Ai grijă să nu ai mâna liberă în fața țevii. Cu arma lipită de un corp, pistolul poate să nu se mai închidă și să rămână blocat după primul foc.

! Toate acestea sunt principii. Exercițiile cu foc real, la acoperiri și cu mai multe ținte, se fac doar în poligon autorizat, cu instructor.

q:[['Cu o singură mână, cum tragi închizătorul dacă e închis?',['Cu dinții','Agăți înălțătorul de curea, de toc sau de gheată și împingi arma în jos — cu degetul afară de pe trăgaci','Nu se poate'],1,'Înălțătorul are o margine dreaptă tocmai bună de agățat. Degetul stă afară: dacă e pe trăgaci, arma trage când se închide.'],

Autorii numesc tragerea „ca rănit” **cea mai avansată tehnică de pistol**. Cheia nu e tehnica, ci mentalitatea: **nu renunți niciodată**. Adrenalina te ajută să faci lucruri incredibile.

Chris îți arată priza și platforma cu o mână. Cartea merge mai departe: **reîncărcări, incidente și scosul** doar cu o mână — cu mâna armei sau cu cealaltă.

### Gândește realist
Dacă agresorul trage spre centrul corpului și tu ești în prezentare completă, acolo îți sunt brațele. De aceea exersezi ca și cum ai fi fost rănit **înainte** să scoți arma, dar și **după**, pe ambele părți.

### Cu mâna armei
1. Scoți arma și **aduci brațul rănit la piept**, pe mijloc — te ajută la echilibru și la recul.
2. Faci un pas în față cu piciorul de pe partea armei și te întorci cu profilul. Te apleci puțin din șold.
3. Înclini arma spre interior cel mult 45°, ca să blochezi încheietura cu mușchii mai puternici ai antebrațului.

### Reîncărcarea cu o mână
- Preferabil **în genunchi**: centru de greutate jos, țintă mică, iar dacă scapi ceva, e aproape.
- **Prinzi pistolul în spatele genunchiului** ridicat (sau îl pui în toc), scoți încărcătorul gol, iei unul plin trecând mâna peste corp, privești o clipă lăcașul, îl introduci și îl fixezi.
- Închizătorul blocat în spate se eliberează cu degetul mare de pe opritor.
- Dacă închizătorul e închis, **agăți înălțătorul** de curea, de toc, de gheată, de marginea unui perete sau a unei uși și împingi arma în jos și în afară. Ai grijă să nu prinzi haine.
- În picioare, cauți **acoperire**, nu doar camuflare.

### Incidentele cu o mână
Tot din genunchi, dacă se poate, și după o acoperire care oprește gloanțele.
- **Nu pleacă focul:** degetul afară, bați talpa armei de coapsă ca să fixezi încărcătorul, tragi închizătorul agățând înălțătorul.
- **Tub blocat:** sprijini tubul de curea sau de gheată și îl împingi ferm, fără să tragi închizătorul complet.
- **Dublă alimentare:** blochezi închizătorul în spate (împingi opritorul în timp ce agăți înălțătorul și tragi), scoți încărcătorul, armezi de trei ori ca să iasă tubul, pui pistolul în toc sau între genunchi cât introduci un încărcător plin, apoi armezi din nou.

### Cu cealaltă mână
E cel mai greu de învățat. Prima problemă: pistolul e pe partea „greșită”. Variante, în funcție de corp și de toc:
- tragi centura spre partea liberă până ajungi la armă;
- ajungi prin față, rotești pistolul în toc ca să-l poți apuca.

Butonul încărcătorului și opritorul se acționează adesea cu **degetul arătător** (fără să intri în gardă).

### Ridicarea pistolului căzut
Sună simplu, dar stresul strică și lucrurile simple. Dacă mânerul e spre partea mâinii libere, ridici puțin închizătorul și **rulezi pistolul în priză**. Dacă e invers, întâi îl rotești cu mânerul spre tine. Degetul mare te ajută să-l ții până îl ridici.

! Sunt cele mai periculoase exerciții din carte: în timpul armării cu o mână, țeava trece ușor pe lângă corp, iar degetul pe trăgaci înseamnă foc la închidere. Se învață **încet, cu cartușe inerte și cu instructor**. Dacă ai dubii, nu le face singur.

> Dacă trebuie să-l lovești cu capul ca să supraviețuiești, asta faci. Nu renunți.

les({id:'p12',m:'pistol',t:'Lanterna cu pistolul',min:5,
q:[['Unde ții lanterna de mână când schimbi încărcătorul?',['În gură','Sub axila de pe partea armei','Pe jos'],1,'Sub axilă, lanterna stă la îndemână, iar mâna de sprijin e liberă pentru încărcător sau pentru incident. Dacă nu-ți trebuie lumină, o stingi.'],
   ['Întunericul e acoperire?',['Da','Nu — te ascunde, dar nu oprește gloanțele'],1,'Întunericul e camuflare. Cineva care trage spre zgomot sau spre lumina ta te poate lovi oricum.']],b:`
Despre cum vede ochiul noaptea și despre principiul „aprinzi, vezi, stingi, te muți” ai lecția „Lumina slabă”. Cartea adaugă **cum ții lanterna și pistolul împreună**. Autorii vorbesc despre „lumină slabă”, nu despre „noapte”: într-un subsol e la fel de întuneric la prânz ca la miezul nopții.

### Ce lanternă
O lanternă nu trebuie să fie cea mai mare și cea mai scumpă, ci **de încredere** — și să fie la tine când îți trebuie. Ai mereu baterii de rezervă. Dacă are cap reglabil, **strânge fascicolul**: prea larg te împiedică să vezi detalii.

### Cum o ții
- **Mâinile încrucișate (tehnica Harries).** Lanterna în mâna de sprijin, încheietura ei trece pe sub încheietura mâinii armei; comutatorul îl apeși cu degetul mare sau cu alt deget.
- **Lanterna montată pe armă.** Autorii o preferă: priza rămâne cea obișnuită, deci e precis și rapid. Calitatea contează — trebuie să rămână fixă și să reziste la recul.
- **Lanterna de pe arma lungă.** Dacă arma lungă s-a blocat, dar are lanternă, o ții cu brațul de sprijin îndreptată spre țintă și tragi cu pistolul într-o mână.

### Înălțătoarele cu tritiu
Cele trei puncte luminoase te ajută să ochești când poți identifica amenințarea fără să-ți dai poziția cu lanterna. Plătești calitate.

### Cum folosești lumina
- Ochește **centrul fascicolului spre îmbinarea podea–perete sau perete–tavan**: luminezi mai mult din cameră.
- **Scanări scurte**, apoi stingi și **te muți** înainte să continui.
- În clipa în care aprinzi, îți pierzi adaptarea la întuneric. Poți ține **ochiul dominant închis** ca să-l păstrezi; îl deschizi doar dacă trebuie să tragi.
- Cu un partener, vă puteți alterna luminile (unul aprinde, apoi stinge, apoi celălalt) ca să-l derutați pe cel căutat — sau folosește lumină doar unul, ca celălalt să rămână neobservat. Nu trebuie să aprindă toată lumea.
- Ai arma pregătită **înainte** să aprinzi și nu fi surprins când găsești exact ce căutai.
- Lumina îl poate dezorienta pe cel din fața ta.
- Lanterna se poate aprinde din greșeală și să te dea de gol.

### Reîncărcări și incidente pe întuneric
- **Lanterna sub axila** de pe partea armei: mâna de sprijin rămâne liberă. Dacă nu-ți trebuie lumină pentru manevră, o stingi.
- Învață „gemetele” pistolului: pe întuneric nu vezi incidentul, îl **simți și îl auzi**.
- Stabilește cu partenerii un **cuvânt-cod** pentru „am un incident, sunt scos din luptă”.

### Ce să nu uiți
- **Întunericul e camuflare, nu acoperire.**
- Flacăra de la gura țevii (a ta și a celor de lângă tine) arată altfel în funcție de armă, muniție și lumină. Familiarizează-te cu ea, ca să nu te surprindă.
- Paradoxal, cu lanterna, grupele ies adesea mai strânse: ai mai puține distrageri, iar elementele de ochire se văd pe țintă ca o siluetă.

! Exersează întâi în casă, cu arma de antrenament și lanterna, ziua, apoi pe întuneric. Focul real cu lanterna doar în poligon, cu instructor.

les({id:'p13',m:'pistol',t:'Antrenamentul ca la sală',min:5,

Planificarea și practica deliberată le ai de la Chris. Cartea adaugă **cifre concrete** și o **ordine a exercițiilor**.

### Regulile de bază
- **5 la 1**: cinci sesiuni de dry fire pentru fiecare sesiune cu foc real. Verifică arma înainte; muniția nu intră în camera de antrenament.
- **Ca la sală.** Mergi cu un obiectiv și cu o listă de echipament (ca să nu descoperi la poligon că ți-a rămas ceva acasă). Lucrezi pe ce ți-ai propus și **pleci când l-ai atins**.
- **Cel mult ~350 de cartușe pe zi** — peste atât, oboseala strică tehnica.
- **Împinge și trage înapoi.** Accelerezi până ratezi cam 30%, apoi încetinești până lovești din nou 100%. Așa cresc împreună viteza și precizia.
- Viteza vine din **mai puține mișcări**, nu din mișcări mai grăbite.
- **Încheie cu un exercițiu pe care îl faci bine.**
- Ține evidența și fii cinstit cu rezultatele: îți arată unde să lucrezi și ce nu mai are nevoie de atenție.

### Focul lent, ochit
E exercițiul de bază pentru fundamente: le treci în revistă înainte de fiecare foc și nu grăbești niciunul. Nu stai cu brațele întinse mai mult de **5–7 secunde** — dacă nu a plecat focul, revii la poziția 3 și reiei. Spui după fiecare foc unde a lovit.

### Ordinea exercițiilor din carte
1. Dry fire.
2. Cartuș inert amestecat de un coleg (ca diagnostic al tresăririi).
3. Foc lent, ochit.
4. Poziția 3 la 4.
5. Controlled pair.
6. Double tap.
7. Scosul din toc.
8. Ritmul.
9. În genunchi, culcat, pe spate.
10. Baricade înalte și joase.
11. Întoarceri la 90° și 180°.
12. Retenția (tragerea din poziția 2).
13. Deplasarea: oprire și foc, apoi foc din mers, la comanda altcuiva.
14. Doar cu mâna armei, apoi doar cu cealaltă.
15. Din vehicul și spre un vehicul.
16. Reîncărcări și incidente cu o singură mână.

### Exercițiul de ritm
Șase focuri pe aceeași țintă, la 7–9 metri, în **cel mult 3 secunde**, iar intervalele dintre focuri nu diferă între ele cu mai mult de **0,06 secunde**. Exemplu bun: 0,30 – 0,31 – 0,33 – 0,35 – 0,30. Ritmul rupt sau grupa împrăștiată îți arată priza, poziția, trăgaciul sau controlul reculului. Un ritm constant e adesea mai rapid și mai precis decât „două, două, două”.

les({id:'k0',m:'carabina',t:'Cartea și omul',min:2,b:`
Lecțiile din acest modul vin din **„Green Eyes & Black Rifles — Warrior's Guide to the Combat Carbine”** (2008), scrisă de **Kyle E. Lamb**, sergent-major în retragere, veteran al Forțelor Speciale americane. Coperta rezumă cariera: „de la Mogadiscio la Mosul”. Cea mai mare parte a cărții a scris-o în Irak, între misiuni, noaptea, înainte de culcare.

Cartea e despre carabina de tip AR (M4), dar pozițiile, mișcarea și mentalitatea se aplică la orice pușcă, carabină sau armă lungă.

### Ce găsești aici
Ce nu acoperă lecțiile după Chris sau modulul de pistol:
- alegerea carabinei, a ochitorului și a curelei;
- încărcarea, încărcătoarele, muniția și incidentele specifice armei lungi;
- zeroirea și balistica: unde lovește glonțul la fiecare distanță;
- poziția „de boxer”, pozițiile joase și ciudate, colțurile și baricadele;
- întoarcerile, tragerea din mers, partea de sprijin;
- decizia „trag sau nu”, trecerea la pistol, noaptea, întreținerea;
- iar la final: unde nu sunt de acord Sajnog, Lawrence & Pannone și Lamb.

Lamb repetă ideea „uneltelor din trusă”: încerci o tehnică; dacă merge, o păstrezi. Dacă nu, o păstrezi oricum și o încerci din nou mai târziu.

! Exersezi cu o armă de antrenament (replică airsoft sau albastră) ori cu arma reală verificată descărcată, doar dacă o deții legal (tir sportiv, vânătoare, instituție). Focul real, încărcarea cu muniție și incidentele se învață cu instructor, în poligon autorizat.

> „Rămâi în luptă!” — deviza lui Lamb.
`});

les({id:'k1',m:'carabina',t:'Ce contează când alegi o carabină',min:5,
q:[['De ce recomandă Lamb o apărătoare „flotantă” (care nu atinge țeava)?',['E mai frumoasă','Presiunea curelei sau a unui sprijin pe apărătoare mută punctul de impact','E mai ușoară'],1,'Cu apărătoarea clasică, o curea strânsă sau o sprijinire pe un zid apasă pe țeavă. Lamb a mutat astfel impactul cu ~10 cm la 100 m.'],
   ['Cât de ușor ar trebui să fie trăgaciul unei carabine de luptă?',['Cât mai ușor, sub 1 kg','Cel puțin ~1,8 kg (4 livre), cât mai aproape de cel al pistolului','Nu contează'],1,'Un trăgaci prea ușor favorizează focul accidental sub stres și nu se simte cu mănuși.']],b:`
Lamb deschide cartea cu componentele armei. Chiar dacă ai primit arma de la instituție, merită să știi ce ai în mână.

### Țeava
- **Lungimea** contează mai mult decât pare: viteza glonțului depinde direct de ea. La armele civile obișnuite, 40 cm (16") e standard; cele militare au 37 cm (14,5"). Țevile foarte scurte arată bine, dar pierd viteză — iar glonțul poate să nu se mai deformeze cum a fost proiectat (pătrunde prea puțin sau, invers, prea mult).
- **Pasul ghinturilor** — câte rotații face glonțul pe o anumită lungime. 1:7 (o rotație la ~18 cm) e cel militar; Lamb preferă 1:8 pentru gloanțele grele (75–77 grain), iar 1:9 e un bun pas „la toate”. Gloanțele grele cer pas mai strâns.
- **Cromarea interioară** scade puțin precizia, dar crește fiabilitatea: tubul iese ușor din cameră chiar și când arma e foarte murdară.
- **Greutatea**: o țeavă ușoară e mai bună de purtat, una mai groasă rezistă mai bine la căldura antrenamentelor intense. Alegi după ce faci mai des.

### Apărătoarea flotantă
O apărătoare care **nu atinge țeava** (prinsă doar de piulița ei) face două lucruri:
- crește precizia, pentru că nimic nu apasă pe țeavă;
- îți permite să strângi cureaua sau să te sprijini pe un zid, o mașină, un stâlp **fără să muți punctul de impact**. Cu o apărătoare clasică, Lamb a mutat impactul cu ~10 cm la 100 m doar din tensiunea curelei.

Apărătoarea trebuie să stea fixă (fără joc), mai ales dacă pe ea montezi lanterne și lasere reglate.

### Trăgaciul
- Cel puțin **~1,8 kg (4 livre)**: îl simți cu mănuși și scade riscul unui foc accidental sub stres. Ideal, apropiat de trăgaciul pistolului tău.
- Trăgaciul în două trepte ajută la distanță, dar de aproape e mai lent.
- După montarea unui trăgaci nou: **piedica nu trebuie să poată fi pusă cu cocoșul căzut**. Altfel, la un incident cu cocoșul în față și piedica pusă, nu mai poți trage închizătorul ca să rezolvi problema.

### Șinele și patul
- Șinele Picatinny (standardul militar) primesc aproape orice accesoriu; cele Weaver nu mereu. Dacă se pot demonta, scapi de efectul de „răzătoare” pe mâini.
- **Patul**: verifici lungimea punând arma la umăr. Dacă nasul lovește luneta, îl lungești; dacă trebuie să te întinzi ca nasul să atingă mânerul de armare, îl scurtezi. Un pat prea scurt îți ia controlul și echilibrul.
- Un pat telescopic trebuie să se strângă repede: la un tub blocat, îl strângi **înainte** să lovești patul de pământ, ca să nu rupi tubul amortizorului.

### Exercițiul lui
Fă inventarul armei tale: lungimea țevii, pasul, cromată sau nu, grea sau ușoară, ce apărătoare, ce ochitor. Când știi exact ce ai, înțelegi de ce se comportă cum se comportă.

q:[['Cum verifici dacă o lunetă are paralaxă?',['Te uiți dacă imaginea e încețoșată','Cu arma sprijinită, miști ochiul stânga–dreapta, sus–jos: dacă reticulul „alunecă” pe țintă, ai paralaxă','O lovești ușor'],1,'O imagine încețoșată ține de reglajul ocularului. Paralaxa se vede ca o mișcare a reticulului față de țintă când îți miști ochiul.'],
   ['Ce mărime de dioptrie (cerc) recomandă Lamb la înălțătorul de rezervă?',['Cea mai mică','Una mare — e pentru urgențe, aproape, și poate funcționa ca „ghost ring”','Nu contează'],1,'Înălțătorul de rezervă e pentru cel mai rău caz: o amenințare apropiată, sub 100 m. Un cerc mare e mai rapid.']],b:`
Cu elementele mecanice învățate de la Chris, Lamb trece la ochitoarele carabinei moderne.

### Înălțătorul și cătarea
Avantaje: nu au baterii, sunt foarte rezistente, merg aproape în orice lumină și sunt precise până la ~200 m pentru cei mai mulți trăgători. Pe întuneric, o cătare cu tritiu ajută mult. Atenție la înălțătoarele cu două cercuri: centrele pot fi la înălțimi diferite, deci și impactul diferă.

### Punctul roșu
- **Holograficul** (de tip EOTech) e, după Lamb, cel mai rapid de aproape: nu privești printr-un tub. Funcționează chiar și cu sticla parțial spartă, cât timp vezi punctul.
- **Cel în tub** (de tip Aimpoint) e robust, cu baterie de mii de ore. Un punct mai mic e mai bun la distanță.
- Un **multiplicator 3x** se pune în spatele punctului roșu, fără să schimbe reglajul.
- Ține baterii de rezervă pe armă și schimbă-le odată cu cea din ochitor.

### Luneta cu mărire
O lunetă cu mărire mică variabilă sau fixă (de tip ACOG) îți permite să **vezi în umbrele unei case de la distanță** — iar asta contează când nu știi de unde vin focurile. Rar se defectează luneta în sine; mult mai des cedează montura.

### Înălțătoarele de rezervă
Lamb recunoaște că nu le-a folosit niciodată în luptă, dar sunt mici și ușoare, deci „de ce nu?”. Sfaturile lui:
- **un singur cerc, mare** — e pentru urgențe, aproape; poate funcționa ca „ghost ring”;
- fără reglaje complicate care se mișcă singure;
- **marchează poziția corectă cu un marker de vopsea**: alții se joacă cu ele când îți „admiră” arma.

### Paralaxa
Apare când imaginea țintei nu cade exact pe planul reticulului. Ca s-o verifici: arma sprijinită fix, **miști ochiul** stânga–dreapta, sus–jos. Dacă reticulul alunecă pe țintă, ai paralaxă. O imagine încețoșată nu e paralaxă — e doar ocularul nereglat. La punctul roșu o reduci cu un **contact constant al obrazului pe pat**, iar punctul îl aliniezi cu cătarea mecanică.

### MOA și miliradiani, pe înțeles
- **1 MOA** (minut de unghi) ≈ **2,9 cm la 100 m** (aproape exact un inch la 100 de yarzi).
- Un clic de ¼ MOA mută impactul ~0,7 cm la 100 m. La 50 m îți trebuie **dublul clicurilor**, la 25 m de patru ori mai multe.
- **1 miliradian** = 10 cm la 100 m. Reticulele cu puncte mil servesc la estimarea distanței după mărimea țintei, la corecții de ținere și la avans pentru ținte în mișcare.
- **Primul plan focal**: reticulul se mărește odată cu imaginea, deci măsurătorile sunt corecte la orice mărire — dar la mărire mică reticulul e greu de văzut. **Al doilea plan focal**: reticulul rămâne la fel; măsori corect doar la o anumită mărire.

@tool clicks Calculează clicurile de corecție

### Montarea
- Monturi solide: cu șuruburi sau cu pârghie. Nimic strâns doar cu degetele.
- Adeziv de filet (cel albastru) și cheie dinamometrică.
- Reticulul se nivelează după **corpul armei** (cu o nivelă pe suprafața plată a cutiei), nu după baza cătării.
- Distanța față de ochi o verifici în **toate pozițiile** — ce e bine în picioare poate fi rău culcat.
- Ochitorul nu trebuie să te împiedice să ajungi la mânerul de armare sau la alte comenzi.
- La zeroirea punctului roșu: luminozitatea **cea mai mică** la care încă vezi punctul — ochești mai fin.

   ['Cum îți dai seama, fără să privești, că s-a alimentat un cartuș?',['Asculți','Scoți încărcătorul și pipăi cartușul de sus: la un încărcător plin, trece de pe dreapta pe stânga','Nu se poate'],1,'Cartușele stau în zigzag. Dacă cel de sus a trecut pe partea cealaltă, unul a plecat în cameră. Merge ziua și noaptea, și cu mănuși.']],b:`
Ai auzit vreodată un poligon întreg auzind „clic” după primul foc? Sau un încărcător căzând pe jos? Lamb spune că aproape mereu e vina tehnicii de încărcare.

### Încărcarea
1. Piedica pusă, țeava într-o direcție sigură.
2. Blochezi închizătorul în spate (tragi mânerul de armare și apeși partea de jos a opritorului), apoi împingi mânerul înapoi până se fixează.
3. Verifici că încărcătorul e plin: apeși pe cartușul de sus. Memorează cât de adânc coboară la 30 sau la 28 — ca să verifici și pe întuneric.
4. Introduci încărcătorul până face clic, apoi **tragi de el în jos** ca să fii sigur că s-a prins. Pasul ăsta te scapă de încărcătorul care cade la primul foc.
5. Eliberezi închizătorul — cu degetul mare pe opritor, cu palma, sau trăgând mânerul de armare și dându-i drumul. Privești fereastra.
6. Închizi capacul ferestrei.

### Fără „press check”
Mulți verifică camera trăgând puțin închizătorul. Lamb nu o face la AR: pe o armă cu nisip sau calamină, închizătorul tras puțin poate să nu se mai închidă complet — adică îți provoci singur un incident. În schimb:
- scoți încărcătorul și **pipăi cartușul de sus**. Cartușele stau în zigzag: la un încărcător plin, cel de sus e pe dreapta; după ce unul a plecat în cameră, cel de sus e pe stânga;
- pui încărcătorul la loc, până face clic, și **tragi de el**.
Merge ziua și noaptea, cu mănuși sau fără, și pe arme fără asistent de închidere.

### Reîncărcarea rapidă
Închizătorul a rămas în spate:
1. Lași încărcătorul gol să cadă. Îl ridici după ce ai câștigat.
2. Introduci unul plin până la capăt și **tragi de el**.
3. Eliberezi închizătorul. Lamb folosește degetul mare pe opritor, dar pentru cine nu se poate antrena mult, varianta sigură e **mânerul de armare**: îl tragi complet și îi dai drumul, ca la un foc normal.

Cum apuci încărcătorul de 30: nu ca pe unul de pistol, ci cu **degetul mic sub talpă** — ai mai multă forță să-l fixezi și mâna e deja în poziție să tragi de el.

### Reîncărcarea tactică
Vrei arma plină înainte să te muți:
- dacă se poate, din spatele unei acoperiri;
- încărcătorul parțial merge într-un buzunar sau o husă **pe care nu o folosești la reîncărcările rapide**;
- pipăi cartușul de sus al celui nou, ca să știi de pe ce parte e (unul se poate pierde după mult timp în portcartușier);
- dacă ai dubii, tragi mânerul de armare complet, apoi refaci verificarea prin încărcător.

### Descărcarea
1. Piedica pusă, țeava în direcție sigură.
2. Scoți încărcătorul și îl pui deoparte.
3. Tragi mânerul de armare **privind cum iese cartușul**.
4. **Privești în cameră** ca să confirmi că e goală.
5. În poligon, abia apoi, cu țeava spre ținte, treci pe foc și lași cocoșul să cadă.

! Acasă exersezi încărcarea doar cu încărcătoare goale sau cu cartușe inerte (portocalii, ușor de recunoscut), cu muniția reală în altă cameră.

q:[['Ce faci cu un încărcător cu buzele îndoite?',['Îl îndrepți cu cleștele','Îl distrugi — buzele îndoite nu mai revin niciodată','Îl vinzi'],1,'Lamb nu dă și nu vinde încărcătoare proaste: le turtește. Nu vrea ca un om să-și piardă viața din cauza lor.'],
   ['Pentru o armă de apărare, ce cere Lamb întâi de la muniție?',['Să fie ieftină','Fiabilitatea, chiar înaintea preciziei','Să fie lucioasă'],1,'Dacă arma nu funcționează, nu mai contează cât de precisă e. De aceea preferă muniția făcută după specificații militare.']],b:`
Ai învățat de la Chris să-ți numerotezi încărcătoarele ca să-l găsești pe cel defect. Lamb face la fel (număr plus inițiale) și adaugă cum îl recunoști.

### Semnele unui încărcător rău
- Cartușele **sar afară** când îl încarci: buze uzate.
- **Testul loviturii**: îl încarci cu ~20 de cartușe și lovești talpa, ținându-l vertical. Dacă sare un cartuș, buzele sunt deformate — iar cele deformate provoacă duble alimentări.
- Fisuri mici în spate, unde începe curbura.
- **Nu cade singur** când e gol.
- Un încărcător de 30 care nu mai primește 30.

Încărcătoarele proaste nu se repară și nu se vând — **se distrug**. Pe cele păstrate intenționat pentru exerciții de incidente le vopsești, de exemplu în roșu, ca să nu le încurci niciodată.

### Mituri pe care le demontează
- **„Nu încărca niciodată mai mult de 28.”** Fals: un încărcător bun merge plin. Dacă alegi 28, atunci mereu 28 — și verifici la fiecare încărcare.
- **„Nu sprijini încărcătorul de pământ.”** Fals pentru echipament bun: culcat, încărcătorul pe pământ îți dă stabilitate și focuri mai rapide. Dacă arma se blochează așa, schimbă încărcătoarele.
- Elevatorul (piesa de sub cartușe) contează: Lamb evită elevatoarele vechi negre.

### Muniția
Prima cerință e **fiabilitatea, înaintea preciziei**. Lamb preferă muniția făcută după specificațiile armatei americane, pentru detalii care la vânătoarea de rozătoare nu contează, dar într-o luptă da:
- tubul din alamă dură, dar nu casantă, care rezistă la smulgerea violentă din cameră;
- gâtul tubului tratat termic (se recunoaște după o nuanță „curcubeu”);
- capsa fixată și etanșată, ca să nu iasă și să blocheze mecanismul;
- glonțul strâns într-un șanț (canelură), ca să nu se miște.

Zeroiești cu muniția pe care o folosești „de serviciu”. Pentru antrenament poți folosi una mai ieftină — dar nu-ți modifica reglajul după ea.

> Nu te atașa sentimental de încărcătoare.

les({id:'k5',m:'carabina',t:'Incidentele la carabină',min:6,
q:[['La acțiunea imediată, cum eliberezi mânerul de armare?',['Îl însoțești ușor înainte','Îi dai drumul să plece singur, cu toată forța arcului','Îl împingi cu putere'],1,'Însoțit, închizătorul poate să nu se închidă complet și îți faci un incident nou. Îl lași să „zboare”.'],
   ['Dublă alimentare rezolvată cu acțiunea remedială. Ce faci cu încărcătorul vechi?',['Îl bagi la loc','Nu-l mai folosești acum — încărcătorul e cauza cea mai probabilă','Îl golești și îl reumpli'],1,'Încărcătoarele produc cele mai multe incidente. După remediere, pui altul.']],b:`
Dacă porți și pistol, de obicei treci pe el când carabina se oprește (lecția „Trecerea la pistol”). Dar exersezi și incidentele la carabină: amenințarea poate fi prea departe pentru pistol sau poate fi vizibilă doar o bucățică din ea.

Două proceduri rezolvă aproape totul: **acțiunea imediată** și **acțiunea remedială**.

### Acțiunea imediată
În armată se învață **SPORTS**: bați încărcătorul, tragi mânerul, **observi** fereastra, eliberezi, împingi asistentul de închidere, apeși din nou. Lamb îl predă întâi, pentru că te învață să analizezi. Cu experiență devine **bate — trage — foc**:
1. Degetul afară din gardă.
2. **Bați** talpa încărcătorului cu putere — o bătaie moale nu ajută. Ochii aruncă o privire la fereastră.
3. La nevoie, prinzi patul sub braț ca să ții arma doar cu mâna de pe mâner. **Țeava nu urcă.**
4. **Tragi mânerul de armare complet** — poți să-l agăți cu îndoitura arătătorului de sprijin — rotind ușor arma spre dreapta, ca să cadă orice cartuș sau resturi.
5. **Îi dai drumul** să plece singur. Nu-l însoți: închizătorul poate să nu se închidă și îți faci alt incident.
6. Reevaluezi: mai există amenințarea? Abia apoi apeși.

Stângacii bat încărcătorul tot cu mâna stângă: e mai rapid, pentru că mânerul de armare se eliberează din stânga.

### Acțiunea remedială
Dacă acțiunea imediată n-a mers, nu mai ai o problemă simplă. Decizi întâi dacă amenințarea e iminentă. Dacă nu, cauți acoperire.
1. **Scoți încărcătorul** — e cauza cea mai probabilă, deci nu-l mai folosești acum.
2. **Blochezi închizătorul în spate.** Dacă nu se blochează: îl ții cu degetul mare al mâinii de sprijin, îl tragi cu arătătorul prin lăcașul încărcătorului sau, la nevoie, cu colțul unui încărcător.
3. Ții apăsat opritorul (ca să nu-ți muște degetele) și împingi cartușele blocate afară prin lăcaș. Uneori ajută o bătaie în pat.
4. Încărcător nou, armezi, continui.

### Ce fel de incident e?
- **Dubla alimentare**: două cartușe întregi încearcă să intre în cameră deodată. Cauza: încărcătorul. Nu o agrava lovind arma.
- **Neextragerea / tubul înțepenit**: tubul tras rămâne în cameră. Cauze: camera murdară, alamă moale sau lovită, prea mult lubrifiant, extractor slab. Strângi patul, ții mânerul de armare și **bați patul de pământ** sau de un perete, cu țeava în direcție sigură. Dacă nu iese: o vergea de curățat (Lamb poartă patru segmente pe armă, fără vârful cu ochi) împinsă din față, în timp ce tragi mânerul.
- **Închizătorul trece peste cartuș**: arcul încărcătorului e slab sau încărcătorul e îndoit; uneori un amortizor de zgomot accelerează închizătorul. Tuburile rămân cu „urme de dinți”.
- **Tubul blocat în fereastră**: arcurile extractorului sau ejectorului sunt slabe (costă câțiva lei, schimbă-le periodic). Și când stai prea aproape de o roată sau de pământ, tubul poate ricoșa înapoi în fereastră.
- **Tubul prins lângă mânerul de armare**: rar și urât. Tragi puțin închizătorul cu degetul și înclini arma spre dreapta ca să cadă tubul.

### Cum te antrenezi
- Trage arma până rămâne goală și **învață senzația** închizătorului care se blochează în spate. Câștigi timp la reîncărcare.
- În poligon, nu trebuie să rezolvi incidentele mereu în viteză: analizează-le, ca să știi cum arată și ce le-a cauzat.
- Un coleg îți încarcă încărcătoarele cu **cartușe inerte portocalii** amestecate, ca să nu știi când apare incidentul.

> Nu accepta o armă care se blochează. Află de ce, repar-o, și incidentele vor fi foarte rare.

! Incidentele se exersează doar cu cartușe inerte, după ce instructorul ți-a arătat procedura pe arma ta. Verifici fiecare încărcător înainte să pleci din poligon.

   ['De ce nu-i plac lui Lamb curelele în trei puncte?',['Sunt scumpe','Acoperă comenzile, se strâng în jurul corpului și fac grele trecerile de pe un umăr pe altul','Sunt prea scurte'],1,'Banda suplimentară îți acoperă comenzile (la stângaci chiar fereastra) și se strânge pe corp la treceri sau când trebuie să iei arma de pe un rănit.']],b:`
Lamb spune că cureaua e cea mai neglijată unealtă a trăgătorului tactic. Nu e doar ceva de cărat arma, ci un instrument cu mai multe roluri.

### Trei tipuri
- **În trei puncte** — „cel mai bine păstrat secret”: nu prea merge. Acoperă comenzile de pe o parte (la stângaci, chiar fereastra), lasă arma să atârne prea jos sau o ține cu țeava în sus, se strânge în jurul corpului la trecerea de pe un umăr pe altul și face greu de luat arma de pe un coleg rănit.
- **Într-un punct** — bună pentru purtare și pentru trecerea la pistol. Dar țeava cade drept în jos și n-o poți strânge bine pe spate; îți trebuie ceva care s-o fixeze când urci sau imobilizezi pe cineva. Prinderea nu trebuie să încurce mâna sau mânerul de armare.
- **În două puncte, reglabilă rapid** — preferata lui. Cu o tragere o strângi pe corp (ca să urci, să cobori pe frânghie sau să ai mâinile libere), cu o tragere de buclă o lungești (pentru schimbul de umăr sau ca să iei poziția).

### Cureaua ca sprijin
Culcat sau șezând, o curea strânsă îți face poziția mult mai stabilă. Se prinde **în spatele și deasupra patului** și **în fața apărătoarei**. Dacă tragi tare de curea, o apărătoare flotantă te scapă de mutarea impactului.

### Țeava în jos
Lamb e categoric:
- **în elicopter și în vehicul** — ca să nu-ți acoperi colegii la urcare, la coborâre sau la un impact;
- **în deplasare** — profil mai mic, alergi mai ușor, nu-ți „steaguiești” colegii;
- **la retenție** — cu țeava în jos ai variante (vezi lecția despre poziția în picioare);
- **medicii și cei care sparg uși** poartă adesea arma cu țeava în sus „ca să nu intre pământ”. Rezultatul: țeava ajunge la nasul colegului când se apleacă peste un rănit. Soluția e un capac de țeavă sau o bandă adezivă.

Și dacă intră puțin pământ în țeavă, îți trebuie foarte mult ca s-o înfunde atât cât să fie periculos.

### Reglajul pentru trecerea la pistol
Cureaua trebuie să fie doar cât de lungă îți trebuie ca să tragi din poziția normală. Așa, când lași carabina pentru pistol, rămâne strânsă lângă corp și nu-ți atârnă între picioare.

les({id:'k7',m:'carabina',t:'Fundamentele, cu viteză',min:5,an:'offset',
q:[['La 5 metri, ochești fix centrul unei ținte mici cu o carabină. Unde lovește, de obicei?',['Exact în centru','Puțin mai jos, pentru că ochitorul e cu câțiva centimetri deasupra țevii','Mult mai sus'],1,'Ochitorul e cu ~6 cm deasupra țevii (mai mult dacă e pe mâner). De aproape, glonțul încă e sub linia de ochire.'],
   ['Ce înseamnă „să-ți citești elementele de ochire”?',['Să citești manualul','Să știi tot timpul unde erau elementele când a plecat focul, ca să corectezi imediat fără să aștepți reacția țintei','Să le cureți'],1,'Dacă știi că focul a plecat lângă țintă, tragi din nou imediat. Câștigi timp, mai ales la distanțe de peste 50 m.']],b:`
Lamb pornește de la aceleași fundamente ca toată lumea, dar adaugă elementul care „face să cadă roțile”: **viteza**. Adversarul se bazează pe „trage și roagă-te”. Tu te bazezi pe fundamente, aplicate repede. În luptă, spune el, ele nu sunt „alb sau negru”, ci „solide ca o gelatină”.

### Poziția
Fii agresiv, **conduci arma** de la o țintă la alta și nu o lași niciodată să „plutească”. Poziția trebuie să fie **durabilă**: dacă te doare, ajungi să grăbești focul ca să scapi de ea.

### Alinierea — aici diferă de Chris
În luptă, Lamb nu insistă să privești tot timpul fix cătarea. **Ochii sar între elementele de ochire și țintă**, pentru că tu, spre deosebire de adversar, trebuie să decizi cine e amenințare și cine e doar un om nevinovat. Prea multă focalizare pe cătare te bagă în vederea în tunel. Nu e tragere „din instinct”: ochii merg pe țintă, aduci arma în linia lor și elementele apar acolo unde vrei.

### Trăgaciul: aliniere „suficientă”
Alinierea perfectă de la 200 m nu e aceeași cu cea de la 6 m. În antrenament afli **ce imagine e acceptabilă la fiecare distanță** — cu punct roșu știi exact unde lovești; cu elementele mecanice experimentezi.

### Decalajul ochitorului
Elementele de ochire sunt cu ~6 cm deasupra axei țevii (mai mult dacă luneta e pe mânerul de transport). Deci **ochești unde vrei să ochești, nu unde vrei să lovești**: de aproape, glonțul lovește mai jos decât punctul ochit. La un foc pe piept nu contează. La o țintă mică — un cap pe jumătate ascuns după un ostatic — contează enorm. Nu atunci afli cât să corectezi, ci în poligon.

@tool zero Vezi unde lovești la fiecare distanță

### Respirația
Lamb nu e de acord că în luptă respirația nu mai contează: dimpotrivă, acolo trebuie să ți-o controlezi mai mult ca oriunde. Vede elevi care uită să respire într-un scenariu și se învinețesc. Iar ochii sunt primii care suferă fără oxigen. Procedura lui: o **respirație adâncă de curățare**, o expiri; încă o inspirație pe care o lași să iasă încet; în „locul liniștit” al respirației, pauza naturală — scurtă, nu forțată. Dacă focul nu pleacă atunci, reiei.

### Continuarea
După foc, lași trăgaciul **doar până simți clicul** de resetare și începi următoarea apăsare. Nu-ți iei degetul de pe trăgaci decât când ai terminat cu ținta. Și la AR nu strică puțin mai mult deget pe trăgaci.

### Citește-ți elementele
Să știi mereu unde erau elementele când a plecat focul. Dacă știi că a plecat pe lângă, tragi din nou **imediat**, fără să aștepți vreo reacție a țintei. Anunțarea focului o exersezi cu un coleg care urmărește impacturile.

les({id:'k8',m:'carabina',t:'Zeroirea, pas cu pas',min:5,
q:[['Tragi jos. Cum muți cătarea (frontală)?',['O ridici','O cobori — cătarea se mișcă invers față de unde vrei să ducă glonțul','Nu se mișcă'],1,'Cătarea se mută invers: tragi jos, cobori cătarea. Înălțătorul (din spate) se mută în aceeași direcție cu impactul dorit.'],
   ['Grupa ta e alungită pe verticală. Ce verifici întâi?',['Vântul','Respirația — probabil nu tragi în pauza naturală','Muniția'],1,'Alungirea sus–jos vine de obicei din respirația care mișcă imaginea. Focurile rătăcite lateral țin mai des de smucit, anticipat sau umărul încordat.']],b:`
### Pregătirea
- Ținte cu un **punct mic de ochire** (o bucată de bandă pe alb) — o țintă mare nu-ți dă un punct repetabil.
- Ținte noi des, sau găurile marcate, ca să nu te încurci.
- Dacă zeroiești culcat, pune ținta mai jos.
- Verifici că ochitorul e strâns bine. Fără monturi cu șuruburi de mână.
- Dacă înălțătorul are două cercuri, știi pe care îl folosești.

### Procedura
1. **Începi aproape**, la 25 m, ca să ajungi repede pe hârtie.
2. **Culcat**, ca să elimini alte cauze de eroare.
3. Tragi **3–5 focuri** ca să vezi dacă faci o grupă. La 25 m ar trebui să fie o singură gaură zdrențuită.
4. Pui piedica, mergi la țintă și analizezi.
5. **Nu atingi ochitorul până nu tragi grupe constante.** Și ochești mereu același punct — altfel urmărești grupa la nesfârșit.
6. Corectezi:
   - **cătarea se mută invers**: tragi jos → cobori cătarea;
   - **înălțătorul se mută în aceeași direcție**: tragi jos → ridici înălțătorul;
   - la lunetă, după marcajele turelei.
7. **Nu exagera cu corecția.** Un sistem precis sau unul grosolan pot sări peste centru.
8. **Confirmi** cu încă o grupă după orice modificare — și după una „mică, de ultim moment”.
9. Marchezi poziția corectă cu un marker de vopsea.

### Cu ce și din ce poziție
- Cu **muniția de serviciu**. Cea de antrenament poate fi alta, dar nu-ți schimba reglajul după ea.
- Din poziții pe care le-ai folosi în realitate (Lamb: culcat, cu încărcătorul pe pământ). Masa de tir și betonul strică reculul natural al armei.

### Citește grupa
- **Alungită sus–jos** → respirația; probabil nu tragi în pauza naturală.
- **Un foc rătăcit** din când în când → smucit, anticipat reculul, umăr încordat.
- Lași trăgaciul brusc după foc? Atunci nu ai continuare. Apeși, lași arma să reculeze, apoi eliberezi încet până la clic.

### De ce se schimbă zeroul
- **„Lumina sus, înălțătorul sus”**: pe măsură ce soarele urcă, grupa poate coborî.
- Altitudinea, umiditatea, temperatura, muniția lovită.
- Arma foarte murdară — sau foarte curată: primul foc dintr-o țeavă rece și curată poate pleca altundeva. De aceea lunetiștii testează „primul foc rece”.

@tool clicks Calculează clicurile de corecție

> Fără dubii, fără „cred că”. Când tragi lângă colegi sau lângă oameni nevinovați, zeroul trebuie confirmat.

les({id:'k9',m:'carabina',t:'Balistica: ce zero alegi',min:5,an:'offset',
q:[['Iese glonțul din țeavă și urcă?',['Da, puțin','Nu — gravitația îl trage în jos imediat; doar țeava e înclinată puțin în sus față de linia de ochire'],1,'Linia de ochire e dreaptă și coboară spre țintă, țeava e ușor înclinată în sus. Glonțul cade din prima clipă, dar pare că „urcă” față de linia ta.'],
   ['Care e „cel mai bun zero”, după Lamb?',['Cel de 25 m, e simplu','Cel pentru care îți știi toate corecțiile fără calcule','Cel de 500 m'],1,'Dacă îți trebuie o riglă de calcul ca să știi unde să ochești, nu e un zero bun. El preferă de obicei 200 m; 50 m e un compromis bun.']],b:`
Lamb promite că nu te omoară cu matematica. Dar cine înțelege unde zboară glonțul lovește mai bine, la mai multe distanțe.

### Termenii
- **Linia de ochire** — dreapta de la ochi la țintă.
- **Axa țevii** — dreapta pe care o continuă țeava.
- **Înălțimea ochitorului** — cât e ochitorul deasupra țevii (~6,4 cm la elementele mecanice ale unui AR).
- **Traiectoria** — curba glonțului, tot mai aplecată spre final, ca jetul de la un furtun.
- **Coeficientul balistic** — cât de ușor străbate glonțul aerul.
- **Corecția de ținere** — cât ochești deasupra sau dedesubt ca să lovești.
- **Vântul de valoare plină** — din lateral, la 90°: împinge cel mai mult.
- **Mirajul** — aerul cald care se vede tremurând; arată direcția și tăria vântului.
- **Focul plonjant** — la distanțe mari glonțul cade abrupt, deci contează mult estimarea distanței.

### Glonțul nu urcă
Din clipa în care iese din țeavă, glonțul cade. Pare că urcă doar pentru că țeava e înclinată puțin în sus față de linia de ochire. Traiectoria **taie linia de ochire de două ori**: o dată aproape, o dată mai departe.

@anim offset

### Ce zero alegi
- **Zero la 25 m** — simplu, dar unde ochești dincolo? Cu luneta pe mânerul de transport (mult deasupra țevii), poți ajunge cu peste 20 de centimetri sus la 100 m. Pentru luptă nu e o soluție.
- **Zero la 200 m** — preferatul lui Lamb pentru muniția M855: aproape nu ai nevoie de corecții până la ~250 m, iar la 300 de yarzi (~275 m) ții cu ~25 cm mai sus, față de ~38 cm cu un zero la 100 m. Cinci inci par puțin, dar la o țintă parțial ascunsă înseamnă că o acoperi complet cu reticulul.
- **Zero la 50 m** — un compromis bun: cu M855 traiectoria taie din nou linia pe la 150–170 m, e cu câțiva centimetri sus la 100 m și puțin sub linie la 200 m. Dincolo de 300 m îți trebuie peste 30 cm de corecție.

**Cel mai bun zero e cel pentru care îți știi toate corecțiile fără calcule**, cel puțin până la 300 m. Iar dacă te bazezi că tragi mereu sub 50 m, „domnul Murphy” te va aștepta la 200.

@tool zero Calculatorul de traiectorie

### Programele balistice
Dau rezultate bune doar cu date bune: viteza reală, măsurată cu cronograful din arma ta, nu cea din catalog. Fiecare armă trage aceeași muniție cu viteze puțin diferite. Ține tabele separate dacă zeroiești la câmpie și lupți la munte.

### Vântul și distanța
- Gloanțele grele ajută la vânt, dar mai puțin decât se crede: la 300 m și vânt lateral de ~16 km/h, diferența e de vreo 2–3 cm.
- **Cât de departe e prea departe?** Lamb a văzut trăgători de concurs lovind plăci la 450 m — și chinuindu-se când se ridică vântul sau mirajul. Pe cine povestește că nimerea „slăbănogi la peste 500 m”, dar „nu cădeau”, îl privește cu suspiciune.

? Calculatorul din aplicație folosește un model simplificat, cu date standard. E bun ca să înțelegi forma traiectoriei — valorile reale le confirmi în poligon, cu arma și muniția ta.

les({id:'k10',m:'carabina',t:'În picioare: ca un boxer',min:5,
q:[['Ce poziție recomandă Lamb pentru carabină, în picioare?',['Isoscel, perfect cu fața la țintă, ca la pistol','Ca un boxer — piciorul de sprijin în față, greutatea pe pernuțe','Pe călcâie, drept'],1,'„Poziția de luptă e poziția de tragere.” Cu piciorul de sprijin în față conduci arma între ținte, ții mâna de sprijin departe în față și controlezi reculul.'],
   ['Cum aduci arma la umăr?',['Pui arma la umăr și apoi cobori capul pe ea','Ții capul în poziție și aduci arma la cap','Nu contează'],1,'Coborârea capului pe armă e lentă și nu se repetă la fel. Capul stă, ochii pe amenințare, arma vine la obraz.']],b:`
Chris folosește aceeași platformă la pistol și la carabină. Lamb e de acord cu isoscelul la pistol, dar la armă lungă spune altceva: **cu fața perfect spre țintă**, nu poți conduce repede arma de la o țintă la alta, nu poți ține mâna de sprijin destul de în față (pentru recul și pentru retenție).

### Poziția de boxer
Te pui în garda unui boxer, apoi duci arma la umăr: **piciorul de sprijin în față**.
- Greutatea pe **pernuțele tălpilor** — destulă cât să nu te împingă fiecare foc înapoi, dar fără să cazi în față. Așa pornești imediat în mișcare.
- Genunchii puțin îndoiți: amortizoare, pe loc și mai ales în mers.
- **Capul cât mai drept**: privești prin centrul ochiului, ai câmpul vizual mai larg (contra vederii în tunel) și poți lucra cu cască sau cu aparatură de noapte. Nasul aproape de mânerul de armare.

> Poziția ta de luptă e poziția ta de tragere, iar poziția de tragere e poziția de luptă.

### Mâinile
- **Mâna de pe mâner, cât mai sus**: fără spațiu între mână și spatele mânerului, fără spațiu între degetul mijlociu și gardă. (Dacă te doare degetul, un dop de urechi pus în spațiul acela rezolvă pe loc.)
- Mâna armei **trage arma în umăr**.
- **Cotul armei jos**, lângă corp: ești o țintă mai mică, nu-ți lovești colegii și nu-l lovești de tocul ușilor.
- **Mâna de sprijin departe în față** pe apărătoare, ca atunci când lupți cu un baston: mâinile depărtate îți dau forță și viteză la schimbarea direcției. Puțin spre stânga față de mijlocul de jos (la dreptaci). Nu „așezi” arma în palmă, ca la tirul sportiv.
- **Nu ține de lăcașul încărcătorului**: merge pentru un foc, nu în luptă — iar degetele ajung uneori peste fereastra de ejecție și provoacă incidente.
- Mânerul frontal e opțional: nu te face mai precis, dar îți dă de ce să te ții (pe o scară, cu lanterne și lasere pe apărătoare).

### Aducerea la umăr
**Arma vine la cap, nu capul la armă.** Capul stă în poziție, ochii pe amenințare, ridici arma până atinge obrazul — și vezi deja prin ochitor. Dacă duci arma la umăr și apoi cobori capul, ești lent și nu repeți mișcarea la fel.

### Piedica
**Se scoate doar când ai ținta în elementele de ochire** și se pune la loc de fiecare dată când iei arma de pe țintă. Stângacii o acționează cu încheietura arătătorului, nu cu degetul mare — altfel pierd priza.

### Retenția
Cu țeava în jos ai variante dacă cineva te apucă de armă: o mișcare bruscă în formă de opt, o lovitură din picior, coborârea rapidă în genunchi ca să-l ai în linia țevii, smulgerea înapoi. La nevoie, lași carabina și scoți pistolul — dar fără să-i oferi încă ceva de apucat.

! Retenția se exersează doar cu arme de antrenament (albastre), cu un partener și încet. Armele reale nu se îndreaptă niciodată spre un om, nici descărcate.

les({id:'k11',m:'carabina',t:'Nu trăim într-o lume culcată: pozițiile joase',min:6,
q:[['Tragi culcat pe o parte, cu arma rotită 90° spre dreapta, la o țintă mai îndepărtată. Unde ochești?',['Fix în centru','Sus și spre stânga — impactul se duce jos și spre partea în care ai rotit arma','Jos și spre dreapta'],1,'Rotită pe o parte, decalajul ochitorului lucrează lateral. Lamb dă exemplul unei plăci: ochești pe la ora 11 când rotești spre dreapta.'],
   ['De ce stai la cel puțin ~60 cm de lateralul mașinii când tragi pe sub ea?',['Ca să nu zgârii mașina','Suflul de la gura țevii ridică tot praful de sub mașină și îți acoperă ochitorul'],1,'Cu țeava sub mașină, suflul ridică murdăria a mii de kilometri. Ține distanța și verifică să nu ai roata sau caroseria între țeavă și țintă.']],b:`
În majoritatea cursurilor de carabină se trage culcat doar la zeroire, apoi numai în picioare. Lamb întreabă: cât de des ajungi în realitate într-o poziție culcată perfectă? Privește în jur: o mașină pe sub care poți trage, un colț, o bordură, o grămadă de lemne. **Exersează exact pozițiile ciudate.**

Sfatul lui: îți construiești o baricadă simplă din placaj (lemnul nu ricoșează), lucrezi pozițiile întâi „ușor”, fără echipament, apoi cu tot ce porți — cască, mănuși, vestă.

### Culcat, varianta de luptă
- Corpul **mai în linie cu arma** decât la tirul sportiv: poți conduce arma între ținte.
- Cât mai lipit de pământ. Nu ridici un genunchi decât dacă respiri greu după efort.
- **Picioarele întinse pe pământ**: dacă stau ridicate, reculul le mișcă și aștepți să se liniștească.
- Încărcătorul pe pământ — e bine. Cureaua strânsă te ajută.
- Mâna de sprijin **în față pe apărătoare**, nu pe încărcător; tragi ușor arma în umăr, obrazul apăsat, nasul la mânerul de armare.

### Culcat pe coate
Dacă îți trebuie puțină înălțime: te ridici pe coate. Cu cureaua strânsă și cu încărcătorul atingând interiorul antebrațului de sprijin, devine stabil. Cotiere — coatele tale îți vor mulțumi.

### Culcat pe o parte („rollover”)
Preferata lui: tragi pe sub obstacole pe sub care n-ai crede.
- Stai pe partea armei, cu **cotul strâns sub corp** (altfel nu cobori destul), bazinul spre pământ, genunchiul de sus puțin tras.
- Arma stă pe o parte. Obrazul nu mai are contact bun — se învață.
- Aliniezi punctul roșu cu cătarea, ca să scapi de paralaxă.
- Ochelari de protecție: o frână de gură îți aruncă pietre și praf în față (un parafulger e mai bun).
- **Verifică spațiul ferestrei**: prea aproape de pământ, tubul ricoșează înapoi.

**Corecția la distanță:** cu arma rotită 90°, decalajul ochitorului lucrează lateral. Rotită spre dreapta, glonțul lovește jos și spre dreapta, deci ochești **sus-stânga** — pe o placă, cam pe la ora 11. Rotită spre stânga, invers, pe la ora 1–2. Ora 12 rămâne mereu „în sus”, oricum ai sta.

### Alte variante
- **Pe spate („rollover invers”)** — de exemplu, cu corpul în stradă și bordura ca acoperire. Cotul și picioarele **jos**, altfel îi oferi o țintă.
- **Cu arma înclinată spre tine** — patul pe biceps, nu pe umăr, încărcătorul pe pământ. Profil foarte jos când acoperirea e mică.
- **„Cu spatele frânt”** — un rollover pe care îl iei și îl părăsești repede, cu mult echipament; bun ca să verifici pe sub mașini fără să te întinzi complet.
- **Ghemuit („rice paddy”)** — tălpile pe pământ, genunchii la fel de îndoiți, tricepșii pe genunchi, coatele în interiorul genunchilor strânse ușor de ei. Te ridici repede; câmpul de tragere e mai îngust, iar punctul natural de ochire e înșelător la început.

### Pe sub mașini
- Dacă tu îl vezi, și el te vede: intri și ieși din poziție repede.
- **Cel puțin ~60 cm** între gura țevii și lateralul mașinii: suflul ridică tot praful de sub ea și îți acoperă ochitorul.
- Te asiguri că între țeavă și țintă nu e nicio bucată de mașină. Lamb a văzut multe roți dezumflate la antrenamente.

! Toate pozițiile se lucrează întâi cu arma de antrenament. Focul real din poziții joase, pe sub mașini sau prin baricade se face doar în poligon, cu instructor.

les({id:'k12',m:'carabina',t:'Șezând, în genunchi, după colț',min:6,
q:[['În genunchi după un colț, sprijinit de el, ce genunchi ții ridicat?',['Pe cel din față','Pe cel din spate — îți sprijină cotul armei, iar piciorul din față stă jos'],1,'E invers față de îngenuncherea clasică. Genunchiul din spate, ridicat, sprijină cotul armei; obstacolul sprijină partea din față.'],
   ['Ce se întâmplă dacă îți sprijini țeava (nu apărătoarea) de baricadă?',['Nimic','Impactul se poate muta zeci de centimetri la 100 m','Crește precizia'],1,'Lamb a mutat impactul cu 30–45 cm la 100 m apăsând capătul țevii de baricadă. Apărătoarea flotantă poate atinge obstacolul; țeava, nu.']],b:`
### Șezând
E mai lent de luat, dar **foarte durabil** — poți sta mult fără să obosești.
- **Clasic, picior peste picior**: coatele în **interiorul** îndoiturii genunchilor — mușchi pe os, nu os pe os — sau tricepșii pe partea din față a genunchilor. Greu cu mult echipament sau cu burtă.
- **Cu picioarele depărtate**: când echipamentul nu te lasă altfel. Poți ține gleznele încrucișate.
- **„Balansoarul”**: genunchiul din față ridicat, talpa lipită de pământ, glezna celuilalt picior peste ea, lăsată moale. Arma pe interiorul genunchiului ridicat, **cureaua strânsă** — te lași ușor pe spate în ea. Merge excelent cu spatele la un copac sau la un perete (sau spate în spate cu un coleg). Nu lupta cu reculul: te leagănă și revii singur.
- **„Smulge iarba”**: un truc pe care Lamb l-a luat la început drept glumă — apuci un smoc de iarbă și îl tragi spre tine în poziție. Funcționează: elementele de ochire se liniștesc.

### În genunchi
Cea mai folosită unealtă din trusă: rapidă și mai stabilă decât în picioare. Pentru colțuri, pentru o reîncărcare tactică, pe lângă o mașină.
- **Clasic**: genunchiul armei jos, cel de sprijin ridicat; partea moale a tricepsului pe genunchi (nu os pe os, dacă se poate).
- **Așezat pe talpă**: rotești laba piciorului din spate și stai pe ea. Mai stabil, dar te ridici mai greu. Poți cuprinde genunchiul cu brațul și să-ți apuci cămașa cu mâna de sprijin, ca să strângi totul.
- **„Întins”**: un pas în față și piciorul din spate întins. Rapid, stabil la distanțe medii, obositor pentru adductori — încălzește-te înainte.

### În genunchi după colț — invers
Când folosești un zid, un copac sau o mașină ca sprijin, Lamb face exact invers decât la îngenuncherea clasică: **genunchiul din spate rămâne ridicat**, cel din față coboară.
- Genunchiul ridicat **sprijină cotul armei**.
- Obstacolul sprijină partea din față a armei; mâna de sprijin, în formă de „L”, apasă arma pe zid ca să nu alunece la recul.
- Cu genunchiul din spate sus, poți păși mai agresiv în poziție.
- Merge când tragi cu mâna dreaptă după un colț din stânga — sau cu stânga după unul din dreapta (vezi lecția despre partea de sprijin).
- Lângă un stâlp, un copac subțire sau o cutie poștală: **îl îmbrățișezi** cu brațul de sprijin.

E poziția pe care a folosit-o cel mai des când chiar se trăgea în el. Pentru unii „încalcă regulile”. „Dacă merge, folosește-o.”

### În picioare după colț
Spațiu strâmt sau o verificare rapidă: aici Lamb **stă mai cu fața** decât de obicei. Dacă ești împins sau te dezechilibrezi, doar ridici piciorul și te tragi înapoi după acoperire. În poziția laterală, singura cale înapoi e un pas **prin zona periculoasă**.

### Peste o mașină
Mai bine pe sub ea, dacă se poate. Dacă nu, pe deasupra capotei, cu arma culcată pe o parte: păstrezi acoperirea și expui mai puțin capul. Țeava ridicată cât să treacă de muchia capotei. Și în genunchi poți trage cu arma pe o parte, printre barele unui gard.

### Baricadele
- **O fereastră**: dacă scoți țeava pe pervaz, îi arăți exact unde ești. Mai bine îți faci poziția **în interiorul camerei**, mai în spate.
- **Apărătoarea** (flotantă) poate atinge obstacolul.
- **Țeava nu.** Apăsând capătul țevii de baricadă, Lamb a mutat impactul cu 30–45 cm la 100 m. Încearcă în poligon: o grupă normală, una cu țeava apăsată. „A vedea înseamnă a crede.”

> Nu există o poziție perfectă pentru toate situațiile. De aceea îți tot adaugi poziții în trusă.
`});

les({id:'k13',m:'carabina',t:'Întoarcerile și tragerea din mers',min:6,
q:[['Te întorci 90° spre stânga cu carabina. Cu ce picior pășești?',['Cu stângul','Cu dreptul, înainte, pivotând pe stângul'],1,'Regula lui Lamb: spre stânga pășești cu dreptul, spre dreapta cu stângul — mereu înainte.'],
   ['Vrei să mergi mai repede trăgând. Ce schimbi?',['Faci pași mai lungi','Faci pași mai rapizi, dar la fel de scurți','Alergi'],1,'Pașii lungi lovesc tare pământul și se văd în ochitor. Viteza vine din frecvență, nu din lungimea pasului.']],b:`
### Întoarcerile
Cerut să facă o simplă întoarcere, mulți trăgători par că au probleme de echilibru. Cu arma în mână, e și mai rău. Lamb vrea întoarceri **simple**, apropiate de mișcările de zi cu zi.
1. **Ochii și capul primii.** Fără ochi pe țintă nu ai nicio șansă — iar privirea începe deja decizia „amenințare sau nu”.
2. Corpul urmează. **Nu ridici arma în timpul întoarcerii**: e periculos lângă colegi, te întorci mai greu și nu mai poți opri inerția armei întinse.
3. Abia când ești cu fața la țintă **conduci arma** în centrul ei (arma vine la cap).
4. Continuarea, evaluarea, piedica.

**Mereu înainte, niciodată înapoi.** Pe un hol plin de moloz, un pas înapoi înseamnă o cărămidă sub călcâi. Dacă cazi pe spate, nu te mai ridici ușor. Dacă te împiedici înainte, în cel mai rău caz ajungi în genunchi — de unde tot poți trage.

Regulile picioarelor (pentru dreptaci și stângaci):
- **90° spre stânga** — pășești cu **dreptul**;
- **90° spre dreapta** — pășești cu **stângul**;
- **la 180°** — te întorci pe partea spre care s-a întors capul: spre stânga pășești cu dreptul, spre dreapta cu stângul.

Te poți simți că te depărtezi de țintă — e normal, important e să pășești înainte. După ce le stăpânești în poligon, le exersezi **lângă un obstacol care simulează un coleg**, cum ai fi lipiți la o intrare.

### Tragerea din mers
În spații strâmte, mișcarea te scoate din calea colegilor și te face o țintă mai grea. Ca să tragi din mers, adaptezi mersul ca să liniștești elementele de ochire.
- **Pornești** din poziția agresivă, cu genunchii îndoiți — dacă ești țeapăn, ochitorul sare la fiecare pas.
- **Începi încet**, cu arma descărcată. Mergi ca și cum ai vâna: un picior în fața celuilalt, ca pe bârnă, pași mici.
- **Rulezi talpa**: călcâi → marginea exterioară → pernuță.
- **Viteză** = pași mai **rapizi**, nu mai lungi.
- **Încetinești coborând centrul de greutate** (genunchii mai îndoiți), nu doar scurtând pașii — altfel inerția te împinge în față.
- **Nu aluneca lateral**, nu face pași cu pauză și nu aștepta un anumit picior ca să tragi: îi încetinești pe toți și îi lași adversarului timp. Pragul ușii e „pâlnia fatală” — trebuie golit repede.
- **Citește-ți elementele**: ele sar, apoi se liniștesc o clipă. Accepți puțină oscilație, apeși, continui.

### Oblic și lateral
Treptat, ajungi să tragi la 90° față de direcția de mers:
- **răsucești trunchiul**, iar picioarele merg tot pe o linie, **fără să se încrucișeze**;
- pentru un dreptaci, de la stânga la dreapta e ușor; invers e greu: înclini puțin arma, tragi mâna de sprijin mai spre tine și îndoi genunchii ca să te poți răsuci.

Incluzi în mers reîncărcări, incidente, decizii „trag sau nu”, trecerea la pistol. **O problemă nu te oprește pe loc** — te poate trimite la cea mai apropiată acoperire.

### Exercițiul zigzag
Lamb îl preferă „cutiei”, pentru că nu cere mers înapoi: înainte trăgând, întoarcere, oblic trăgând, piedica pusă și fugă spre colțul opus, întoarcere pe partea de sprijin, iar înainte și oblic pe partea cealaltă. Pe cronometru.

### Dacă trebuie să te retragi
Nu mergi cu spatele. Mergi **înainte, cu privirea peste umărul de sprijin**, capul „pe pivot”. Când apare o amenințare, ochii rămân pe ea, te întorci spre ea pășind înainte și conduci arma.

> Ochii conduc, corpul urmează.

Chiar îi spunem „partea slabă”. Lamb întreabă: „E chiar slabă?”. În aproape orice situație tactică, să poți trage de pe umărul celălalt e un avantaj uriaș: ești mai mic după colțuri și un rănit la brațul armei poate continua. În Somalia, în 1993, soldați răniți la brațul armei au învățat asta direct în luptă.

De la Chris știi că oglindești tot, inclusiv picioarele. Lamb adaugă **cum muți carabina de pe un umăr pe altul**.

### Scuzele
Cea mai des auzită: ochiul dominant. Lamb are un prieten care și-a pierdut un ochi într-un accident și n-a spus niciodată „nu pot” — și-a urcat ochitorul pe o șină mai înaltă. Singura scuză acceptată: orb de un ochi și fără vedere la celălalt.

### Precauții
- Exerciții noi — întâi **cu arma descărcată**: mânuirea, apoi precizia.
- **Mereu piedica pusă** între umeri. Mereu.
- Exersezi și incidentele cu o mână, pe ambele părți. Și noaptea.

### Schimbul de umăr (cu cureaua în două puncte)
1. Piedica pusă. Lărgești cureaua cât să poți trece **brațul de sprijin printre armă și curea** — acum cureaua îți e doar după gât.
2. Apuci apărătoarea cu mâna de sprijin, destul de în față cât să ții toată greutatea armei.
3. Mâna armei prinde ferm **partea din față a lăcașului încărcătorului**.
4. Într-o singură mișcare: tragi arma de pe umăr, mâna de sprijin trece pe mâner și duci patul în celălalt umăr; un pas mic în față cu piciorul care acum e „în spate”, ca să rămâi în poziția de luptă.
5. Mâna liberă merge în față pe apărătoare (lanterna, și ca să fie departe de fereastră).
6. Scoți piedica doar când ai ținta.

Cureaua se încrucișează la gât — e normal. Dacă te încurcă, o lărgești. Înapoi faci același lucru, cu mâinile inversate, **după ce ai pus piedica**.

**Ochii rămân pe zona din care poate apărea amenințarea.** Noaptea oricum nu-ți vezi arma.

### Ochiul dominant
- Truc din teren: te apropii de acoperire până când zidul **ascunde ținta pentru ochiul care nu ochește**. Celălalt ochi preia singur.
- Pentru antrenament: o bucată de bandă transparentă pe partea de sus a lentilei, cât să ascundă ținta, dar să lase lumina. Renunți la ea imediat ce poți fără.

### Exerciții
- Pornești cu arma pe curea: **două focuri pe dreapta, două pe stânga, două pe dreapta, două pe stânga**, cu piedica pusă la fiecare schimbare.
- La baricadă: în genunchi după colț, tot cu genunchiul din spate ridicat, oglindit pe partea de sprijin, și înapoi.

> Ca trăgător tactic, nu vrei să ai o parte SLABĂ.

Cine poartă și pistol are un avantaj de aproape: dacă arma lungă se blochează sau rămâne goală, ai o rezervă. Modulul de pistol ți-a arătat incidentele; aici e **trecerea** de la una la alta.

### Când
Ai un **clic** fără bubuitură, simți că arma a rămas goală sau ai un trăgaci „mort” — și amenințarea e aproape. **Nu analizezi incidentul.** Nu mai ies gloanțe pe țeavă, deci treci la pistol. Și nu te uita la carabină.

### Fără piedică
Mulți instructori cer să pui piedica înainte de trecere. Lamb o numește absurd: dacă cocoșul a căzut, piedica nici nu ar trebui să intre (dacă intră, du arma la armurier), iar dacă arma e goală, n-are rost. Tu, în schimb, ai o amenințare de rezolvat. Fă trecerea doar când arma chiar e goală sau blocată — iar exercițiile trebuie să reproducă exact asta.

### Cum
1. **Lași carabina cu mâna care scoate pistolul.** Mâna pleacă repede spre pistol, apoi încetinește cât să ia priza corectă.
2. **Cealaltă mână coboară carabina** lângă corp — acum e oricum doar o bâtă. Așa nu te arzi cu țeava și nu-ți cade între picioare.
3. Mâna de sprijin vine pe pistol. Scosul e **cel obișnuit**, fără mișcări ciudate.
4. Dacă erai în poziția de boxer, un pas mic în față cu piciorul de pe partea armei, **în timpul** scosului.

Cureaua trebuie reglată scurt, ca după trecere carabina să rămână lipită de corp.

? În cartea de pistol, Lawrence și Pannone descriu și varianta „lăsată să cadă”: lași patul să coboare până la genunchi, carabina cade pe pat și se înclină înainte, iar tu ajungi în genunchi cu pistolul scos.

- **5–7–9:** colegul îți încarcă încărcătoare cu 5, 7 sau 9 cartușe. Cu număr impar, trecerea apare în mijlocul exercițiului, nu la final.

> Te antrenezi la 100%, ca în realitate să fii la 90% — și tot mult mai rapid decât adversarul.

les({id:'k17',m:'carabina',t:'Ce face glonțul la țintă',min:4,
q:[['Ce pătrunde mai mult într-un corp: un glonț .45 ACP cu cămașă completă sau unul de 5,56 mm cu cămașă completă?',['5,56 mm','.45 ACP — până la ~75 cm, cam dublu față de 5,56'],1,'Mitul spune că 5,56 „trece prin tot”. În gelatină, .45 ACP cu cămașă completă pătrunde mult mai adânc.'],
   ['Există un glonț care oprește sigur o amenințare din prima?',['Da, un calibru mare','Nu — fiecare om și fiecare impact sunt diferite; continui până se oprește amenințarea'],1,'Lamb compară cu vânatul lovit bine care mai fuge o distanță. Precizia contează mai mult decât calibrul.']],b:`
„Balistica terminală” e ce face glonțul după ce lovește. În testele industriei, ținta e gelatina balistică.

### Ce vrei de la un glonț
1. **Să fie precis** pentru standardele tale. Dacă nu — cauți altul.
2. **Să pătrundă până la organele vitale.** Un glonț nu lovește mereu drept în piept: poate trece întâi printr-un braț întins sau printr-un mușchi gros, din unghi. Regula orientativă: **cel puțin ~30 cm** de pătrundere. Un glonț de vânătoare de rozătoare, care se oprește la 8–10 cm, nu ajunge.
3. **Să se deformeze** devreme și să continue să rupă până la ~30 cm, oprindu-se aproape de partea opusă sau ieșind fără energie periculoasă pentru alții.

Apoi întrebările grele: de la ce distanță? Pierde viteză și nu se mai deschide? Ce face când lovește un os? Ce face prin parbriz, din afară și din interior, prin gips-carton? Iar o țeavă scurtată prea mult îți fură exact viteza de care glonțul are nevoie.

### Gloanțele „lipite”
La gloanțele cu miezul lipit de cămașă, glonțul își păstrează masa — deci pătrunde mai bine. Lamb preferă gloanțe cu caracteristici ca ale M855, care merg bine prin sticlă și placaj și apoi își fac treaba.

### Mitul supra-penetrării
„Nu folosi 5,56 în casă, trece prin tot.” Realitatea: un glonț .45 ACP cu cămașă completă pătrunde până la ~75 cm în gelatină, cam **dublu** față de un 5,56 cu cămașă completă. Gloanțele cu vârf gol reduc problema — dar se pot înfunda cu gips-carton sau cu haine groase și atunci se comportă ca unele întregi.

### Nu există glonțul magic
Poate un glonț de 5,56 să oprească instantaneu un om? Da. Poate un om lovit solid să continue? Tot da. Fiecare om e diferit, iar fiecare impact e diferit (o coastă, un unghi). Vânătorii știu: și animalele lovite bine cu calibre mari mai fug o distanță. Concluzia: **continui până se oprește amenințarea** — nu te bazezi pe unul sau două focuri, oricare ar fi calibrul.

### Ce încerci de fapt să lovești
Imaginea lui Lamb: o **bară de armătură cu două mingi de tenis înfipte în ea**. Mingile sunt creierul și inima, bara e coloana. O țintă mică, grea și realistă. De aceea răspunsul lui pentru cine e nemulțumit de un calibru e simplu: **lucrează la precizie.**

les({id:'k18',m:'carabina',t:'Noaptea: lumina pe carabină',min:5,
q:[['Unde montezi lanterna pe carabină?',['Cât mai în spate','Cât mai în față cât e comod — ca țeava sau amortizorul să nu facă umbră pe țintă și ca lumina să fie departe de capul tău'],1,'Prea în spate, țeava aruncă o umbră exact peste ochii celui din față. Iar lumina e o țintă: o vrei departe de cap.'],
   ['Ce comutator preferă Lamb?',['Banda adezivă cu buton pe apărătoare','Butonul din spatele lanternei, momentan'],1,'Banda se apasă singură când cazi, te prinzi de ceva sau în geantă. Butonul din spate se stinge când îi dai drumul.']],b:`
Modulul de pistol îți arată cum ții lanterna în mână. Lamb vorbește despre **lumina de pe arma lungă**. Mesajul lui: **lucrurile rele se întâmplă noaptea.** Cele mai multe confruntări au loc pe vizibilitate redusă — deci acolo trebuie să te antrenezi; ziua e doar repetiția generală.

### Ce lanternă
Cea mai ușor de procurat unealtă de noapte e lumina albă: fără permise, fără aparatură specială, folosești aceleași elemente de ochire, fără reglaj de noapte. „Cea mai bună lanternă e cea pe care o ai.” Nu-ți trebuie una specială pentru recul pe o carabină.

### Unde o montezi
**Cât mai în față cât e comod.** Prea în spate (mai ales cu un amortizor), țeava aruncă o **umbră** exact peste capul și ochii celui din față. Iar ochii lui îți spun dacă se pregătește să facă ceva. Dacă lumina îi bate în ochi, îl orbește și îl derutează; dacă are umbră pe ochi, el te vede pe tine. În plus, lumina e o țintă: o vrei departe de cap. Nici chiar în dreptul gurii țevii — suflul strică becul și murdărește lentila.

### Când o aprinzi
Ori de câte ori îndrepți arma spre o posibilă amenințare, zi sau noapte, dacă îți dă un avantaj. Și **o stingi repede**:
- **butonul din spate, momentan** — îi dai drumul și se stinge. Banda adezivă cu buton se apasă singură când cazi de pe o scară, când te prinzi de ceva sau în geantă (și găsești bateria moartă când îți trebuie);
- butonul trebuie să poată fi apăsat cu ambele mâini;
- dacă ții lumina aprinsă continuu, tu ești cel în care se trage — și îi luminezi și pe cei de lângă tine.

### Disciplina luminii
- Al doilea om dintr-o echipă **nu-l luminează din spate pe primul**: privește unde bate lumina lui.
- Atenție lângă ferestre și uși închise: orice semn îi spune celuilalt unde să tragă — prin perdele, prin uși, prin pereți.
- O lumină aprinsă din greșeală când te apropii pe ascuns e inacceptabilă.

### Laserul vizibil
Lamb nu l-a iubit până nu l-a folosit în realitate: oameni înarmați și-au ridicat mâinile când au văzut punctul pe piept. Același „dacă îl vezi tu, îl vede și el” ca la lanternă.
- Nu-l monta **sub țeavă**: laserul merge drept, glonțul pe o curbă — vei fi reglat bine la o singură distanță.
- Reglajul „paralel”: laserul păstrează aceeași înălțime ca ochitorul de zi, iar lateral glonțul lovește lângă punct exact cât e laserul montat lângă țeavă. Așa corecțiile tale de ținere rămân aceleași.
- Laserele bune nu sunt sigure pentru ochi. Nu le îndrepți niciodată spre oameni la antrenament.

Aparatura de noapte și laserele infraroșii sunt pentru instituții — principiul rămâne același: aceeași poziție de tragere, aceeași disciplină.

! Exersează noaptea întâi acasă, cu arma de antrenament și lanterna, apoi în poligon, cu instructor. Gândește-te și la situațiile intermediare: felinare intermitente, mașini din sens opus, amurg, zori.

les({id:'k19',m:'carabina',t:'Întreținerea și uneltele de antrenament',min:5,
q:[['Ce verifici după ce ai reasamblat carabina?',['Nimic','Verificarea funcționării: pe piedică cocoșul nu cade; pe foc cade; ții trăgaciul, armezi, eliberezi încet și auzi clicul de resetare'],1,'Verificarea funcționării îți arată că piedica, trăgaciul și resetarea merg. Cele mai multe asamblări greșite țin de știftul percutorului.'],
   ['La ce e bun un laser vizibil în dry fire?',['La nimic','Îți arată cum se mișcă arma — de exemplu, cât sare la fiecare pas când tragi din mers'],1,'Punctul care sare pe țintă îți arată erorile de mers sau de trăgaci. Dar nu deveni dependent de el.']],b:`
### Curățenia — doar ce contează
Lamb glumește că nu-și curăță armele: trage până se murdăresc, apoi le vinde. În realitate, curăță **piesele care contează**: un mecanism **bine lubrifiat** și o țeavă curată contează mai mult decât fiecare urmă de calamină de pe închizător.

**Trusa de bază:** un multitool cu clește cu vârf subțire (scoate știfturi și ajută la un tub înțepenit), o vergea solidă (și pentru tuburi blocate), perii de alamă (niciodată de oțel inoxidabil în țeavă), un dorn pentru petice, petice, solvent pentru cupru, chei imbus, o perie pentru cameră. Un „șarpe” de curățat e bun pentru o curățare rapidă.

**Ordinea, pe scurt** (verifică manualul armei tale):
1. Arma descărcată, verificat.
2. Desfaci cele două părți ale cutiei și scoți ansamblul închizătorului și mânerul de armare.
3. Scoți știftul percutorului, percutorul, știftul-camă, închizătorul, apoi extractorul.
4. Răzuiești calamina din spatele închizătorului (nu cu cuțitul), periezi ghearele.
5. **Segmenții de etanșare nu trebuie să aibă fantele aliniate** — le decalezi cu unghia.
6. Lubrifiezi generos suprafețele de alunecare.
7. Țeava: din spate spre față, petic ud, petic uscat, până nu mai iese nimic albastru-verzui. Apoi camera și locașurile ghearelor.
8. Ochitorul cu un creion pentru lentile; încărcătoarele cu o perie (după praf, desfăcute).

### Verificarea funcționării
După reasamblare, cu arma descărcată:
1. **Piedica pusă**, închizătorul în față, apeși — cocoșul **nu** cade.
2. **Pe foc**, apeși — cocoșul cade.
3. **Ții trăgaciul apăsat, armezi**, apoi **eliberezi încet** — trebuie să simți și să auzi clicul de resetare.

Cele mai multe asamblări greșite văzute de Lamb: știftul percutorului pus greșit — și atunci arma nu trage.

**Arcurile** extractorului și ejectorului costă puțin și fac o diferență uriașă: le schimbi periodic. Arcul amortizorului, după câțiva ani, dacă arma pare „leneșă”.

### Uneltele de antrenament
- **Cartușe inerte portocalii** — pentru incidente și treceri. Ușor de găsit pe jos și de recunoscut. Verifici **toate** încărcătoarele înainte să pleci.
- **Muniție fragmentabilă pe oțel**, de aproape — feedback imediat la fiecare lovitură. Doar pentru antrenament, nu pentru zeroire; oțelul și distanțele trebuie să fie potrivite, ca să nu ricoșeze nimic spre tine.
- **Kituri de conversie .22** sau ansambluri de 9 mm — mult mai ieftin, și acceptate în poligoane care nu primesc 5,56.
- **Arme de marcare** (pentru antrenament cu oameni) — doar cu reguli: dacă „adversarul” trage prin perete, peretele se tratează ca unul real. Nu devine paintball. Contează mult ca „actorii” să-și joace rolul.
- **Airsoft** — antrenament în casă sau în garaj și antrenament de echipă în locuri unde altfel n-ai avea voie.
- **Arme albastre** — pentru poziții, retenție și orice exercițiu în care arma se îndreaptă spre un partener.
- **Laserul vizibil** — în dry fire îți arată cum se mișcă arma; la tragerea din mers, punctul care sare îți arată mersul greșit. Dar nu deveni dependent de el.

> Arma îngrijită nu te lasă la greu. Nici tu nu o lăsa.
`});

les({id:'k20',m:'carabina',t:'Sajnog, Pannone, Lamb: unde nu sunt de acord',min:5,
q:[['Ce spun toți trei autorii despre tehnicile pe care nu le folosești?',['Să le ignori','Să le încerci, să păstrezi ce funcționează pentru tine și să le păstrezi pe celelalte „în trusă”','Să alegi doar o școală'],1,'Toți vorbesc despre o trusă de unelte: încerci, testezi, păstrezi ce merge — și rămâi deschis.']],b:`
Ai acum trei școli în aplicație: **Chris Sajnog** (SEAL, instructor), **Erik Lawrence și Mike Pannone** (Forțele Speciale, „Tactical Pistol Shooting”) și **Kyle Lamb** (Forțele Speciale, „Green Eyes & Black Rifles”). În cele mai multe privințe spun același lucru. Iată unde nu.

### 1. Cât de tare strângi pistolul
- **Sajnog:** 100% cu ambele mâini — sub stres oricum strângi la maxim, iar 100% se poate reproduce.
- **Lawrence & Pannone:** 70/30 — mâna de sprijin strânge mai tare, ca mâna armei să fie mai relaxată pentru trăgaci. Unii preferă 50/50.

### 2. Respirația
- **Sajnog:** respiri normal; pauza respiratorie doar la tirurile lungi.
- **Lawrence & Pannone:** te oprești din respirat în pauza naturală (cel mult 5–7 secunde) și înveți să tragi serii cu tot mai puține respirații.
- **Lamb:** o respirație de curățare, apoi pauza naturală — iar în luptă controlul respirației contează mai mult, nu mai puțin.

### 3. Focalizarea
- **Sajnog:** cătarea clară până pleacă focul. Fără compromis.
- **Lawrence & Pannone:** cătarea clară ca bază; la nivel avansat imaginea se „înmoaie” între cătare și țintă.
- **Lamb:** în luptă, ochii sar între elementele de ochire și țintă, ca să deosebești amenințarea de un om nevinovat și să nu intri în tunel.

### 4. Poziția la carabină
- **Sajnog:** aceeași platformă la pistol și la carabină.
- **Lamb:** la carabină, poziția de boxer, cu piciorul de sprijin în față.

### 5. Cu o singură mână
- **Sajnog:** platforma rămâne aceeași, fără arma înclinată „ca în filme”.
- **Lawrence & Pannone:** profil lateral, pas în față, arma înclinată cel mult 45°.

### 6. Mersul înapoi
- **Lawrence & Pannone:** dacă trebuie, mergi înapoi târând piciorul din spate, pipăind terenul.
- **Lamb:** nu merge înapoi deloc — te întorci și mergi înainte, cu privirea peste umăr.

### 7. Verificarea camerei
- **Lawrence & Pannone:** la pistol, după încărcare, tragi puțin închizătorul și vezi alama.
- **Lamb:** la carabina AR, nu — poate provoca un incident; verifici pipăind cartușul de sus din încărcător.

### 8. Poziția de așteptare
- **Sajnog:** sus pregătit, lipit de corp sau port sus, după situație.
- **Lawrence & Pannone:** poziția 3 a scosului; țeava în sus la 45° e nesigură lângă colegi.
- **Lamb (carabina):** țeava în jos, aproape mereu.

### Cum alegi
1. **Siguranța nu se negociază** — aici toți trei spun exact același lucru.
2. Încearcă fiecare variantă **în dry fire**, încet. Filmează-te.
3. Păstrează ce îți iese **consecvent** — sub stres, cu corpul tău, cu arma și echipamentul tău.
4. Dacă ai un instructor, urmează sistemul lui cât lucrezi cu el. Amestecul de sisteme la început încurcă.
5. Celelalte variante le păstrezi „în trusă”: într-o zi s-ar putea să-ți trebuiască.

> Trei oameni care au trecut prin luptă pot să nu fie de acord. Ce contează e ca tu să știi **de ce** faci ce faci.
`});
