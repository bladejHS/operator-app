les({id:'ge1',m:'gebr',t:'Filosofia luptătorului modern',min:5,b:`
Kyle Lamb nu vorbește despre „cât de bine tragi", ci despre **cine ești când totul merge prost**. Luptătorul modern nu e un super-soldat — e un om obișnuit care a decis să fie pregătit.

### Ce înseamnă „pregătit"
- Nu înseamnă că ai cele mai scumpe arme sau cel mai mare mușchi.
- Înseamnă că ai **un plan**, că l-ai exersat și că știi ce faci când planul se strică.
- Înseamnă că poți lua decizii bune sub presiune extremă.

> Mintea ta e prima armă. Dacă mintea cedează, arma devine doar o bucată de metal.

Lamb insistă pe ideea că antrenamentul fizic și cel mental sunt inseparabile. Nu poți avea unul fără celălalt. Pentru bazele mentalității, vezi și lecția @link m1.
`});

les({id:'ge2',m:'gebr',t:'Angajarea la distanță cu pușca',min:6,b:`
Pușca nu e un pistol mare. Are reguli proprii de angajare, mai ales la distanțe peste 100 de metri.

@anim trajectory
### Principii cheie
1. **Cunoaște-ți zero-ul.** Trebuie să știi exact unde lovește glonțul la 50, 100, 200 și 300m. Fără asta, tragi orbește.
2. **Folosește reticulul.** Reticulul opticului e instrumentul tău de măsurare. Învață să estimezi distanța și compensarea vântului direct prin el.
3. **Poziția contează enorm.** La distanță, fiecare milimetru de mișcare a țevii se traduce în centimetri pe țintă. Exersează poziții stabile: culcat, sprijinit, bipod.
4. **Respirația și ritmul cardiac.** La distanță mare, bătaia inimii tale mișcă arma. Trage între bătăi, în pauza respiratorie naturală.

! Nu confunda „pot lovi" cu „trebuie să lovesc". Justificarea etică a fiecărui foc e responsabilitatea ta.
`});

les({id:'ge3',m:'gebr',t:'Tranziții rapide: pușcă → pistol',min:5,b:`
În scenariile reale, uneori trebuie să treci de la arma lungă la pistol în fracțiuni de secundă.

@anim trans

### Tehnica corectă
1. **Lasă pușca să atârne.** Folosește sling-ul (cureaua). Nu o pune jos, nu o arunci.
2. **Mișcarea simultană.** Mâna dreaptă merge spre pistol în timp ce mâna stângă eliberează pușca.
3. **Pistolul e deja în poziție.** Nu cauți holster-ul — știi exact unde e.
4. **Revenirea la pușcă** e la fel de importantă. Exersează ambele direcții.

> Tranziția nu e o abilitate separată — e parte din fluxul normal de luptă. Dacă trebuie să te oprești și să te gândești, e prea târziu.

Exersează dry fire (fără muniție!) de sute de ori înainte de a încerca live fire. Vezi ritualul de siguranță din @link s3.
`});

les({id:'ge4',m:'gebr',t:'Lupta în lumină scăzută',min:6,b:`
Majoritatea confruntărilor reale au loc noaptea sau în condiții de vizibilitate redusă. Antrenamentul exclusiv diurn te lasă nepregătit.

### Adaptări esențiale
- **Identificarea pozitivă a țintei** e obligatorie. Nu tragi niciodată dacă nu ești sigur ce e. Lumina tactica nu e opțională.
- **Tehnici de iluminare:** lanterna montată pe armă vs. lanterna în mână liberă. Ambele au avantaje; exersează-le pe amândouă.
- **Vederea nocturnă naturală.** Ochii au nevoie de 20-30 minute pentru adaptare completă. O singură sursă de lumină albă resetează tot procesul.
- **Comunicarea în întuneric.** Semnalele verbale și non-verbale trebuie stabilite și exersate înainte.

? Lanterna tactică e o armă defensivă în sine: poate dezorienta temporar un agresor și îți oferă timpul necesar pentru identificare.
`});

les({id:'ge5',m:'gebr',t:'Acoperire și baricade avansate',min:5,b:`
Folosirea acoperirii nu înseamnă doar „să te ascunzi după ceva". E o abilitate activă.

@anim cover
### Principii
- **Acoperire vs. mascare.** Un tufiș te maschează (nu te vede), dar nu te protejează de gloanțe. Doar materiale dense (beton, motor de mașină, pământ compact) oferă acoperire reală.
- **Expunerea minimă.** Expune doar cât e strict necesar pentru a angaja. Schimbă unghiurile frecvent.
- **Baricade laterale.** Tragerea pe lângă colțul unei baricade expune mai puțin decât tragerea peste ea.
- **Mișcarea între puncte de acoperire.** Planifică ruta înainte de a te mișca. Sprint scurt, apoi reassess.

! Acoperirea nu e eternă. Gloantele pot penetra sau ricoșa. Nu rămâne static prea mult.
`});

les({id:'ge6',m:'gebr',t:'Comunicare în echipă',min:4,b:`
Chiar dacă lucrezi singur, comunicarea e vitală — cu partenerul, cu familia, cu forțele de ordine.

### Reguli de bază
- **Mesaje scurte și standardizate.** „Contact față, 30 metri, doi indivizi" — nu povești.
- **Confirmarea.** Cel care primește repetă mesajul. Fără confirmare, presupui că nu a fost recepționat.
- **Semnale non-verbale.** Când liniștea e necesară, gesturile prestabilite înlocuiesc vocea.
- **Briefing înainte și debriefing după.** Orice operațiune începe cu un plan clar și se termină cu o analiză sinceră.

> Comunicarea proastă ucide mai repede decât lipsa de antrenament.
`});

les({id:'ge7',m:'gebr',t:'Scenarii CQB avansate',min:6,b:`
Close Quarters Battle (lupta la distanță mică) depășește intrarea simplă într-o cameră.

### Elemente avansate
- **Unghiuri moarte.** Fiecare cameră are zone pe care nu le poți vedea simultan. Mișcarea echipei trebuie să le acopere progresiv.
- **Gestionarea non-combatanților.** Ce faci când întâlnești civili? Protocolul trebuie stabilit înainte.
- **Tranziția spații deschise → închise.** Ritmul se schimbă radical. Viteza în exterior, controlul în interior.
- **Comunicarea silențioasă.** Stack-ul (formația) comunică prin atingere și poziționare.

! CQB real nu e ca în filme. E haotic, zgomotos și confuz. Singurul antidot e repetiția masivă în condiții realiste.
`});

les({id:'ge8',m:'gebr',t:'Gestionarea stresului sub foc',min:5,b:`
Stresul de luptă nu dispare niciodată complet. Scopul e să funcționezi **în ciuda** lui.

### Mecanisme
- **Respirația tactică.** Inspiră 4 secunde, ține 4, expiră 4, ține 4. Activează sistemul parasimpatic și reduce panica.
- **Self-talk pozitiv.** „Am făcut asta de o mie de ori. Știu ce fac." Vocea interioară contează.
- **Ancorarea în prezent.** Nu te gândi la ce s-a întâmplat sau la ce ar putea urma. Focus pe sarcina imediată.
- **Acceptarea fricii.** Frica e normală. Curajul nu e absența fricii, e acțiunea în ciuda ei.

> Antrenamentul realist (simunition, force-on-force) e singura modalitate de a învăța cum reacționezi cu adevărat sub stres.
`});

les({id:'ge9',m:'gebr',t:'Antrenament realist vs. sportiv',min:4,b:`
Tragerea competitivă și cea defensivă/tactică sunt discipline diferite.

### Diferențe critice
| Sportiv | Realist/Tactic |
|---------|----------------|
| Ținte statice, cunoscute | Ținte mobile, necunoscute |
| Mediu controlat | Mediu haotic, variabil |
| Scor = precizie | Supraviețuire = decizii corecte |
| Echipament optimizat pentru reguli | Echipament purtat zilnic |
| Fără consecințe reale | Consecințe letale posibile |

Lamb avertizează: **„Dacă te antrenezi doar pentru competiție, s-ar putea să mori într-o situație reală."** Adaugă elemente de stres, surpriză și decizie în fiecare sesiune de antrenament.
`});

les({id:'ge10',m:'gebr',t:'Echipament și configurare pușcă',min:5,b:`
Configurația armei reflectă misiunea. Nu există setup universal.

### Principii de configurare
- **Greutatea contează.** Fiecare gram suplimentar te obosește. Elimină accesoriile inutile.
- **Accesibilitate.** Comenzile trebuie operate fără a privi. Exersează cu mănuși și în întuneric.
- **Optica potrivită.** LPVO (Low Power Variable Optic) e versatilă pentru angajări mixte. Red dot + magnifier e altă opțiune validă.
- **Sling-ul nu e opțional.** E sistemul de retenție primar. Învață să-l folosești ca suport stabil.
- **Testează totul.** Nu merge în teren cu ceva ce n-ai verificat personal.

? Cea mai bună armă e cea pe care o porți și o cunoști perfect. Arma perfectă din dulap nu te ajută cu nimic.
`});

les({id:'ge11',m:'gebr',t:'Prim ajutor tactic pe câmp',min:6,b:`
Într-un scenariu tactic, tu ești primul responder medical. Ambulanța vine târziu sau deloc.

### Priorități (MARCH)
1. **M**assive hemorrhage — oprirea hemoragiilor masive (tourniquet, packing).
2. **A**irway — calea aeriană liberă.
3. **R**espiration — respirația (pneumotorax, bandaj toracic).
4. **C**irculation — șocul hipovolemic, fluide.
5. **H**ypothermia — prevenirea hipotermiei (chiar și vara).

> Tourniquetul aplicat corect salvează vieți în secunde. Antrenează-te pe tine însuți și pe partener până devine reflex.

! Primul ajutor tactic NU înlocuiește cursurile certificate (TCCC, TECC). Această lecție e un reminder, nu un substitut.
`});

les({id:'ge12',m:'gebr',t:'Evacuare și extracție',min:4,b:`
Misiunea nu se termină când amenințarea e neutralizată. Extracția e adesea cea mai periculoasă fază.

### Elemente cheie
- **Planul de extracție** se face ÎNAINTE de angajare. Unde mergem? Cum semnalăm? Cine ne preia?
- **Comunicarea cu echipa de extracție.** Coduri, puncte de întâlnire, semnale de recunoaștere.
- **Securizarea zonei de extracție.** Zona trebuie curățată înainte de sosirea vehiculului/echipei.
- **Prioritizarea răniților.** Triaj rapid: cine poate aștepta, cine nu.

> Evacuarea haotică transformă o victorie tactică într-un dezastru. Disciplina menține ordinea.
`});

les({id:'ge13',m:'gebr',t:'Lecții din operațiuni reale',min:5,b:`
Kyle Lamb împărtășește experiențe din Irak și Afganistan care ilustrează principii universale.

### Lecții extrase
- **Adaptabilitatea bate perfecțiunea.** Planurile perfecte nu supraviețuiesc contactului. Echipele care se adaptează rapid câștigă.
- **Leadership distribuit.** Când liderul cade, următorul preia instantaneu. Fiecare membru trebuie să poată conduce.
- **After Action Review (AAR).** După fiecare misiune, analiza onestă: ce a mers, ce nu, ce schimbăm. Fără vinovăție, fără ego.
- **Rezistența mentală colectivă.** Moralul echipei e mai important decât moralul individual. Sprijinul reciproc previne burnout-ul.

> Experiența altora e cel mai ieftin profesor. Învață din greșelile lor ca să nu le repeți pe ale tale.
`});

les({id:'ge14',m:'gebr',t:'Planul personal de antrenament',min:4,b:`
Fără un plan scris, antrenamentul devine hobby. Cu un plan, devine progres.

### Structura recomandată
1. **Obiective SMART.** Specific, Măsurabil, Abordabil, Relevant, Temporal.
2. **Evaluare inițială.** Unde ești acum? Testează-vă onest.
3. **Prioritizare.** Lucrează slăbiciunile primele. Punctele forte se mențin.
4. **Program săptămânal.** Dry fire zilnic (10-15 min), live fire săptămânal/bilunial, fitness constant.
5. **Jurnal de antrenament.** Notează ce ai făcut, cum a mers, ce schimbi data viitoare. (@tool journal Caiet)
6. **Reevaluare lunară.** Progresul se măsoară, nu se presupune.

> „Nu contează cât de bun erai ieri. Contează cât de bun ești azi." — Kyle Lamb
`});
/* 027-balistica.js */
/* Model balistic punct-masă (tabelul de rezistență G1), folosit de animația „offset” și de calculatorul de traiectorie.
   Verificat față de tabelul M855 din cartea lui Kyle Lamb: diferențe de câțiva milimetri până la ~300 m. Aer standard, fără vânt. */
const G1T=[[0,.2629],[.5,.2032],[.6,.2034],[.7,.2165],[.8,.2546],[.85,.2901],[.9,.3415],[.95,.4084],[1,.4805],[1.05,.5427],[1.1,.5883],[1.15,.6191],[1.2,.6393],[1.25,.6518],[1.3,.6589],[1.35,.6621],[1.4,.6625],[1.5,.6573],[1.6,.6474],[1.7,.6347],[1.8,.621],[1.9,.6072],[2,.5934],[2.1,.5804],[2.2,.5685],[2.3,.5577],[2.4,.5481],[2.5,.5397],[2.6,.5325],[2.7,.5264],[2.8,.5211],[2.9,.5168],[3,.5133]];
function g1cd(M){if(M>=3)return .5133;for(let i=1;i<G1T.length;i++)if(M<=G1T[i][0]){const [a,ca]=G1T[i-1],[b,cb]=G1T[i];return ca+(cb-ca)*(M-a)/(b-a)}return .5133}
/* v0 m/s, bc G1 (lb/in²), sh = înălțimea ochitorului (m), zero (m), xmax (m)
   → listă pe fiecare metru: [x m, y m față de linia de ochire (+ = sus), viteza m/s, timpul s] */
function balTraj(v0,bc,sh,zero,xmax=400){
  const rho=1.225,c=340.3,B=bc*703.07,g=9.80665,dt=.0005;
  const fly=(ang,xm)=>{let x=0,y=-sh,vx=v0*Math.cos(ang),vy=v0*Math.sin(ang),t=0,nx=0;const out=[];
    while(x<xm+1&&t<6){const v=Math.hypot(vx,vy),a=Math.PI/8*rho*v*v*g1cd(v/c)/B;vx+=-a*vx/v*dt;vy+=(-a*vy/v-g)*dt;x+=vx*dt;y+=vy*dt;t+=dt;
      while(x>=nx&&nx<=xm){out.push([nx,y,v,t]);nx++}}
    return out};
  let lo=-.01,hi=.05;
  for(let k=0;k<44;k++){const m=(lo+hi)/2,r=fly(m,zero);if(r.length>zero&&r[zero][1]>0)hi=m;else lo=m}
  return fly((lo+hi)/2,xmax);
}
/* punctele unde traiectoria taie linia de ochire (în metri) */
function balCross(r){const c=[];for(let i=1;i<r.length;i++)if((r[i-1][1]<0)!==(r[i][1]<0)){const a=r[i-1][1],b=r[i][1];c.push(r[i-1][0]+a/(a-b))}return c}

les({id:'tp1',m:'tps',t:'Selecția și montarea accesoriilor pistol',min:5,b:`
Un pistol defensiv nu e același lucru cu unul de competiție sau de poligon. Accesoriile trebuie alese pentru **fiabilitate, simplitate și utilizare sub stres**.

### Principii de selecție
- **Lanterna tactică** e obligatorie, nu opțională. Fără ea, nu poți identifica ținte noaptea. Montaj dedicat sau handheld — exersează ambele.
- **Optica pe pistol (RDS).** Red dot-ul accelerează achiziția și permite focalizarea pe țintă, nu pe cătare. Dar trebuie să ai backup iron sights.
- **Holster-ul potrivit.** Retenție activă vs. pasivă depinde de rol. Pentru civil: OWB/IWB cu retenție pasivă bună. Verifică compatibilitatea cu lanterna/optica.
- **Încărcătoare suplimentare.** Minim 3 încărcătoare dedicate antrenamentului + 2 pentru carry. Marchează-le diferit.

! Nu adăuga accesorii doar pentru că arată bine. Fiecare gram și fiecare complexitate contează într-o situație reală.
`});

les({id:'tp2',m:'tps',t:'Tragere din poziții neconvenționale',min:6,b:`
Într-o confruntare reală, rar tragi din poziția ideală de poligon. Trebuie să fii eficient din orice unghi.

### Poziții esențiale
- **Genunchi (kneeling).** Stabilitate superioară, profil redus. Genunchiul dominant jos, piciorul opus sprijină brațul.
- **Culcat lateral (urban prone).** Când acoperirea e joasă. Corp perpendicular pe linia de tragere, brațele sprijinite pe sol.
- **Sprijinit de perete/baricadă.** Folosește structura ca suport stabil. Brațul slab între armă și suprafață absoarbe reculul.
- **O mână ocupată.** Tragi cu o singură mână când cealaltă deschide o ușă, ține un copil sau comunică. Exersează ambele mâini.

> Poziția perfectă e cea din care poți lovi ținta ACUM, nu cea din manual. Adaptează-te la realitate.

Pentru fundamentele poziției de bază, vezi @link t1.
`});

les({id:'tp3',m:'tps',t:'Angajarea multiplilor adversari',min:5,b:`
Scenariile reale implică adesea mai multe amenințări simultane. Prioritizarea e cheia.

@anim threats
### Principii de prioritizare
1. **Cea mai apropiată amenințare activă** primează. Distanța = timp de reacție redus.
2. **Amenințarea armată > neînarmată.** Un cuțit la 3 metri e mai periculos decât un pistol la 30m dacă cel cu pistolul nu te-a observat încă.
3. **Scanare continuă.** După fiecare angajare, scanează 360°. Amenințările se mișcă, apar altele noi.
4. **Mișcarea între angajări.** Nu sta pe loc după ce ai tras. Mișcă-te lateral sau spre acoperire.

! Nu „golești încărcătorul" într-o singură țintă când sunt multiple. 2-3 focuri per amenințare, apoi reassess.
`});

les({id:'tp4',m:'tps',t:'Mișcare și tragere simultană',min:6,b:`
Staționarea e pericol. Într-un scenariu dinamic, trebuie să te miști **și** să tragi precis.

@anim shootmove
### Tehnici fundamentale
- **Mișcarea înainte/după tragere.** Trage → mișcă → reevaluează → trage din nou. Niciodată static.
- **Deplasare laterală.** Mai greu de detectat decât mișcarea înainte/înapoi. Păstrează arma orientată spre amenințare în timpul deplasării.
- **Tragere în mișcare.** Absorbția șocurilor prin genunchi flexați. Brațele izolează arma de mișcarea corpului.
- **Oprirea bruscă pentru precizie.** Când distanța crește, oprește-te complet pentru focurile precise, apoi continuă mișcarea.

> Viteza fără control e inutilă. Controlul fără viteză e fatal. Găsește echilibrul prin repetiție.
`});

les({id:'tp5',m:'tps',t:'Reîncărcare tactică sub presiune',min:5,b:`
Reîncărcarea în luptă nu e aceeași cu cea de la poligon. Stresul, întunericul și mișcarea schimbă totul.
@anim reload

### Tipuri de reîncărcare
- **Emergency reload.** Arma s-a oprit, încărcătorul e gol. Scoate-l, introdu altul, lovește slide release-ul. Totul într-o mișcare fluidă.
- **Tactical reload.** Încărcător parțial consumat → îl schimbi cu unul plin PĂSTRÂNDU-L pe cel parțial. Fără grabă, dar fără ezitare.
- **Malfuncție + reîncărcare.** Uneori ceea ce pare o pană e de fapt un încărcător gol. Tap-rack-bang devine tap-rack-reload dacă nu rezolvă.

! Exersează reîncărcarea cu ochii închiși și cu mănuși. În întuneric și sub stres, dexteritatea fină scade dramatic.

Pentru clearing-ul malfuncțiilor de bază, vezi @link t8.
`});

les({id:'tp6',m:'tps',t:'Identificare ținte și reguli de angajare',min:5,b:`
Tragerea corectă tehnic dar greșită legal/moral e un eșec total. Identificarea precede întotdeauna angajarea.

### Protocol de identificare
1. **Vizual:** Ce văd? Armă? Comportament agresiv? Context?
2. **Verbal:** „Arată-mi mâinile!" / „Nu te mișca!" Răspunsul (sau lipsa lui) informează decizia.
3. **Contextual:** Sunt civili în zonă? Care e fundalul? Există cale de retragere?
4. **Legal:** Legea română permite folosirea forței DOAR când există un atac iminent asupra ta sau a altuia. Proporționalitatea e obligatorie.

> Tragerea e ultima opțiune, nu prima. Dacă poți evita confruntarea prin distanță, comunicare sau evacuare, fă-o.

! Această lecție e educativă. Cunoaște legislația locală și consultă un avocat specializat.
`});

les({id:'tp7',m:'tps',t:'Scenarii vehicul și spații înguste',min:6,b:`
Mașina și holurile strâmte sunt medii extrem de restrictive. Tehnicile standard nu funcționează aici.

@anim vehicle
### Vehicul
- **Ieșirea din mașină sub amenințare.** Deschide ușa ca scut temporar. Ieși pe partea opusă amenințării dacă e posibil.
- **Tragere din/în jurul vehiculului.** Motorul și roțile oferă acoperire reală. Portierele NU opresc gloantele.
- **Arma în mașină.** Holster dedicat consola/scaun. Nu sub scaun, nu în torpedou. Acces rapid = viață.

### Spații înguste
- **Retragerea armei la piept (compressed ready).** Țeava sus, aproape de corp. Previne dezarmarea și permite tranziții rapide.
- **Colțuri și intersecții.** Expune minim. Folosește tehnica „slice the pie" progresiv.
- **Scări.** Arma orientată spre amenințarea probabilă. Mâna liberă pe balustradă pentru stabilitate.
`});

les({id:'tp8',m:'tps',t:'Apărare casnică — planificare și execuție',min:5,b:`
Casa ta ar trebui să fie cel mai sigur loc. Planificarea defensivă transformă haosul potențial în răspuns structurat.

### Pregătire preventivă
- **Securizare fizică.** Uși solide, încuietori bune, iluminare exterioară automată. Descurajarea e primul strat.
- **Plan familial.** Toți membrii știu ce fac la o intruziune: unde se adună, cine sună la 112, cum comunică.
- **Zona sigură (safe room).** Cameră cu ușă solidă, telefon, lanternă, kit medical. Ultimul refugiu, nu primul.
- **Iluminare interioară strategică.** Lumini de veghe pe coridoare. Întunericul e aliatul tău dacă tu controlezi lumina.

### Răspuns activ
- **Verifică înainte de a angaja.** Zgomot ≠ amenințare confirmată. Identifică pozitiv.
- **Comunică verbal clar.** „Am armă! Pleacă acum!" Vocea puternică descurajează și documentează intenția.
- **Nu urmări.** Lasă agresorul să plece dacă se retrage. Urmărirea transformă apărarea în agresiune.

> Cel mai bun rezultat al unei confruntări defensive e cel care nu a avut loc.
`});

les({id:'tp9',m:'tps',t:'Integrarea lanternei tactice',min:5,b:`
Lanterna nu e doar pentru a vedea — e un instrument tactic multifuncțional.

### Tehnici de utilizare
- **Montată pe armă:** Mâinile libere, iluminare sincronizată cu direcția armei. Ideală pentru angajare.
- **Mână liberă (Harries/AIO):** Flexibilitate maximă. Poți ilumina fără a orienta arma. Esențială pentru identificare.
- **Strobe ca armă non-letală.** Dezorientează temporar. Creează fereastra de timp pentru evacuare sau angajare.
- **Semnalizare.** Comunică poziția echipei tale fără voce. Coduri prestabilite.

! Lanterna te face vizibil. Folosește-o scurt, mișcă-te, reaprinde din altă poziție. Nu deveni o țintă luminată.

Pentru tehnici de lumină scăzută avansate, vezi și @link ge4.
`});

les({id:'tp10',m:'tps',t:'Drill-uri avansate de viteză și precizie',min:5,b:`
Viteza fără precizie e zgomot. Precizia fără viteză e istorie. Drill-urile construiesc ambele simultan.

### Drill-uri recomandate
- **Bill Drill (7 yards, 6 focuri sub 2 secunde).** Testează viteza pură de tragere și recuperare.
- **El Presidente (3 ținte, tranziții, reîncărcare).** Evaluează mișcarea, tranzițiile și managementul încărcătoarelor.
- **Failure Drill / Mozambique (2 la corp, 1 la cap).** Antrenează tranziția rapidă între zone de impact.
- **Dot Torture (50 de focuri, diverse drill-uri).** Testează toate fundamentele sub presiune de timp.

### Cum le folosești
- **Baseline:** Măsoară timpul inițial. Fără baseline, nu știi dacă progresezi.
- **Par time:** Setează un target realist. Crește dificultatea treptat.
- **Jurnal:** Notează scorurile. (@tool journal Caiet) Progresul vizibil motivează.
- **Siguranță:** NICIODATĂ nu sacrifici siguranța pentru viteză.

> „Slow is smooth, smooth is fast." Viteza e produsul secundar al eficienței.
`});

les({id:'tp11',m:'tps',t:'Mentenanță și fiabilitate armă',min:4,b:`
Arma ta e un sistem mecanic. Neglijarea mentenanței = malfunction în cel mai prost moment posibil.

### Rutina de mentenanță
- **După fiecare sesiune:** Curățare basică, lubrifiere puncte cheie, verificare funcțională.
- **Lunar:** Inspectare detaliată, curățare profundă, test funcții de siguranță.
- **Înainte de carry:** Verificare vizuală + funcțională. Mag check. Baterie optică/lanternă.
- **După expunere la mediu ostil** (ploaie, praf, noroi): Curățare imediată, indiferent de program.

### Fiabilitate
- **Testează muniția de carry.** Minim 200 de cartușe fără malfunction înainte de a avea încredere.
- **Schimbă piesele consumabile.** Arcuri, extractoare, baterii — au durată de viață limitată.
- **Păstrează log de mentenanță.** Când ai schimbat ultima dată arcul extractorului? Dacă nu știi, e prea târziu.

? O armă curată și lubrifiată e o asigurare de viață. 10 minute pe săptămână pot face diferența.
`});

les({id:'tp12',m:'tps',t:'Pregătire mentală pentru confruntare reală',min:5,b:`
Confruntarea violentă durează secunde, dar consecințele durează o viață. Mintea trebuie pregătită LA FEL DE MULT ca arma.

### Elemente critice
- **Visualizare mentală.** Imaginează-ți scenarii complete, inclusiv stresul, zgomotul, confuzia. Creierul nu distinge clar între vizualizare intensă și experiență reală.
- **Acceptarea posibilității violenței.** Nu e paranoia — e realism. Cine refuză să accepte că răul există e deja victimă.
- **Decizia pre-combat.** Știi DINAINTE ce ești dispus să faci. Ezitarea în momentul critic costă vieți.
- **Post-incident.** Shock-ul emoțional e normal. Pregătește-te psihologic pentru aftermath: legal, emoțional, social.

> Antrenamentul fizic construiește competența. Antrenamentul mental construiește **voința de a folosi acea competență** când totul merge împotriva ta.

Pentru bazele mentalității, vezi și @link m1 și @link ge8.
`});
/* 030-anims.js */
/* Animații SVG pentru lecții. Fiecare: vb (viewBox), svg (conținut; "§" devine un prefix unic pentru id-uri),

const lerp=(a,b,t)=>a+(b-a)*t;
const ez=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;

/* motorul: montează o animație într-un element, rulează doar cât e vizibilă */
let animUid=0;
function mountAnim(host,id){
  const A=ANIMS[id];if(!A)return;const uid='a'+(++animUid)+'_';
  host.classList.add('anim');
  host.innerHTML=`<svg viewBox="${A.vb}" role="img">${A.svg.replace(/§/g,uid)}</svg><div class="cap"><span class="cx"></span><span class="sp"></span><button class="btn sm g" data-pp aria-label="Pauză">${ic('pause','s')}</button></div>`;
  const svg=$('svg',host),cap=$('.cx',host),pp=$('[data-pp]',host);
  const total=A.steps.reduce((s,x)=>s+x.d,0);let t0=performance.now(),paused=false,pausedAt=0,last=-1,vis=true,raf=0;
  const io=new IntersectionObserver(es=>{vis=es[0].isIntersecting;if(vis&&!raf&&!paused)loop()},{threshold:.15});io.observe(host);
  pp.onclick=()=>{paused=!paused;if(paused){pausedAt=performance.now();pp.innerHTML=ic('play','s')}else{t0+=performance.now()-pausedAt;pp.innerHTML=ic('pause','s');loop()}};
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function draw(now){let t=(now-t0)%total,i=0;while(t>=A.steps[i].d){t-=A.steps[i].d;i++}
    if(i!==last){cap.innerHTML=A.steps[i].c;last=i}A.f(svg,i,t/A.steps[i].d,A)}
  function loop(){raf=0;if(!host.isConnected){io.disconnect();return}if(paused||!vis)return;draw(performance.now());raf=requestAnimationFrame(loop)}
  if(reduce){paused=true;pp.innerHTML=ic('play','s');A.f(svg,A.steps.length>2?2:0,0,A);cap.innerHTML=A.steps[A.steps.length>2?2:0].c}else loop();
}

  <text x="394" y="90" text-anchor="end" fill="#5f676f" font-size="10" ${AF}>țeava spre amenințare</text>
  ${mag('mg')}${mag('mn')}
  <path d="M128 112 L181 112 L168 198 L114 198Z" fill="#2b3137"/>
  <rect x="150" y="112" width="154" height="17" rx="2" fill="#2b3137"/>
  <path d="M206 129 C206 152 184 157 172 141" fill="none" stroke="#2b3137" stroke-width="5"/>
  <line x1="191" y1="129" x2="188" y2="144" stroke="#5b636b" stroke-width="3" stroke-linecap="round"/>
  <g data-k="sl"><rect x="100" y="84" width="210" height="30" rx="4" fill="#3d454d"/><g stroke="#2a2f35" stroke-width="2.4">${ser}</g>
    <rect x="200" y="87" width="42" height="12" rx="2" fill="#07080a"/><rect x="294" y="79" width="7" height="6" fill="#3d454d"/><rect x="108" y="78" width="13" height="7" fill="#3d454d"/></g>
  <g data-k="cs" opacity="0"><rect x="223" y="58" width="9" height="31" rx="1.5" fill="#d4a64a"/></g>
  <g data-k="df" opacity="0"><rect x="214" y="89" width="26" height="9" rx="2" fill="#b98c3a"/><rect x="190" y="93" width="22" height="9" rx="1.5" fill="#d4a64a"/><path d="M212 93 L222 97.5 L212 102Z" fill="#c07a4a"/></g>
  <g data-k="fl" opacity="0"><rect x="-4" y="-11" width="8" height="22" rx="1.5" fill="#d4a64a"/></g>

  <circle data-k="hit" cx="137" cy="210" r="10" fill="none" stroke="#5be38e" stroke-width="2" opacity="0"/>`,
  steps:[{d:2200,c:'<b>Nu pleacă focul:</b> apeși și auzi doar <i>clic</i>. Încărcătorul nu e fixat — sau cartușul e defect.'},
    {d:3200,c:'<b>Bate — trage — gata:</b> palma fixează încărcătorul, tragi închizătorul complet și îl lași să plece singur.'},
    {d:2200,c:'<b>Tubul blocat</b> („coș de sobă”): tubul a rămas prins în fereastră, iar închizătorul nu s-a închis.'},
    {d:2800,c:'<b>Mături tubul</b> cu degetele întinse, peste închizător — niciodată prin fața țevii. Nu tragi închizătorul complet.'},
    {d:2200,c:'<b>Dubla alimentare:</b> tubul tras a rămas în cameră, iar cartușul următor e împins în spatele lui.'},
    {d:4600,c:'Blochezi închizătorul în spate → scoți încărcătorul → tragi închizătorul de 2–3 ori → încărcător nou → alimentezi.'}],
  f(el,i,p){

        df=q<.06?1:0;const ft=clamp(q/.4,0,1);if(ft<1)fl=[226+46*ft,92-84*ft+120*ft*ft,300*ft,1-ft]}
      else if(p<.8){lb=10;mo=0;d=80;const a=ez((p-.62)/.18);dn=[80*(1-a),a]}

const VID={};VIDS.forEach(v=>VID[v.i]=v);

let CLEAN=[];const onLeave=f=>CLEAN.push(f);
const SCR={};let curHash='',navCount=0;

function shell(){
  const nav=NAV.map(n=>`<a href="#/${n[0]}" data-n="${n[0]}">${ic(n[2])}<span>${n[1]}</span></a>`).join('');
  const side=NAV.map(n=>`<a class="nv" href="#/${n[0]}" data-n="${n[0]}">${ic(n[2])}<span>${n[1]}</span></a>`).join('');
  $('#app').innerHTML=`<aside class="side"><div class="brand"><img class="mk" src="${ICON64}" alt=""><span class="wm">OPERA<b>TOR</b></span></div>${side}
    <div class="foot">Lecții, unelte și toate videoclipurile lui Chris Sajnog, plus cărțile lui Lawrence & Pannone și Kyle Lamb, explicate în română. Aplicație neoficială.</div></aside>
    <header class="top" id="top"></header><main id="main"></main><nav class="nav">${nav}</nav>`;
}
function topbar(o){
  const t=$('#top');
  if(o.back){t.innerHTML=`<button class="back" data-back aria-label="Înapoi">${ic('back')}</button><div class="ttl">${esc(o.title||'')}</div>${o.right||''}`;
    $('[data-back]',t).onclick=()=>{if(navCount>1)history.back();else location.hash=o.back}}
  else t.innerHTML=`<div class="brand"><img class="mk" src="${ICON64}" alt=""><span class="wm">OPERA<b>TOR</b></span></div>${o.right||''}`;
}
const ROUTES=[];
const route=(re,fn)=>ROUTES.push([re,fn]);
function render(){
  CLEAN.forEach(f=>{try{f()}catch(e){}});CLEAN=[];hush();wake(false);closeSheet();
  if(curHash)SCR[curHash]=scrollY;navCount++;
  const h=(location.hash||'#/azi').replace(/^#\/?/,'');curHash=h;
  let m=null,fn=null;for(const [re,f] of ROUTES){m=h.match(re);if(m){fn=f;break}}
  if(!fn){location.replace('#/azi');return}
  const tab=h.split('/')[0];const act={lectie:'lectii',modul:'lectii',test:'lectii',unealta:'unelte'}[tab]||tab;
  $$('.nav a,.side a.nv').forEach(a=>a.classList.toggle('on',a.dataset.n===act));
  const main=$('#main');main.className='';
  const v=fn(...m.slice(1).map(decodeURIComponent));
  topbar(v);main.innerHTML=`<div class="view">${v.html}</div>`;
  v.mount&&v.mount(main);
  $$('[data-anim]',main).forEach(h=>mountAnim(h,h.dataset.anim));
  requestAnimationFrame(()=>scrollTo(0,v.keepScroll&&SCR[h]?SCR[h]:0));
}
/* clic pe orice [data-go] navighează */
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){e.preventDefault();const to=g.dataset.go;if(to.startsWith('#'))location.hash=to;else window.open(to,'_blank','noopener')}});

/* bucăți comune */
const thumb=id=>`https://i.ytimg.com/vi/${id}/mqdefault.jpg`;
const dur=s=>s>=3600?Math.floor(s/3600)+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60):Math.floor(s/60)+':'+pad(s%60);
const views=n=>n>=1e6?(n/1e6).toFixed(1).replace('.',',')+' mil.':n>=1e3?Math.round(n/1e3)+' mii':String(n);
function vcard(v){return `<button class="vcard" data-go="#/video/${v.i}"><div class="th"><img loading="lazy" src="${thumb(v.i)}" alt=""><span class="dur">${dur(v.d)}</span>${S.watched[v.i]?`<span class="wt pill ac">${ic('check','s')} văzut</span>`:''}</div>
  <div class="bd"><b>${esc(v.t)}</b><small class="mu">${CAT[v.c]} · ${views(v.v)} vizionări${S.fav[v.i]?' · ★':''}</small></div></button>`}
function vchip(id){const v=VID[id];if(!v)return'';return `<button class="vchip" data-go="#/video/${id}"><div class="th"><img loading="lazy" src="${thumb(id)}" alt=""></div><div><b>${esc(v.t)}</b><small class="mu">${dur(v.d)}${S.watched[id]?' · văzut ✓':''}</small></div></button>`}
function okMark(y){return `<span class="ok ${y?'y':''}">${ic('check')}</span>`}
function ring(val,max,size=64,stroke=6){const r=(size-stroke)/2,c=2*Math.PI*r,f=clamp(val/max,0,1);
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--s3)" stroke-width="${stroke}"/>${f>0?`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--ac)" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${(c*f).toFixed(1)} ${c.toFixed(1)}" style="filter:drop-shadow(0 0 4px rgba(91,227,142,.5))"/>`:''}</svg><b>${val}</b></div>`}
const phv=(k,py)=>`--ph:url('${PH[k]}')${py?';--py:'+py:''}`;

const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
function md(src){
  const out=[];let para=[],list=null,lt='';
  const fp=()=>{if(para.length){out.push('<p>'+inl(para.join(' '))+'</p>');para=[]}};
  const fl=()=>{if(list){out.push(`<${lt}>${list.map(x=>'<li>'+inl(x)+'</li>').join('')}</${lt}>`);list=null}};
  for(const raw of src.trim().split('\n')){
    const l=raw.trim();let m;
    if(!l){fp();fl();continue}
    if(l.startsWith('### ')){fp();fl();out.push('<h3>'+inl(l.slice(4))+'</h3>');continue}
    if((m=l.match(/^- (.*)/))){fp();if(lt!=='ul')fl();lt='ul';(list=list||[]).push(m[1]);continue}
    if((m=l.match(/^\d+\. (.*)/))){fp();if(lt!=='ol')fl();lt='ol';(list=list||[]).push(m[1]);continue}
    fl();
    if(l.startsWith('> ')){fp();out.push('<div class="key">'+inl(l.slice(2))+'</div>');continue}
    if(l.startsWith('! ')){fp();out.push(`<div class="note">${ic('alert')}<div>${inl(l.slice(2))}</div></div>`);continue}
    if(l.startsWith('? ')){fp();out.push(`<div class="note i">${ic('info')}<div>${inl(l.slice(2))}</div></div>`);continue}
    if((m=l.match(/^@anim (\w+)/))){fp();out.push(`<div data-anim="${m[1]}"></div>`);continue}
    if((m=l.match(/^@ilust (\w+)(?:\s+(.*))?/))){fp();out.push(`<div class="ilust" data-ilust="${m[1]}">${m[2]?'<span class="cap">'+esc(m[2])+'</span>':''}</div>`);continue}
    if((m=l.match(/^@tool (\w+) (.*)/))){fp();out.push(`<div class="tool"><button class="btn g" data-go="${toolLink(m[1])}">${ic(TOOLS[m[1]]?TOOLS[m[1]].ic:'chev')} ${esc(m[2])}</button></div>`);continue}
    para.push(l.replace(/@link (\w+)/g,(_,id)=>LES[id]?`<a href="#/lectie/${id}" class="ilink">${esc(LES[id].t)}</a>`:`<code>@link ${esc(id)}</code>`));
  }
  fp();fl();return out.join('');
}

function quizHTML(l){if(!l.q)return'';
  return `<div class="sec"><h2>Verifică-te</h2></div><div class="card quiz">${l.q.map((q,qi)=>`<div class="qb" data-q="${qi}" style="${qi?'margin-top:18px':''}"><div class="qq">${esc(q[0])}</div>${q[1].map((o,oi)=>`<button class="opt" data-o="${oi}">${esc(o)}</button>`).join('')}<p class="why hide"></p></div>`).join('')}</div>`}
function bindQuiz(root,l,onAll){
  const res={};
  $$('.qb',root).forEach(b=>{const qi=+b.dataset.q,q=l.q[qi];$$('.opt',b).forEach(o=>o.onclick=()=>{
    if(res[qi]!=null)return;const oi=+o.dataset.o,ok=oi===q[2];res[qi]=ok;
    o.classList.add(ok?'y':'n');if(!ok)$(`.opt[data-o="${q[2]}"]`,b).classList.add('y');
    const w=$('.why',b);w.innerHTML=(ok?'<b class="ac">Corect.</b> ':'<b style="color:var(--bad)">Nu chiar.</b> ')+esc(q[3]);w.classList.remove('hide');
    if(Object.keys(res).length===l.q.length)onAll&&onAll(Object.values(res).filter(Boolean).length);
  })});
}

/* VIDEO — toate videoclipurile canalului, cu rezumat și momente-cheie în română */
const VF={q:'',c:'',sort:'pop',only:''};
const LOCAL=location.protocol==='file:';
function vfilter(){
  const q=norm(VF.q).split(/\s+/).filter(Boolean);
  let a=VIDS.filter(v=>(!VF.c||v.c===VF.c)&&(VF.only!=='new'||!S.watched[v.i])&&(VF.only!=='fav'||S.fav[v.i])&&(VF.only!=='ess'||ESS.includes(v.i)));
  if(q.length)a=a.filter(v=>{const h=norm(v.t+' '+v.o+' '+v.s+' '+v.p.join(' ')+' '+v.k.map(x=>x[1]).join(' '));return q.every(w=>h.includes(w))});
  if(VF.sort==='pop')a.sort((x,y)=>y.v-x.v);else if(VF.sort==='new')a.sort((x,y)=>x.n-y.n);else if(VF.sort==='short')a.sort((x,y)=>x.d-y.d);
  if(VF.only==='ess')a.sort((x,y)=>ESS.indexOf(x.i)-ESS.indexOf(y.i));
  return a;
}

/* ajutoare */
function stepperHTML(k,label,val,fmt){return `<div class="f"><small class="mu">${esc(label)}</small><div class="stp"><button data-sd="${k}" data-v="-1" aria-label="Mai puțin">−</button><b data-sv="${k}">${fmt?fmt(val):val}</b><button data-sd="${k}" data-v="1" aria-label="Mai mult">+</button></div></div>`}
function bindSteppers(root,obj,spec,onCh){$$('[data-sd]',root).forEach(b=>b.onclick=()=>{const k=b.dataset.sd,s=spec[k];obj[k]=Math.round(clamp(obj[k]+(+b.dataset.v)*s.step,s.min,s.max)*1000)/1000;
  if(s.link)s.link(obj);Object.keys(spec).forEach(kk=>{const e=$(`[data-sv="${kk}"]`,root);if(e)e.textContent=spec[kk].fmt?spec[kk].fmt(obj[kk]):obj[kk]});onCh&&onCh()})}
const secF=v=>String(v).replace('.',',')+' s';
function segHTML(id,opts,cur){return `<div class="seg" id="${id}">${opts.map(o=>`<button data-k="${o[0]}" class="${o[0]===cur?'on':''}">${o[1]}</button>`).join('')}</div>`}
function bindSeg(root,id,fn){$$('#'+id+' button',root).forEach(b=>b.onclick=()=>{$$('#'+id+' button',root).forEach(x=>x.classList.toggle('on',x===b));fn(b.dataset.k)})}
function safetyGate(go){
  if(SAFE_OK){go();return}
  sheet('Înainte de dry fire',`<p class="mu" style="margin-top:0">Confirmă, cu mâna pe inimă:</p><div class="lst" style="display:block">${['Nu e nicio muniție în camera în care exersez','Am verificat arma și încărcătoarele, vizual și cu degetul','Exersez spre un fundal care ar opri un glonț','Sau folosesc o armă de antrenament (albastră, airsoft, laser)'].map((t,k)=>`<label class="chk"><input type="checkbox" data-g="${k}"><span>${t}</span></label>`).join('')}</div>
    <div class="row w mt"><button class="btn g" data-go="#/unealta/safety">Lista completă</button><button class="btn sp" data-ok disabled>Sunt în siguranță</button></div>`,el=>{
    const ok=$('[data-ok]',el);const ch=()=>{const c=$$('[data-g]',el);ok.disabled=!(c[0].checked&&c[3].checked||c.slice(0,3).every(x=>x.checked))};
    $$('[data-g]',el).forEach(c=>c.onchange=ch);ok.onclick=()=>{SAFE_OK=true;closeSheet();go()};
  });
}
/* rulează pași cronometrați: [{l:eticheta, s:secunde, cue:secunde între semnale, say:text}] */
function runSteps(host,steps,{onDone,big=true}={}){
  let i=0,t0=0,raf=0,alive=true,lastCue=-1,paused=false,pAt=0;
  host.innerHTML=`<div class="stage"><div class="lbl" data-l></div><div class="disp" data-d>0</div><div class="lbl" data-n style="letter-spacing:.04em;text-transform:none;font-weight:550"></div><div class="dots" data-dots>${steps.map(()=>'<i></i>').join('')}</div>
    <div class="ctl"><button class="btn g" data-p>${ic('pause','s')} Pauză</button><button class="btn o" data-x>${ic('stop','s')} Oprește</button></div></div>`;
  const L_=$('[data-l]',host),D=$('[data-d]',host),N=$('[data-n]',host),dots=$$('[data-dots] i',host);
  const start=k=>{i=k;t0=performance.now();lastCue=-1;const s=steps[i];L_.textContent=s.l;N.textContent=s.n||'';dots.forEach((d,j)=>d.classList.toggle('y',j<=i));if(s.say)say(s.say);else beep(i?880:1200,.14,.35,'sine')};
  const loop=()=>{if(!alive||!host.isConnected)return;if(!paused){const s=steps[i],el=(performance.now()-t0)/1000;const left=s.s-el;D.textContent=Math.ceil(Math.max(0,left));
      if(s.cue){const c=Math.floor(el/s.cue);if(c!==lastCue&&el>.3){lastCue=c;tick(.35,1300)}}
      if(left<=0){if(i+1<steps.length)start(i+1);else{alive=false;bell(.3);L_.textContent='Gata';D.textContent='✓';D.classList.add('go');N.textContent='';$('[data-p]',host).remove();$('[data-x]',host).innerHTML=ic('redo','s')+' Încă o dată';$('[data-x]',host).onclick=()=>runSteps(host,steps,{onDone});onDone&&onDone();return}}}
    raf=requestAnimationFrame(loop)};
  $('[data-p]',host).onclick=e=>{paused=!paused;if(paused){pAt=performance.now();e.currentTarget.innerHTML=ic('play','s')+' Continuă'}else{t0+=performance.now()-pAt;e.currentTarget.innerHTML=ic('pause','s')+' Pauză'}};
  $('[data-x]',host).onclick=()=>{alive=false;cancelAnimationFrame(raf);host.dispatchEvent(new CustomEvent('stopped'))};
  wake(true);start(0);loop();
  return ()=>{alive=false;cancelAnimationFrame(raf)};
}

/* ── Cronometrul de dry fire (start aleatoriu + timp-limită) ── */
tool('timer',{t:'Cronometru dry fire',d:'Start aleatoriu, timp-limită, repetări și pauze',ic:'timer',g:'tr',run(h){
  const c=S.set.timer=Object.assign({dmin:2,dmax:4,par:2,reps:10,rest:5},S.set.timer);
  const spec={dmin:{min:0,max:10,step:.5,fmt:secF,link:o=>{if(o.dmax<o.dmin)o.dmax=o.dmin}},dmax:{min:0,max:15,step:.5,fmt:secF,link:o=>{if(o.dmin>o.dmax)o.dmin=o.dmax}},par:{min:.5,max:30,step:.25,fmt:secF},reps:{min:1,max:50,step:1},rest:{min:0,max:60,step:1,fmt:secF}};
  h.innerHTML=`<div class="stage"><div class="disp" id="td">0,00</div><div class="lbl" id="tl">Pregătit</div><div class="ctl"><button class="btn lg" id="tgo">${ic('play','s')} Start</button></div></div>
  <div class="cfg">${stepperHTML('dmin','Start, cel mai devreme',c.dmin,secF)}${stepperHTML('dmax','Start, cel mai târziu',c.dmax,secF)}${stepperHTML('par','Timp-limită (al doilea semnal)',c.par,secF)}${stepperHTML('reps','Repetări',c.reps)}${stepperHTML('rest','Pauză între repetări',c.rest,secF)}</div>
  <div class="note i mt">${ic('info')}<div><b>Cum îl folosești:</b> la primul semnal faci mișcarea (de exemplu ridici arma de antrenament la ochi, cu cătarea clară). Al doilea semnal e timpul-limită. Lucrează încet și perfect — mărește dificultatea doar când toate repetările sunt perfecte.</div></div>`;
  bindSteppers(h,c,spec,()=>save('set'));
  let run=false,raf=0,tok=0;const D=$('#td',h),Lb=$('#tl',h),B=$('#tgo',h);
  const stop=(msg)=>{run=false;tok++;cancelAnimationFrame(raf);B.innerHTML=ic('play','s')+' Start';D.className='disp';Lb.textContent=msg||'Pregătit';wake(false)};
  const wait=(ms,my)=>new Promise(res=>{const e=performance.now()+ms;const f=()=>{if(my!==tok)return res(false);const l=e-performance.now();if(l<=0)return res(true);setTimeout(f,Math.min(40,l))};f()});
  async function go(){run=true;const my=++tok;B.innerHTML=ic('stop','s')+' Stop';wake(true);ac();const t0=Date.now();let done=0;
    for(let r=1;r<=c.reps;r++){
      D.className='disp wait';D.textContent='gata';Lb.textContent=`Repetarea ${r} din ${c.reps} — așteaptă semnalul`;
      if(!await wait(rnd(c.dmin,c.dmax)*1000,my))return;
      beep(2200,.22,.6);const st=performance.now();D.className='disp go';Lb.textContent='Acum!';
      const upd=()=>{if(my!==tok)return;D.textContent=((performance.now()-st)/1000).toFixed(2).replace('.',',');raf=requestAnimationFrame(upd)};upd();
      if(!await wait(c.par*1000,my))return;cancelAnimationFrame(raf);beep(1100,.12,.5);setTimeout(()=>beep(1100,.12,.5),170);D.textContent=c.par.toFixed(2).replace('.',',');done++;
      if(r<c.reps&&c.rest>0){D.className='disp';const re=performance.now()+c.rest*1000;Lb.textContent='Pauză — revino în poziție';
        while(performance.now()<re){if(my!==tok)return;D.textContent=Math.ceil((re-performance.now())/1000);await wait(100,my)}}
    }
    logSession('Dry fire',Math.max(1,(Date.now()-t0)/60000),`Cronometru: ${done} repetări, limită ${secF(c.par)}`);stop(`Gata: ${done} repetări ✓ (notat în Caiet)`);bell(.25);
  }
  B.onclick=()=>{if(run)stop();else safetyGate(go)};
  return ()=>stop();
}});

/* ── Cronometrul de tragere cu microfon ── */
tool('shot',{t:'Cronometru cu microfon',d:'Prinde focurile (sau clicurile) și îți dă timpii',ic:'mic',g:'tr',run(h){
  const c=S.set.shot=Object.assign({thr:.35,dmin:2,dmax:4,max:10},S.set.shot);
  h.innerHTML=`<div class="stage"><div class="disp" id="sd">0,00</div><div class="lbl" id="sl">primul foc</div><div class="meter"><i id="sm"></i><u id="st"></u></div>
    <div class="ctl"><button class="btn lg" id="sgo">${ic('mic','s')} Start</button></div><div class="shots" id="ss"></div></div>
  <div class="card mt"><label class="f" style="margin-top:0">Sensibilitate (trage spre stânga dacă prinde zgomote, spre dreapta dacă nu prinde clicul)</label><input type="range" id="sth" min="2" max="95" value="${Math.round((1-c.thr)*100)}">
    <div class="cfg">${stepperHTML('dmin','Start, cel mai devreme',c.dmin,secF)}${stepperHTML('dmax','Start, cel mai târziu',c.dmax,secF)}${stepperHTML('max','Ascultă cel mult',c.max,secF)}</div></div>
  <div class="note i mt">${ic('info')}<div>La semnal tragi (în poligon) sau apeși (la dry fire). Clicul percutorului e slab: pune telefonul aproape și mărește sensibilitatea. Poți testa cu o bătaie din palme. Prima dată, aplicația îți cere voie la microfon.</div></div>`;
  bindSteppers(h,c,{dmin:{min:0,max:10,step:.5,fmt:secF,link:o=>{if(o.dmax<o.dmin)o.dmax=o.dmin}},dmax:{min:0,max:15,step:.5,fmt:secF,link:o=>{if(o.dmin>o.dmax)o.dmin=o.dmax}},max:{min:3,max:60,step:1,fmt:secF}},()=>save('set'));
  const D=$('#sd',h),Lb=$('#sl',h),B=$('#sgo',h),M=$('#sm',h),T=$('#st',h),SS=$('#ss',h),TH=$('#sth',h);
  const setThr=()=>{c.thr=1-TH.value/100;T.style.left=(c.thr*100)+'%';save('set')};TH.oninput=setThr;setThr();
  let stream=null,an=null,buf=null,raf=0,state='idle',tStart=0,shots=[],lastShot=0,tok=0;
  const meter=()=>{if(!an)return 0;an.getFloatTimeDomainData(buf);let p=0;for(let k=0;k<buf.length;k++){const a=Math.abs(buf[k]);if(a>p)p=a}return p};
  const idle=()=>{raf=requestAnimationFrame(idle);const p=meter();M.style.width=Math.min(100,p*100)+'%'};
  async function mic(){if(stream)return true;try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});const a=ac();const src=a.createMediaStreamSource(stream);an=a.createAnalyser();an.fftSize=1024;buf=new Float32Array(an.fftSize);src.connect(an);return true}
    catch(e){toast('Fără acces la microfon. Permite-l din setările browserului.',3500);return false}}
  const showShots=()=>{SS.innerHTML=shots.map((t,k)=>`<div><small class="mu">#${k+1}</small><b>${t.toFixed(2).replace('.',',')}</b><small class="mu">${k?'+'+(t-shots[k-1]).toFixed(2).replace('.',','):'primul'}</small></div>`).join('')};
  const finish=()=>{state='idle';tok++;B.innerHTML=ic('mic','s')+' Start';Lb.textContent=shots.length?`${shots.length} ${shots.length===1?'foc':'focuri'} · primul ${shots[0].toFixed(2).replace('.',',')} s`:'niciun foc prins';
    if(shots.length)logSession('Dry fire',1,`Cronometru cu microfon: ${shots.length} focuri, primul la ${shots[0].toFixed(2)} s`);wake(false)};
  async function go(){if(!await mic())return;const my=++tok;state='wait';shots=[];showShots();B.innerHTML=ic('stop','s')+' Stop';D.textContent='gata';D.className='disp wait';Lb.textContent='așteaptă semnalul';wake(true);
    await sleep(rnd(c.dmin,c.dmax)*1000);if(my!==tok)return;beep(2200,.2,.6);tStart=performance.now();state='listen';D.className='disp go';lastShot=0;
    const lis=()=>{if(my!==tok)return;const now=performance.now(),el=(now-tStart)/1000;const p=meter();M.style.width=Math.min(100,p*100)+'%';
      if(el>.28&&p>c.thr&&now-lastShot>90){lastShot=now;shots.push(el);showShots()}
      D.textContent=(shots.length?shots[shots.length-1]:el).toFixed(2).replace('.',',');
      if(el>c.max||(shots.length&&now-lastShot>4000)){finish();return}requestAnimationFrame(lis)};lis()}
  B.onclick=()=>{if(state!=='idle'){tok++;finish();return}cancelAnimationFrame(raf);go()};
  return ()=>{tok++;cancelAnimationFrame(raf);if(stream)stream.getTracks().forEach(t=>t.stop())};
}});

let METRO_BPM=null;
tool('metro',{t:'Metronom',d:'Ritmul focurilor — „să sune ca muzica”',ic:'metro',g:'tr',run(h){
  const c=S.set.metro=Object.assign({bpm:60,acc:1},S.set.metro);if(METRO_BPM){c.bpm=METRO_BPM;METRO_BPM=null}
  h.innerHTML=`<div class="stage"><div style="width:120px;height:120px;margin:4px auto 10px;border-radius:50%;background:radial-gradient(circle,rgba(91,227,142,.55),rgba(91,227,142,0) 70%);transform:scale(.6);transition:transform .08s" id="mp"></div>
    <div class="disp" id="mb">${c.bpm}</div><div class="lbl">bătăi pe minut</div><input type="range" id="mr" min="30" max="200" value="${c.bpm}" class="mt">
    <div class="ctl"><button class="btn lg" id="mgo">${ic('play','s')} Start</button></div></div>
  <div class="row w mt">${[[40,'40'],[60,'60'],[80,'80'],[100,'100'],[110,'RCP 110']].map(p=>`<button class="chip" data-bp="${p[0]}">${p[1]}</button>`).join('')}</div>
  <div class="cfg">${stepperHTML('acc','Accent la fiecare a câta bătaie',c.acc)}</div>
  <div class="note i mt">${ic('info')}<div>La dry fire: o apăsare lină pe fiecare bătaie, fără să pierzi alinierea. Crești ritmul doar când toate sunt perfecte. <b>RCP 110</b> e ritmul pentru compresiile toracice (100–120 pe minut).</div></div>`;
  bindSteppers(h,c,{acc:{min:1,max:8,step:1}},()=>save('set'));
  const P=$('#mp',h),Bm=$('#mb',h),R=$('#mr',h),G=$('#mgo',h);let on=false,next=0,n=0,tm=0;
  const setB=v=>{c.bpm=+v;Bm.textContent=c.bpm;R.value=c.bpm;save('set')};R.oninput=e=>setB(e.target.value);
  $$('[data-bp]',h).forEach(b=>b.onclick=()=>setB(b.dataset.bp));
  const sched=()=>{const a=ac();while(next<a.currentTime+.12){const acc=c.acc>1&&n%c.acc===0;const o=a.createOscillator(),g=a.createGain();o.frequency.value=acc?1900:1300;o.type='square';
      g.gain.setValueAtTime(0,next);g.gain.linearRampToValueAtTime(S.set.sound?(acc?.5:.32):0,next+.003);g.gain.linearRampToValueAtTime(0,next+.04);o.connect(g).connect(a.destination);o.start(next);o.stop(next+.05);
      const d=(next-a.currentTime)*1000;setTimeout(()=>{if(!on)return;P.style.transform='scale(1)';setTimeout(()=>P.style.transform='scale(.6)',90)},Math.max(0,d));n++;next+=60/c.bpm}};
  const stop=()=>{on=false;clearInterval(tm);G.innerHTML=ic('play','s')+' Start';wake(false)};
  G.onclick=()=>{if(on){stop();return}const a=ac();if(!a)return;on=true;n=0;next=a.currentTime+.08;tm=setInterval(sched,25);sched();G.innerHTML=ic('stop','s')+' Stop';wake(true)};
  return stop;
}});

/* Unelte pentru ochi: antrenorul de focalizare (iluzii proprii), sfoara Brock, ochiul dominant */
function sightMark(g,S_,cx,cy,dark){ // semnul de fixat: o cătare mică cu punct alb
  const w=S_*.028,hh=S_*.1;g.fillStyle=dark?'#5be38e':'#0a0b0c';g.fillRect(cx-w/2,cy,w,hh);
  g.beginPath();g.arc(cx,cy+w*.55,w*.32,0,7);g.fillStyle=dark?'#04140a':'#ffffff';g.fill();
}
function cntRing(el,f,txt){el.innerHTML=`<svg viewBox="0 0 54 54"><circle cx="27" cy="27" r="23" fill="rgba(0,0,0,.45)" stroke="rgba(255,255,255,.18)" stroke-width="4"/><circle cx="27" cy="27" r="23" fill="none" stroke="#5be38e" stroke-width="4" stroke-linecap="round" stroke-dasharray="${(144.5*f).toFixed(1)} 145"/></svg><b>${txt}</b>`}

tool('focus',{t:'Antrenor de focalizare',d:'Iluzii optice: fixezi semnul și mișcarea se oprește',ic:'eye',g:'ochi',run(h){
  let mode='lilac',raf=0,alive=true,t0=0,running=false,img=null;
  const INFO={lilac:'Fixează semnul alb de pe cătarea din centru. După 15–30 de secunde, punctele colorate din jur încep să dispară — rămâne doar un punct verde care se rotește. Asta e focalizarea: tot ce e în jur dispare.',
    drift:'Plimbă-ți privirea liber: cercurile par să se rotească. Acum fixează 30 de secunde semnul din centru: mișcarea se oprește. „Mișcarea” vine din salturile ochilor tăi, nu din imagine.',
    grid:'Privește liber: în cercurile albe par să „pâlpâie” puncte negre. Fixează semnul verde din centru 30 de secunde: grila se liniștește.',
    sight:'Diferența dintre a te uita la țintă și a focaliza pe cătare. Exersează privind semnul de pe cătare cât ținta rămâne încețoșată.'};
  const shell=()=>{h.innerHTML=`${segHTML('fm',[['lilac','Puncte care dispar'],['drift','Mișcarea care se oprește'],['grid','Grila'],['sight','Cătarea']],mode)}<div id="fb" class="mt"></div>`;bindSeg(h,'fm',k=>{mode=k;stop();body()});body()};
  function body(){const fb=$('#fb',h);
    if(mode==='sight'){fb.innerHTML=`<div data-anim="focus"></div><p class="mu">${INFO.sight}</p>`;mountAnim($('[data-anim]',fb),'focus');return}
    fb.innerHTML=`<div class="focusbox" id="fx"><canvas></canvas><div class="cnt" id="cnt"></div></div><p class="mu mt">${INFO[mode]}</p>
      <div class="ctl"><button class="btn lg" id="fgo">${ic('play','s')} 30 de secunde</button><button class="btn g" id="ffs">${ic('expand','s')} Ecran complet</button></div>`;
    const box=$('#fx',fb),cv=$('canvas',box);
    const size=()=>{const r=box.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);img=null};
    size();new ResizeObserver(()=>size()).observe(box);
    cntRing($('#cnt',fb),1,'30');
    $('#fgo',fb).onclick=()=>{if(running){stop();return}running=true;t0=performance.now();$('#fgo',fb).innerHTML=ic('stop','s')+' Stop';wake(true)};
    $('#ffs',fb).onclick=()=>{const on=!box.classList.contains('fs');box.classList.toggle('fs',on);let bar=$('.fsbar');if(on){bar=document.createElement('div');bar.className='fsbar';bar.innerHTML=`<button class="btn g">${ic('x','s')} Închide</button>`;document.body.appendChild(bar);$('button',bar).onclick=()=>{box.classList.remove('fs');bar.remove();size()}}else if(bar)bar.remove();size()};
    const loop=()=>{if(!alive||!box.isConnected)return;draw(cv);
      if(running){const el=(performance.now()-t0)/1000;cntRing($('#cnt',fb),1-el/30,Math.ceil(30-el));if(el>=30){bell(.3);running=false;$('#fgo',fb).innerHTML=ic('play','s')+' Încă o dată';cntRing($('#cnt',fb),1,'30');logSession('Ochi / focalizare',.5,'Antrenor de focalizare: '+({lilac:'puncte care dispar',drift:'mișcarea care se oprește',grid:'grila'}[mode]));toast('Gata. Ai văzut cum se oprește totul în jur?');wake(false)}}
      raf=requestAnimationFrame(loop)};loop();
  }
  function draw(cv){const g=cv.getContext('2d'),W=cv.width,H=cv.height,S_=Math.min(W,H),cx=W/2,cy=H/2;
    if(mode==='lilac'){g.fillStyle='#c4c4c4';g.fillRect(0,0,W,H);const R=S_*.36,r=S_*.06,miss=Math.floor(performance.now()/110)%12;
      for(let k=0;k<12;k++){if(k===miss)continue;const a=k/12*Math.PI*2-Math.PI/2,x=cx+R*Math.cos(a),y=cy+R*Math.sin(a);const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,'rgba(226,110,206,1)');gr.addColorStop(.55,'rgba(214,150,205,.55)');gr.addColorStop(1,'rgba(196,196,196,0)');g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill()}
      sightMark(g,S_,cx,cy-S_*.01);return}
    if(mode==='drift'){if(img){g.putImageData(img,0,0);return}g.fillStyle='#8c8c8c';g.fillRect(0,0,W,H);const n=W>700?3:2,cell=S_/n,col=['#000000','#24508f','#ffffff','#e6cd55'];
      for(let a=0;a<n;a++)for(let b=0;b<n;b++){const ox=(W-S_)/2+cell*(a+.5),oy=(H-S_)/2+cell*(b+.5);const rings=4,seg=18;
        for(let q=rings;q>=1;q--){const r1=cell*.46*q/rings,r0=cell*.46*(q-1)/rings,rev=(q+a+b)%2;for(let s=0;s<seg;s++)for(let c4=0;c4<4;c4++){const a0=(s+c4/4)/seg*Math.PI*2,a1=(s+(c4+1)/4)/seg*Math.PI*2;g.beginPath();g.arc(ox,oy,r1,a0,a1);g.arc(ox,oy,Math.max(r0,1),a1,a0,true);g.closePath();g.fillStyle=col[rev?3-c4:c4];g.fill()}}}
      g.fillStyle='#8c8c8c';g.beginPath();g.arc(cx,cy,S_*.07,0,7);g.fill();sightMark(g,S_,cx,cy-S_*.04);img=g.getImageData(0,0,W,H);return}
    if(mode==='grid'){if(img){g.putImageData(img,0,0);return}g.fillStyle='#000';g.fillRect(0,0,W,H);const n=7,st=S_/(n+1),x0=(W-S_)/2,y0=(H-S_)/2;g.strokeStyle='#808080';g.lineWidth=S_*.014;
      for(let k=1;k<=n;k++){g.beginPath();g.moveTo(x0+k*st,y0);g.lineTo(x0+k*st,y0+S_);g.stroke();g.beginPath();g.moveTo(x0,y0+k*st);g.lineTo(x0+S_,y0+k*st);g.stroke()}
      g.fillStyle='#fff';for(let a=1;a<=n;a++)for(let b=1;b<=n;b++){g.beginPath();g.arc(x0+a*st,y0+b*st,S_*.017,0,7);g.fill()}
      g.fillStyle='#000';g.fillRect(cx-st*.32,cy-st*.32,st*.64,st*.64);sightMark(g,S_,cx,cy-S_*.03,true);img=g.getImageData(0,0,W,H)}}
  const stop=()=>{running=false;cancelAnimationFrame(raf);wake(false);const b=$('.fsbar');if(b)b.remove()};
  shell();
  return ()=>{alive=false;stop()};
}});

tool('eye',{t:'Ochiul dominant',d:'Testul pas cu pas și ce faci cu rezultatul',ic:'eye',g:'ochi',run(h){

    cross:'Ai dominanță încrucișată. Soluția lui Chris: păstrezi poziția și triunghiul brațelor neschimbate și doar <b>muți arma puțin</b>, în dreptul ochiului dominant. Nu înclini arma, nu înclini capul. La pușcă, dacă ești la început, poți învăța direct pe partea ochiului dominant.',

      <div data-anim="eye"></div><div class="card"><h3>Testul Miles</h3><ol style="margin:10px 0 0;padding-left:20px"><li>Alege un obiect <b>mic</b>, la câțiva metri (un întrerupător).</li><li>Întinde brațele și fă un triunghi mic din mâini (degetele mari și arătătoarele).</li><li>Cu ambii ochi deschiși, încadrează obiectul în triunghi.</li></ol></div><button class="btn blk lg mt" data-n>Am obiectul în triunghi ${ic('chev','s')}</button>`;

tool('breath',{t:'Respirație',d:'Pătrat, autogenă, cu burta, oftatul fiziologic',ic:'wind',g:'minte',run(h){
  let mode=S.set.bmode||'box',raf=0,on=false;

    <div class="stage"><div class="breath"><svg viewBox="0 0 300 300"><circle cx="150" cy="150" r="138" fill="none" stroke="var(--s3)" stroke-width="3"/><circle id="bp" cx="150" cy="150" r="138" fill="none" stroke="var(--ac)" stroke-width="3" stroke-linecap="round" transform="rotate(-90 150 150)" stroke-dasharray="0 900"/>

  const stop=()=>{on=false;cancelAnimationFrame(raf);hush();wake(false);const b=$('#bgo',h);if(b)b.innerHTML=ic('play','s')+' Start'};
  function go(){const B=BREATH[mode],ph=B[2],cyc=ph.reduce((s,p)=>s+p[1],0),total=cyc*B[3];on=true;wake(true);ac();$('#bgo',h).innerHTML=ic('stop','s')+' Stop';
    const t0=performance.now();let last='';const C=$('#bc',h),P=$('#bp',h),Q=$('#bq',h),N=$('#bn',h);let r=60,r0=60,tg=60;
    const loop=()=>{if(!on||!C.isConnected)return;const el=(performance.now()-t0)/1000;if(el>=total){stop();Q.textContent='Gata ✓';bell(.25);logSession('Respirație',total/60,B[0]);return}
      const ci=Math.floor(el/cyc),ce=el-ci*cyc;let acc=0,k=0;while(ce>=acc+ph[k][1]){acc+=ph[k][1];k++}const pp=(ce-acc)/ph[k][1],name=ph[k][0];
      const key=ci+'-'+k;if(key!==last){last=key;r0=r;tg=/Insp/.test(name)?(mode==='sigh'?112:128):/Încă/.test(name)?134:/Exp/.test(name)?60:r;Q.textContent=name;if(hasVoice()&&S.set.voice)say(name,1);else beep(/Insp|Încă/.test(name)?660:/Exp/.test(name)?440:550,.12,.25,'sine')}
      r=lerp(r0,tg,ez(pp));

  draw();return stop;
}});

    round++;$('#pr',h).textContent=`runda ${round} / 10`;$('#po',h).innerHTML='';const pb=$('#pb',h);await sleep(rnd(900,1700));if(!alive||!pb.isConnected)return;
    const L_=pick(LET),a=Math.random()*Math.PI*2,rr=rnd(36,44);const el=document.createElement('div');el.className='lt';el.textContent=L_;el.style.left=(50+rr*Math.cos(a))+'%';el.style.top=(50+rr*Math.sin(a))+'%';pb.appendChild(el);
    await sleep(flash);el.remove();const opts=shuffle([L_,...shuffle(LET.filter(x=>x!==L_)).slice(0,3)]);
    $('#po',h).innerHTML=`<div class="opts">${opts.map(o=>`<button data-l="${o}">${o}</button>`).join('')}</div>`;
    $$('#po [data-l]',h).forEach(b=>b.onclick=()=>{const ok=b.dataset.l===L_;if(ok){score++;flash=Math.max(120,flash-40);beep(990,.08,.25,'sine')}else{flash=Math.min(700,flash+40);beep(220,.12,.25,'sine')}
      b.style.borderColor=ok?'var(--ac)':'var(--bad)';$('#ps',h).textContent=score+' corecte';setTimeout(next,450)});}
  draw();return ()=>{alive=false};
}});

const KIM=['🔑','📱','⌚','🕶️','🖊️','💳','🔦','🧭','📒','🧢','🎒','🪙','☕','🍎','📷','🧤','🔋','🗺️','🧯','🩹','✂️','🔒','📎','🧲'];
tool('kim',{t:'Jocul memoriei',d:'Privești obiectele, apoi spui ce lipsește',ic:'grid',g:'atentie',run(h){
  let n=6,round=0,score=0,alive=true;
  const draw=()=>{h.innerHTML=`<div class="row mb"><span class="pill" id="kr">runda 0 / 8</span><span class="sp"></span><span class="pill ac" id="ks">0 corecte</span></div><div id="kb"></div>

    $('#kgo',h).onclick=()=>{n=6;round=0;score=0;$('#kgo',h).classList.add('hide');next()}};

    round++;$('#kr',h).textContent=`runda ${round} / 8`;const items=shuffle(KIM).slice(0,n),cols=n<=6?3:4;const secs=Math.max(4,Math.round(n*1.2));

    kb.innerHTML=`<p class="ctr mu">…</p>`;await sleep(900);if(!alive)return;
    const miss=pick(items),rest=shuffle(items.filter(x=>x!==miss));const opts=shuffle([miss,...shuffle(KIM.filter(x=>!items.includes(x))).slice(0,3)]);

    $$('[data-k]',kb).forEach(b=>b.onclick=()=>{const ok=b.dataset.k===miss;b.style.borderColor=ok?'var(--ac)':'var(--bad)';if(ok){score++;n=Math.min(12,n+1);beep(990,.08,.25,'sine')}else{beep(220,.12,.25,'sine');toast('Lipsea '+miss)}$('#ks',h).textContent=score+' corecte';setTimeout(next,700)});}
  draw();return ()=>{alive=false};
}});

tool('clicks',{t:'Clicuri de corecție',d:'Cât rotești turela ca grupa să ajungă în centru',ic:'sight',g:'tr',run(h){
  const o=Object.assign({u:'moa',c:.25,d:100,v:-3,x:2},S.set.clk);
  const UN={moa:[['0.25','¼ MOA'],['0.5','½ MOA'],['1','1 MOA']],mil:[['0.1','0,1 mil'],['0.05','0,05 mil']]};
  const spec={d:{step:25,min:25,max:600,fmt:v=>v+' m'},v:{step:.5,min:-80,max:80,fmt:cmS},x:{step:.5,min:-80,max:80,fmt:cmS}};
  const keep=()=>{S.set.clk=Object.assign({},o);save('set')};
  const draw=()=>{
    if(!UN[o.u].some(z=>+z[0]===o.c))o.c=+UN[o.u][0][0];
    h.innerHTML=`${segHTML('cku',[['moa','MOA'],['mil','Miliradiani']],o.u)}
    <div class="mt">${segHTML('ckc',UN[o.u].map(z=>[z[0],z[1]+' pe clic']),String(o.c))}</div>
    <div class="cfg">${stepperHTML('d','Distanța până la țintă',o.d,spec.d.fmt)}<div class="f"><small class="mu">Un clic, la distanța asta</small><div class="stp"><b id="ck1"></b></div></div>
      ${stepperHTML('v','Grupa: sus (+) sau jos (−)',o.v,cmS)}${stepperHTML('x','Grupa: dreapta (+) sau stânga (−)',o.x,cmS)}</div>
    <div class="stage mt ckw" id="ckr"></div>
    <div class="note i mt">${ic('info')}<div>Pe turelă, săgeata arată unde se <b>mută impactul</b>: rotești spre „UP” ca grupa să urce, spre „R” ca să meargă la dreapta. <b>La cătarea frontală de AR e invers:</b> ca să urci impactul, cobori cătarea.</div></div>
    <p class="mu mt">Măsori de la punctul ochit până în <b>centrul grupei</b> (3–5 focuri), nu până la un foc rătăcit. După orice corecție confirmi cu o grupă nouă — vezi lecția „Zeroirea, pas cu pas”.</p>`;
    bindSeg(h,'cku',k=>{o.u=k;o.c=+UN[k][0][0];keep();draw()});
    bindSeg(h,'ckc',k=>{o.c=+k;keep();res()});
    bindSteppers(h,o,spec,()=>{keep();res()});
    res();
  };
  const res=()=>{
    const per=(o.u==='moa'?2.9089:10)*o.d/100*o.c,ev=Math.round(Math.abs(o.v)/per),wv=Math.round(Math.abs(o.x)/per);
    $('#ck1',h).textContent=cmF(per)+' cm';

tool('zero',{t:'Calculator de traiectorie',d:'Unde lovești la fiecare distanță, după zero și ochitor',ic:'target',g:'tr',run(h){

  const draw=()=>{
    h.innerHTML=`<label class="f" for="za">Muniția</label><select id="za">${AMMO.map(a=>`<option value="${a[0]}" ${o.a===a[0]?'selected':''}>${esc(a[1])}</option>`).join('')}<option value="x" ${o.a==='x'?'selected':''}>Altă muniție (viteza și coeficientul de mai jos)</option></select>

    bindSeg(h,'zz',k=>{o.z=+k;keep();res()});

  const res=()=>{
    const r=balTraj(o.v,o.bc,o.sh/100,o.z,400),cm=x=>r[x][1]*100,cr=balCross(r);

    let a0=-1,a1=-1;for(let x=0;x<=400;x++){const y=cm(x);if(Math.abs(y)<=5){if(a0<0)a0=x;a1=x}else if(a0>=0&&y<-5)break}

    const st=[5,10,20,50,100].find(s=>(hi-lo)/s<=6)||100,yt=[];for(let y=Math.ceil(lo/st)*st;y<=hi;y+=st)yt.push(y);
    const path=r.filter((_,k)=>k%4===0).map((q,k)=>(k?'L':'M')+px(q[0]).toFixed(1)+' '+py(q[1]*100).toFixed(1)).join('');
    const D=[25,50,100,150,200,250,300,350,400];
    const hold=(x,u)=>{const v=-cm(x)/((u==='moa'?2.9089:10)*x/100);return Math.abs(v)<.05?'0':(v>0?'↑ ':'↓ ')+(Math.round(Math.abs(v)*10)/10).toString().replace('.',',')};
    $('#zres',h).innerHTML=`<div class="card mt zch"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Traiectoria față de linia de ochire">

      ${yt.map(y=>`<line x1="${x0}" x2="${x1}" y1="${py(y).toFixed(1)}" y2="${py(y).toFixed(1)}" stroke="rgba(255,255,255,${y===0?0:.06})"/><text x="${x0-6}" y="${(py(y)+3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="#6b747c">${y>0?'+':''}${y}</text>`).join('')}
      ${[0,100,200,300,400].map(x=>`<text x="${px(x).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="10" fill="#6b747c">${x} m</text>`).join('')}
      <text x="${x0-6}" y="10" text-anchor="end" font-size="9" fill="#6b747c">cm</text>
      <line x1="${x0}" x2="${x1}" y1="${py(0).toFixed(1)}" y2="${py(0).toFixed(1)}" stroke="#5be38e" stroke-width="1.2" stroke-dasharray="5 4"/>
      <path d="${path}" fill="none" stroke="#f2b84b" stroke-width="2" clip-path="url(#zcp)"/>
      ${cr.map(x=>`<circle cx="${px(x).toFixed(1)}" cy="${py(0).toFixed(1)}" r="4" fill="#0b0c0e" stroke="#5be38e" stroke-width="1.6"/>`).join('')}
      </svg><div class="row w zlg"><span><i style="background:#5be38e"></i>linia de ochire</span><span><i style="background:#f2b84b"></i>glonțul</span></div></div>
      <div class="grid2 mt"><div class="stat"><b>${cr.length?cr.map(x=>Math.round(x)).join(' și '):'—'} m</b><small class="mu">unde taie linia de ochire</small></div>
        <div class="stat"><b>${top>.05?'+'+cmF(top)+' cm':'0 cm'}</b><small class="mu">${top>.05?'cel mai sus, la '+topX+' m':'nu urcă peste linie'}</small></div></div>
      ${a0>=0?`<div class="note i mt">${ic('info')}<div>Între <b>${a0} și ${a1} m</b> glonțul e la cel mult 5 cm de punctul ochit: pe o țintă de 10 cm ochești direct, fără corecții.</div></div>`:''}
      <div class="card mt p0"><table class="ztab"><thead><tr><th>Distanța</th><th>Față de linie</th><th>Ții (MOA)</th><th>Ții (mil)</th></tr></thead><tbody>
      ${D.map(x=>`<tr class="${x===o.z?'on':''}"><td>${x} m</td><td>${cmS(cm(x))}</td><td>${hold(x,'moa')}</td><td>${hold(x,'mil')}</td></tr>`).join('')}</tbody></table></div>
      <p class="mu mt"><b>„Ții”</b> = cât ochești mai sus (↑) sau mai jos (↓) ca să lovești punctul dorit — sau câte unități corectezi pe turelă. Viteza la 300 m: ~${Math.round(r[300][2])} m/s.</p>`;
  };
  draw();
}});
