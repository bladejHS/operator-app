/* 160-caiet.js */
/* CAIET — jurnal, obicei, obiective, reguli, setări */
const LOGT=['Dry fire','Foc real (poligon)','Meditație','Vizualizare','Ochi / focalizare','Respirație','Priză','Condiție fizică','Atenție','Prim ajutor','Lectură / video','Provocare','Test','Altceva'];
function logSheet(pre){
  pre=pre||{};
  sheet('Notează antrenamentul',`
    <label class="f">Ce ai făcut</label><select id="lt">${LOGT.map(t=>`<option ${pre.type===t?'selected':''}>${t}</option>`).join('')}</select>
    <div class="grid2"><div><label class="f">Data</label><input type="date" id="ld" value="${pre.d||ymd()}" max="${ymd()}"></div><div><label class="f">Minute</label><input type="number" id="lm" min="0" max="600" value="${pre.min||15}"></div></div>
    <label class="f">Ce a mers bine</label><textarea id="lg" placeholder="ex. priza a rămas la fel la fiecare repetare"></textarea>
    <label class="f">Ce n-a mers</label><textarea id="lb" placeholder="ex. am pierdut focalizarea în ultima clipă"></textarea>
    <label class="f">Ce lucrez data viitoare</label><textarea id="ln" placeholder="ex. 30 de secunde pe semnul cătării înainte de fiecare apăsare"></textarea>
    <button class="btn blk mt" id="ls">${ic('check','s')} Salvează</button>`,el=>{
    $('#ls',el).onclick=()=>{const d=$('#ld',el).value||ymd();const e=logSession($('#lt',el).value,+$('#lm',el).value||0,'',{d,good:$('#lg',el).value.trim(),bad:$('#lb',el).value.trim(),next:$('#ln',el).value.trim()});
      S.log.sort((a,b)=>b.d.localeCompare(a.d));save('log');markDay(d);closeSheet();toast('Salvat în Caiet ✓');render()};
  });
}
const RULES=[
  ['1 · Mentalitatea',['Am scris de ce mă antrenez','Meditez 5 minute pe zi','Am ajuns la 15–20 de minute de meditație','Vizualizez înainte sau după meditație','Îmi formulez gândurile pozitiv („eu sunt…”)']],
  ['2 · Planificarea',['Țin un caiet de antrenament','Am scris problema-cheie de acum','Planific fiecare sesiune în scris (modelul GPS)','Am cel puțin un obiectiv MUST']],
  ['3 · Fizica',['Mi-am verificat punctul natural de ochire','Lucrez forța prizei de 3 ori pe săptămână','Înțeleg eroarea unghiulară și cea paralelă']],
  ['4 · Focalizarea',['Am un semn mic pe cătare (sau pe arma de antrenament)','Fac sfoara de focalizare de 3 ori pe săptămână','Am făcut testul ochiului dominant','Focalizez 30 de secunde pe cătare la fiecare sesiune']],
  ['5 · Fără muniție',['Fac dry training de cel puțin 3 ori pe săptămână','Respect lista de siguranță de fiecare dată','Am terminat provocarea de 30 de zile','Am ajuns la 66 de zile de antrenament']],
  ['6 · Practica deliberată',['Lucrez pe slăbiciuni, în bucăți mici','Mă antrenez până la un standard, nu după ceas','Adaug stresul treptat, după ce mișcarea e perfectă']],
  ['7 · Feedback',['Mă filmez și mă uit cu încetinitorul','Când greșesc, mă întorc un pas și refac','Închei fiecare sesiune cu o repetare perfectă']],
];
route(/^caiet(?:\/(\w+))?$/,(tab='jurnal')=>{
  const tabs=[['jurnal','Jurnal'],['obicei','Obicei'],['obiective','Obiective'],['reguli','Reguli'],['setari','Setări']];
  const seg=`<div class="seg">${tabs.map(t=>`<button data-go="#/caiet/${t[0]}" class="${tab===t[0]?'on':''}">${t[1]}</button>`).join('')}</div>`;
  let body='';
  if(tab==='jurnal'){
    const wk=S.log.filter(e=>dayDiff(e.d,ymd())<7),mins=S.log.reduce((s,e)=>s+(+e.min||0),0);
    body=`<div class="card mt"><label class="f" style="margin-top:0">De ce mă antrenez</label><textarea id="why" placeholder="Scrie cu emoție: pentru cine, pentru ce. Îl citești în fiecare dimineață.">${esc(S.why)}</textarea>
      <label class="f">Problema-cheie de acum</label><input type="text" id="key" placeholder="ex. focalizarea pe cătare" value="${esc(S.key)}"></div>
    <div class="grid3 mt"><div class="stat"><b>${S.log.length}</b><small class="mu">sesiuni</small></div><div class="stat"><b>${Math.round(mins/60*10)/10}</b><small class="mu">ore în total</small></div><div class="stat"><b>${wk.length}</b><small class="mu">în ultimele 7 zile</small></div></div>
    <button class="btn blk mt" data-add>${ic('plus','s')} Notează un antrenament</button>
    <div class="sec"><h2>Intrările tale</h2></div>
    ${S.log.length?`<div class="lst" style="display:block">${S.log.slice(0,80).map(e=>`<div class="ent" style="display:block"><div class="h"><b>${esc(e.type)}</b><span class="pill">${dataRo(e.d)}</span>${e.min?`<span class="pill">${e.min} min</span>`:''}<span class="sp"></span><button class="x" data-del="${e.id}" aria-label="Șterge">${ic('trash','s')}</button></div>
      ${e.note?`<p>${esc(e.note)}</p>`:''}${e.good?`<p><span>Bine:</span> ${esc(e.good)}</p>`:''}${e.bad?`<p><span>De lucrat:</span> ${esc(e.bad)}</p>`:''}${e.next?`<p><span>Data viitoare:</span> ${esc(e.next)}</p>`:''}</div>`).join('')}</div>`
      :`<div class="empty card">Încă nimic. Uneltele (meditația, respirația, cronometrul) notează singure sesiunile; restul le notezi aici.</div>`}`;
  }else if(tab==='obicei'){
    const hs=habitStats();let cells='';for(let k=0;k<66;k++)cells+=`<i class="${k<hs.n?'y':''}"></i>`;
    const start=new Date();start.setDate(start.getDate()-7*12+1);let cal='';for(let k=0;k<84;k++){const d=new Date(start);d.setDate(start.getDate()+k);const s=ymd(d);cal+=`<i class="${S.habit[s]?'y':''} ${s===ymd()?'t':''}" title="${dataRo(d)}"></i>`}
    body=`<div class="card mt ctr"><div class="big">${hs.n}<span class="mu" style="font-size:1.1rem"> / 66</span></div><p class="mu" style="margin:8px 0 0">zile de antrenament. În medie, un obicei se formează în 66 de zile.</p>
      <div class="hab mt">${cells}</div></div>
    <div class="grid3 mt"><div class="stat"><b>${hs.cur}</b><small class="mu">zile la rând acum</small></div><div class="stat"><b>${hs.best}</b><small class="mu">cel mai lung șir</small></div><div class="stat"><b>${hs.today?'✓':'—'}</b><small class="mu">azi</small></div></div>
    <div class="sec"><h2>Ultimele 12 săptămâni</h2></div><div class="card"><div class="hab" style="grid-template-columns:repeat(12,1fr);grid-auto-flow:column;grid-template-rows:repeat(7,1fr)">${cal}</div></div>
    <div class="row w mt"><button class="btn ${hs.today?'g':''}" data-today>${ic('check','s')} ${hs.today?'Azi e bifat':'Bifează ziua de azi'}</button></div>
    <p class="mu mt" style="font-size:.88rem">Orice sesiune salvată (din unelte sau din jurnal) bifează ziua. O zi ratată nu strică nimic — continui.</p>`;
  }else if(tab==='obiective'){
    body=`<div class="note i mt">${ic('info')}<div>Obiective <b>MUST</b>: cu sens (Meaningful), pe înțelesul unui copil (Understandable), mici și concrete (Specific), cu loc și oră (Timed). Obiective de proces, nu de rezultat.</div></div>
    <div class="card mt"><label class="f" style="margin-top:0">Ce fac (mic și concret)</label><input type="text" id="g1" placeholder="ex. 15 minute de dry fire pe priză">
      <label class="f">Când și unde</label><input type="text" id="g2" placeholder="ex. luni, miercuri, vineri, la 7:00, în dormitor">
      <label class="f">De ce contează pentru mine</label><input type="text" id="g3" placeholder="ex. vreau o priză la fel de fiecare dată">
      <button class="btn blk mt" data-addg>${ic('plus','s')} Adaugă obiectivul</button></div>
    <div class="sec"><h2>Obiectivele tale</h2></div>
    ${S.goals.length?`<div class="lst">${S.goals.map((g,k)=>`<div><button data-gt="${k}" style="display:flex">${okMark(g.done)}</button><span class="ti"><b style="${g.done?'text-decoration:line-through;color:var(--mu)':''}">${esc(g.w)}</b><small class="mu">${esc(g.t||'')}${g.m?' · '+esc(g.m):''}</small></span><button class="x" data-gd="${k}" aria-label="Șterge">${ic('trash','s')}</button></div>`).join('')}</div>`:`<div class="empty card">Niciun obiectiv încă.</div>`}`;
  }else if(tab==='reguli'){
    const tot=RULES.reduce((s,r)=>s+r[1].length,0),dn=Object.values(S.check).filter(Boolean).length;
    body=`<div class="card mt"><b>${dn} din ${tot} bifate</b><div class="prog mt"><i style="width:${(dn/tot*100).toFixed(1)}%"></i></div><small class="mu">Lista celor 7 Reguli Noi, transformată în obiceiuri. Bifezi ce faci deja constant.</small></div>
    ${RULES.map((r,ri)=>`<div class="sec"><h2>${r[0]}</h2></div><div class="lst">${r[1].map((t,ti)=>{const k=ri+'.'+ti;return `<label class="chk ${S.check[k]?'y':''}"><input type="checkbox" data-ck="${k}" ${S.check[k]?'checked':''}><span>${esc(t)}</span></label>`}).join('')}</div>`).join('')}`;
  }else{
    body=`<div class="sec"><h2>Sunet și voce</h2></div><div class="lst">
      <label class="chk"><input type="checkbox" data-set="sound" ${S.set.sound?'checked':''}><span><b>Sunete</b><br><small class="mu">semnalele cronometrelor, clopoțelul meditației</small></span></label>
      <label class="chk"><input type="checkbox" data-set="voice" ${S.set.voice?'checked':''}><span><b>Vocea în română</b><br><small class="mu">${hasVoice()?'vocea română e disponibilă pe acest dispozitiv':'dispozitivul nu are o voce română instalată — uneltele folosesc doar sunete și text'}</small></span></label></div>
      <div class="row w mt"><button class="btn g sm" data-tv>${ic('vol','s')} Testează sunetul și vocea</button></div>
    <div class="sec"><h2>Copie de siguranță</h2></div>
      <div class="card"><p class="mu" style="margin-top:0">Totul (jurnal, lecții, obiective, bife) e salvat pe acest dispozitiv. Fă din când în când o copie, mai ales înainte să schimbi telefonul.</p>
      <div class="row w"><button class="btn g" data-ex>${ic('down','s')} Salvează copia</button><label class="btn g" style="cursor:pointer">${ic('up','s')} Încarcă o copie<input type="file" accept=".json,application/json" id="imp" hidden></label></div></div>
    <div class="sec"><h2>Despre</h2></div><div class="card"><p style="margin-top:0">Operator — lecții, unelte și toate videoclipurile lui Chris Sajnog, explicate în română. Aplicație personală, neoficială: rezumatele și explicațiile sunt scrise cu cuvintele noastre, după materialele lui publice; videoclipurile rulează de pe YouTube.</p>
      <p class="mu" style="margin:0;font-size:.86rem">Nu înlocuiește un instructor autorizat, un curs de prim ajutor sau sfatul unui medic.</p></div>
    <div class="mt2"><button class="btn r sm" data-reset>${ic('trash','s')} Șterge toate datele</button></div>`;
  }
  return {title:'Caiet',html:`<h1>Caiet</h1><div class="mt">${seg}</div>${body}`,mount(r){
    const w=$('#why',r);if(w){let t;w.oninput=()=>{clearTimeout(t);t=setTimeout(()=>{S.why=w.value.trim();save('why')},400)};const k=$('#key',r);k.oninput=()=>{clearTimeout(t);t=setTimeout(()=>{S.key=k.value.trim();save('key')},400)}}
    const a=$('[data-add]',r);if(a)a.onclick=()=>logSheet();
    $$('[data-del]',r).forEach(b=>b.onclick=async()=>{if(await confirmBox('Ștergi intrarea?','Nu se poate anula.','Șterge',true)){S.log=S.log.filter(e=>e.id!==b.dataset.del);save('log');render()}});
    const td=$('[data-today]',r);if(td)td.onclick=()=>{if(S.habit[ymd()]){delete S.habit[ymd()];save('habit')}else markDay();render()};
    const ag=$('[data-addg]',r);if(ag)ag.onclick=()=>{const w1=$('#g1',r).value.trim();if(!w1){toast('Scrie ce faci');return}S.goals.unshift({w:w1,t:$('#g2',r).value.trim(),m:$('#g3',r).value.trim(),done:false,d:ymd()});save('goals');render()};
    $$('[data-gt]',r).forEach(b=>b.onclick=()=>{const g=S.goals[+b.dataset.gt];g.done=!g.done;save('goals');render()});
    $$('[data-gd]',r).forEach(b=>b.onclick=async()=>{if(await confirmBox('Ștergi obiectivul?','','Șterge',true)){S.goals.splice(+b.dataset.gd,1);save('goals');render()}});
    $$('[data-ck]',r).forEach(c=>c.onchange=()=>{S.check[c.dataset.ck]=c.checked;save('check');c.closest('.chk').classList.toggle('y',c.checked)});
    $$('[data-set]',r).forEach(c=>c.onchange=()=>{S.set[c.dataset.set]=c.checked;save('set')});
    const tv=$('[data-tv]',r);if(tv)tv.onclick=()=>{beep(880,.15,.4);setTimeout(()=>bell(.3),300);setTimeout(()=>say('Bună. Așa sună vocea aplicației.'),600);if(!hasVoice())toast('Nu există o voce română pe acest dispozitiv')};
    const ex=$('[data-ex]',r);if(ex)ex.onclick=()=>{const data={app:'operator',v:1,date:ymd()};KEYS.forEach(k=>data[k]=S[k]);const b=new Blob([JSON.stringify(data,null,1)],{type:'application/json'});const u=URL.createObjectURL(b);const l=document.createElement('a');l.href=u;l.download='operator-copie-'+ymd()+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('Copia s-a salvat în Descărcări')};
    const im=$('#imp',r);if(im)im.onchange=async()=>{const f=im.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(d.app!=='operator')throw 0;if(!await confirmBox('Încarci copia?','Datele de acum se înlocuiesc cu cele din copie.','Încarcă'))return;KEYS.forEach(k=>{if(k in d){S[k]=d[k];save(k)}});toast('Copia a fost încărcată');render()}catch(e){toast('Fișierul nu e o copie Operator')}};
    const rs=$('[data-reset]',r);if(rs)rs.onclick=async()=>{if(await confirmBox('Ștergi tot?','Jurnalul, lecțiile bifate, obiectivele și setările se șterg de pe acest dispozitiv. Fă întâi o copie dacă vrei să le păstrezi.','Șterge tot',true)){KEYS.forEach(k=>{S[k]=structuredClone(DEF[k]);save(k)});toast('Datele au fost șterse');location.hash='#/azi'}};
  }};
});
