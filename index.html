 vechi se propagă (glezne, șolduri, gât).","Mișcările laterale lipsesc din multe programe de antrenament.","Recuperarea urmărește simetria și funcția."],"k":[[30,"Evaluarea dezechilibrului"],[90,"Exercițiul"]]},{"i":"5AIGu4DaetM","t":"Testul de atenție situațională pe care cei mai mulți îl pică: 10 moduri să ți-o îmbunătățești","o":"Most People Fail This Exclusive Situational Awareness Test","c":"tac","d":1013,"v":155000,"n":83,"s":"Zece metode: bucla SEAL (vezi/simți, evaluezi, acționezi, înveți), poziționarea (spatele la perete, vezi intrarea), toate simțurile (stai cu ochii închiși și îți imaginezi ce auzi), mereu două ieșiri, capul sus (nu în telefon), meditația, jocuri de observație, observarea oamenilor, estimarea distanțelor și a timpului, grija de corp (fără alcool în exces, somn, mișcare).","p":["Jocul: un prieten te întreabă câți oameni ați trecut și ce purtau — te antrenează rapid.","Ieșirile: când intri undeva, cauți două căi de ieșire și le actualizezi pe măsură ce te miști.","Mai puțin de 6 ore de somn mai multe nopți la rând îți încetinesc reacțiile cam ca alcoolul."],"k":[[60,"1 · Bucla SEAL"],[155,"2 · Poziționarea"],[200,"3 · Toate simțurile"],[275,"4 · Două ieșiri"],[365,"5 · Capul sus"],[455,"6 · Meditația"],[520,"7 · Jocuri de observație"],[645,"8 · Observarea oamenilor"],[745,"9 · Distanțe și timp"],[870,"10 · Grija de corp"]]},{"i":"et7e54XPtg8","t":"Două cuvinte care îți pot îmbunătăți fiecare parte a vieții","o":"Two Words That Can Make Every Part of Your Life Better","c":"min","d":121,"v":9800,"n":84,"s":"Mulți trăiesc în „lipsă”: nu dorm destul, nu fac destul, mâine va fi altfel. Suntem poveștile pe care ni le spunem. Schimbi povestea cu două cuvinte: „Eu sunt…” urmat de ce vrei să fii („sunt plin de energie”), apoi pleci la treabă.","p":["Ce îți spui zilnic devine identitatea ta.","„Nu am timp” e o poveste — ai timp pentru ce contează.","Decide dimineața ce vei realiza în ziua aceea."],"k":[[0,"Viața în lipsă"],[60,"„Eu sunt…”"]]},{"i":"3rM7zOawl-A","t":"Sfat rapid: respirația pentru o tragere mai precisă","o":"Quick Tip: Breathing Techniques For More Accurate Shooting","c":"tr","d":164,"v":50000,"n":85,"s":"Ținerea respirației (focul în pauza naturală dintre expirație și inspirație) e pentru tirurile lungi de lunetist. În rest, respiri natural — dar corect: pe nas și cu burta, nu ridicând umerii și pieptul, care îți mișcă platforma de tragere.","p":["Respirația din piept ridică umerii și mișcă arma.","Respirația cu burta: mai mult oxigen și platforma rămâne stabilă.","Tirul lung: focul în pauza naturală a respirației."],"k":[[0,"Când ții respirația"],[60,"Respirația cu burta"]]},{"i":"UNRQXRL-1FI","t":"Alinierea elementelor de ochire vs controlul trăgaciului: care contează pentru lovitură?","o":"Sight Alignment vs Trigger Control: Which One is Required to Hit Where You Aim?","c":"tr","d":386,"v":74000,"n":86,"s":"Exagerare demonstrativă: cu elementele de ochire nealiniate, chiar și apăsarea perfectă ratează; cu arma prinsă într-o menghină și alinierea perfectă, poți apăsa oricum și lovești. Controlul trăgaciului există doar ca să nu strice alinierea — deci alinierea e ce contează. Metoda lui: „tragi cu ochii”.","p":["Trăgaciul, priza și tot restul servesc alinierii.","„Tragi cu ochii”: degetul se mișcă doar cât ochii văd alinierea corectă; dacă se strică, degetul așteaptă.","Testează în poligon, spre o direcție sigură."],"k":[[60,"Demonstrația exagerată"],[180,"Argumentul „să nu strici alinierea”"],[245,"Tragi cu ochii"]]},{"i":"v_qDQlWN3u0","t":"Puterea prezenței: înveți orice mai ușor","o":"The Power of Presence: Learn Anything Easier","c":"min","d":178,"v":8600,"n":87,"s":"Când exersezi, mulți se gândesc la ce a fost sau la ce va fi, nu la clipa de acum — singura în care poți controla rezultatul (contactul crosei cu mingea, plecarea focului). Prezența se antrenează prin meditație: ochii închiși, atenția pe respirație.","p":["Fără prezență în clipa execuției, n-ai control asupra rezultatului.","Mintea conștientă se ocupă de un lucru odată; subconștientul urmărește sute.","Dacă „meditație” te încurcă, numește-o „antrenament pentru creier”."],"k":[[0,"Trecut, viitor, prezent"],[60,"Meditația"]]},{"i":"cd6WeFuKJhM","t":"Sfat rapid: strică dry fire-ul arma?","o":"Quick Tip: Is Dry Fire Bad for Your Firearm?","c":"dry","d":172,"v":42000,"n":88,"s":"Pentru majoritatea pistoalelor moderne cu percuție centrală, dry fire-ul nu strică arma (unele arme vechi sau cu percuție laterală sunt excepții — vezi manualul). Pentru el, „dry training” înseamnă tot ce te face mai bun: meditație, vedere, priză, vizualizare, plan, scos, incidente.","p":["Verifică manualul armei tale (sau folosește capse de exercițiu).","Focul real solicită mai mult arma decât dry fire-ul.","Antrenamentul fără muniție e mult mai larg decât apăsatul pe trăgaci."],"k":[[0,"Mitul"],[30,"Ce înseamnă dry training"]]},{"i":"Ft0beU-CuFQ","t":"ABC-ul supraviețuirii unei confruntări violente","o":"ABCs of Surviving Violent Encounters - Learn Personal Protection From a Navy SEAL","c":"tac","d":396,"v":12000,"n":89,"s":"Cel mai bine e să previi confruntarea. A — atenția (meditația și alergarea pe trasee o antrenează), B — construiește-ți apărarea (fizic: alarmă, lumini, corp puternic; spațial: distanța de siguranță; mental: încredere și vorbire pozitivă), C — calmează amenințarea (cea mai bună luptă e cea care nu are loc).","p":["Prevenția vine înaintea oricărei tehnici de luptă.","Spațiul personal și „bula” de protecție din jurul tău.","Dezamorsarea situației e prima opțiune."],"k":[[60,"A · Atenția"],[195,"B · Apărarea"],[290,"C · Calmarea"]]},{"i":"CZCwNL_azzk","t":"„Nu sunt un trăgător, sunt un antrenor”","o":"Hi, I'm Chris Sajnog. Call me a Coach, an Instructor or a Guru...I'm Not a Shooter","c":"inv","d":119,"v":6300,"n":90,"s":"Răspuns celor care cer să-l vadă trăgând: meseria lui acum e să-i învețe pe alții, nu să tragă. Un bun profesor își dorește ca elevii să-l întreacă. Să te uiți la trăgători buni e distractiv, dar nu te face mai bun — te face un profesor bun.","p":["Abilitatea de a preda e diferită de abilitatea de a executa.","Caută un profesor bun, nu doar un campion.","Scopul unui antrenor: elevi mai buni decât el."],"k":[[0,"Antrenor, nu trăgător"]]},{"i":"Xmsn7QfBsRQ","t":"Sfat rapid: cum îți îmbunătățești atenția situațională","o":"Quick Tip: How to Improve Your Situational Awareness","c":"tac","d":156,"v":10000,"n":91,"s":"Atenția situațională înseamnă în mare parte vedere periferică. O antrenezi ridicând ochii din telefon, ieșind afară și, când mergi, privind drept înainte și observând tot ce intră în câmpul vizual lateral, fără să muți privirea.","p":["Telefonul și banda de alergare îți „închid” câmpul vizual.","Exercițiu: privești fix înainte și enumeri ce vezi lateral.","Cu timpul începi să „simți” și ce e în spatele tău."],"k":[[0,"Vederea periferică"],[60,"Exercițiul"]]},{"i":"3shEB1q3T9s","t":"3 cuvinte cu F pentru protecția personală","o":"3 F-Words from a Navy SEAL for Your Personal Protection","c":"tac","d":357,"v":12000,"n":92,"s":"Flow (curgi prin situație — a patra reacție, după luptă, fugă și îngheț, câștigată prin antrenament), Fight (dacă lupta e ultima opțiune și ai decis, dai totul, fără avertisment) și Follow up (după orice situație, chiar dacă n-a fost nimic, analizezi și înveți).","p":["Îngheți când n-ai exersat niciodată situația.","Lupta e ultima opțiune, după ce ai încercat s-o eviți.","Fiecare experiență e o lecție pentru data viitoare."],"k":[[60,"1 · Flow"],[155,"2 · Fight"],[230,"3 · Follow up"]]},{"i":"WTS48sz5X1I","t":"De ce e atât de greu cu motivația","o":"Why Motivation is So Hard","c":"min","d":124,"v":4000,"n":93,"s":"Nu te mai învinovăți că nu ești mereu motivat: corpul e programat să economisească energie (legea efortului minim). Ca în prima lege a lui Newton, un corp în repaus rămâne în repaus până acționează o forță — iar forța trebuie să fii tu. Odată pornit, inerția lucrează pentru tine.","p":["Lipsa de motivație e normală, nu un defect.","Pornește tu „trenul” — e partea cea mai grea.","Nu aștepta ca un eveniment rău să te motiveze."],"k":[[0,"Legea efortului minim"],[60,"Pornește trenul"]]},{"i":"N3i0bOo4AO0","t":"Sfat rapid: unde să-ți pui tocul","o":"Quick Tip: Where to Put Your Holster","c":"ech","d":194,"v":22000,"n":94,"s":"Întâi alegi felul purtării (în talie, pe exterior etc.), apoi iei priza corectă de tragere și „inginerie inversă”: duci mâna, cu priza perfectă, acolo unde ajunge natural — acolo pui tocul. Înclinarea tocului o stabilești tot așa, pentru corpul și arma ta.","p":["Priza pe care o iei din toc e cea cu care tragi — nu ai timp s-o corectezi.","Tocul se pune unde merge mâna, nu invers.","Fiecare corp e diferit; testezi cu arma descărcată."],"k":[[30,"Priza întâi"],[60,"Unde ajunge mâna"]]},{"i":"GiL2SUiVg1o","t":"Cum renunți la obiceiurile proaste și le întărești pe cele bune","o":"How to Stop Bad Habits and Reinforce Good Habits to Change Your Life","c":"inv","d":184,"v":5700,"n":95,"s":"Obiceiurile proaste dau plăcere imediată și pagubă târzie; cele bune cer efort acum și răsplătesc mai târziu. Trei pași: un plan (inclusiv pentru momentele grele), un mediu care te ajută (hainele de sport la piciorul patului, scrumierele aruncate) și recompense pentru reușite.","p":["Planifică dinainte ce faci când nu ai chef.","Schimbă mediul ca obiceiul bun să fie mai ușor decât cel rău.","Răsplătește-te după o săptămână reușită."],"k":[[0,"De ce e greu"],[90,"1 · Planul"],[120,"2 · Mediul"],[150,"3 · Recompensa"]]},{"i":"6kK-2Y95RZ4","t":"De ce trag prost când accelerez? (5 motive)","o":"Why Do I Shoot Bad When I Speed Up? [Chris Sajnog's 5 in Under 5 FAQ]","c":"tr","d":266,"v":7300,"n":96,"s":"Cinci cauze când grupele se lărgesc la viteză: nu ai fundația mecanică (platformă, structură, priză puternică), nu crezi că poți, punctul natural de ochire e greșit (arma revine mereu spre el, mai ales la carabină → focuri jos-stânga la dreptaci), îți schimbi mecanica când grăbești și forțezi viteza în loc s-o lași să vină.","p":["Ce faci încet trebuie să fie exact ce faci repede.","Verifică NPA: șoldurile spre țintă.","Viteza e un efect al practicii perfecte, nu un obiectiv."],"k":[[30,"1 · Fundația mecanică"],[62,"2 · Credința"],[95,"3 · Punctul natural de ochire"],[160,"4 · Mecanica schimbată"],[185,"5 · Nu forța viteza"]]},{"i":"LonXcQTeBEI","t":"Mărturia unui membru despre programul lui","o":"Review of Chris Sajnog's VIP Membership","c":"inv","d":230,"v":2300,"n":97,"s":"Un elev povestește că programul l-a făcut un trăgător mult mai bun fără multe ore în poligon și l-a ajutat și în viață: respirație, meditație, jurnal, consecvență și autoevaluare cinstită.","p":["Se poate progresa mult acasă.","Jurnalul și consecvența fac diferența.","Video promoțional."],"k":[[0,"Mărturia"]]},{"i":"peEXQ0UhgkQ","t":"Aplicația lui gratuită SEAL Training","o":"Chris Sajnog's Free SEAL Training App - Like Having a Navy SEAL on Speed Dial","c":"inv","d":413,"v":5800,"n":98,"s":"Prezintă aplicația lui de obiceiuri: notezi ce abilități ai lucrat (ochi, priză, vizualizare, plan), ce ai făcut pentru tine (meditație, mișcare, frig, alimentație, natură) și pentru echipă (familie, ajutor), plus o provocare de 30 de zile de dry fire.","p":["Obiceiul de a te antrena e la fel de important ca tehnica.","Bifează imediat după ce faci un lucru.","Ideea a inspirat și jurnalul din această aplicație."],"k":[[30,"Ce poți nota"],[300,"Provocarea de 30 de zile"]]},{"i":"vMv-wvFQkpc","t":"Mărturia lui Jacob, veteran al armatei SUA","o":"US Army Vet Jacob on Chris Sajnog's Training","c":"inv","d":383,"v":4600,"n":99,"s":"Un veteran povestește că a început cu videoclipul despre tragerea cu ambii ochi deschiși și focalizarea pe cătare, a progresat mult și spune că mentalitatea de războinic l-a ajutat să-și gestioneze stresul posttraumatic și să fie un tată și soț mai bun.","p":["Focalizarea pe cătare a fost declicul lui.","Antrenamentul l-a ajutat și emoțional.","Video promoțional."],"k":[[30,"Tragerea cu ambii ochi"],[180,"Cum l-a schimbat"]]},{"i":"de4HCkDxWpo","t":"Ce unelte pot folosi ca să trag mai bine? (5 unelte)","o":"What Tools Can I Use to Improve My Shooting  [Chris Sajnog's 5 in Under 5 FAQ]","c":"dry","d":269,"v":14000,"n":100,"s":"Nu înveți să tragi doar trăgând. Cinci unelte: arme albastre (copii din plastic, sigure, pentru toată mânuirea), airsoft (aceeași greutate și funcționare, poți trage și în 360°), sisteme laser (cartușe, arme, ținte), sfoara de focalizare (vederea) și unelte de priză (greutăți ținute în mână, Captains of Crush, gyroball).","p":["Mare parte din antrenament se poate face fără muniție.","Vederea e esențială în orice sport.","Priza puternică ajută enorm la pistol."],"k":[[60,"1 · Arme albastre"],[95,"2 · Airsoft"],[125,"3 · Laser"],[150,"4 · Sfoara de focalizare"],[185,"5 · Priza"]]},{"i":"cZHuMwJxu0g","t":"Vei fi doar atât de bun cât crezi că poți fi","o":"You'll Only Ever Be As Good As You Believe You Can Be","c":"min","d":67,"v":4200,"n":101,"s":"Convingerile se formează în copilărie sau la prima încercare, când nu știai și nu exersaseși. Sunt doar în mintea ta și le poți schimba pe loc, schimbând cuvintele pe care ți le spui.","p":["Ce a fost adevărat ieri nu trebuie să fie adevărat mâine.","Mintea te lasă să faci doar ce crezi că poți.","Schimbă povestea, îți schimbi viața."],"k":[[0,"De unde vin convingerile"]]},{"i":"5qwFMsPvNYs","t":"Cele mai mari greșeli de tragere (5 erori)","o":"What Are The Biggest Shooting Errors? [Chris Sajnog's 5 in Under 5 FAQ]","c":"tr","d":303,"v":30000,"n":102,"s":"Cinci erori frecvente: împingi sau tragi lateral trăgaciul (degetul prea puțin/prea mult pe trăgaci — iei priza bună și lași degetul unde cade), „mulgi” priza (strângi toată mâna la apăsare), anticipezi sau tresari (rezolvare: o lună de dry fire), te uiți peste elemente ca să vezi impactul și nu focalizezi cu adevărat pe cătare.","p":["Priza bună rezolvă multe probleme de trăgaci.","Tresărirea se vindecă prin dry fire, nu prin mai mult foc real.","Păstrezi focalizarea și după foc: cătarea urcă și revine."],"k":[[30,"1 · Împins / tras"],[95,"2 · „Mulsul”"],[126,"3 · Anticipare / tresărire"],[185,"4 · Privitul peste elemente"],[215,"5 · Focalizarea"]]},{"i":"Ek8FRGiXA9Y","t":"E o armă de foc potrivită pentru mine? (5 întrebări)","o":"Is a Firearm Even Right for Me?  [Chris Sajnog's 5 in Under 5 FAQ]","c":"tac","d":259,"v":4800,"n":103,"s":"Arma de foc nu e pentru oricine. Cinci întrebări înainte: ai alte opțiuni (spray, alte mijloace legale)? ești stabil psihic? unde locuiești (legea locului, tipul locuinței)? cu cine locuiești (copii, persoane care n-ar trebui să aibă acces)? ai timp să te antrenezi sigur și eficient?","p":["Respectă legea țării tale — în România: permis, examen, armă înregistrată.","Arma se ține încuiată, departe de copii.","Fără timp de antrenament, nu cumperi armă."],"k":[[30,"1 · Alte opțiuni"],[60,"2 · Stabilitatea psihică"],[95,"3 · Unde locuiești"],[125,"4 · Cu cine locuiești"],[155,"5 · Timpul de antrenament"]]},{"i":"34PvsU4rf_E","t":"Sfat rapid: oul verde pentru mâini","o":"Using the Green Egg Hand Exerciser Quick Tip","c":"fit","d":174,"v":15000,"n":104,"s":"O minge de exercițiu tare (nu un simplu „anti-stres”) pentru încălzirea și întărirea mâinilor. Ideea genială: reproduci cu ea exact mișcările de la armă (butonul de încărcător cu degetul mare, opritorul închizătorului, apăsarea pe trăgaci), în aceeași poziție a mâinii.","p":["Încălzești mâinile înainte de antrenament.","Antrenezi exact mușchii mișcării de care ai nevoie.","Se poate face acasă, oricând."],"k":[[30,"Încălzirea"],[50,"Mișcări specifice"]]},{"i":"7Bc_GCGoQlQ","t":"A patra reacție la stres: Flow","o":"The Fourth Reaction to Stress: Flow","c":"min","d":98,"v":2800,"n":105,"s":"Știm trei reacții: luptă (înțelegi situația și crezi că poți câștiga), fugă (înțelegi, dar nu poți câștiga) și îngheț (nu înțelegi). A patra este „flow”: ești prezent, încrezător și în control, iar prezența ta calmă schimbă situația — ca la meditație, recunoști gândul și mergi mai departe.","p":["Ingheți când n-ai exersat situația niciodată.","Speranța nu e un plan.","Flow-ul vine din antrenament și prezență."],"k":[[0,"Cele trei reacții"],[30,"Flow"]]},{"i":"GGIn7grTIkU","t":"De ce antrenamentul online poate fi mai bun decât un curs live (5 motive)","o":"Why Is Online Training Better Than a Live Shooting Course? [Chris Sajnog's 5 in Under 5 FAQ]","c":"inv","d":317,"v":5200,"n":106,"s":"Învățarea are loc la repetiție și în somn (nu la demonstrația instructorului), întrebările apar după curs, lecțiile pot fi revăzute din mai multe unghiuri, fiecare merge în ritmul lui și oamenii nu se mai jenează să întrebe. Totuși, partea practică cu armă reală se face sub instructor autorizat.","p":["Somnul consolidează ce ai exersat ziua.","Repetiția ta, nu demonstrația, te face mai bun.","Pune întrebări — nu-ți fie rușine."],"k":[[30,"1 · Repetiția și somnul"],[90,"2 · Întrebările de după"],[120,"3 · Revezi lecțiile"],[155,"4 · Ritmul tău"],[185,"5 · Fără jenă"]]},{"i":"CWTbQAn8c78","t":"Sfat rapid: cum controlezi reculul","o":"Quick Tip: How to Manage Recoil","c":"tr","d":137,"v":62000,"n":107,"s":"Mitul: reculul trebuie „gestionat”. Adevărul: dacă ai o platformă solidă, o priză bună și ești pregătit pentru forță (exersat înainte, fără foc), reculul se rezolvă singur — ca la bicicletă, unde nu înveți „să cazi”, ci să mergi.","p":["Platformă solidă + priză bună = recul mic.","Exersează acasă înainte de primul foc real.","Nu lupta cu efectul, repară cauza."],"k":[[0,"Mitul reculului"],[60,"Comparația cu bicicleta"]]},{"i":"jgInhnAE1cE","t":"Puterea unui singur grad","o":"The Power of One Degree","c":"min","d":125,"v":5800,"n":108,"s":"Apa nu se schimbă vizibil de la 33 la 211 °F, apoi la un singur grad în plus devine abur. La fel e antrenamentul: muncești mult fără să vezi nimic, până când un efort în plus schimbă totul. Nu știi unde e „gradul” tău, deci nu renunța.","p":["Progresul e invizibil o vreme, apoi apare brusc.","Fiecare antrenament adaugă căldură.","Nu te opri înainte de pragul tău."],"k":[[0,"Apa și aburul"],[60,"Pragul tău"]]},{"i":"7gaoFhAFXOU","t":"Cum îmi câștig încrederea în mine? (5 metode)","o":"How Can I Gain Confidence in Myself?  [Chris Sajnog's 5 in Under 5 FAQ]","c":"min","d":266,"v":5800,"n":109,"s":"Încrederea e ca un mușchi. Cinci metode: exersezi (cercul încredere–competență), vorbirea pozitivă cu tine însuți (și în oglindă), mișcarea fizică, asumi riscuri (îți înfrunți temerile) și, cel mai important, îți ții promisiunile făcute ție.","p":["Mai bun → mai încrezător → și mai bun.","Spune-ți în oglindă cine ești.","Fiecare promisiune ținută față de tine construiește încredere."],"k":[[30,"1 · Practica"],[62,"2 · Vorbirea pozitivă"],[123,"3 · Mișcarea"],[135,"4 · Riscurile"],[155,"5 · Promisiunile față de tine"]]},{"i":"zztr8UamskM","t":"Sfat rapid: tremurul mâinilor și „oscilația”","o":"Quick Tip: Controlling the Wobble or Shaking Hands","c":"tr","d":159,"v":74000,"n":110,"s":"Ai grijă de sănătate (cofeină, somn) și lucrează forța prizei. Dar, mai ales, nu te teme de oscilație: dacă focalizezi pe cătare și ai aliniere perfectă, oscilația mică doar mută focul în zona țintei (eroare paralelă). Eroarea mare vine din alinierea greșită (eroare unghiulară).","p":["Alinierea perfectă contează mai mult decât stabilitatea perfectă.","Atâta timp cât oscilația e mai mică decât ținta, lovești.","Mai puțină cofeină, mai mult somn, priză mai puternică."],"k":[[0,"Sănătatea și priza"],[30,"Nu te teme de oscilație"],[60,"Eroarea unghiulară vs paralelă"]]},{"i":"fpABbRs9JWg","t":"Pentru ce te antrenezi?","o":"What Are You Training For?","c":"min","d":81,"v":2400,"n":111,"s":"Cel mai important e să ai un motiv. Ai intra într-o clădire în flăcări pentru 20 de lei? Dar pentru copilul tău? Antrenamentul de elită cere un „de ce” cu încărcătură emoțională puternică — altfel apeși pe „amânare” la alarmă în fiecare dimineață.","p":["Lipsa timpului e de obicei lipsa unui scop.","Motivul trebuie să conteze emoțional pentru tine.","Scrie-ți motivul și pune-l la vedere."],"k":[[0,"Clădirea în flăcări"],[30,"Motivul tău"]]},{"i":"daaMNWymjJk","t":"O armă sub pernă nu e un plan de apărare a casei","o":"A Gun Under Your Pillow Is Not a Home Defense Plan","c":"tac","d":296,"v":5400,"n":112,"s":"Cinci lucruri care protejează casa mai bine decât o armă sub pernă: un plan pentru mai multe scenarii (în pat, la televizor, în curte), implicarea familiei și a vecinilor, exerciții de parcurgere (ca exercițiile de incendiu cu copiii), prevenția (o casă luminată e o țintă grea) și atenția (când auzi ceva noaptea, încerci să-ți dai seama ce e).","p":["Un plan pe care nu-l știe familia nu e un plan.","Exersarea elimină înghețul.","Luminile aprinse descurajează hoții."],"k":[[30,"1 · Planul"],[95,"2 · Oamenii"],[125,"3 · Pregătirea"],[155,"4 · Prevenția"],[185,"5 · Atenția"]],"w":"În caz de pătrundere: suni la 112, fugi sau te baricadezi, nu cauți intrusul."},{"i":"FMgpTa7WKR4","t":"Care e cea mai bună armă pentru apărarea casei? (5 criterii)","o":"What's the Best Firearm for Home Defense?  [Chris Sajnog's 5 in Under 5 FAQ]","c":"tac","d":314,"v":13000,"n":113,"s":"Nu există un singur răspuns. Cinci criterii: dacă te poți antrena cu acea armă (ai unde?), cine mai locuiește cu tine (copii), din ce sunt făcuți pereții (proiectilele pot trece prin pereți, la vecini sau la copii), ce distanțe sunt în casa ta și cum și unde o păstrezi încuiată.","p":["Fără posibilitate de antrenament, mai bine fără armă.","Gândește-te la ce e în spatele țintei și dincolo de pereți.","Păstrarea încuiată e obligatorie când ai copii."],"k":[[30,"1 · Antrenamentul"],[95,"2 · Cine locuiește cu tine"],[125,"3 · Construcția casei"],[155,"4 · Distanțele"],[215,"5 · Păstrarea"]],"w":"În România arma se deține doar cu permis și se păstrează conform legii, în casetă/dulap metalic."},{"i":"b1nDxgNNZZk","t":"3 motive pentru care „să NU focalizezi pe cătare” (și de ce greșesc)","o":"3 Reasons You Should NOT Focus on Your Front Sight - Navy SEAL Tips","c":"fo","d":257,"v":214000,"n":114,"s":"Răspunde celor mai des întâlnite argumente împotriva focalizării pe cătare (n-ai timp sub stres, trebuie să vezi ținta, nu contează la distanță mică) și arată de ce, pentru el, focalizarea pe cătare rămâne baza preciziei.","p":["Ce exersezi devine reflex și sub stres.","Ținta rămâne vizibilă, doar mai puțin clară.","Rezumat după titlu — videoclipul nu are subtitrare."],"k":[[0,"Începutul"]],"w":"Rezumat făcut după titlu și restul materialelor lui; videoclipul nu are subtitrări."},{"i":"4vyQMJqKPYY","t":"Cum folosești gripper-ele Captains of Crush pentru forța prizei","o":"How to Use the Captains of Crush Hand Grip Strength Exerciser","c":"fit","d":294,"v":76000,"n":115,"s":"„Priza e regele consecvenței”. Încălzești întâi mâinile cu oul verde (câteva minute), apoi gripper-ul (pentru un bărbat adult, de obicei se începe cu nivelul 1): 10 strângeri cu o mână, 10 cu cealaltă, apoi strângi și ții 10 secunde. Degetul mic la baza mânerului. Bonus: lucrezi cu brațul întins, ca la tragere.","p":["Încălzirea înainte, de fiecare dată.","Le poți ține în mașină sau lângă televizor.","Antrenează mâna în poziția în care o folosești."],"k":[[30,"De ce priza"],[60,"Încălzirea"],[125,"Nivelurile"],[155,"Rutina"],[215,"Bonus: brațul întins"]]},{"i":"pWBFArCVLZ4","t":"Cum economisesc bani când învăț să trag? (5 metode)","o":"How Can I Save Money Learning to Shoot? [Chris Sajnog's 5 in Under 5 FAQ]","c":"dry","d":310,"v":6500,"n":116,"s":"Cinci metode: înveți acasă (poziția, priza, focalizarea, ochirea), îți planifici antrenamentul în caiet, izolezi zonele cu cel mai mare câștig (priza, vederea, scosul armei — fără foc real), folosești unealta potrivită (airsoft, laser, armă albastră) și îți antrenezi mintea — tu ești arma.","p":["Fără plan, poligonul e calea cea mai lungă și mai scumpă.","Scrie în caiet ce lucrezi și de ce.","Arma e doar o unealtă; antrenezi omul."],"k":[[30,"1 · Acasă"],[90,"2 · Planul"],[120,"3 · Zonele slabe"],[155,"4 · Unealta potrivită"],[215,"5 · Mintea"]]},{"i":"DaiMOZrLTB0","t":"Nu am armă — de unde încep? (5 pași)","o":"I Don't Own a Gun, Where do I Start?  [Chris Sajnog's 5 in Under 5 FAQ]","c":"tr","d":235,"v":4100,"n":117,"s":"Cinci pași: decizi dacă o armă e potrivită pentru tine, alegi tipul (pistol, carabină, armă cu țeavă lisă) după nevoie, mergi într-un magazin să ții în mână mai multe modele, exersezi cu o copie (armă albastră sau airsoft) înainte să cumperi și înveți bazele acasă înainte de primul foc real.","p":["Decizia vine înaintea cumpărăturii.","Ține arma în mână înainte s-o alegi.","Bazele se învață înainte de primul foc."],"k":[[30,"1 · E potrivită?"],[60,"2 · Ce tip"],[85,"3 · Magazinul"],[110,"4 · Copia de antrenament"],[125,"5 · Învață acasă"]],"w":"În România: întâi permisul de armă (curs, examen, avize), apoi achiziția."},{"i":"gn9QD1B-8CM","t":"Cum ții un pistol? (5 componente ale prizei)","o":"How Do You Hold a Pistol? [Chris Sajnog's 5 in Under 5 FAQ]","c":"tr","d":308,"v":33000,"n":118,"s":"Contează mecanica, nu un procent anume. Cinci componente: brațul direct în spatele armei (nu cu cotul în lateral), priza cât mai sus pe mâner (pielea se „cutează” sub coada închizătorului), mâna de sprijin la ~45° umple tot spațiul liber, ambii degetele mari orientate înainte spre țintă și strângere 100% cu ambele mâini (dar nu până tremuri) — sub stres oricum vei strânge tare.","p":["Brațul în spatele armei preia reculul.","Priza sus = mai puțin ridicare a țevii.","„60/40” nu se poate reproduce; 100% da — priza e regele consecvenței."],"k":[[30,"1 · Brațul în spatele armei"],[60,"2 · Priza sus"],[91,"3 · Mâna de sprijin"],[121,"4 · Degetele mari înainte"],[155,"5 · Strângere 100%"]]},{"i":"U2qixkPXw2o","t":"Cum exersez tragerea fără poligon? (5 moduri)","o":"How Can I Practice Shooting Without a Shooting Range? [Chris Sajnog's Five in under 5 FAQ]","c":"dry","d":306,"v":12000,"n":119,"s":"A învăța să tragi înseamnă mult mai mult decât focul. Cinci moduri: înțelegi asta, exersezi mânuirea (încărcătoare, scosul, poziții, incidente), lucrezi vederea și priza, faci vizualizare (repetări mentale perfecte) și îți notezi fiecare antrenament.","p":["Acasă ai mai multe ocazii de antrenament decât în poligon.","Vizualizarea: repetări perfecte, de fiecare dată.","Notează fiecare sesiune — Caietul din aplicație e făcut pentru asta."],"k":[[30,"1 · Mai mult decât focul"],[90,"2 · Mânuirea"],[120,"3 · Vederea și priza"],[155,"4 · Vizualizarea"],[215,"5 · Notează"]]},{"i":"UCI61PWg3kg","t":"Cum scap de tresărire și anticipare? (5 metode)","o":"How Can I Stop Flinching or Anticipating?  [Chris Sajnog's 5 in Under 5 FAQ]","c":"tr","d":329,"v":131000,"n":120,"s":"Cinci metode: o provocare de 30 de zile de dry fire, nu-ți mai spune „mereu tresar” (spune ce vrei: „trag bine”), meditația (ești prezent în clipa focului), respiri normal (nu-ți ții respirația, te relaxezi) și ai răbdare — creierul are nevoie de timp să construiască un traseu nou, fără tresărire.","p":["Povestea pe care ți-o spui devine realitate.","Mintea nu înțelege „nu” — spune ce vrei.","O tresărire veche de ani nu dispare într-o zi."],"k":[[30,"1 · 30 de zile de dry fire"],[60,"2 · Povestea ta"],[125,"3 · Meditația"],[180,"4 · Respirația"],[215,"5 · Răbdarea"]]},{"i":"aFNwQiqb6qs","t":"Cum pot trăi ca un războinic? (5 moduri)","o":"How Can I Live Like a Warrior? [Chris Sajnog's 5 in under 5 FAQ]","c":"viat","d":257,"v":1800,"n":121,"s":"Gata de luptă, dar căutând pacea. Cinci moduri: „iei medicamentele” (meditație, mișcare, dietă, somn), transformi obiceiurile în ritualuri, îți găsești un mentor, îți permiți să fii vulnerabil (să spui „te iubesc”, să vorbești în public) și îți ții promisiunile față de tine.","p":["MEDS = meditație, exerciții, dietă, somn.","Vulnerabilitatea construiește încredere.","Promisiunile încălcate față de tine te apasă."],"k":[[30,"1 · MEDS"],[60,"2 · Ritualuri"],[90,"3 · Mentorul"],[120,"4 · Vulnerabilitatea"],[155,"5 · Promisiunile"]]},{"i":"0JvFCBjKtfk","t":"Cum rămâi calm într-o confruntare violentă? (5 metode)","o":"How Do You Stay Calm During a Violent Encounter?  [Chris Sajnog's 5 in Under 5 FAQ]","c":"min","d":279,"v":6500,"n":122,"s":"Cinci metode care te țin calm și în control: meditația (ești în prezent, nu în trecut sau viitor), vizualizarea scenariilor concrete, practica (cercul încredere–competență), atenția (exercițiul: privești fix un punct și observi tot ce vezi lateral, fără să muți ochii) și „flow” — a patra reacție, pe lângă luptă, fugă și îngheț.","p":["Calmul se antrenează înainte, nu se improvizează.","Vizualizează situații concrete, nu „o confruntare” în general.","Vederea periferică îți lărgește atenția."],"k":[[30,"1 · Meditația"],[62,"2 · Vizualizarea"],[92,"3 · Practica"],[120,"4 · Atenția"],[155,"5 · Flow"]]},{"i":"i94oHGM6ifs","t":"Cum stau când trag? (5 chei pentru platformă)","o":"How Should I stand When I Shoot a Firearm? [Chris Sajnog's 5 in under 5 FAQ]","c":"tr","d":297,"v":9700,"n":123,"s":"Cinci chei: pornești de la priză și construiești înapoi spre corp, gândești mecanic (fiecare corp e altfel), o poziție atletică, de luptă (pentru el: piciorul puternic puțin în spate, centrul de greutate coborât, ușor aplecat înainte), mobilitate (picioarele nu sunt în ciment) și nu copia orbește poziția altcuiva.","p":["Aceeași poziție pentru o bătaie și pentru tragere.","Centrul de greutate jos = stabilitate.","Trăgătorii buni trag bine din cauza felului în care se antrenează, nu a poziției lor."],"k":[[30,"1 · Priza întâi"],[60,"2 · Mecanica"],[94,"3 · Poziția atletică"],[158,"4 · Mobilitatea"],[188,"5 · Fiecare e diferit"]]},{"i":"6Xj6G-73yz8","t":"Care e cea mai rapidă cale să trag mai bine? (5 metode)","o":"What's the Fastest Way to Improve Your Shooting? [Chris Sajnog's 5 in Under 5 FAQ]","c":"tr","d":329,"v":6100,"n":124,"s":"Cinci scurtături reale: devii „MVP” (meditație, vizualizare, gândire pozitivă), îți planifici antrenamentul în scris, faci dry training (tot ce nu e focul: vedere, priză, scos, mânuire, minte), mergi cât mai încet (viteza creează „cicatrici de antrenament”) și îți găsești un partener sau un club care te ține responsabil.","p":["Creierul mișcă tot — antrenează-l.","Încet = trasee nervoase perfecte = învățare rapidă.","Un partener te face să nu sari peste antrenamente."],"k":[[30,"1 · MVP"],[93,"2 · Planul"],[125,"3 · Dry training"],[155,"4 · Încet"],[218,"5 · Partenerul"]]},{"i":"vd6jLUkpe9o","t":"De ce nu progresez la tragere? (5 motive)","o":"Why Am I Not Getting Better At Shooting? [Chris Sajnog's 5 in Under 5 FAQ]","c":"tr","d":258,"v":28000,"n":125,"s":"Cinci motive: nu planifici („cine nu planifică, planifică eșecul”), nu exersezi abilitatea potrivită (veriga cea mai slabă), nu exersezi corect (în poligon îți repeți greșelile — înveți acasă și execuți în poligon), nu-ți schimbi gândurile negative („mereu trag jos-stânga”) și nu observi că progresezi (câștigurile devin tot mai mici, dar există).","p":["Află-ți veriga slabă și lucreaz-o separat.","Nu-ți mai spune ce faci greșit „mereu”.","Notează progresul ca să-l vezi."],"k":[[30,"1 · Fără plan"],[50,"2 · Abilitatea greșită"],[90,"3 · Practica greșită"],[120,"4 · Gândurile negative"],[150,"5 · Nu vezi progresul"]]},{"i":"j2Be-CJiG9A","t":"Partenerul meu urăște armele. Ce pot face? (5 idei)","o":"My Spouse Hates Guns! What Can I Do? [Chris Sajnog's 5 in Under 5 FAQ]","c":"viat","d":318,"v":4100,"n":126,"s":"Pornește de la povestea lui (soția nu voia arme în casă). Cinci idei: afli de ce (frică, ceva întâmplat, informații greșite), mergi încet, arăți că ești responsabil și instruit, arăți cum le ții încuiate (doar tu ai acces) și îl implici — poate vrea și el/ea să se simtă confortabil cu ele.","p":["Întrebările deschid discuția.","Presiunea creează rezistență.","Siguranța demonstrată liniștește."],"k":[[30,"Povestea lui"],[95,"1 · Află de ce"],[125,"2 · Încet"],[155,"3 · Arată că ești sigur"],[190,"4 · Păstrarea"],[215,"5 · Implică-l"]]},{"i":"1Cy1gfQhGRE","t":"Care sunt cele mai bune exerciții de tragere? (5 idei)","o":"What are the Best Shooting Drills? [Chris Sajnog's 5 in Under 5 FAQ]","c":"tr","d":342,"v":11000,"n":127,"s":"Nu-i plac exercițiile standard: un „timp bun” devine un plafon (ca bariera celor 4 minute pe milă). Exercițiile tale trebuie să țină de mediul, scopurile și nivelul tău, să țintească zonele de îmbunătățit, să măsoare ce faci înainte de foc (practica), nu timpul sau scorul, și să evolueze odată cu tine.","p":["Creează-ți propriile exerciții.","Măsoară ce controlezi: practica dinainte de foc.","După fiecare antrenament ești alt trăgător."],"k":[[30,"1 · Etalonul care te limitează"],[93,"2 · Mediul și scopul tău"],[125,"3 · Zonele de îmbunătățit"],[155,"4 · Practica, nu scorul"],[218,"5 · Exercițiile evoluează"]]},{"i":"8zTL3crH8Ew","t":"Cum alegi lentilele corectoare pentru tragere","o":"How to Select Corrective Lenses For Shooting Firearms","c":"fo","d":187,"v":39000,"n":128,"s":"Când îmbătrânești ai nevoie de ochelari ca să vezi clar cătarea. Trei opțiuni: lentile cu centrul optic mutat sus și lateral (privești prin colțul lentilei la pușcă), ochelari de tragere cu ochiul dominant reglat pe distanța până la cătare (măsori distanța în poziția de tragere) și cel nedominant pe distanță, sau lentile de contact diferite la cei doi ochi.","p":["Măsoară distanța ochi–cătare și du-o la medicul oftalmolog.","Lentilele obișnuite sunt centrate pentru privirea drept înainte.","Alimentația și mișcarea ajută și ochii."],"k":[[30,"Problema"],[45,"1 · Lentile descentrate"],[65,"2 · Ochelari de tragere"],[93,"3 · Lentile de contact"]],"w":"Decizia se ia împreună cu medicul oftalmolog."},{"i":"etqNwdMqsco","t":"Mielinizarea: cum funcționează practica","o":"Myelination – How Practice Works","c":"inv","d":157,"v":20000,"n":129,"s":"Explicația științifică a „memoriei musculare”: la fiecare repetare, în jurul fibrelor nervoase folosite se depune un strat de mielină, care face semnalul mai rapid și mai precis. De aceea contează repetarea perfectă: încet și deliberat, ca să întărești traseul corect, nu greșeala.","p":["Nu orice repetare ajută — doar cea corectă.","Încet = nervii potriviți se activează de fiecare dată.","Așa „pavezi drumul spre perfecțiune”."],"k":[[30,"Memoria musculară"],[65,"Nervii și mielina"],[125,"Practica perfectă"]]},{"i":"HeTOQALHT-M","t":"De ce contează dieta și mișcarea când înveți să tragi","o":"Why Diet And Exercise Are Important In Learning How To Shoot","c":"nut","d":288,"v":3300,"n":130,"s":"Tu ești arma, deci corpul și mintea fac parte din antrenament. Sistemul „MEDS”: meditație (ca o defragmentare a creierului), exerciții (transpiră zilnic — de exemplu alergare pe deal), dietă (grăsimi sănătoase, fără zahăr și uleiuri vegetale rafinate) și somn (în jur de 8 ore și jumătate).","p":["Ca la orice sport, performanța ține de corp.","Somnul puțin te face mai lent, nu mai productiv.","Mișcare zilnică, fără un plan complicat."],"k":[[30,"De ce în cartea de tragere"],[120,"MEDS"],[150,"Meditația"],[155,"Exercițiile"],[175,"Dieta"],[200,"Somnul"]],"w":"Pentru dietă, cere sfatul unui medic sau nutriționist."},{"i":"7Y4skj8ayEA","t":"Urgențe SMART: cum salvezi o viață la orice traumatism","o":"SMART Emergency Medicine - How to Save a Life in Any Traumatic Injury","c":"tac","d":334,"v":2800,"n":131,"s":"Sistemul lui pentru traumatisme, înainte de sosirea medicilor: S — locul e sigur, M — sângerarea masivă (oprită imediat, cu orice mijloace), A — căile respiratorii (respiră? se mișcă pieptul? rănile dintre maxilar și buric se acoperă etanș), R — reevaluezi tot ce ai făcut (garoul mai ține?), T — transportul spre spital cât mai repede.","p":["La traumatisme, sângerarea vine înaintea respirației.","Reevaluează după fiecare pas.","Exersează pașii, nu doar vizionează."],"k":[[30,"De ce prim ajutor"],[95,"De ce nu ABC"],[110,"S · Siguranța"],[125,"M · Sângerarea"],[155,"A · Respirația"],[187,"R · Reevaluarea"],[219,"T · Transportul"]],"w":"Sună la 112. Dacă cineva se prăbușește fără o rană (stop cardiac), resuscitarea și un defibrilator salvează vieți — fă un curs de prim ajutor."},{"i":"IfrTqhovDmQ","t":"Exerciții pentru ochi, pentru o vedere mai bună","o":"Eye Exercises for Improved Vision","c":"fo","d":349,"v":40000,"n":132,"s":"Ochii au mușchi și se antrenează ca restul corpului. Rutina lui: dimineața clătește ochii închiși cu apă călduță; apoi apropie un pix de la brațul întins până la nas, urmărindu-l; cercuri cu ochii urmărind vârful pixului (nu mișcări la întâmplare); apoi schimbă focalizarea aproape–departe, așteptând de fiecare dată claritatea perfectă, nu viteza.","p":["Urmărește un obiect — așa antrenezi ochii să urmărească o țintă.","La aproape–departe contează claritatea perfectă, nu viteza.","Lumina naturală și legumele verzi ajută sănătatea ochilor."],"k":[[30,"De ce exerciții"],[62,"1 · Apa călduță"],[92,"2 · Pixul aproape–departe"],[125,"3 · Cercurile urmărind pixul"],[175,"4 · Aproape–departe"],[245,"Bonus: lumina și alimentația"]],"w":"Nu privi niciodată direct în soare; la lumină puternică sau zăpadă, poartă ochelari de protecție UV. Pentru probleme de vedere, mergi la oftalmolog."},{"i":"dU8noeVUqUk","t":"Cum îți măsori antrenamentul (nu cum crezi)","o":"How to Measure Your Firearms Training [It's not how you think]","c":"inv","d":253,"v":4700,"n":133,"s":"Nu folosi etaloane de timp sau de scor: celor buni le devin plafon, celor începători le par imposibile. Măsoară „indicatorii din față” (ce faci înainte de foc: minute de vedere, priză, dry fire), nu „indicatorii din spate” (scorul și timpul, care sunt deja trecut). Ca la slăbit: notezi mișcarea și mâncarea, cântarul urmează singur.","p":["Măsori ce poți controla azi.","Scorul e un efect, nu o pârghie.","Notează zilnic ce ai făcut — Caietul din aplicație face asta."],"k":[[30,"De ce nu etaloane"],[90,"Indicatori din față vs din spate"],[125,"Exemplul cu slăbitul"]]},{"i":"s0PNAMkipYA","t":"Cum tragi precis cu pistolul cu o singură mână","o":"How to Accurately Shoot a Pistol with One Hand","c":"tr","d":399,"v":61000,"n":134,"s":"Motive: mâna rănită, ții un copil, te sprijini de o balustradă. Sfaturi: păstrezi platforma la fel și doar scoți mâna de sprijin (fără arma înclinată „ca în filme” și fără umărul împins înainte); strângi și mâna liberă în pumn (o strângere puternică într-o mână ajută și cealaltă); poți ridica degetul mare; „răsucești” încheietura înainte ca să blochezi reculul; când treci pe mâna cealaltă, schimbi și picioarele.","p":["Același mecanism ca la două mâini, minus mâna de sprijin.","Strânge pumnul mâinii libere.","Pe mâna cealaltă oglindești tot, inclusiv picioarele."],"k":[[30,"Când tragi cu o mână"],[62,"1 · Aceeași platformă"],[120,"2 · Strânge mâna liberă"],[195,"3 · Degetul mare"],[215,"4 · Încheietura înainte"],[275,"5 · Schimbă și picioarele"]],"w":"Exersezi acasă cu arma descărcată sau de antrenament, apoi în poligon, sub supraveghere."},{"i":"6Hibh23Xf-Y","t":"Anunț: conferință la Summit-ul PGA 2019","o":"Navy SEAL Chris Sajnog to Speak at the 2019 PGA Teaching and Coaching Summit","c":"viat","d":36,"v":666,"n":135,"s":"Scurt anunț (36 s): a vorbit despre metoda lui de învățare accelerată la o conferință a instructorilor de golf. Arată că metoda lui se aplică la orice abilitate, nu doar la tragere.","p":["Aceleași principii de învățare, alt sport."],"k":[[0,"Anunțul"]]},{"i":"gmGbslYQiSI","t":"Mărturia lui Peter din Austria despre un antrenament privat","o":"Peter - Great Personal Training with Chris Sajnog All the Way from Austria!","c":"inv","d":180,"v":1200,"n":136,"s":"Un elev austriac povestește că, după o ședință individuală online în care i-a corectat poziția și priza, a obținut cel mai bun rezultat al lui la un concurs. Apreciază și că poate revedea înregistrarea ședinței.","p":["Corecturile mici la poziție și priză pot aduce un salt.","Revederea înregistrării ajută la fixare.","Video promoțional."],"k":[[0,"Mărturia"]]},{"i":"t2qCwhjUigQ","t":"Poziția în picioare cu carabina","o":"Master the Standing Carbine Shooting Position with Retired Navy SEAL Sniper, Chris Sajnog","c":"tr","d":393,"v":16000,"n":137,"s":"Poziția cea mai folosită: rapidă și ușor de părăsit. Baza: picioarele la lățimea umerilor, șoldurile spre țintă (NPA), piciorul puternic puțin în spate (vârful lui la nivelul călcâiului celuilalt), genunchii îndoiți, „nasul peste vârfuri”. Patul armei în piept, direct sub ochi (nu pe umăr, în lateral). Mâna de sprijin cât mai în față, cu o parte deasupra armei, și cotul rotit în afară, nu în jos.","p":["Dacă nu găsești elementele de ochire, patul e în locul greșit.","Mâna de sprijin conduce arma; mâna de pe mâner controlează focul.","Cotul jos creează o balama care ridică țeava."],"k":[[30,"De ce poziția în picioare"],[55,"Baza și NPA"],[125,"Nasul peste vârfuri"],[140,"Patul sub ochi"],[190,"Mâna de sprijin"],[275,"Cotul în afară"]],"w":"Exersezi acasă cu arma descărcată / de antrenament, apoi în poligon."},{"i":"8Rl7J3DM-Bo","t":"Poți focaliza pe cătare și lovi o țintă în mișcare?","o":"Can You Focus on Your Front Sight and Hit a Moving Target?","c":"fo","d":377,"v":31000,"n":138,"s":"Da. Două tipuri de erori: unghiulară (elementele nealiniate — eroarea crește cu distanța) și paralelă (aliniere bună, dar ochești puțin pe lângă — rămâne la fel). Cu țeavă scurtă, o abatere mică ratează ușor. Demonstrația cu nivela cu bulă: dacă te uiți la țintă și urmărești, bula fuge; dacă privești bula (= cătarea) și urmărești ținta cu atenția periferică, bula stă la mijloc.","p":["Alinierea = focalizarea; imaginea țintei = atenția.","Eroarea unghiulară crește cu distanța, cea paralelă nu.","Fă testul nivelei acasă, cu cineva care te privește."],"k":[[30,"Obiecția"],[60,"Eroarea unghiulară și paralelă"],[125,"Lungimea liniei de ochire"],[185,"Testul nivelei"]]},{"i":"Y8xiI6kFuBM","t":"Cum îți oprești mintea agitată și începi să meditezi","o":"How to Stop Your Racing Mind and Start Meditating","c":"min","d":241,"v":6000,"n":139,"s":"Dacă nu poți sta liniștit, lasă meditația deoparte și învață întâi să respiri corect: pe nas (ca bebelușii), cu diafragma (burta iese și intră), fără să miști umerii, pieptul și gâtul. Când poți respira așa 5 minute, treci la meditație.","p":["Respirația corectă e poarta spre meditație.","Respirația din piept folosește mușchi care nu sunt pentru asta.","Ținta: 5 minute de respirație corectă."],"k":[[30,"Mintea agitată"],[60,"Pe nas"],[90,"Fără mușchii accesori"],[150,"Apoi meditația"]]},{"i":"H0_HRsJEygU","t":"Puterea echipei: acronimul TEAMS","o":"The Power Of Teamwork - Lessons From Retired Navy SEAL Instructor Chris Sajnog","c":"min","d":361,"v":10000,"n":140,"s":"Ce face echipele SEAL atât de bune nu e individul, ci echipa. TEAMS: Take responsibility (asumă-ți răspunderea — dacă e „vina ta”, poți schimba ceva), Encourage others (încurajează), Ask for help (cere ajutor — nu ești bun la toate), Master your job (stăpânește-ți propria sarcină, nu pe a altora), Sacrifice for others (fă sacrificii pentru coechipieri — familia și prietenii sunt echipa ta).","p":["Responsabilitatea totală îți dă puterea să schimbi.","O vorbă bună la momentul potrivit contează enorm.","Fă-ți perfect treaba ta în echipă."],"k":[[30,"De ce echipa"],[62,"T · Responsabilitatea"],[127,"E · Încurajarea"],[191,"A · Cererea de ajutor"],[245,"M · Stăpânește-ți rolul"],[280,"S · Sacrificiul"]]},{"i":"Ft1Eu-RCamw","t":"Cum îți oprești tremurul mâinilor la pistol","o":"How to Stop Your Hands from Shaking when Shooting a Pistol","c":"tr","d":288,"v":507000,"n":141,"s":"Arma nu va fi niciodată perfect nemișcată. Dacă alinierea și focalizarea sunt corecte, ratezi doar cât tremuri. Trei sfaturi: nu strânge mai tare decât poți (100%, nu peste — atunci începe tremurul), respiră (fără aer apar tremurături în mușchii mici) și relaxează-te — un truc: mișcă degetele de la picioare înainte de foc.","p":["Oscilația mică nu e problema; alinierea greșită este.","Lucrează forța prizei ca să nu treci de 100%.","Mișcatul degetelor de la picioare relaxează tot corpul."],"k":[[30,"Arma nu stă niciodată perfect"],[93,"1 · Prea strâns"],[126,"2 · Respirația"],[157,"3 · Relaxarea și degetele de la picioare"]]},{"i":"fNRp2h5JM7E","t":"Cum să te antrenezi ca un Navy SEAL","o":"How to Train Like a Navy SEAL","c":"inv","d":235,"v":7800,"n":142,"s":"Mulți fac invers: cumpără arma, merg la poligon și speră să devină buni. Ordinea corectă are trei pași: educație (afli ce-ți trebuie, dacă îți trebuie, și îți antrenezi mintea), echipament (abia acum arma și echipamentul, folosite corect) și experiență (antrenament pe scenarii, cu instructori, la final).","p":["Întâi înveți, apoi cumperi.","Mintea se pregătește înaintea mâinilor.","Experiența vine ultima, când stăpânești bazele."],"k":[[30,"Ordinea greșită"],[60,"1 · Educația"],[95,"2 · Echipamentul"],[125,"3 · Experiența"]]},{"i":"c6laC5H6cqY","t":"Cum scapi de tresărire: provocarea de 30 de zile","o":"How to Stop Flinching When Shooting a Pistol - 30 Day Navy SEAL Challenge","c":"dry","d":272,"v":56000,"n":143,"s":"Tresărirea nu e o fatalitate: apare când tragi prima dată fără pregătire și rămâne „scrisă” în creier. Trăgătorii buni nu tresar pentru că s-au antrenat corect. Leacul: 30 de zile fără foc real, doar dry training — meditație, vizualizare, gândire pozitivă și mânuire — până se formează noul reflex.","p":["O singură sesiune de dry fire nu vindecă nimic; durează cam 30 de zile.","Nu-ți mai spune „eu tresar mereu”.","Dry training = tot ce te face mai bun, nu doar trăgaciul."],"k":[[30,"De unde vine tresărirea"],[95,"Provocarea de 30 de zile"],[125,"MVP"]]},{"i":"l-ByObJbkVo","t":"Trucul lunetistului pentru trăgaci: a doua încheietură a degetului","o":"A Navy SEAL Sniper Trigger Trick to Help Hit Your Target Every Time","c":"tr","d":224,"v":33000,"n":144,"s":"Ține a doua încheietură a degetului arătător îndreptată drept spre țintă când apeși. Ca arma să se miște
