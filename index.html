„Platformă”, nu „poziție”: o poziție e statică, o platformă se poate mișca. Cât mai mult din corp vine în spatele armei, ca la volan.

### Cele trei elemente ale oricărei platforme
1. **Sprijin pe oase, nu pe mușchi** — oasele țin arma fără să obosească; mușchii tremură.
2. **Relaxare musculară** — strângi tare doar arma. Testul lui: dacă poți mișca degetele de la picioare, ești relaxat.
3. **Punctul natural de ochire** — corpul relaxat arată singur spre țintă.

### Pistol, în picioare (isoscel modificat)
- Picioarele la lățimea umerilor sau puțin mai larg, vârfurile spre țintă.
- Piciorul de pe partea armei un pas înapoi (vârful lui cam în dreptul călcâiului celuilalt).
- Genunchii puțin îndoiți — nu blocați.
- Aplecat ușor din talie: **„nasul peste vârfuri”**.
- Capul drept. **Aduci cătarea la ochi**, nu ochii la cătare.
- Brațele întinse fără tensiune, umerii „trași înapoi” — lucrează spatele și pieptul, nu umerii.
- Țeava în linie cu coloana.

Gândește-te: cum ai sta dacă cineva mai mare decât tine ar veni să te dărâme din față? Aproape exact așa.

### Fiecare corp e altfel
Nu copia pe nimeni la milimetru. Ia principiile și adaptează-le la corpul tău, apoi verifică cu testul ochilor închiși.

### Și alte platforme
Genunchi (înalt — rapid; jos pe călcâi — mai precis), culcat (cel mai precis, cel mai lent), șezând, ghemuit. Principiile sunt aceleași: oase, relaxare, punct natural de ochire.

> Picioarele sunt șenilele tancului, trunchiul e turela.

Imaginează-ți pistolul prins într-o menghină: poți face orice cu trăgaciul și gloanțele trec prin aceeași gaură. Priza ta trebuie să fie menghina aceea. De aceea priza e **regele consecvenței** și „leacul reculului”.

@anim grip

### Cum construiești priza (pistol)
1. Pornești cu arma în mâna de sprijin (nu din toc) ca s-o construiești corect.
2. Mâna de tragere **cât mai sus** pe mâner, până pielea dintre degetul mare și arătător se „încrețește” sub spatele ramei.
3. **Antebrațul în linie cu țeava** — reculul trebuie să intre drept în braț.
4. Mâna de sprijin la ~**45° în jos**, umple tot golul rămas pe mâner; palmele lipite.
5. **Degetele mari înainte**, spre țintă.
6. Strângi **100% cu ambele mâini** — tare, dar nu până tremuri.
7. Abia acum degetul pe trăgaci: unde cade natural.

### Verificări rapide
- Ridici arma vertical: degetul de pe trăgaci și degetul mare al mâinii de sprijin sunt cam la același nivel.
- Lași degetele de jos: arma rămâne dreaptă.
- Strângi tare și privești cătarea: dacă arma fuge lateral, brațul nu e în spatele ei.
- În poligon: dacă îți tot corectezi priza între focuri, n-ai pornit corect.

### Priza vine din toc
Ce apuci din toc e ce ai. Exersezi priza la fiecare scoatere a armei (fără muniție).

### Forța prizei
Lucrează mâinile de câteva ori pe săptămână: o minge tare pentru încălzire, un gripper (Captains of Crush — la un bărbat adult, de obicei se începe cu nivelul 1), un gyroball. Truc: exersezi cu brațul întins, ca la tragere.

@tool grip Rutina pentru forța prizei

> Arma trebuie să devină o prelungire a corpului, nu ceva ce ții în mână.

Imaginea la ochire înseamnă **unde** pui elementele de ochire (aliniate) pe țintă. Gândește-o ca pe un film, nu ca pe o poză: și tu, și ținta vă mișcați puțin tot timpul.

@anim sight
### Ținerea în centru
Chris ține **în centrul** țintei (center mass), nu sub ea („la ora 6”). Trei motive:
1. **Viteză** — nu calculezi unde să ții.
2. Ținerea la ora 6 se schimbă cu mărimea și distanța țintei.
3. Ochiul găsește singur centrul unei forme, **chiar și când ținta e încețoșată** (cum trebuie să fie).

### Cel mai mic punct
„Țintești mic, ratezi mic.” Împarte ținta în patru și ochește centrul. Apoi încă o dată. La o eroare de 10% pe o țintă mică rămâi aproape de centru; pe una mare poți rata.

### Oscilația
Nicio armă ținută de un om nu stă perfect nemișcată. Asta e normal.
- Dacă alinierea e perfectă, focul ajunge doar cât oscilezi (eroare paralelă).
- Dacă oscilația e mai mică decât ținta și ești pe țintă, lovești.
- Dacă tremuri: pune cătarea în centru și apasă lin. Nu „vâna” momentul.

### Dacă îți tremură mâinile
1. Nu strânge peste 100% — peste puterea ta apare tremurul.
2. Respiră — fără aer apar tremurături în mușchii mici.
3. Relaxează-te: mișcă degetele de la picioare înainte de foc.
4. Pe termen lung: mai puțină cofeină, somn bun, priză mai puternică.

> Imaginea trebuie doar să fie PE țintă. Alinierea trebuie să fie PERFECTĂ.

les({id:'t4',m:'tragere',t:'Alinierea și focalizarea pe cătare',min:7,an:'align',v:['UNRQXRL-1FI','6lMYzJpD4n8','8Rl7J3DM-Bo','b1nDxgNNZZk','nTiI6rfdt8E'],

Alinierea (cătarea față de înălțător) e mai importantă decât orice altceva. Demonstrația lui: cu elementele nealiniate, chiar și o apăsare perfectă ratează. Cu arma prinsă într-o menghină și alinierea perfectă, poți apăsa oricum — lovești. Controlul trăgaciului există doar ca să nu strice alinierea.

@anim align

### Alinierea corectă
- Vârful cătării **la nivel** cu marginea de sus a înălțătorului.
- Cătarea **centrată** în crestătură, cu **benzi egale de lumină** stânga–dreapta.
- La dioptrie (ochitor cu cerc): vârful cătării în centrul cercului.

Nu e nevoie să „măsori” benzile de lumină: când focalizezi intens pe cătare, ochiul le egalizează singur.

### Focalizarea
**Cătarea clară. Înălțătorul ușor neclar. Ținta încețoșată.** Dacă vezi ținta clară, te uiți la ea, nu la cătare.

Semne că nu focalizezi pe cătare: focuri jos, sau îți vezi impacturile în timp ce tragi (te uiți peste elemente ca să vezi gaura).

### Eroarea unghiulară
Exemplul lui: o abatere de 1–2 mm a cătării, la câțiva metri, mută impactul cu centimetri buni. Cu cât ținta e mai departe, cu atât mai mult. Iar linia de ochire scurtă a pistolului amplifică totul.

@anim errors

### Exercițiul „aha”
Ține focalizarea pe cătare până pleacă focul — chiar dacă nu crezi că merge. Când prinzi momentul, tragerea ta se schimbă pentru totdeauna.

### Trage cu ochii
Nu repeta în minte „cătarea, cătarea”. Ține în minte **imaginea** cătării aliniate. Degetul se mișcă doar cât timp vezi imaginea aceea; dacă se strică, degetul așteaptă. Ca pedala de accelerație: dacă pierzi controlul, ridici piciorul, apoi continui.

> Rafinarea imaginii e un proces continuu până la final, nu o aliniere făcută o dată.

### Ochitoarele cu punct roșu
Nu înlocuiesc fundamentele. Învață întâi pe elementele mecanice. La punctul roșu: luminozitate redusă, ca să poți focaliza pe punct, și exersezi și cu optica „moartă”.

### Regula lui
- **Tirurile lungi** (aproape de limita ta sau a armei): tragi în pauza naturală dintre expirație și inspirație.

Pe nas, cu **burta** (diafragma). Dacă la o inspirație adâncă ți se ridică umerii și pieptul, folosești mușchi care nu sunt pentru asta — și îți miști platforma de tragere. Când respiri cu burta, stând în picioare, arma nu se mișcă.

### Două exerciții de calmare
- **Respirația în pătrat (a lui):** inspiri 5 s, ții 5 s, expiri 5 s, ții 5 s — de 5 ori. Oricând ești stresat.

@tool breath Exersează cu ghidul de respirație

! Exercițiile de respirație le faci așezat sau în picioare, pe uscat — niciodată în apă și niciodată la volan.

les({id:'t6',m:'tragere',t:'Controlul trăgaciului',min:7,an:'trigger',v:['YaHpYXHS718','l-ByObJbkVo','UNRQXRL-1FI','xMIYHYh2kqg','5qwFMsPvNYs'],
q:[['Ce încheietură a degetului ții îndreptată spre țintă?',['Vârful','A doua (din mijloc)','Baza'],1,'Dacă încheietura din mijloc rămâne spre țintă, nu poți împinge sau trage arma lateral.'],

Nu „pălmui” trăgaciul. Arma e precisă de la fabrică; treaba ta e s-o lași să fie precisă. Pistolul e mai greu decât pușca: linie de ochire scurtă și trăgaci greu raportat la greutatea armei.

### Pașii lui (rezumat)
1. **Întâi priza.** Apoi degetul cade unde cade natural — fiecare mână și fiecare armă e alta.
2. Eventual puțin mai jos pe trăgaci — pârghie mai bună.
3. **A doua încheietură a degetului îndreptată spre țintă.** Ca arma să se miște din cauza degetului, încheietura ar trebui să se miște lateral.
4. **Pre-tensionezi**: iei jocul liber al trăgaciului.
5. **Tragi cu ochii**: apeși doar cât vezi alinierea corectă.
6. Lin, drept înapoi; simți presiunea pe vârful degetului.
7. Doar degetul lucrează — fără „muls” (strânsul întregii mâini).
8. Degetul rămâne pe trăgaci pe toată secvența de foc.
9. După foc, lași trăgaciul **doar până la reset** și re-pregătești în timpul reculului.

@anim trigger

### Progresia la dry fire
1. Arma descărcată în poală: simți doar cursa trăgaciului, cu ochii închiși.
2. În poziție, cu ochii închiși.

4. Abia apoi, spre o țintă.

### Exercițiul cu creionul
Un creion cu radieră în țeava armei verificate descărcate, aproape de o foaie: la apăsare, creionul lasă un punct. Vezi pe hârtie dacă apăsarea a mișcat arma.

@tool target Ținte de imprimat (și cea pentru creion)

### Lin nu înseamnă încet
Viteza vine din scosul armei, din ochire și din aliniere. Timpul câștigat acolo îl folosești la trăgaci.

> Nu poți „prinde momentul” când cătarea trece prin centru. Lasă focul să vină.

les({id:'t7',m:'tragere',t:'Continuarea și anunțarea focului',min:4,an:'recoil',v:['f7PVB-PF0iE','X-y_hg2TLRI','GtQDN_Qms-w'],
q:[['Ce înseamnă continuarea (follow-through)?',['Cobori arma imediat după foc','Păstrezi toate fundamentele o fracțiune de secundă după foc','Tragi încă un foc'],1,'Platforma, priza, focalizarea rămân la fel și după foc; ești gata pentru încă unul.']],b:`

### Pașii
1. Te oprești din apăsat — nu „zdrobești” trăgaciul.
2. Rămâi relaxat; nu reacționezi la zgomot și la mișcare.
3. Păstrezi platforma, poziția capului și priza.
4. În recul lași trăgaciul **doar până la reset**.
5. Re-pregătești trăgaciul.

### Anunțarea focului
În clipa focului, ține minte imaginea (ca declanșatorul unui aparat foto) și spune unde a lovit, **înainte** să te uiți la țintă. Nu spune „centru” din reflex. Dacă anunțurile tale se potrivesc cu găurile, focalizarea e bună.

### Regula lui
Oricâte focuri ai tras, fii gata pentru încă unul. Nu cobori arma imediat după fiecare foc.

les({id:'t8',m:'tragere',t:'Ochiul dominant și ambii ochi deschiși',min:6,an:'eye',v:['MyjYr5nwOos','wIV6jIWrHJM','j7PBGI3-FEA','8zTL3crH8Ew'],
q:[['Ochiul dominant e întotdeauna cel care vede mai bine?',['Da','Nu — e cel pe care creierul îl „alege”'],1,'Adesea e chiar cel cu vederea mai slabă. E alegerea creierului, nu calitatea ochiului.'],
   ['Ești dreptaci cu ochiul stâng dominant. Ce recomandă Chris?',['Înclini capul spre armă','Muți arma puțin spre ochiul stâng, fără să strici poziția','Închizi ochiul stâng în ultima clipă'],1,'Păstrezi poziția și triunghiul brațelor, doar muți arma în dreptul ochiului dominant.']],b:`
Creierul primește două imagini ușor diferite (ochii sunt la ~6 cm unul de altul) și se bazează mai mult pe una: aceea e a **ochiului dominant**. Cam două treimi dintre oameni au ochiul drept dominant, o treime stângul, foarte puțini niciunul. Nu e neapărat ochiul care vede mai bine.

@anim eye

### Testele de bază
- **Miles:** faci un triunghi mic cu mâinile, brațele întinse, și privești un obiect **mic** (un întrerupător). Închizi pe rând câte un ochi: ochiul cu care încă vezi obiectul în triunghi e cel dominant. Sau apropii încet mâinile de față, cu ochii deschiși: ajung la ochiul dominant.
- **Porta:** la fel, dar arăți cu degetul spre obiect.

@tool eye Fă testul interactiv

### Se poate schimba
Dominanța se poate schimba cu arma în mână (mai ales cu două mâini), la lumină slabă, la distanță sau sub stres. Refă testul în aceste situații.

### Ambii ochi deschiși
- Vezi mai mult, te miști mai sigur; când închizi un ochi, îl afectezi și pe celălalt.
- **Vei vedea două imagini ale cătării — e normal.** Nu scapi de a doua; creierul învață să o folosească pe cea a ochiului dominant. Durează cam o săptămână de exercițiu.
- Întâi înveți cu un ochi închis, apoi cu ambii.

### Trei exerciții (10–15 minute pe zi, o săptămână)
1. Un creion la brațul întins: ochești cu ochiul nedominant închis, apoi îl deschizi fără să miști nimic.
2. Invers: ochești cu ambii deschiși, verifici închizând ochiul nedominant, corectezi.
3. Vârful creionului aproape de ochi, aliniat cu ținta; întinzi încet brațul — focalizarea trece pe vârf.

Ajutor: o bandă adezivă transparentă pe lentila ochelarilor din dreptul ochiului nedominant.

Precizia și viteza sunt ca roțile din față și din spate ale mașinii — ai nevoie de amândouă. Dar ordinea contează.

### De ce precizia întâi
„Nu poți rata destul de repede.” Fiecare glonț are responsabilitate legală, costă, iar timpul în care stai expus e mai lung dacă ratezi. „Rapid e bine. Precis e definitiv.”

### Viteza se întâmplă
Viteza nu se forțează. La fiecare repetare se depune mielină pe traseul folosit; cu cât repeți mai **exact și mai încet**, cu atât traseul corect devine mai rapid. Dacă forțezi viteza, greșești — și creierul izolează greșeala. Iar stresul (bubuitul, cronometrul, reculul, propria minte) intră în traseele încă neizolate.

### Cinci motive pentru care tragi prost când grăbești
1. Nu ai fundația mecanică (platformă, priză).
2. Nu crezi că poți.
3. Punctul natural de ochire e greșit — reculul te readuce în altă parte.
4. Îți schimbi mecanica când grăbești. Ce faci încet trebuie să fie exact ce faci repede.
5. Forțezi viteza în loc s-o lași să vină.

### Unde câștigi timp
Mulți fac invers: scot încet și apoi smucesc trăgaciul. Corect: elimini mișcările inutile la scos (arma vine direct înainte, nu sus și apoi înainte), o duci repede în linia ochilor, **apoi frânezi**, aliniezi și apeși lin.

### Două trucuri
- **Gândește mai repede.** Ritmul pe care îl auzi în minte („bang-bang-bang”) e ritmul cu care tragi. Accelerează-l în minte.
- **Platformă mai agresivă** când vrei să tragi mai repede: mai aplecat înainte, priză mai fermă.

@anim rhythm

> Viteza e un efect al practicii perfecte, nu un obiectiv.

1. Mentalitate negativă.
2. Fără plan.
3. Nu te antrenezi.

Nu are legătură cu religia. Dacă te încurcă cuvântul, spune-i **antrenament pentru creier**. Chris meditează de peste 35 de ani (de la artele marțiale din copilărie), de obicei 15–20 de minute de două ori pe zi.

@anim meditate
### Ce antrenezi de fapt
Abilitatea de a-ți **alege** pe ce te concentrezi. În meditație te concentrezi pe respirație; vin gânduri („am de făcut aia”, „oare fac bine?”). Le observi, le spui în gând „te-am văzut” și revii la respirație. Exact asta faci și în poligon, la concurs sau într-o situație de stres: zgomot, oameni, emoții — și tu alegi cătarea.

### Cum începi
1. Un scaun, tălpile pe podea, spatele sprijinit, capul drept, mâinile în poală.
2. Telefonul pe silențios, un cronometru de **5 minute** (sau 1–3, dacă 5 e mult).
3. Ochii închiși, 5 respirații adânci pe nas, cu burta. Relaxezi umerii și maxilarul.
4. Atenția pe respirație — sau pe un cuvânt simplu („Eu sunt”), sau pe imaginea unui punct negru.
5. Când mintea fuge, revii. Fără supărare.
6. La final, încă un minut de liniște înainte să deschizi ochii.

@tool medit Pornește meditația ghidată

### Sfaturi din cartea lui
- Mai bine 5 minute zilnic decât o oră rar. Dă-i **30 de zile** înainte să judeci.
- Nu imediat după masă și nu chiar înainte de culcare.
- Dacă te deranjează zgomotele: zgomot alb sau muzică liniștită la început.
- **Nu căuta senzații** (plutire, culori). Ca nisipul: dacă strângi prea tare, îți scapă printre degete.
- Dacă nu poți sta liniștit deloc, învață întâi să respiri corect (5 minute pe nas, cu burta), apoi meditezi.

### Progresia stresului
Liniște cu ochii închiși → fără muzică → cu ochii deschiși → într-un loc aglomerat → chiar în poligon → meditație în mișcare.

> Succesul zilei la meditație e unul singur: „Am meditat azi.”

Creierul folosește aproape aceleași trasee când **îți imaginezi** o mișcare ca atunci când o faci. Într-un studiu cu polițiști, cei care au făcut exerciții de imaginație pozitivă au tras mai bine când „adversarul” trăgea înapoi cu muniție de marcare.

Marele avantaj: în minte, **fiecare repetare poate fi perfectă**.

### Cum faci
1. Timp separat, zilnic — înainte sau după meditație — și înainte de un eveniment important.
2. Ochii închiși, corpul și mintea relaxate.
3. Te vezi la nivelul tău maxim — prin ochii tăi sau ca într-un film.
4. **Toate simțurile**: sunetele, mirosul, greutatea armei, textura mânerului, temperatura.
5. **Emoția**: calm, încredere, mândrie la final. Emoția „ancorează” imaginea.
6. Dacă greșești în imagine, derulezi și refaci corect. Poți încetini, mări ținta, rula înapoi.
7. Termini cu o senzație bună.

### Reguli
- Doar lucruri posibile — dar fără să te limitezi: fiecare glonț în centru e posibil.
- **10 minute zilnic** valorează mai mult decât 70 de minute o dată pe săptămână.
- Vizualizează și situații concrete (casa ta, mașina ta, drumul tău), nu doar „o confruntare”.

**Gândul pozitiv e ceva ce faci. Încrederea e ceva ce ai.** Încrederea vine din gânduri pozitive plus rezultate — și se hrănesc una pe alta (cercul încredere–competență).

### Cuvintele creează imagini
„Nu te gândi la un urs alb.” L-ai văzut, nu? Dacă îți spui „să nu ratez”, mintea vede ratarea. Spune ce vrei: „cătarea clară, apăs lin”. Dacă apare un gând negativ, îl întrerupi și îl întorci.

La selecția SEAL, unii **credeau** că vor termina, alții **știau**. Doar cei care știau au terminat.

### Cinci căi spre încredere
1. **Exersează** — fiecare reușită o hrănește pe următoarea.
2. **Vorbește-ți pozitiv** — și în oglindă, privindu-te în ochi.
3. **Mișcă-te** — exercițiul fizic te face să te simți mai puternic.
4. **Asumă-ți riscuri** — înfruntă ceva de care ți-e frică.

Capul sus, umerii înapoi. „Emoția vine din mișcare”: dacă arăți slab, te simți slab și așa ești tratat.

„Bine că s-a întâmplat aici, la antrenament, nu pe stradă.”

### Identitatea
Când progresezi, devii alt om. Acceptă noua imagine („sunt un trăgător bun”, „sunt un om disciplinat”), altfel revii la vechile obiceiuri.

> Gândul pozitiv e un întrerupător: nu produce energia, o eliberează. Tot trebuie să te antrenezi.

Nu te mai învinovăți că nu ești mereu motivat. Corpul e făcut să economisească energie (legea efortului minim). Ca în prima lege a lui Newton: un corp în repaus rămâne în repaus până acționează o forță asupra lui — și forța trebuie să fii **tu**.

### Motivația e un mit — în sensul ăsta
Nu vine de la sine. **Apare după ce începi.** Ca o rachetă: aproape tot combustibilul se consumă la decolare. Ca un tren: greu de pornit, greu de oprit.

### Patru pași
1. **De ce.** Scrie-ți motivul, detaliat, cu emoție. Citește-l zilnic.
2. **Efortul.** Acceptă că va fi greu.
3. **Atitudinea.** Dacă te aștepți să fie ușor, renunți la primul obstacol. Așteaptă-te să fie greu — și știi că poți.
4. **Repetiția.** Zilnic. Progresul vine în timp.

@tool why Scrie-ți „de ce”-ul

### Puterea unui singur grad
Apa nu se schimbă vizibil de la 1 la 99 de grade, apoi la un grad în plus fierbe. Antrenamentul la fel: muncești mult fără să vezi nimic, până când un efort în plus schimbă totul. Nu știi unde e „gradul” tău — deci nu renunța.

### Ținte, nu obiective
Un obiectiv e un punct final; după ce-l atingi, mulți nu mai știu ce să facă. Gândește ca un lunetist: o țintă, apoi următoarea. Iar o greutate neprevăzută e o „țintă de ocazie” — o șansă să devii mai puternic.

> Fie „de asta am eșuat”, fie „de asta am învins”. Motivul tău decide.

### De ce e greu
Obiceiurile proaste dau **plăcere imediată** și **pagubă târzie** (țigara). Cele bune cer **efort acum** și **răsplătesc mai târziu** (antrenamentul). Și nu pățești nimic dacă sari un antrenament — nu te îngrași într-o zi.

Mintea (meditație, natură), inima (familia, prietenii — măcar un telefon), sănătatea (mișcare, somn, mâncare), perfecționarea (o abilitate cu 1% mai bună) și munca pentru viitorul tău. Câte un lucru mic în fiecare, zilnic.

q:[['Care e „a patra reacție” la stres?',['Fuga','Flow — ești prezent, calm și în control','Înghețul'],1,'Pe lângă luptă, fugă și îngheț, Chris adaugă flow — câștigat prin antrenament și prezență.']],b:`
Când exersezi sau execuți ceva important, mulți sunt în trecut („cum am tras data trecută”) sau în viitor („ce vor zice”, „dacă ratez”). Dar **singura clipă în care poți controla rezultatul e acum**: clipa în care pleacă focul.

### Cum devii prezent
Prin meditație. Mintea conștientă se ocupă de un singur lucru odată; subconștientul urmărește sute. Când ești prezent, corpul îți spune singur ce să corectezi — de exemplu, că un punct din priză s-a slăbit. De aceea tu ești cel mai bun instructor al tău.

### Cele patru reacții la stres
- **Lupta** — înțelegi situația și crezi că poți câștiga.
- **Fuga** — înțelegi situația, dar nu poți câștiga.
- **Înghețul** — nu înțelegi deloc situația („căprioara în faruri”): mintea caută un tipar exersat și nu-l găsește.
- **Flow** — ești deja în control: prezent, calm, încrezător. Prezența ta calmă poate schimba singură situația.

Exemplul lui: întâlnești un leu. Poți lupta (dacă ai o armă mare), poți fugi (dacă alergi cu 80 km/h), poți îngheța și spera. Speranța nu e un plan. Sau poți fi atât de prezent și calm încât să nu fii nici prădător, nici pradă.

### De unde vine flow-ul
Din antrenament, meditație și vizualizare. Îngheți doar când n-ai exersat niciodată situația.

> Dacă nu ești conștient de ce se întâmplă în clipa aceasta, nu ai niciun control asupra rezultatului.

q:[['Ce înseamnă să trăiești ca un războinic, pentru Chris?',['Să cauți conflicte','Să iubești ceva atât de mult încât să lupți pentru el','Să fii mereu agresiv'],1,'Gata de luptă, dar căutând pacea. Războinicul luptă pentru cei pe care îi iubește.']],b:`
Pentru Chris, a fi războinic nu înseamnă război. Înseamnă **să iubești ceva atât de mult încât să fii dispus să lupți pentru el** — familia, țara, credința, echipa. Războinicul e gata de luptă, dar caută pacea.

### Trăsăturile „dure”
- **Încrezător** — pornești cu finalul în minte: vei reuși.
- **Puternic** — și la minte: o minte tare compensează un corp slab; invers nu.
- **Îndrăzneț** — energic, direct, decis.
- **Disciplinat** — te trezești devreme pentru antrenament.
- **Activ** — ideile sunt bune; acțiunea face treaba.
- **Curajos** — ți-e frică și o faci totuși.

### Trăsăturile „blânde”
- **Conștient de sine** — te bazezi pe reacțiile tale, nu pe ce e în afară.
- **Răbdător** — suporți fără să te plângi.
- **Modest** — poți fi învățat, poți greși, îți poți schimba părerea.
- **Loial** — „o săgeată fără vârf e doar un băț”: familia, țara, credința îți dau direcția.
- **Cinstit** — în primul rând cu tine.
- **Iubitor** — iubirea pentru cei dragi e energia războinicului.

Fiecare trăsătură are și o parte întunecată (încrederea devine aroganță, îndrăzneala devine agresiune). Echilibrul contează.

### Cinci obiceiuri de războinic
1. „Ia-ți medicamentele” — **MEDS**: meditație, exerciții, dietă, somn.
2. Transformă obiceiurile în ritualuri.
3. Găsește-ți un mentor.
4. Permite-ți să fii vulnerabil (să spui „te iubesc”, să vorbești în public).
5. Ține-ți promisiunile față de tine.

les({id:'m8',m:'minte',t:'Echipa: TEAMS',min:4,v:['H0_HRsJEygU','0DXnNFoFX4c','-Y4pOh3JbjY','QjfkRsZ1pxo'],
q:[['Ce înseamnă „T” din TEAMS?',['Tactica','Asumă-ți responsabilitatea','Timpul'],1,'Take responsibility: dacă găsești de ce e „vina ta”, poți schimba ceva.']],b:`
Ce face echipele SEAL atât de bune nu e un individ extraordinar, ci **echipa**. Chris rezumă asta în acronimul **TEAMS**:

### T — Asumă-ți responsabilitatea
Fără scuze: vântul, arma, vecinul de linie. Scuza poate fi reală, dar ea desparte câștigătorii de ceilalți. Fiilor lui le spune: „Dacă primești un pumn în față, a cui e vina? A ta.” De ce? Pentru că doar dacă e vina ta poți schimba ceva: te ferești, blochezi, nu stai acolo.

### E — Încurajează-i pe ceilalți
Și operatorii de elită sunt oameni. La kilometrul 30 al unui maraton, un străin care strigă „hai, tu cel cu tricou albastru, poți!” schimbă totul.

### A — Cere ajutor (și ajută)
Nimeni nu știe tot. Mândria care te oprește să întrebi poate costa vieți.

### M — Stăpânește-ți propria sarcină
Nu pe a altora. Portarul nu exersează loviturile de colț. Echipa e la fel de puternică precum cea mai slabă verigă — fă ca veriga aceea să nu fii tu.

### S — Sacrifică-te pentru ceilalți
Familia, prietenii, colegii sunt echipa ta. Prietenul trebuie dus la aeroport la 4 dimineața? Îl duci, fără să stai pe gânduri.

les({id:'a1',m:'atentie',t:'Codul culorilor',min:4,an:'colors',v:['5AIGu4DaetM','1kOEiJvodcE','iTd6cqbnx-Q'],
q:[['În ce nivel ar trebui să fii, normal, când ești în public?',['Alb','Galben','Roșu'],1,'Galben: atenție relaxată. Alb (absent, cu capul în telefon) e nivelul de evitat.']],b:`
Codul culorilor (după Jeff Cooper, cu un nivel în plus folosit de pușcașii marini) descrie **cât de atent ești**:

@anim colors

- **Alb** — absent, cu capul în telefon, nu observi nimic. Nu ieși niciodată din casă așa.
- **Galben** — atenție relaxată. Observi oamenii, ieșirile, ce e normal. Normal în public.
- **Portocaliu** — ceva ți-a atras atenția. Cauți informații, îți pregătești un plan („dacă… atunci…”).
- **Roșu** — confruntarea. Acționezi după planul pregătit.
- **Negru** — supraîncărcare de adrenalină: vedere în tunel, auz „închis”, mâini care nu ascultă. De evitat — antrenamentul te ține departe de el.

### Reguli
- Cu cât nivelul e mai sus, cu atât îl poți susține mai puțin timp.
- Știi să **cobori** repede când pericolul a trecut.
- Galbenul nu înseamnă paranoia — înseamnă că trăiești cu ochii deschiși.

### Exemplul lui
Seara, vede un om în umbră lângă drum → portocaliu. Trece strada spre lumină, păstrând distanța. Era un puști speriat care se uita în telefon → înapoi la galben, fără dramă.

> Atenția nu e o poveste de film. E un semnal că ceva nu e în regulă — și se antrenează.

les({id:'a2',m:'atentie',t:'Bucla SEAL',min:4,an:'loop',v:['5AIGu4DaetM','3shEB1q3T9s'],

Mulți cunosc bucla OODA (observă, orientează-te, decide, acționează). Chris spune că de fapt nu e o buclă: e o linie. Bucla lui, **SEAL**, se închide prin învățare:

@anim loop

### S — Vezi (și simte)
Nu doar cu ochii: auzul, mirosul, „senzația” că ceva nu e în regulă. Nivelul de atenție (codul culorilor) decide cât de mult observi.

### E — Evaluează
Unde ești? Unde e celălalt? Ce ai la tine? Pe unde poți ieși? Cine mai e acolo? Ai mai trăit asta? Antrenamentul pe scenarii îți scurtează evaluarea: un „șah mental” de tip „dacă… atunci…”.

### A — Acționează
Faci ce ai decis. Dacă nu acționezi, îngheți: mintea caută un tipar exersat și nu-l găsește.

### L — Învață
După orice situație — chiar și una în care nu s-a întâmplat nimic — o rejoci în minte: ce a mers, ce n-a mers, ce faci data viitoare. Poți porni bucla chiar de aici: un curs, o lecție, o carte.

> Fiecare experiență e o lecție pentru data viitoare.

les({id:'a3',m:'atentie',t:'10 moduri să-ți antrenezi atenția',min:6,v:['5AIGu4DaetM','Xmsn7QfBsRQ','Mz4CRa21DJ4','qlhM5zt4X7o'],
q:[['Care e un exercițiu bun pentru vederea periferică?',['Să te uiți la telefon','Să privești drept înainte și să observi tot ce intră lateral în câmpul vizual','Să închizi un ochi'],1,'Atenția situațională e în mare parte vedere periferică — se antrenează privind fix înainte și observând lateral.']],b:`
Strămoșii noștri trăiau în păduri și câmpii; noi trăim cu capul în ecrane. Atenția se închide — dar se poate redeschide. Cele 10 metode ale lui:

1. **Bucla SEAL** — vezi, evaluează, acționează, învață.
2. **Poziționarea** — în restaurant, cu spatele la perete și intrarea în câmpul vizual; în mulțime, nu te lași înconjurat.
3. **Toate simțurile** — stai pe o bancă, închide ochii și imaginează-ți ce se întâmplă doar din sunete.
4. **Mereu două ieșiri** — când intri undeva, cauți două căi de ieșire și le actualizezi pe măsură ce te miști.
5. **Capul sus** — „pe pivot”. Alergarea pe trasee (nu pe bandă) îți antrenează atenția fără să te gândești.
6. **Meditația** — curăță zgomotul ca să observi ce contează.
7. **Jocuri de observație** — un prieten te întreabă: „câți oameni am depășit? ce purtau? avea cineva pălărie?” La început e greu; apoi devine natural.
8. **Observarea oamenilor** — ghicește ce fac, de ce sunt acolo, ce vor face (o să vireze la stânga?).
9. **Estimarea distanței și a timpului** — „bula” ta de spațiu personal și de siguranță; estimează cât a trecut fără să te uiți la ceas.
10. **Grija de corp** — alcoolul încetinește; mai puțin de 6 ore de somn mai multe nopți la rând îți încetinesc reacțiile cam cât alcoolul; mișcarea îți ține mintea trează.

### Exersează în aplicație
@tool periph Vederea periferică
@tool kim Jocul memoriei (ce lipsește?)
@tool odd Găsește diferitul
@tool timeest Estimează timpul

> Nu trebuie să știi totul ca James Bond. Trebuie să observi că ceva nu se potrivește — și să acționezi simplu.
`});

les({id:'a4',m:'atentie',t:'Prevenția: cea mai bună luptă e cea evitată',min:6,v:['bgXWSCUE7tg','Ft0beU-CuFQ','3shEB1q3T9s','Ek8FRGiXA9Y'],
q:[['Care e cea mai bună cale de a supraviețui unei confruntări violente?',['Să știi să lupți','Să o eviți','Să ai mereu o armă'],1,'Prevenția și dezamorsarea vin înaintea oricărei tehnici.']],b:`
Cea mai bună cale de a câștiga o luptă e să nu ai niciuna. Nu e o idee de „pacifist” — e o idee deșteaptă.

### Cei 3 T
- **Gândește** (Think) — la situațiile TALE reale: casa, mașina, parcarea, drumul cu copiii, noaptea. Nu la scenariile din filme.
- **Antrenează** (Train) — le exersezi, inclusiv în minte.
- **Vorbește** (Talk) — cu familia, ca toată lumea să știe planul (de exemplu, un cuvânt-cod la care copiii vin imediat lângă tine).

Când intri undeva: unde sunt ieșirile? 30 de secunde de plan mental.

### ABC-ul
- **A — Atenția**: meditația, alergarea pe trasee, capul sus.
- **B — Construiește-ți apărarea**: fizic (lumini, încuietori, un corp puternic), spațial (distanța față de străini, tufișurile tăiate lângă casă), mental (încredere, vorbire pozitivă).
- **C — Calmează amenințarea**: dezamorsezi, vorbești calm, pleci.

### Cele 3 F
- **Flow** — prezent și în control, treci prin situație fără să o escaladezi.
- **Fight** — doar dacă nu mai ai altă opțiune; atunci dai totul.
- **Follow up** — după orice situație analizezi și înveți.

### Cei 4 piloni ai supraviețuirii
1. **Mentalitatea** — cel mai important: te pregătești serios, nu tai colțuri, nu renunți.
2. **Atenția** — fără „mie nu mi se poate întâmpla”; atent, fără paranoia.
3. **Priceperea** — tehnici simple, repetate până devin reflex.
4. **Condiția fizică** — inclusiv să poți fugi repede.

! Ca civil, prima opțiune e întotdeauna să eviți confruntarea, să pleci și să suni la **112**. Folosirea forței e strict reglementată de lege.
`});

les({id:'a5',m:'atentie',t:'Casa ta: un plan, nu o armă sub pernă',min:5,v:['daaMNWymjJk','bgXWSCUE7tg','FMgpTa7WKR4','j2Be-CJiG9A'],
q:[['Cineva a pătruns noaptea în casă. Ce faci, ca civil?',['Cauți intrusul prin casă','Suni la 112, fugi sau te baricadezi cu familia într-o cameră și aștepți poliția','Aștepți să plece'],1,'Nu cauți intrusul. Suni la 112, ieși dacă poți, altfel te baricadezi și aștepți poliția.']],b:`
„Am o armă sub pernă” nu e un plan. Planul e ce faci înainte, ca să nu ajungi niciodată să ai nevoie de ea.

### Cinci lucruri care chiar te protejează
1. **Un plan pentru mai multe scenarii** — ce faci dacă ești în pat? în sufragerie? în curte? în baie?
2. **Familia știe planul** — și vecinii buni pot face parte din el.
3. **Exerciții** — ca exercițiile de incendiu cu copiii: îi strigi „foc!” și ei parcurg drumul exersat. Cine a exersat nu îngheață.
4. **Prevenția** — o casă luminată, încuiată, fără scări lăsate afară, e o țintă grea. Hoțul alege casa cu luminile stinse.
5. **Atenția** — când auzi ceva noaptea, încearcă să-ți dai seama ce e.

### Dacă se întâmplă
1. Suni imediat la **112**: spui clar „pătrundere în locuință”, adresa, numele, câți sunteți și unde sunteți în casă.
2. **Cel mai bine ieși** din casă cu familia, dacă poți.
3. Dacă nu poți: vă **baricadați** într-o cameră (mobilă, opritoare de ușă) și așteptați poliția. **Nu cauți intrusul.**
4. Rămâi la telefon cu dispeceratul.

### Planul de baricadare
Alegi dinainte camera (de obicei unde dorm copiii), ai acolo un telefon încărcat și o lanternă, știi ce mobilă poți împinge în ușă. Îl exersezi o dată, ca pe un joc.

! Arma din casă se ține încuiată, cu muniția separat, departe de copii. Gândește-te la pereți: un glonț trece prin pereții de interior.

les({id:'a6',m:'atentie',t:'Primul ajutor SMART',min:7,v:['7Y4skj8ayEA','eUra6fr6Rb8','wpdmAS0IjLQ','oLleBErVdWk','6ZDVOkqwhY4','XsqmjBIu_30'],
q:[['La un rănit care sângerează abundent, ce faci întâi (după ce locul e sigur)?',['Verifici respirația','Oprești sângerarea masivă','Îl muți'],1,'La traumatisme, sângerarea masivă vine înaintea respirației: un om poate pierde critic de mult sânge foarte repede.'],
   ['Cum ceri ajutor ca să funcționeze?',['„Să sune cineva!”','Alegi o persoană, o privești în ochi și îi spui exact ce să facă','Aștepți să vină cineva'],1,'Cererile generale nu funcționează. „Tu, cel cu tricou albastru, sună la 112!”']],b:`
Chris a fost medic de luptă și instructor de paramedici. Sistemul lui pentru traumatisme, până sosesc medicii, se numește **SMART**:

### S — Siguranța locului
Nu deveni și tu o victimă. Privește în jur: ce a provocat rănile? Mai e pericolul activ? Cabluri căzute, trafic, obiecte care pot cădea? **Preia controlul:** alege o persoană, privește-o în ochi și spune-i exact ce să facă: „Tu, cel cu geaca roșie, sună la 112!” Oamenii îngheață; cererile generale nu funcționează.

### M — Sângerarea masivă
Sânge care băltește, curge continuu sau țâșnește. Faci o „căutare” fermă pe tot corpul (inclusiv sub haine și pe spate) și te uiți la mâinile tale. Când găsești o sângerare masivă, o **oprești imediat** — apăsare puternică, pansament, garou pe membru — apoi continui căutarea. „Din cap până în picioare, tratezi pe drum.”

### A — Căile respiratorii
Capul ușor pe spate, bărbia ridicată. Privești pieptul, asculți respirația, simți aerul pe obraz. O rană deschisă în piept (între bărbie și buric) se acoperă etanș.

### R — Reevaluarea
Verifici din nou tot: garoul mai ține? respiră în continuare? Apoi un control rapid din cap până în picioare. Notezi ce găsești și ora pentru echipajul medical.

### T — Transportul
Spre spital, cât mai repede — de obicei cu ambulanța. Dacă bănuiești o leziune la gât sau la coloană, nu-l mișca inutil.

@tool smart Fișa SMART (cu buton de apel 112)

! Aplicația nu înlocuiește un curs. Fă un curs de prim ajutor (de exemplu la Crucea Roșie), unde exersezi practic garoul și resuscitarea. Dacă cineva se prăbușește **fără o rană** (stop cardiac): sună la 112, începe compresiile toracice și cere un defibrilator.

> Doar să privești un video nu salvează pe nimeni. Exersează: căutarea sângerărilor pe un prieten, un garou pe propriul braț.
`});

les({id:'a7',m:'atentie',t:'Supraviețuirea în natură',min:4,v:['VskfMrjfwG4','gPEukQvGlSM'],
q:[['Te-ai rătăcit pe munte și nu știi sigur drumul. Ce faci?',['Mergi până găsești ceva','Rămâi pe loc și lași salvatorii să te găsească (ai anunțat traseul)','Cobori pe valea cea mai apropiată'],1,'Dacă ai lăsat vorbă unde mergi, cel mai sigur e să rămâi pe loc.']],b:`
Într-un interviu la o emisiune de vânătoare, Chris spune că nu există „un singur obiect” care te salvează. Te salvează **planificarea și repetarea** dinainte — exact ca înaintea unei operațiuni.

### Ce planifici
- **Hrana** — compactă și calorică; pentru mai multe zile, un fir și câteva cârlige.
- **Apa** — sursa cea mai curată (curgătoare, nu stătătoare); o fierbi sau o filtrezi; ai nevoie de un recipient. Bea apa pe care o ai ca să ai energia să găsești alta.
- **Adăpostul** — pe munte, frigul vine repede după apus. O pătură de supraviețuire (folie) e adăpost, colector de apă și semnal.
- **Focul** — două surse.
- **Primul ajutor** — contează mai mult să știi ce faci decât ce ai în trusă.

### Prioritățile depind de loc
În deșert, apa întâi. Pe munte, la frig, adăpostul întâi.

### Orientarea
Hartă și busolă exersate dinainte. „Doi înseamnă unul, unul înseamnă niciunul”: două busole. Ai încredere în azimut chiar când poteca pare să ducă altundeva.

### Cel mai important
**Lasă vorbă acasă**: unde mergi, pe ce traseu, când te întorci. Dacă te rătăcești și nu ești sigur de drum, **rămâi pe loc**.

? În România, pe munte: **Salvamont** la 0SALVAMONT (0725 826 668) sau **112**. Aplicația gratuită „Salvamont” trimite locația ta.

les({id:'c1',m:'corp',t:'Tu ești arma: S.E.A.L. și MEDS',min:5,v:['HeTOQALHT-M','lDY5ejF5bzM','w4LnWRfpGv0','huPgm1F4WKI','J-At1zI5kBk'],
q:[['Ce înseamnă MEDS?',['Medicamente zilnice','Meditație, Exerciții, Dietă, Somn','Mers, Echilibru, Dans, Sărituri'],1,'„Ia-ți medicamentele”: meditație, exerciții, dietă, somn.']],b:`
De ce un capitol despre sport și alimentație într-o carte despre tragere? Pentru că Chris nu te învață doar să apeși un trăgaci. **Tu ești arma; armele sunt unelte.** Un fotbalist profesionist se antrenează și mănâncă bine; un maestru de șah doarme bine înainte de turneu. La fel un operator.

### S.E.A.L. — Sleep, Eat And Lift
Somn, mâncare, forță. Beneficiile: mai puțin stres, mai multă încredere, minte mai limpede, reacții mai rapide, rezistență, platformă și priză mai bune, echilibru.

### MEDS — „ia-ți medicamentele”
- **M**editație — ca o defragmentare a creierului.
- **E**xerciții — transpiră în fiecare zi; nu-ți trebuie un plan complicat.
- **D**ietă — mâncare adevărată, puține produse procesate.
- **S**omn — 7–9 ore.

### Antrenamentul funcțional
„Testul stației de autobuz”: poți alerga după autobuz, sări un gard, ridica un om căzut? Forță + cardio + intervale intense + mobilitate. Programul lui (orientativ): înot și alergare; intervale și abdomen; echilibru și mobilitate; arte marțiale și alergare; yoga și abdomen; intervale și echilibru; o zi de pauză.

### Energia
Energia nu vine stând. O creezi mișcându-te: corpul îți dă energie când „crede” că ai nevoie. Nu aștepta să ai chef ca să te antrenezi — antrenamentul îți dă chef.

? Dacă vrei un program complet de forță și condiție fizică, îl ai deja în aplicația ta ZECE.

> Pregătire mentală și fizică întâi, apoi tactici, apoi pricepere, apoi echipament — în această ordine.
`});

les({id:'c2',m:'corp',t:'Somnul — unde se fixează antrenamentul',min:5,v:['ufYY3Fr4j78','BZn3zJgfgtg','4Zb-nHWWb6o','-0l72JgEA_k'],
q:[['Când se consolidează abilitățile exersate?',['În timpul exercițiului','În somn','A doua zi la antrenament'],1,'Ca mușchii care cresc la odihnă: mișcările se fixează în somnul profund.']],b:`
Abilitățile se fixează **în somn**, nu în timpul exercițiului — ca mușchii, care cresc la odihnă. Fără somn bun uiți mult din ce ai exersat. Mai puțin de 6 ore pe noapte, câteva nopți la rând, îți încetinesc reacțiile cam ca alcoolul. Antrenamentul fără somn bun e timp pierdut.

### Cele 7 sfaturi ale lui
1. **Program fix** — mai ales ora de trezire, 7 zile din 7.
2. **Rutină de seară** — începe cu ~2 ore înainte de culcare.
3. **Cameră răcoroasă** — în jur de 16–19 °C.
4. **Întuneric total** — chiar și o lumină mică deranjează.
5. **Respirație pe nas**.
6. **Mișcare zilnică**.
7. **Dacă nu adormi în ~20 de minute**, te ridici și citești o carte (nu ecran), apoi revii.

### Rutina de seară
- Fără ecrane și lumină puternică în ultima oră.
- Fără mâncare grea și fără alcool seara — alcoolul te adoarme, dar strică somnul profund.
- 5 minute: scrii ce ai de făcut mâine, ca mintea să nu mai „țină” lista.
- Patul doar pentru somn.

### Dimineața
Lumină naturală 10–15 minute, cât mai devreme. Îți potrivește ceasul intern.

! Dacă sforăi puternic, te trezești obosit sau ai somnolență mare ziua, vorbește cu un medic.
`});

les({id:'c3',m:'corp',t:'Alimentația și hidratarea',min:5,v:['HeTOQALHT-M','VfgJbLzIWTk','6oa3buWJQr4','2mFsLv_tCBY','hod4B2uTxo4'],
q:[['Care e ideea principală despre alimentație care se regăsește la Chris și la medici deopotrivă?',['Mănânci doar carne','Mâncare adevărată, puțin zahăr și puține produse ultraprocesate','Nu mănânci deloc'],1,'Restul (post, uleiuri, suplimente) sunt opiniile lui — discută-le cu un medic.']],b:`
Chris are opinii puternice despre alimentație. Unele sunt acceptate de toată lumea, altele sunt **opinii personale**. Le despărțim cinstit.

### Ce e solid
- **Mâncare adevărată**: carne, pește, ouă, legume, fructe, nuci, ulei de măsline extravirgin.
- **Puțin zahăr** și puține produse ultraprocesate.
- **Grăsimi sănătoase** — creierul e făcut în mare parte din grăsimi.
- **Apă** — destulă, mai ales la efort și pe căldură.

### Ce sunt opiniile lui
- **Postul intermitent** (o fereastră de mâncare de 10–12 ore sau mai scurtă): spune că îi dă claritate și energie. Dacă încerci, mergi treptat.
- Evitarea totală a uleiurilor din semințe.
- Diverse suplimente.
- Experimente ca alergatul lung fără apă.

! Postul și schimbările mari de dietă nu sunt potrivite pentru oricine (diabet, medicamente, efort mare, tineri în creștere). Discută cu un medic sau nutriționist. Pe căldură și la efort lung, hidratarea e obligatorie.

les({id:'c4',m:'corp',t:'Forța prizei',min:4,v:['4vyQMJqKPYY','zlAfIw13JQ4','34PvsU4rf_E','de4HCkDxWpo'],

- Gyroball-ul lucrează degetele, încheietura și antebrațul; un aparat cu rezistență pe fiecare deget îți arată degetul slab.

les({id:'c5',m:'corp',t:'Antrenamentul ochilor',min:6,an:'brock',v:['9B-ZUHSoqBI','pnsxnIQsgKg','IfrTqhovDmQ','-OSDaPed7L0','ik3bytus9Os'],

Ochii au mușchi și se antrenează ca restul corpului — la orice vârstă. La SEAL, Chris le spunea elevilor că **trebuie** să focalizeze, dar nu-i învăța **cum**. Asta a schimbat după ce a studiat cum funcționează ochii.

### Sfoara Brock (sfoara de focalizare)
Antrenează ochii să lucreze împreună (convergența) — exact ce faci când focalizezi pe cătare.

@anim brock

1. O sfoară de ~3 m cu 3 mărgele colorate (lipite, ca să nu alunece).
2. Legi un capăt de ceva fix, puțin **sub nivelul ochilor**; celălalt îl ții la rădăcina nasului, întins.
3. Prima mărgea la ~15 cm. O privești: trebuie să vezi **două sfori care se încrucișează în X exact pe mărgea**.
4. Dacă X-ul e în fața sau în spatele mărgelei, mai încerci. Truc: „cațără-ți” privirea pe mărgea.
5. Muți focalizarea pe mărgeaua din mijloc, apoi pe cea departe, apoi înapoi — de fiecare dată **clar**, nu doar o privire.
6. Lucrezi și la distanța cătării (brațul întins). Apoi apropii mărgeaua până la ~3 cm, rotești ușor capul.

Varianta „avansată”: mărgele negre, pătrate, cu un semn alb — ca o cătare.

@tool brock Ghidul pas cu pas pentru sfoară

### Alte exerciții
- **Aproape–departe**: o foaie cu scris mic aproape și un text departe. Complet clar pe unul, apoi complet clar pe celălalt.
- **Urmărire**: cercuri cu ochii **urmărind** vârful unui pix (nu mișcări la întâmplare) — ochii învață să urmărească o țintă.
- Dimineața, clătește ochii închiși cu apă călduță.
- Timp afară, privind la distanțe variate.

! Nu privi niciodată direct în soare. La lumină puternică poartă ochelari cu protecție UV; în poligon, ochelari de protecție obligatoriu. Pentru orice problemă de vedere, mergi la oftalmolog.

> Dacă exercițiul e greu, înseamnă tocmai că ai nevoie de el.

les({id:'o1',m:'operatii',t:'Scosul cu elastic',min:5,an:'draw',v:['HGFsm_Zcxzc','X-y_hg2TLRI','N3i0bOo4AO0','_afw6CzqlrE'],
q:[['De ce „elastice” imaginare?',['Ca să fie mai lent','Ca scosul să fie o singură mișcare fluidă, cu oprire lină la final','Ca să arate bine'],1,'În loc de 4 poziții separate, o mișcare continuă: trasă spre țintă, frânată lin de elasticul din piept.']],b:`
Scosul clasic are 4 poziții separate: priza în toc → arma afară și rotită spre țintă → mâinile împreună la piept → împins spre țintă. Chris le leagă cu **elastice imaginare**:

- un elastic trage gura țevii **spre țintă**;
- unul leagă spatele armei de **centrul pieptului** — te frânează lin la final, ca să nu te oprești brusc;
- unul o ține aproape de **toc** la plecare.

Rezultatul: **o singură mișcare fluidă**, pe linia mediană, cu oprire lină când elementele ajung în linia ochilor.

@anim draw

### Principiile
- **Ce apuci din toc e ce ai.** Priza bună se ia în toc.
- Mâna merge spre armă ca un reflex, pe un arc, cu cotul înapoi.
- **Privirea nu se mișcă.** Arma vine la ochi, nu ochii la armă.
- Mâna de sprijin așteaptă la centrul pieptului; mâinile se întâlnesc unde bați din palme.
- **Scosul repede, apăsarea lină** — mulți fac invers.
- Nu porni mereu cu mâinile „ca un ninja” — exersează din poziții obișnuite (ții ceva în mână, scrii, ai mâinile în buzunar).

### Unde pui tocul
Iei priza perfectă, apoi duci mâna acolo unde ajunge natural — acolo e tocul. Nu îți reînveți mâna după toc.

### Cum exersezi
Împarți scosul în 4 bucăți (mâna la armă, ieșirea din toc, mâinile se întâlnesc, împinsul), le vizualizezi, le exersezi pe rând până sunt perfecte, te filmezi, apoi le legi. Până la un standard: „15 scoateri perfecte”.

! Doar cu armă de antrenament sau descărcată verificat, cu muniția în altă cameră.

les({id:'o3',m:'operatii',t:'Schimbul de încărcător și incidentele',min:5,v:['ndLVmgFGvyY','L-l1pozsUyE','_XljDlZq7ig'],
q:[['Care e cauza numărul 1 a incidentelor, după Chris?',['Muniția','Încărcătoarele (buze îndoite)','Arcul'],1,'Încărcătoarele. Le numerotezi ca să afli care e defect.']],b:`

les({id:'o7',m:'operatii',t:'Lumina slabă',min:4,v:['MyjYr5nwOos'],b:`

### Exersează ce faci 99% din timp
Mersul prin propria casă pe întuneric: unde sunt umbrele, oglinzile, sursele de lumină, ce scârțâie. Avantajul tău e că îți cunoști casa. Totul întâi ziua, apoi noaptea.

les({id:'o8',m:'operatii',t:'Stresul în antrenament',min:4,v:['tOBWOP4_s-Y','nTiI6rfdt8E','Yr5Vj5OyOMU','BOk9VaOaIVE'],
q:[['Când adaugi stres în antrenament?',['De la prima zi','După ce mișcarea e corectă și fluidă, fără stres','Niciodată'],1,'Întâi traseul curat, fără stres; apoi stresul, treptat.']],b:`
Se spune că sub stres pierzi abilitățile fine (focalizarea, trăgaciul). Chris nu e de acord: piloții de vânătoare apasă butoane mici la viteze uriașe — **prin antrenament**. Stresul îi afectează diferit pe oameni, în funcție de cât de bine și-au construit traseele.

1. Întâi mișcarea, **fără stres**, încet, perfect, acasă — până traseul e bine „izolat”.

Exemplul lui cu baschetul: dacă știi că va trebui să arunci cu ochii închiși, nu începi cu ochii închiși. Arunci perfect cu ochii deschiși, din același loc, de sute de ori. Abia apoi închizi ochii — și mingea intră.

### Cum adaugi stres
- **Efort fizic** înainte: sprinturi, genuflexiuni cu săritură, kettlebell — pulsul sus, apoi exersezi scosul cu arma de antrenament.
- **Cronometrul** — semnalul sonor e un stres mic.
- **Airsoft** cu parteneri, organizat, cu mască și reguli — scenarii pe care poligonul nu le permite.
- Concursuri.

! Airsoft-ul cu parteneri se face doar organizat, cu ochelari/mască de protecție și reguli clare de siguranță.

> Sub stres nu te ridici la nivelul ocaziei. Cazi la nivelul antrenamentului.

les({id:'o9',m:'operatii',t:'O mână, mâna cealaltă și carabina',min:5,v:['s0PNAMkipYA','t2qCwhjUigQ','A_afe0h-0NI','j7PBGI3-FEA'],b:`
### Cu o singură mână
De ce: mâna rănită, ții un copil, te sprijini de o balustradă. Statistic, în multe schimburi reale de focuri oamenii au tras cu o mână.

Îi spui „mâna de sprijin”, nu „mâna slabă”. Când treci pe ea, **oglindești tot**, inclusiv picioarele.

### Carabina în picioare
- Patul în piept, **direct sub ochiul dominant** — nu agățat pe umăr, în lateral.
- Mâna de pe mâner ca la pistol: sus, încheietura dreaptă.
- Mâna de sprijin **cât mai în față**, cu o parte a mâinii deasupra armei.

Lecția vine din cartea **„Two-Person Close Quarters Tactics”** (Book 02 din folderul tău). N-o scrie Chris Sajnog, ci o firmă americană, Special Tactics. E scrisă pentru civili înarmați legal și agenți de pază și explică cum lucrează doi oameni împreună în spații închise: la uși, pe holuri, pe scări, pe afară.

Aici găsești **principiile** — cum gândesc profesioniștii. Mișcările exacte se învață doar cu instructor, în cadrul instituției, pentru că, învățate singur din carte, pot duce la accidente grave.

! Chiar cartea spune: ca civil, **prima opțiune e să eviți confruntarea**, să fugi și să aștepți poliția. Tehnicile sunt pentru ultima situație, când viețile sunt în pericol și nu mai există altă cale.

### De ce lucrul în doi e periculos
Cel mai mare risc nu e adversarul, ci **partenerul tău**: doi oameni neantrenați împreună se pot răni unul pe altul. Antrenamentul și repetițiile împreună sunt singura protecție.

### Principiile
1. **Niciodată prin fața țevii partenerului.** Fiecare știe în orice clipă unde e celălalt.
2. **Nu de o parte și de alta a aceleiași uși**, dacă se poate evita: dacă iese cineva pe ușă, ați trage unul spre altul.
3. **Ușa e locul cel mai periculos.** Nu stai în dreptul ei și nu zăbovești lângă ea; treci repede și în liniște. Adversarii tind să tragă spre uși și spre pereții din jurul lor.
4. **Vezi cât mai mult din afară.** O cameră pe care o poți verifica din exterior nu trebuie neapărat intrată.
5. **Distanța potrivită între voi.** Destul de aproape ca să vă coordonați, destul de departe ca o singură rafală să nu vă lovească pe amândoi și să nu vă împiedicați unul de altul.
6. **Un semnal simplu, stabilit dinainte.** De exemplu, o strângere fermă a brațului — nu o atingere ușoară, care poate fi confundată. Apoi aștepți o clipă, ca partenerul să-și pună mâinile înapoi pe armă.
7. **Fiecare își știe rolul.** Unul observă direcția principală, celălalt spatele și laturile. Vă adaptați unul după altul („curgere liberă”), dar după reguli exersate.
8. **Încet și deliberat.** Scopul e supraviețuirea, nu viteza.
9. **Cel care sprijină stă la distanță sigură**, ca să nu fiți loviți amândoi și să poată reacționa.

### Cum se exersează
- **Cu persoana alături de care ai fi** într-o urgență: soția, fratele, colegul.
- **Sesiuni scurte de 15 minute**, regulate, bat sesiunile lungi și rare.
- **„Treci prin mișcări”** fără foc real: arme albastre sau airsoft, prin propria casă, încet.
- Gândiți dinainte scenarii (cine unde doarme, unde vă adunați, ce cameră baricadați).
- Tragerea de precizie se exersează separat, în poligon, cu instructor.

### Pătrundere în casă
1. Suni imediat la **112** și spui: „pătrundere în locuință”, numele și adresa, chiar dacă nu te întreabă.
2. Spui câți sunteți, unde sunteți și cum sunteți îmbrăcați — ca poliția să vă recunoască.
3. **Fuga e de obicei cea mai bună opțiune.** Dacă nu puteți, vă baricadați într-o cameră (mobilă, opritoare de cauciuc pentru ușă) și așteptați. **Nu trebuie să găsiți intrusul.**
4. Planul de baricadare îl exersați dinainte: verificați că mobila chiar poate fi mutată repede.

### Atac armat într-un loc public
1. Imediat la pământ, în spatele a ceva **solid** — nu tufișuri, lemn subțire sau pereți de gips-carton, prin care trec gloanțele.
2. Nu te ridica să cauți trăgătorul. Evaluează din spatele acoperirii și pleacă pe cea mai sigură cale.
3. Sună la 112 când ești la adăpost.
4. Când vine poliția: mâinile goale și la vedere, urmezi întocmai instrucțiunile.

### Triada de luptă
Cartea pornește de la trei piese care trebuie să existe împreună:
1. **Mânuirea armei** — scosul, încărcarea, reîncărcarea, descărcarea, incidentele, pozițiile de pregătire, toate în siguranță.
2. **Precizia** — alinierea elementelor de ochire în timp ce apeși trăgaciul fără să le strici.
3. **Mentalitatea** — mintea e arma adevărată. Arma, calibrul sau tocul contează mai puțin decât starea ta de spirit.

Oricine cu o coordonare obișnuită poate scoate arma și lovi o țintă la 7 metri în 1,5 secunde. Întrebarea e dacă o poate face când viața lui chiar e în joc. Aici intră mentalitatea.

### Principiile apărării (după Jeff Cooper)
Primul capitol al cărții e construit pe lucrările lui Jeff Cooper. Codul culorilor îl ai deja în lecția „Codul culorilor”. Restul principiilor:
- **Vigilența.** Știi ce e în jurul și în spatele tău. Observi ce nu se potrivește („ce e greșit în imaginea asta?”). Ai încredere în instinct: „stomacul n-are orgoliu”.
- **Hotărârea.** Alegi o variantă corectă și o duci la capăt fără ezitare. Cine ezită pierde.
- **Agresivitatea.** Nu începi tu niciodată un atac. Dar dacă ești atacat, răspunsul trebuie să fie copleșitor. Frica se poate transforma în furie: „n-are dreptul să-mi facă asta”.
- **Viteza.** Lupta perfectă se termină înainte ca perdantul să înțeleagă ce se întâmplă.
- **Sângele rece** (și, cu arma, precizia). Furia controlată nu te încetinește. Dacă știi că poți și că trebuie să-ți păstrezi capul, de obicei îl păstrezi.
- **Fermitatea.** Atacul trebuie oprit, fără jumătăți de măsură — dar nu mai lovești după ce agresorul nu mai e o amenințare.
- **Surpriza.** Faci ce nu se așteaptă agresorul. El nu se așteaptă să te aperi.

! În România, legitima apărare (art. 19 din Codul penal) cere un atac **material, direct, imediat și injust**, iar apărarea trebuie să fie **proporțională** cu gravitatea atacului. Principiile de mai sus nu înlocuiesc legea — o completează. Prima opțiune rămâne mereu să eviți confruntarea.

### Doctrina de securitate personală
Autorii o rezumă în trei chei:
1. **Mentalitatea „de stradă”.** Defetismul te învinge. Îți asumi faptele: ce faci într-o secundă va fi analizat de alții mult timp. Nu arăta ca o pradă. Abilitățile se pierd — antrenamentul trebuie să fie continuu.
2. **Analiza amenințării.** Ce fel de pericol e plauzibil unde trăiești (spargere, tâlhărie pe stradă, furt din mașină)? Ora (după lăsarea întunericului crește riscul), evenimentele publice, zonele cu probleme.
3. **„Meseria”.** Antrenament cu ce ai la îndemână, distanță și mișcare. Schimbi rutele ca să ocolești zonele periculoase, observi dacă ești urmărit, eviți situațiile periculoase de fiecare dată când poți.

> Fii pregătit, nu paranoic. Repetă în minte „ce fac dacă…?” — e gratis și te face mai rapid la decizie.

Frica e unul dintre cei mai mari motori ai omului. Cartea o împarte în trei componente:
1. **Anticiparea** — neliniștea dinainte, „al șaselea simț”.
2. **Chimia** — cocktailul de adrenalină din corp.
3. **Comportamentul** — ce faci efectiv.

Frica are nevoie de timp ca să crească, iar fiziologic seamănă mult cu furia. De aceea autorii spun că **furia e antidotul fricii**: dacă îți cunoști reacțiile, le poți îndrepta într-o direcție utilă.

### Reacția de sperietură
Prins nepregătit, capul intră între umeri, iar unii „îngheață”. Pare instinct, dar e o reacție învățată — și se poate reantrena.

### Ce face corpul
- Adrenalina, cortizolul și dopamina mută sângele din piele, din extremități și din stomac spre **mușchii mari** (forță și viteză). De aici greața și mâinile mai puțin îndemânatice — de aceea autorii pun accent pe **mișcări mari, simple**.

- **Auzul se „închide”**: împușcăturile pot suna înfundat sau deloc.
- **Vederea în tunel**: vezi clar doar arma adversarului, restul se încețoșează.
- Totul poate părea **cu încetinitorul** și pierzi noțiunea timpului și a distanței.
- **Negarea**: „chiar mi se întâmplă mie?”. Cine rămâne blocat aici pierde.
- Deciziile se iau altfel decât la calm.

### Cum o controlezi
1. **Încetinești respirația** — respirația tactică.
2. **Prioritizezi amenințările.** Cum mănânci un elefant? Bucată cu bucată.
3. **Vizualizezi** ce trebuie făcut ca să oprești atacul.
4. **Acționezi.**

Autorii fac o distincție pe care puține cărți o fac: **regulile administrative ale poligonului** („range-isme”) nu sunt același lucru cu **siguranța armelor**.

### De ce contează diferența
Multe reguli de poligon există ca să limiteze ce poate face trăgătorul, ca să nu aibă ocazia să greșească. Efectul secundar: oamenii învață să aștepte comenzi și **nu mai gândesc singuri**. Iar înaintea aproape oricărui accident, autorii au auzit aceleași trei fraze: **„n-am crezut…”, „n-am știut…”, „n-am văzut…”**. Toate se reduc la una: **„n-am gândit”**.

Exemplul lor: la descărcarea de la final, unele poligoane cer să lași încărcătorul să cadă pe jos, „ca să nu-l bagi în buzunar și în luptă”. Autorii spun că un antrenament bun nu înseamnă să faci totul într-un singur fel, ci **logic**: la final, „administrativ”, nimeni nu trage în tine și nu ești pe cronometru. Ce contează e să ai semnale clare care separă exercițiul tactic de partea administrativă.

? Asta nu înseamnă că ignori regulile poligonului. Le respecți întocmai — e locul altcuiva și responsabilitatea instructorului. Doar înțelegi **de ce** există fiecare.

### Siguranța principală
Nu e piedica mecanică. E **creierul legat de degetul arătător**, care stă pe ramă până decizi să tragi. O tresărire de spaimă strânge mâna; dacă degetul e pe trăgaci sau pe gardă, pleacă focul. Dacă e pe ramă, nu.

### Detalii care fac diferența
- **„În bătaie” nu e mereu o direcție sigură.** Direcția sigură e cea în care un foc accidental nu poate răni pe nimeni și nu poate strica nimic.
- Când cineva îți vorbește, tendința e să te întorci spre el cu arma în mână. **Arma în toc întâi**, apoi te întorci.
- Nu legeni pistolul într-o mână. Nu te întorci niciodată cu arma în mână pe linia de tragere.
- Degetul afară de pe trăgaci și din gardă la reîncărcări, la incidente și când te muți de pe țintă.
- **Oricine** poate cere încetarea focului dacă vede ceva periculos.
- La descărcare: vezi pământul prin lăcașul încărcătorului, verifici camera **de două ori**, iar pe întuneric o pipăi cu degetul mic.

### Trusa de poligon
- O trusă medicală și știi unde e.
- Un telefon cu numerele de urgență și o fișă completată dinainte: cine, ce, unde — ca să nu cauți adresa în panică.

Un capitol întreg al cărții e despre **kineziologie** — cum se mișcă de fapt corpul. Ideea centrală e simplă și foarte utilă.

### Instinct sau tipar învățat?
Un instinct e moștenit. Un **tipar învățat** a fost repetat atât de mult încât pare automat. Reacția la sperietură, de exemplu, pare instinct, dar e învățată: când decidem să înfruntăm un pericol, ne întoarcem cu fața spre el, puțin ghemuiți, ca să folosim tot câmpul vizual, brațele și picioarele. De aceea autorii preferă **isoscelul modificat**: e exact poziția în care corpul ajunge oricum — ca un boxer sau un fundaș.

### Economia mișcării
Cea mai scurtă cale între două puncte e linia dreaptă. Oamenii caută natural să obțină cât mai mult cu efort minim — iar asta se poate rafina la fiecare antrenament.

### Împrumută mișcări pe care le faci deja
Cel mai valoros sfat din capitol: în loc să înveți o mișcare nouă, **adaptezi una pe care o faci de mii de ori**. Avantaje:
1. Se învață ușor — de fapt n-o înveți, doar o adaptezi.
2. Se stăpânește repede și constant.
3. Rezistă sub stres.

Trei exemple din carte:
- **Cât de întinse brațele?** Ca atunci când dai mâna cu cineva sau iei un pix întins de altcineva — cotul are aceeași mică îndoire.
- **Cât de aproape aduci arma la reîncărcare?** Până unde poți citi scrisul de pe închizător — ca atunci când iei o conservă de pe raft și citești eticheta. (Dacă porți ochelari de citit, acolo unde citești cu ei.)
- **Cum iei încărcătorul?** Ca atunci când scoți telefonul din buzunar și te uiți la el: mâna intră, apucă, cotul coboară și aduce obiectul în fața ochilor.

### Cinci factori care îți schimbă platforma
1. **Mărimea** — un om mic, cu mâini mici, ține altfel arma și poate avea nevoie de o poziție mai agresivă.
2. **Forța** — cine are brațe mai slabe tinde să nu le întindă complet; se corectează cu exercițiu.
3. **O problemă fizică** (umăr, spate) — te apropii cât poți de modelul ideal.
4. **Vederea** — fără vedere corectată, poate fi nevoie să ții arma mai aproape sau mai departe.
5. **Confortul** — dacă o poziție te deranjează, o tot ajustezi și pierzi consecvența. „Foiala” cu priza între focuri arată de obicei un pistol care nu ți se potrivește în mână.

? Pistoalele vin reglate din fabrică. Înainte să muți înălțătorul, verifică-ți priza: potrivește-ți mâna după pistol, nu pistolul după mână.

### Mersul cu arma, pe scurt
Deplasarea fără armă o ai în lecția „Deplasarea: întâi fără armă”. Cartea adaugă trei observații:
- **Bazinul privește în direcția de mers.** Corpul merge confortabil acolo unde e orientat bazinul.
- Singura schimbare reală față de mersul normal e **o îndoire ceva mai mare a genunchilor**. De la talie în sus, platforma rămâne cea de pe loc. Postura, ritmul și lungimea pașilor se adaptează doar cât e nevoie.
- **Acceptă oscilația**, dar urmărește-i forma: pe verticală e normală. Grupele întinse pe **orizontală** arată un mers răsucit, „legănat”.

Nu încerca să sincronizezi focul cu pașii — e nerealist. Tragi când elementele sunt pe țintă.

> Antrenează-ți instinctele naturale, nu lupta împotriva lor.

les({id:'p5',m:'pistol',t:'Poziții: în genunchi, culcat, șezând, pe spate',min:5,
q:[['Tragi după un colț spre dreapta, din genunchi. Ce genunchi pui jos?',['Stângul','Dreptul — cel de pe partea spre care tragi, ca să te expui mai puțin'],1,'Genunchiul de pe partea pe care ieși de după acoperire te ține mai strâns lângă ea.'],
   ['Ce trebuie să ai mereu în minte când tragi de pe spate?',['Unde îți sunt picioarele și genunchii — să nu fie în linia de tragere','Să ții capul ridicat'],0,'De pe spate, picioarele și genunchii ajung ușor în fața țevii. „Nimic nu doare mai tare decât o rană făcută de tine.”']],b:`
Chris descrie platformele de bază (în picioare, genunchi, culcat). Cartea lui Lawrence și Pannone adaugă detaliile practice pentru fiecare.

### În genunchi
- E foarte bună tactic: te poți ascunde după o acoperire joasă și poți ieși pe stânga, pe dreapta sau pe deasupra.
- Ca să ajungi la ea repede și la fel de fiecare dată: **înlocuiești piciorul de pe partea armei cu genunchiul**.
- Când tragi după un colț, pui jos **genunchiul de pe partea spre care ieși** (spre dreapta → genunchiul drept). Te expui mai puțin.
- Varianta pe un genunchi îți permite să te ridici și să pleci. Cea pe doi genunchi e mai stabilă pentru ținte îndepărtate.
- Te poți lăsa în genunchi și ca să tragi ușor în sus într-un loc aglomerat, astfel încât un glonț care trece de țintă să nu-i lovească pe cei din spate.

### Culcat
- Culcat pe o parte („rollover”), cu **brațul armei în linie cu corpul**: reculul intră drept, iar profilul e foarte jos. Dacă îți trebuie puțină înălțime, ridici un genunchi.
- Sprijinit „pe coate, ca în filmele western”, pierzi controlul reculului.
- Cobori controlat: pui mâna liberă jos puțin în fața locului unde vrei să ajungă pieptul.
- Exersează și reîncărcările, și incidentele **în poziție culcat** — acolo nu mai seamănă cu nimic din ce faci în picioare.

### Șezând
- Scosul de pe scaun e identic cu cel din picioare. „Consecvență înseamnă precizie.”
- Așezat pe jos: **oasele cotului se sprijină pe interiorul genunchilor**. Te țin oasele, nu mușchii — poți sta mult fără să obosești.

### Pe spate
Pentru când ai ajuns la pământ, rănit sau doar dezechilibrat.
- Picioarele cât mai lipite de pământ și **știi tot timpul unde sunt**, mai ales când urmărești o țintă care se mișcă.
- Varianta cu genunchii îndoiți îți protejează trunchiul, dar ai grijă la genunchi.
- Te poți roti pe spate ca să urmărești o amenințare nouă.

### Cu o singură mână — varianta lor
Aici autorii diferă de Chris. Chris păstrează platforma neschimbată și doar „scoate” mâna de sprijin. Cartea recomandă:
- un **pas în față**, cu partea armei spre țintă, ca reculul să intre prin braț în piept;
- încheietura bine blocată;
- arma ușor **înclinată spre interior, cel mult 45°** (sau dreaptă, ca de obicei) — înclinarea lasă mușchii mai puternici ai antebrațului să țină reculul;
- dacă celălalt braț e rănit, îl strângi la piept, ca să te stabilizezi.

Exersează ca să afli unde lovești: unii trebuie să țină puțin mai jos.

? Încearcă ambele variante în dry fire, filmează-te și păstrează ce îți iese consecvent. Ambele școli spun același lucru despre unelte: pui în trusă ce funcționează pentru tine.

! Toate pozițiile se exersează întâi cu armă de antrenament. Din poziții joase, țeava trece ușor peste propriile picioare — fii atent.

les({id:'p6',m:'pistol',t:'Prezentarea, pregătirea și întoarcerile',min:5,
q:[['Ce poziție recomandă autorii pentru așteptare?',['Sus pregătit, cu țeava în sus la 45°','Poziția 3 a scosului — arma în față, cu ambele mâini, cătarea la marginea privirii','Arma în toc, mereu'],1,'Din poziția 3 ești imediat gata. Poziția cu țeava în sus o consideră nesigură lângă colegi și sub stres.'],
   ['Cât timp rămâi în prezentarea completă după ce ai terminat?',['Cât vrei','Cel mult 6–8 secunde, apoi revii la poziția 3','Un minut, ca să fii sigur'],1,'Brațele întinse obosesc și îți închid câmpul vizual. După angajare: respiri, privești în jur, verifici arma, revii la 3.']],b:`
Scosul în patru poziții îl știi de la Chris (cu „elasticele” lui). Lawrence și Pannone îl descriu tot în patru pași, dar insistă pe ce se întâmplă **între poziția 3 și 4** și **după** foc.

### Cei patru pași, pe scurt
1. **Mâna pe armă** — singura ocazie de a lua priza corectă. Cât de repede poți corect.
2. **Arma iese** și se îndreaptă imediat spre amenințare, în timp ce vine spre mijlocul corpului. Tot cât de repede poți.
3. **Mâinile se întâlnesc**, țeava spre amenințare, degetul afară — dacă n-ai decis să tragi. Umerii relaxați, capul drept.
4. **Prezentarea completă** — cea mai precisă poziție.

### De la 3 la 4: „pe o șină”
Arma merge **drept spre țintă, ca pe o șină**, cu viteză medie. Așa, dacă e nevoie, poți trage înainte să ajungi la brațele întinse. Trăgaciul, mișcarea, alinierea și imaginea se întâlnesc **exact când brațele ajung la capăt**.

La pistoalele cu acțiune dublă (trăgaci lung și greu) — și, mai ușor, la Glock — autorii descriu o tehnică avansată: odată decis să tragi și cu țeava pe țintă, începi să iei jocul și să apeși **în timp ce împingi** arma de la 3 la 4, ca focul să plece fix la final.

! Tehnica de mai sus se învață doar în dry fire, încet, și numai după ce controlul trăgaciului e solid. „Dacă ai dubii, n-o face”: întinzi întâi brațele, apoi apeși lin. Degetul intră pe trăgaci doar când ai decis să tragi și ești pe țintă.

Exercițiul „poziția 3 la 4” e, după carte, cel care trebuie stăpânit înainte de orice progres în viteză sau precizie.

### Poziția de așteptare
Autorii nu predau poziția cu țeava în sus la 45°: lângă colegi și sub stres, riscul unui foc accidental spre capul cuiva e prea mare. Nici poziția joasă nu o folosesc ca regulă. Recomandă **poziția 3**: arma în față, cu ambele mâini, sub ochiul dominant, cătarea la marginea privirii — gata imediat.

### După ce ai terminat
1. Rămâi în prezentarea completă **cel mult 6–8 secunde**.
2. Degetul afară de pe trăgaci (doar dacă problema s-a rezolvat).
3. **Inspiri și expiri.**
4. Cobori țeava 2–3 centimetri și privești „cu trei ochi” — ai tăi și țeava. **Întorci capul** cu adevărat la stânga și la dreapta, ca să rupi vederea în tunel.
5. Revii la poziția 3, **verifici starea armei** (închizătorul complet în față), pui piedica sau decoci, dacă arma ta are.
6. Privești **peste umeri**, în spate.

### Întoarcerile: P.R.A.
**Percepi** (întorci capul), **recunoști** amenințarea (începi întoarcerea), **achiziționezi** ținta cu elementele de ochire.
- Te întorci pivotând pe pernuța piciorului spre care te întorci (spre stânga — piciorul stâng), iar celălalt picior se oprește direct în poziția de tragere.
- La 180°, direcția în care îți întorci capul e direcția în care se întoarce corpul.
- Dacă scoți arma în timpul întoarcerii, **țeava nu ajunge orizontală până nu ești orientat spre amenințare**.
- Dacă cineva nevinovat îți trece prin fața țevii, **îndoi încheieturile** și cobori țeava până trece.

les({id:'p7',m:'pistol',t:'Reîncărcările: tactică și rapidă',min:5,
q:[['Când faci reîncărcarea tactică?',['Când închizătorul a rămas în spate','Când ai un moment de răgaz și vrei arma plină înainte să te miști, cu cartuș pe țeavă','Niciodată'],1,'E mai sigur să reîncarci cu un cartuș pe țeavă: poți trage oricând. Reîncarci când poți, nu când ești obligat.'],
   ['Unde pui încărcătorul parțial după reîncărcarea tactică?',['Înapoi lângă cele pline','Într-un loc separat (buzunar), ca să nu-l iei din greșeală la o reîncărcare rapidă','În dinți'],1,'Cele pline au locul lor fix. Cel parțial merge altundeva — niciodată în mână sau în gură.']],b:`
Mișcarea de bază a schimbului de încărcător o ai de la Chris (zona de lucru, „locul preferat”, degetul arătător pe primul cartuș, privirea doar o clipă). Cartea adaugă ce trebuie să știi **când și cum alegi** reîncărcarea.

Autorii spun deschis că oameni au murit pentru că au scăpat încărcătorul, au tremurat, l-au băgat invers sau au băgat înapoi unul gol. Stresul te face să faci lucruri pe care altfel nu le-ai face.

### Regulile lor
- Încărcătoarele stau mereu la fel în portcartușier: **în jos, cu gloanțele înainte, spre mijlocul corpului**, bine prinse.
- **Nu exersa „administrativ”.** Și prima încărcare o faci cu tehnica de reîncărcare rapidă — încet și corect, ca să nu-ți construiești un obicei greșit.
- **Reîncarci când poți, nu când ești obligat.** Întreabă-te: am timpul și ocazia? Dacă da, reîncărcare tactică.
- Exersezi și sub stres: după efort, cu zgomot, în concursuri — orice îți bate inima tare.

### Reîncărcarea tactică
Arma mai are cartușe, iar tu vrei să fie plină **înainte să te miști** sau înainte de un nou atac. E o mișcare controlată:
1. Ochii și țeava rămân spre zona amenințării, degetul afară. Scoți un încărcător plin.
2. Rotești puțin arma în mână, eliberezi încărcătorul folosit și îl prinzi între degetul mare și arătător, în aceeași mână cu cel nou.
3. Introduci încărcătorul nou, îl fixezi ferm cu podul palmei.
4. Încărcătorul parțial merge **într-un loc separat** de cele pline — buzunar, altă husă. Nu în mână, nu în dinți.

Dacă e posibil, din spatele unei acoperiri. La mâini mici și încărcătoare mari, mișcarea e mai grea — de aceea se repetă până devine reflex.

### Reîncărcarea rapidă
Închizătorul a rămas în spate: arma e goală și ai nevoie de ea acum.
- Aduci arma în fața ta, pe linia ochi–țeavă–țintă, acolo unde ai citi scrisul de pe închizător, și „bagi ața în ac”.
- Palma care fixează încărcătorul e **tare, cu degetele întinse**.
- Închizi închizătorul fie cu opritorul, fie trăgându-l înapoi și lăsându-l să plece singur (arma rotită ușor spre mâna de sprijin). La stângaci, a doua variantă e adesea mai rapidă.
- Standardul din carte (foc real, siluetă, 7 m): un foc, reîncărcare, încă un foc — **3–3,5 secunde**, în funcție de portcartușier.

### Dacă încărcătorul gol nu cade
Îl smulgi: împingi cu marginea încărcătorului nou în talpa celui blocat, sau îl prinzi cu inelarul și degetul mic, îl tragi afară și continui.

! Reîncărcările cu muniție se învață doar cu instructor. Acasă exersezi cu încărcătoare goale sau cu cartușe inerte, cu muniția reală în altă cameră.

les({id:'p8',m:'pistol',t:'Incidentele: trei tipuri, trei soluții',min:6,an:'malf',
q:[['Apeși, auzi clic, nu pleacă focul. Ce faci?',['Apeși iar trăgaciul','Bați încărcătorul, tragi închizătorul, ești gata','Demontezi arma'],1,'„Bate, trage, gata”: încărcătorul poate fi nefixat sau cartușul defect. Rezolvă cele mai multe cazuri.'],
   ['La dubla alimentare, care e primul pas?',['Tragi de închizător de mai multe ori','Blochezi închizătorul în spate, ca să scapi de tensiunea arcului','Lovești încărcătorul'],1,'Cu închizătorul blocat în spate, arcul nu mai apasă pe cele două cartușe. Abia apoi scoți încărcătorul.'],
   ['De ce nu tragi închizătorul complet înapoi la un tub blocat vertical?',['Te poate lovi','Ai deja un cartuș pe țeavă — ai provoca o dublă alimentare','E prea greu'],1,'La tubul blocat, următorul cartuș e de obicei deja pe drum. Doar mături tubul; închizătorul se închide singur.']],b:`
Chris îți arată **de unde** vin incidentele (arcuri, curățenie, muniție, încărcătoare). Cartea îți arată **cum le recunoști și le rezolvi**. Regula autorilor: un exercițiu de incident trebuie să rezolve problema **100% din cazuri, din prima** — altfel nu e bun.

Mulți trăgători „cu experiență”, când dau de un tub blocat, aproape demontează pistolul în loc să-l mture și să continue.

### 1. Nu pleacă focul
**Semne:** prezinți, apeși, auzi și simți cocoșul sau percutorul, dar nimic. Încărcătorul nu a fost fixat, s-a desprins sau cartușul e defect.

**Soluția: bate — trage — gata.**
1. Degetul afară de pe trăgaci.
2. **Bați** talpa încărcătorului cu palma tare, degetele întinse, ca să fie sigur fixat.
3. **Tragi** închizătorul complet înapoi și îl lași să plece singur (poți roti arma pe axa țevii spre mâna de sprijin). Țeava rămâne spre amenințare.
4. **Gata**: prezinți din nou și decizi dacă mai e nevoie de foc.

**Rotit sau nu?** Mulți învață „bate–trage–rotește” cu arma rotită mult, degetul mare spre piept. Autorii spun că o rotire puțin peste 90° spre mâna de sprijin ajunge ca un cartuș sau tub să cadă; mai mult doar te scoate din raza naturală de mișcare și îți strică linia. Varianta cu degetul mare spre piept o păstrează pentru distanță de contact, cu arma lângă corp.

### 2. Tubul blocat („coș de sobă”)
**Semne:** în timpul unei serii vezi tubul înțepenit în fereastra de ejecție, îți acoperă cătarea, închizătorul nu s-a închis, trăgaciul e „moale”. Cauza tipică: încheietura moale, care nu dă închizătorului pe ce să se sprijine (sau un ejector rupt).

**Soluția:** cu degetele mâinii de sprijin întinse și lipite, **treci peste închizător — niciodată prin fața țevii** — și mături tubul cu o mișcare fermă, înapoi. Rulezi degetele peste închizător, ca să prinzi tubul fie că stă vertical, fie orizontal. Nu trage închizătorul complet: cartușul următor e deja pe drum și ai provoca o dublă alimentare.

### 3. Dubla alimentare (neextragerea)
**Semne:** tubul tras a rămas în cameră, iar cartușul următor a fost împins în spatele lui. Închizătorul nu s-a închis, trăgaciul e moale, arma nu trage. E cel mai complicat incident.

**Soluția:**
1. Degetul afară. Rotești arma ca să ajungi cu degetul mare la opritor și **blochezi închizătorul în spate** — primul pas, care scapă de tensiunea arcului.
2. **Scoți încărcătorul.**
3. **Tragi închizătorul de cel puțin două ori**, privind cum iese tubul, și îl lași să se închidă singur.
4. Introduci un încărcător plin, cu palma tare.
5. Tragi închizătorul ca să alimentezi un cartuș.
6. Continui doar dacă situația o cere.

### Închizătorul nu s-a închis complet
Se întâmplă mai ales la încărcare, când închizătorul a fost „însoțit” în loc să fie lăsat să plece singur. Soluția e mereu aceeași: degetul afară, **lovești spatele închizătorului** cu podul palmei.

### Ce mai spune cartea
- Pe întuneric nu vezi incidentul. Învață-l **după senzație și sunet**.
- Dacă îngenunchezi ca să rezolvi un incident lângă colegi, le spui când te ridici — după un semnal stabilit.
- Dacă nu reușești din prima, treci la altă armă sau la acoperire. O armă care nu funcționează trebuie reparată, nu analizată.

! Incidentele se exersează **doar cu cartușe inerte** (de exercițiu), după ce un instructor ți-a arătat procedura pe arma ta. Un coleg ți le poate amesteca în încărcător fără să știi unde sunt.

les({id:'p9',m:'pistol',t:'Regulile de supraviețuire',min:5,an:'pie',
q:[['De ce „stai departe de colțuri”?',['Ca să nu te murdărești','Distanța față de colț îți dă unghi și timp de reacție: verifici zona bucată cu bucată','Ca să vezi mai puțin'],1,'Lipit de colț, vezi totul dintr-odată și târziu. De la distanță, deschizi unghiul treptat și ai timp să reacționezi.'],
   ['Îi ceri cuiva să ridice mâinile. La ce te gândești?',['La nimic, e sub control','Mișcarea pe care o aștepți poate ascunde o mișcare spre o armă — acțiunea e mai rapidă decât reacția'],1,'Când aștepți ca mâinile să urce, nu mai citești ce fac de fapt. Autorii avertizează: el poate ajunge înaintea reflexelor tale.']],b:`
Înainte de exercițiile de luptă, cartea dă o listă scurtă de reguli. Sunt simple, dar fiecare a costat vieți ca să fie scrisă.

### Regulile
1. **Folosește-ți simțurile.** Ochii și urechile prind ce nu e normal — inclusiv mirosuri. Încetinește sau oprește-te din când în când și ascultă.
2. **Nu întoarce spatele unei zone neverificate.** Verifici sistematic, înăuntru și afară.
3. **Păstrează-ți echilibrul.** Nu te mișca niciodată mai repede decât poți trage precis. Săriturile după colțuri și alunecatul pe holuri sunt pentru filme.
4. **Stai departe de colțuri.** Folosește unghiurile. Verifici după colț „felie cu felie” și păstrezi distanța, ca să ai timp de reacție.
5. **Folosește distanța.** Nu te lipi de un loc periculos sau de un agresor. Cu cât ești mai aproape, cu atât îi e mai ușor să te lovească.
6. **Ia inițiativa.** În fiecare clipă folosești orice avantaj ai.
7. **Nu rămâne static.** Te miști când situația permite: după ce ai tras, în timpul reîncărcării, la un incident. Dar nu te mișca dacă asta atrage atenția fără folos.
8. **Ai grijă ce porți.** O cămașă deschisă la culoare e o țintă comodă. Culorile închise sunt mai bune, în funcție de mediu.
9. **Rămâi vigilent.** Dacă cauți pe cineva, nu fi șocat când îl găsești. Gândește dinainte ce faci.
10. **Ai încredere în tine.** „Fii calm, nu juca rolul de calm.” Nu te grăbi dacă nu e nevoie; fii calculat și hotărât.
11. **Atenție la comenzile pe care le dai.** Dacă îi ceri cuiva să ridice mâinile, o să aștepți mișcarea aceea — și el poate scoate o armă în aceeași mișcare. Acțiunea e mai rapidă decât reacția.
12. **Învață mereu** de la cei care au trecut prin asta, ca să nu repeți greșelile lor.

### „Felie cu felie” după un colț
Cartea numește tehnica „pie off”: privești după un obstacol **treptat**, expunând cât mai puțin din corp, cu pași laterali, fără să-ți încrucișezi picioarele. Cu cât stai mai departe de colț, cu atât vezi zona pe bucăți, una câte una, și ai mai mult timp să reacționezi.

@anim pie

> Perdanții „corecți” sunt morți. În orice clipă a unei confruntări cauți avantajul.
